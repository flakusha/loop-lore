# giwt lifecycle config for loop-lore (see giwt src/utils/settings.ts schema).

[branches]
# Worktrees branch from dev; dev is the integration target.
root = "dev"

[commands]
# giwt finalize Step 3 runs the full unit suite. giwt splits this string on
# whitespace and spawns it WITHOUT a shell, so the suite is reached through a
# package script (bun run does expand the shell syntax).
#
# The suite is the same one `test:unit` runs; only the worker count differs:
# the check runner's own src chunk gate measures this suite at ~200s with 12
# workers against ~435s with 4 (scripts/check/parallel/config.mjs,
# SRC_TEST_JOBS), and Step 3 runs alone after the gate pools drain.
# CHECK_SRC_TEST_JOBS is the knob the check runner already uses for this
# suite — drop it when finalizing beside other lanes (the 12-worker peak is
# ~30GB tree-isolated).
test = "bun run test:unit:finalize"

[status.aliases]
# Free-form legacy statuses -> the closed plan vocabulary
# (Not Started | In Progress | Blocked | Done | Wontfix | Postponed).
#
# Consumed by `giwt plan validate --fix` (status-vocab gate). The gate's
# annotation tolerance resolves a trailing "(...)" against the core, so these
# core keys also fix decorated values such as
#   "OK Resolved (commit 6b3cadc6, follow-up d0a24be8 guard)"
#     -> "Done (commit 6b3cadc6, follow-up d0a24be8 guard)"
# without an entry per commit reference.

# --- actually done -> Done -----------------------------------------------
# `done` is the spelling `giwt sync` writes when it pushes a git issue state
# into a ticket's **Status:** field. Without this alias, reconciling a stale
# status makes `sync` emit `done` and then `plan validate`'s status-vocab gate
# reject it, so the two commands can never both be satisfied.
done = "Done"
resolved = "Done"
finished = "Done"
shipped = "Done"
applied = "Done"
landed = "Done"
implemented = "Done"
fixed = "Done"
verified = "Done"

# --- deliberately dropped -> Wontfix -------------------------------------
wontfix = "Wontfix"
rejected = "Wontfix"
not-a-bug = "Wontfix"
superseded = "Wontfix"

# --- parked -> Postponed --------------------------------------------------
postponed = "Postponed"
deferred = "Postponed"

# --- part-built / actively moving -> In Progress -------------------------
in_progress = "In Progress"
partial = "In Progress"
partially = "In Progress"
foundation = "In Progress"
unwired = "In Progress"
ongoing = "In Progress"
fixed-in-worktree = "In Progress"

# --- not begun -> Not Started --------------------------------------------
draft = "Not Started"
proposed = "Not Started"
planned = "Not Started"
design = "Not Started"
research = "Not Started"
todo = "Not Started"
idea = "Not Started"
not-yet-implemented = "Not Started"
stub = "Not Started"
