[package]
name = "loop-lore-egui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/loop-lore/loop-lore"
description = "Experimental egui (Rust) WASM frontend for loop-lore — JSON client, no htmx fragments"

[lib]
name = "loop_lore_egui"
# cdylib = the wasm artifact mounted by the /egui host page; rlib = lets
# `cargo test` link the pure modules on the host (cdylib alone cannot).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Spike-measured configuration (docs/meta/research/egui-wasm-embed-spike.md):
# glow, not wgpu — ~1.5x smaller bundle. default_fonts lives on egui.
# x11/wayland keep the host `cargo test` linkable — winit's backends are
# eframe features, not its defaults, and `default-features = false` drops them.
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Headers/Request/RequestInit/Response gate the fetch-with-Request path in
# client.rs; HtmlDocument carries document.cookie; Storage covers localStorage.
web-sys = { version = "0.3", features = ["Headers", "HtmlCanvasElement", "HtmlDocument", "Request", "RequestInit", "Response", "Storage", "Window"] }

[features]
default = []

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Same relaxations as native/loop-lore-native: doc-only lints on a UI crate
# whose public surface is the wasm entry point.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
# Wasm bundle is downloaded once per visit — optimize hard, same policy as
# native/loop-lore-native.
lto = true
codegen-units = 1
panic = "abort"
strip = true
