name: Release

on:
  push:
    branches: [master, release/**]
    tags: ["*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.2.x"

# Hybrid release model:
#   - Branch push (master/release/*): verification gate only — full checks +
#     build. CI NEVER creates tags; tagging is a post-testing human decision.
#   - Tag push (bare `x.y.z`, e.g. `0.1.0`): build + artifacts + GitHub Release,
#     notes derived from CHANGELOG.md (single source, never git log).
#   - `dev-*` tags (dev-release workflow) are excluded — dev builds are not releases.

jobs:
  verify:
    name: Verify (post-merge gate)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check:ci

      - name: Run unit tests
        run: bun run test:unit

      - name: Run E2E tests
        run: E2E_SAFEGUARD=1 bun run test:e2e

      # The ONLY check that compiles app.rs and web.rs: lib.rs gates them behind
      # `#[cfg(target_arch = "wasm32")]`, so the host target never sees them.
      # A missing Rust toolchain is a SUPPORTED state: the steps are allowed to
      # fail so the check can SKIP with a reason instead of reddening the
      # release gate. The check itself FAILS when the crate does not compile,
      # so a broken UI cannot pass the post-merge gate.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          targets: wasm32-unknown-unknown

      # The action adds the target to the toolchain IT installs (stable) and
      # makes that the default; the repo's rust-toolchain.toml pins the
      # channel, and rustup resolves that pin over the default inside this
      # directory - so the target has to land on the PINNED toolchain, the one
      # cargo actually runs here. Allowed to fail: the check below asks for the
      # target itself and SKIPs with a reason when it is missing.
      - name: Add the wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
        continue-on-error: true

      - name: Type-check the egui crate for wasm32
        run: bun run scripts/native/check-wasm.ts

      - name: Build
        run: bun run build

      - name: Changelog gate
        run: bun run changelog:check

      - name: Ready to tag
        run: |
          echo "Master merge verified green — tag decision is HUMAN (post-testing)."
          echo "  git tag -s <version> -m \"loop-lore <version>\"   # then:"
          echo "  git push origin <version>                        # triggers Release build"

  release-tag-push:
    name: Release from Tag Push
    # Bare `x.y.z` tags (e.g. 0.1.0). `dev-*` tags are dev builds — excluded.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/dev-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The ONLY check that compiles app.rs and web.rs: lib.rs gates them behind
      # `#[cfg(target_arch = "wasm32")]`, so the host target never sees them.
      # A missing Rust toolchain is a SUPPORTED state: the steps are allowed to
      # fail so the check can SKIP with a reason instead of reddening the
      # release. The check itself FAILS when the crate does not compile, so a
      # broken UI cannot be released.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          targets: wasm32-unknown-unknown

      # The action adds the target to the toolchain IT installs (stable) and
      # makes that the default; the repo's rust-toolchain.toml pins the
      # channel, and rustup resolves that pin over the default inside this
      # directory - so the target has to land on the PINNED toolchain, the one
      # cargo actually runs here. Allowed to fail: the check below asks for the
      # target itself and SKIPs with a reason when it is missing.
      - name: Add the wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
        continue-on-error: true

      - name: Type-check the egui crate for wasm32
        run: bun run scripts/native/check-wasm.ts

      # The wasm-bindgen CLI, at the version the workspace Cargo.lock
      # resolves. Without it `build:egui` skips before compiling anything, so
      # the bundle these checksums cover would never exist. Never fails the
      # job: a provisioning failure warns and the bundle stage skips with it.
      - name: Provision the wasm-bindgen CLI (pinned to the workspace lock)
        run: bun run scripts/native/provision-wasm-bindgen.ts
        continue-on-error: true

      - name: Build
        run: bun run build
      # Non-fatal by design: a missing Rust toolchain is a SUPPORTED state
      # (build:egui skips with a warning). This step only names what the
      # checksum manifest below is about to cover — it never fails the release.
      - name: Report egui artifact presence
        id: egui
        run: |
          bun run scripts/check/egui-release-warn.mjs dist | tee /tmp/egui-presence
          echo "present=$(tail -1 /tmp/egui-presence | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Generate release artifacts and hashes
        id: artifacts
        run: |
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          cp -r dist "$ARTIFACT_DIR/" 2>/dev/null || true
          cp -r src/public "$ARTIFACT_DIR/" 2>/dev/null || true

          cd "$ARTIFACT_DIR"
          find . -type f -exec sha256sum {} \; | sort > SHA256SUMS.txt
          find . -type f -exec md5sum {} \; | sort > MD5SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          echo "artifact_dir=$ARTIFACT_DIR" >> $GITHUB_OUTPUT

      - name: Generate release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          HASHES=$(cat "${{ steps.artifacts.outputs.artifact_dir }}/SHA256SUMS.txt" 2>/dev/null || echo "No artifacts found")

          # Single source of truth: CHANGELOG.md (Keep a Changelog). Extract the
          # `## [x.y.z] - date` section up to the next `## ` heading.
          SECTION=$(awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "$SECTION" ]]; then
            echo "::error::CHANGELOG.md has no section ## [$TAG] — update CHANGELOG.md, then re-tag"
            exit 1
          fi

          # Previous tag (same or any major), excluding dev-* tags
          PREV_TAG=$(git tag | grep -E '^[0-9]' | sort -V | grep -v '^dev-' | tail -2 | head -1)

          {
            echo "release_notes<<EOF"
            echo "# Release $TAG"
            echo ""
            echo "$SECTION"
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Artifacts & Verification"
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo "\`\`\`"
            echo "$HASHES"
            echo "\`\`\`"
            echo ""
            echo "*Verify downloads: \`sha256sum -c SHA256SUMS.txt\`*"

            if [ "${{ steps.egui.outputs.present }}" != "true" ]; then
              echo ""
              echo "**egui WASM bundle omitted** — this release ships without"
              echo "\`dist/public/egui\`: \`build:egui\` skipped (no Rust toolchain or no"
              echo "wasm-bindgen CLI on the runner, or the crate did not compile), so the"
              echo "checksums above cover a dist with no egui frontend. Not a packaging"
              echo "bug — see the run log for the reason."
            fi
            echo ""
            if [[ -n "$PREV_TAG" && "$PREV_TAG" != "$TAG" ]]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.artifact_dir }}/dist/**
            ${{ steps.artifacts.outputs.artifact_dir }}/src/public/**
            ${{ steps.artifacts.outputs.artifact_dir }}/SHA256SUMS.txt
            ${{ steps.artifacts.outputs.artifact_dir }}/MD5SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
