# GitHub Actions Release workflow for loop-lore
# Triggered on push to master and release/* branches
# Creates annotated tags and GitHub releases

name: Release

on:
  push:
    branches:
      - master
      - "release/**"

jobs:
  ci-checks:
    name: Reuse CI Quality Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Detect Version
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is-release-branch: ${{ steps.branch.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Detect branch type
        id: branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "master" || "$BRANCH" == "main" ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Predict version
        id: version
        run: |
          NEXT_VERSION=$(bun run version:predict)
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Predicted version: $NEXT_VERSION"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.is-release-branch == 'true'
    permissions:
      contents: write
      discussions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check for existing tag
        id: tagcheck
        run: |
          TAG_EXISTS=$(git tag -l "${{ needs.version.outputs.tag }}" | wc -l)
          echo "exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Create annotated tag
        if: steps.tagcheck.outputs.exists == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Generate changelog
        if: steps.tagcheck.outputs.exists == '0'
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG..HEAD")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "## Changes" > release-notes.md
          echo "" >> release-notes.md
          echo "$CHANGELOG" >> release-notes.md

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
