# GitHub Actions Release workflow for loop-lore
# Triggered on push to master and release/* branches
# Creates annotated tags and GitHub releases

name: Release

on:
  push:
    branches:
      - master
      - 'release/**'

jobs:
  ci-checks:
    name: Reuse CI Quality Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci-checks
    if: needs.version.outputs.is-release-branch == 'true'
    permissions:
      contents: write
      discussions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Predict version
        id: version
        run: |
          NEXT_VERSION=$(bun run version:predict)
          echo "predicted=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Predicted version: $NEXT_VERSION"

      - name: Check for existing tag
        id: tagcheck
        run: |
          TAG_EXISTS=$(git tag -l "v${{ steps.version.outputs.predicted }}" | wc -l)
          echo "exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Create annotated tag
        if: steps.tagcheck.outputs.exists == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.predicted }}" -m "Release v${{ steps.version.outputs.predicted }}"
          git push origin "v${{ steps.version.outputs.predicted }}"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.predicted }}
          name: Release v${{ steps.version.outputs.predicted }}
          generate_release_notes: true