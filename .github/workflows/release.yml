name: Release

on:
  push:
    branches: [master, release/**]
    tags: [v*]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.2.x"

jobs:
  release:
    name: Create Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check:ci

      - name: Run unit tests
        run: bun run test:unit:parallel

      - name: Run E2E tests
        run: E2E_SAFEGUARD=1 bun run test:e2e:browser

      - name: Build
        run: bun run build

      - name: Predict version and create tag
        id: version
        run: |
          # Predict version
          VERSION=$(bun run version:predict)
          echo "predicted_version=$VERSION" >> $GITHUB_OUTPUT

          # Create annotated tag if version bump detected
          if [[ "$VERSION" != *"No version bump"* ]]; then
            TAG="v$VERSION"
            echo "Creating tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "No version bump needed"
          fi

      - name: Generate release notes
        if: steps.version.outputs.tag != ''
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag | grep "^v${TAG#v}" | sort -V | tail -2 | head -1)
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git tag | sort -V | tail -1)
          fi

          echo "Generating notes from $PREV_TAG to $TAG"
          NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..HEAD 2>/dev/null || git log --pretty=format:"- %s (%h)" --no-merges)

          # Categorize commits
          FEATS=$(echo "$NOTES" | grep -E "^\- feat" | sed 's/^\- feat[^(]*(\([^)]*\))?: /- /' || true)
          FIXES=$(echo "$NOTES" | grep -E "^\- fix" | sed 's/^\- fix[^(]*(\([^)]*\))?: /- /' || true)
          OTHERS=$(echo "$NOTES" | grep -vE "^\- (feat|fix)" || true)

          {
            echo "release_notes<<EOF"
            echo "## Release $TAG"
            echo ""
            if [[ -n "$FEATS" ]]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi
            if [[ -n "$FIXES" ]]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [[ -n "$OTHERS" ]]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo ""
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            dist/**
            src/public/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag-push:
    name: Release from Tag Push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Release from tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Auto-generated release from tag push.
          draft: false
          prerelease: false
          files: |
            dist/**
            src/public/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
