# Dependency Vulnerability Audit
#
# Weekly audit of Bun (JS) and Rust (native) dependencies.
# Runs Mondays 06:00 UTC and on manual dispatch.
name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    name: Bun Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Match local toolchain pin for reproducible installs.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --prod

  cargo-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RustSec audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native/loop-lore-native
