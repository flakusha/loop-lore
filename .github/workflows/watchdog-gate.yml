# Heavy gate dispatched by the watchdog crash-threshold notifier.
name: Watchdog Gate

on:
  repository_dispatch:
    types: [watchdog.threshold_breach]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"
  # CI has no .credentials.env; skip only the gate suite's GPG preflight.
  CHECK_SKIP_GPG_PRECHECK: "1"

jobs:
  heavy-gate:
    name: Watchdog Heavy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout dev HEAD
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Build frontend
        run: bun run build:frontend

      - uses: dtolnay/rust-toolchain@stable

      - name: Run local gate suite
        run: bun run check:ci

      - name: Summarize trigger
        if: always()
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "### Watchdog gate trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "client_payload: $CLIENT_PAYLOAD" >> "$GITHUB_STEP_SUMMARY"
