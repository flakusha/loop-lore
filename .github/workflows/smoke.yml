name: Smoke

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.5"

jobs:
  smoke:
    name: Fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # The parallel check runner's GPG preflight reads .credentials.env before
    # any gate runs; CI has no credentials and no gate signs commits. Skip only
    # that preflight — commit signing configuration is untouched.
    env:
      CHECK_SKIP_GPG_PRECHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke gate
        run: bun run smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: .tmp/check-report.json
          if-no-files-found: warn
