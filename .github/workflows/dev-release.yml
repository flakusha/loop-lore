name: Dev Release

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.x"

jobs:
  dev-release:
    name: Dev Release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check if dev-release label present
        id: check_label
        run: |
          if echo "${{ github.event.pull_request.labels.*.name }}" | grep -q "dev-release"; then
            echo "dev_release=true" >> $GITHUB_OUTPUT
          else
            echo "dev_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Run quality checks
        run: bun run check:ci

      - name: Run unit tests
        run: bun run test:unit

      - name: Run E2E tests
        run: E2E_SAFEGUARD=1 bun run test:e2e

      # The ONLY check that compiles app.rs and web.rs: lib.rs gates them behind
      # `#[cfg(target_arch = "wasm32")]`, so the host target never sees them.
      # A missing Rust toolchain is a SUPPORTED state: the steps are allowed to
      # fail so the check can SKIP with a reason instead of reddening the
      # release. The check itself FAILS when the crate does not compile, so a
      # broken UI cannot be released.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          targets: wasm32-unknown-unknown

      # The action adds the target to the toolchain IT installs (stable) and
      # makes that the default; the repo's rust-toolchain.toml pins the
      # channel, and rustup resolves that pin over the default inside this
      # directory - so the target has to land on the PINNED toolchain, the one
      # cargo actually runs here. Allowed to fail: the check below asks for the
      # target itself and SKIPs with a reason when it is missing.
      - name: Add the wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
        continue-on-error: true

      - name: Type-check the egui crate for wasm32
        run: bun run scripts/native/check-wasm.ts

      # The wasm-bindgen CLI, at the version the workspace Cargo.lock
      # resolves. Without it `build:egui` skips before compiling anything, so
      # the bundle this release uploads would never exist. Never fails the
      # job: a provisioning failure warns and the bundle stage skips with it.
      - name: Provision the wasm-bindgen CLI (pinned to the workspace lock)
        run: bun run scripts/native/provision-wasm-bindgen.ts
        continue-on-error: true

      - name: Build
        run: bun run build

      # Non-fatal by design: a missing Rust toolchain is a SUPPORTED state
      # (build:egui skips with a warning). Names what the uploaded artifact
      # actually contains; never fails the release.
      - name: Report egui artifact presence
        id: egui
        run: |
          bun run scripts/check/egui-release-warn.mjs dist | tee /tmp/egui-presence
          echo "present=$(tail -1 /tmp/egui-presence | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Predict dev version
        id: version
        run: |
          DEV_VERSION=$(bun run version:predict)
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loop-lore-${{ steps.version.outputs.dev_version }}
          path: |
            dist/
            src/public/
          retention-days: 7

      - name: Create GitHub Release (Pre-release)
        if: steps.check_label.outputs.dev_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-${{ steps.version.outputs.dev_version }}
          name: Dev Release ${{ steps.version.outputs.dev_version }}
          body: |
            ## Dev Release
            Auto-generated from PR #${{ github.event.pull_request.number }} merge to master.

            **Version:** ${{ steps.version.outputs.dev_version }}
            **Commit:** ${{ github.event.pull_request.merge_commit_sha }}
            **Branch:** ${{ github.event.pull_request.head.ref }}

            ${{ steps.egui.outputs.present == 'true' && '' || '**egui WASM bundle omitted** — this dev build has no `dist/public/egui`: `build:egui` skipped (no Rust toolchain or no wasm-bindgen CLI on the runner, or the crate did not compile). See the run log for the reason.' }}

            This is a pre-release for testing purposes.
          draft: false
          prerelease: true
          files: |
            dist/**
            src/public/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
