# ───────────────────────────────────────────────────────────
# Example: loop-lore config for e2e testing
# ───────────────────────────────────────────────────────────
# Copy to config.e2e.yaml.
#
# Two test modes:
#
# ── Mock (fast, no external servers) ──
#   bun test tests/e2e/
#   Uses MockLLMProvider — validates full HTTP pipeline.
#   No real LLM/sd-server needed.
#
# ── Real-server (requires external servers) ──
#   export LL_REAL_MODEL=/path/to/model.gguf
#   export LL_REAL_SD_MODEL=/path/to/model.safetensors
#   bun test tests/e2e/flows/real-generation.test.ts
#   Spawns llama.cpp + sd-server as child processes.
#   Tests skip gracefully if binaries/models missing.
#
# External-server env vars:
#   LL_REAL_MODEL           path to GGUF model for llama.cpp (required)
#   LL_REAL_SD_MODEL        path to safetensors for sd-server (required)
#   LL_REAL_PORT_LLAMA      llama.cpp port (default: 9011)
#   LL_REAL_PORT_SD         sd-server port (default: 9010)
#   LL_REAL_E2E_SKIP=1      skip all external-server tests
#
#   # For llama-swap instead of direct llama.cpp:
#   # LL_REAL_SWAP_CONFIG    path to llama-swap config yaml
#
# Alternative: set model paths in the testing config section below
# instead of env vars. Config file overrides env var defaults.
# ───────────────────────────────────────────────────────────

server:
  port: 0 # random port
  host: "localhost"

db:
  type: sqlite
  sqliteFilename: ":memory:" # in-memory DB

auth:
  required: false
  registrationOpen: true
  demoAutoSetup: true

logging:
  level: error # quiet during tests

generation:
  providers:
    openaiCompatible:
  # ── Mock provider (registered by test server, not config) ──
  # The e2e test server auto-registers MockLLMProvider as
  # "mock-provider". No real config entry needed — this empty
  # list is correct for mock-only e2e.

  # ── Real provider example (uncomment for live-server e2e) ──
  # - name: llama-cpp-e2e
  #   label: "llama.cpp E2E"
  #   baseUrl: http://localhost:9011/v1
  #   model: e2e-test-model
  #   timeout: 30000
  #   retries: 2
  #   allowUserApiKey: false
  #   models:
  #     e2e-test-model:
  #       contextLimit: 8192
  #       maxOutput: 1024

  defaultProvider: mock-provider
  defaultModels:
    mock-provider: mock-model

# ── Messages (tight limits for e2e) ──────────────────────
messages:
  maxGenerationRetries: 2
  generationTimeoutMs: 15000
  idempotencyExpiryHours: 1
  maxLength: 1000000

# ── Transport (keep it simple for e2e) ───────────────────
transport:
  defaultProtocol: http/1.1
  enableWebSocket: false
  enableWebTransport: false
  enableH2: false
  enableH3: false

# ── Testing: external-server e2e model paths ──────────────
# model paths: local file or HuggingFace ID (org/repo:quant)
# HF format auto-downloads via llama-server -hf flag.
# testing:
#   llamaModel: /path/to/model.gguf
#   # or: llamaModel: "org/repo:Q4_K_M"         # HF download
#   sdModel: /path/to/model.safetensors
#   llamaPort: 9011
#   sdPort: 9010
#   llamaSwapConfig: /path/to/llama-swap-config.yaml
