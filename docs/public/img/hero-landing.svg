<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Docs landing page hero: RPG chat world scene -->
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151820"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f597e8"/>
      <stop offset="100%" stop-color="#c469f0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7130f8"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#heroBg)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="300" rx="250" ry="150" fill="#f597e8" opacity="0.04"/>
  <ellipse cx="600" cy="200" rx="200" ry="200" fill="#7130f8" opacity="0.03"/>

  <!-- Grid floor -->
  <g opacity="0.08">
    <line x1="0" y1="350" x2="800" y2="350" stroke="#7130f8" stroke-width="1"/>
    <line x1="0" y1="370" x2="800" y2="370" stroke="#7130f8" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="800" y2="390" stroke="#7130f8" stroke-width="0.5"/>
    <line x1="0" y1="310" x2="800" y2="310" stroke="#3c3f41" stroke-width="0.5"/>
  </g>

  <!-- Floating chat bubbles -->
  <!-- Bubble 1 (left, character) -->
  <rect x="60" y="80" width="240" height="70" rx="14" fill="#21242c" stroke="#3c3f41" stroke-width="1"/>
  <circle cx="88" cy="115" r="16" fill="#3f424a"/>
  <circle cx="88" cy="115" r="14" fill="#30333b"/>
  <circle cx="84" cy="111" r="4" fill="#cfcfcf" opacity="0.5"/>
  <rect x="114" y="100" width="110" height="5" rx="2.5" fill="#cfcfcf" opacity="0.5"/>
  <rect x="114" y="112" width="168" height="5" rx="2.5" fill="#898e93" opacity="0.4"/>
  <rect x="114" y="124" width="80" height="5" rx="2.5" fill="#898e93" opacity="0.3"/>
  <path d="M60 150 L76 150 L68 160Z" fill="#21242c"/>

  <!-- Bubble 2 (right, user) -->
  <rect x="500" y="120" width="240" height="70" rx="14" fill="url(#accentGrad)" opacity="0.92"/>
  <rect x="522" y="138" width="120" height="5" rx="2.5" fill="#1a1a1a" opacity="0.35"/>
  <rect x="522" y="150" width="196" height="5" rx="2.5" fill="#1a1a1a" opacity="0.25"/>
  <rect x="522" y="162" width="90" height="5" rx="2.5" fill="#1a1a1a" opacity="0.15"/>
  <path d="M500 190 L516 190 L508 200Z" fill="url(#accentGrad)" opacity="0.92"/>

  <!-- Bubble 3 (small, floating) -->
  <rect x="100" y="170" width="160" height="50" rx="12" fill="#21242c" stroke="#3c3f41" stroke-width="0.5" opacity="0.7"/>
  <rect x="122" y="187" width="120" height="4" rx="2" fill="#cfcfcf" opacity="0.4"/>
  <rect x="122" y="197" width="80" height="4" rx="2" fill="#898e93" opacity="0.3"/>

  <!-- Divider line -->
  <line x1="80" y1="290" x2="720" y2="290" stroke="url(#accentGrad)" stroke-width="1" opacity="0.15"/>

  <!-- Bottom decorative elements -->
  <!-- Scroll icon -->
  <g transform="translate(120, 300)" opacity="0.15">
    <rect x="0" y="0" width="24" height="32" rx="3" fill="none" stroke="#f597e8" stroke-width="1.5"/>
    <line x1="6" y1="8" x2="18" y2="8" stroke="#f597e8" stroke-width="1"/>
    <line x1="6" y1="14" x2="18" y2="14" stroke="#f597e8" stroke-width="1"/>
    <line x1="6" y1="20" x2="14" y2="20" stroke="#f597e8" stroke-width="1"/>
  </g>
  <!-- Wand icon -->
  <g transform="translate(380, 300)" opacity="0.15">
    <line x1="4" y1="20" x2="20" y2="4" stroke="#f597e8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="22" cy="2" r="3" fill="#f597e8"/>
  </g>
  <!-- Heart icon -->
  <g transform="translate(640, 300)" opacity="0.15">
    <path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.27 2 8.5C2 5.41 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.08C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.41 22 8.5C22 12.27 18.6 15.36 13.45 20.03L12 21.35Z" fill="#f597e8"/>
  </g>

  <!-- Small floating stars -->
  <g opacity="0.12" filter="url(#glow)">
    <circle cx="180" cy="240" r="2" fill="#f597e8"/>
    <circle cx="420" cy="200" r="1.5" fill="#f597e8"/>
    <circle cx="620" cy="260" r="1" fill="#f597e8"/>
    <circle cx="300" cy="180" r="1.5" fill="#0072ff"/>
  </g>
</svg>