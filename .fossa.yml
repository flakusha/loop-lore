# SPDX-License-Identifier: LGPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 Loop Lore Contributors
#
# FOSSA license analysis configuration.
# Docs: https://docs.fossa.com/docs/references/fossayml
version: 3

project:
  name: loop-lore
  team: loop-lore-contributors

paths:
  # Analyze Bun/Node dependencies
  manifests:
    - package.json

  # Scan source for embedded licenses (optional, slower)
  # glob is relative to repo root
  source:
    - src/**/*.{ts,tsx,js,mjs}

# License policy: flag these as policy violations
policy:
  # LGPL project cannot include GPL/AGPL dependencies
  rules:
    - name: no-gpl-dependencies
      allowed_licenses:
        - LGPL-2.0
        - LGPL-2.0-only
        - LGPL-2.0-or-later
        - LGPL-2.1
        - LGPL-2.1-only
        - LGPL-2.1-or-later
        - LGPL-3.0
        - LGPL-3.0-only
        - LGPL-3.0-or-later
        - MIT
        - ISC
        - BSD-2-Clause
        - BSD-3-Clause
        - Apache-2.0
        - MPL-2.0
        - EPL-1.0
        - EPL-2.0
        - 0BSD
        - Unlicense
        - CC0-1.0
        - Zlib
        - BlueOak-1.0.0
      denied_licenses:
        - GPL-2.0
        - GPL-2.0-only
        - GPL-2.0-or-later
        - GPL-3.0
        - GPL-3.0-only
        - GPL-3.0-or-later
        - AGPL-1.0
        - AGPL-1.0-only
        - AGPL-1.0-or-later
        - AGPL-3.0
        - AGPL-3.0-only
        - AGPL-3.0-or-later

# Output format for CLI consumption
output:
  format: json
