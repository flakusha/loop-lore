# ───────────────────────────────────────────────────────────
# Example: loop-lore config with llama-swap multi-model proxy
# ───────────────────────────────────────────────────────────
# Copy to config.llama-swap.yaml, edit provider entries.
#
# This is a LOOP-LORE config file that references a running
# llama-swap instance. For the llama-swap config itself, see:
#   https://github.com/mostlygeek/llama-swap
#
# Port strategy (llama-swap): startPort in llama-swap config
# determines the first model port; each additional model gets
# the next port. Match baseUrl below to those ports.
# ───────────────────────────────────────────────────────────

server:
  port: 9000
  host: "localhost"

db:
  type: sqlite
  sqliteFilename: "../loop-lore-data/loop-lore.db"

auth:
  required: false
  registrationOpen: true
  demoUsername: demo
  demoAutoSetup: true

generation:
  providers:
    openaiCompatible:
      # ── llama-swap model: L3 17B (8K context) ──────────
      - name: llama-swap-l3
        label: "L3 17B (llama-swap)"
        baseUrl: http://localhost:3000/v1
        model: davidau/l3
        timeout: 60000
        retries: 3
        allowUserApiKey: false
        models:
          "davidau/l3":
            contextLimit: 8192
            maxOutput: 4096

      # ── Add more models here (next port e.g. 3001) ────
      # - name: llama-swap-model2
      #   label: "Model 2"
      #   baseUrl: http://localhost:3001/v1
      #   model: <ALIAS>
      #   timeout: 60000
      #   retries: 3
      #   allowUserApiKey: false
      #   models:
      #     <ALIAS>:
      #       contextLimit: 8192
      #       maxOutput: 4096

  defaultProvider: llama-swap-l3
  defaultModels:
    llama-swap-l3: davidau/l3

