version = 1

# Vendored third-party file: upstream MIT text kept verbatim below; the
# annotation carries the machine-readable identifiers for the LGPL repo tree.
[[annotations]]
path = ["src/public/css/xterm.css"]
precedence = "override"
SPDX-FileCopyrightText = "2014 The xterm.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "bin/**",
  "src/**",
  "data/**",
  "scripts/**",
  "tests/**",
  ".github/templates/**",
  "*.ts",
  "*.js",
  "*.mjs",
  "*.json",
  "*.toml",
  "eslint.config.mjs",
  "tsconfig.json",
  ".gitignore",
  ".prettierignore",
  ".prettierrc",
  "configs/assets/README.md",
  "DECISION-NOTE.md",
  "AGENTS.md",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "config.example.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = [
  "docs/**",
  ".plan/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/PULL_REQUEST_TEMPLATE.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT OR CC-BY-4.0"

[[annotations]]
path = [".agents/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = ["plugins/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = ["LICENSES/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Loop Lore Contributors"
SPDX-License-Identifier = "LicenseRef-REUSE"

[[annotations]]
path = ["LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-or-later"
