# LLM Generation Templates
#
# System prompts and chat format templates for LLM generation.
# Merge strategy: replace | extend (default) | override
#
# extend: adds new prompts, existing keys from config win on conflict
# replace: wipes all built-in prompts, uses only these
# override: deep merges over built-ins

merge: extend

systemPrompts:
  # Main chat system prompt (used in conversation)
  chat: "You are {{charName}}. {{charDescription}}"
  # Summarization prompt
  summarize: "Summarize this conversation concisely."
  # Image prompt generation instruction
  imagePrompt: "Write image generation tags for: {{scene}}"
  # Out-of-character / GM narration
  ooc: "You are the game master. Narrate the scene."

# Chat format templates (for Jinja/vLLM-style formatting)
# Keys are format names, values have system/user/assistant template strings
chatFormats: {}
