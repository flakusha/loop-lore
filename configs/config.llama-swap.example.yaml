# Example llama-swap configuration template
# ------------------------------------------
# Derived from configs/config.llama-swap.yaml (real machine config).
# All model IDs and artifact paths are placeholders — replace them with
# values that exist on your machine before use.
#
# Add this modeline for validation in vscode:
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Rotation/offload mechanics (from llama-swap upstream docs):
# - On-demand swap: a request naming a model starts its server; if another
#   model's server is running and swap rules forbid coexistence, the old one
#   is unloaded first. Manual/API unload: POST /api/models/unload[/:model_id].
# - TTL offload: `ttl` (per model) / `globalTTL` (global) unload idle models
#   automatically after N seconds; `ttl: 0` = never unload.
# - `unloadTimeout` bounds graceful shutdown (manual, API, or ttl expiry)
#   before force-kill; override per model for slow stoppers (docker stop).
# - Routing engines: default `group` engine (groups with `swap`, `exclusive`,
#   `persistent`) or the newer `matrix` DSL for fine-grained concurrency.
# - `hooks.on_startup.preload` loads models at startup (define a group first
#   if preloading multiple, otherwise they swap each other out).

# --- Global settings -----------------------------------------------------
logLevel: debug
logTimeFormat: rfc3339
logToStdout: "both"

# Port for the automatic ${PORT} macro (incremented per model that uses it)
startPort: 7180

# Unload any model idle for more than this many seconds (0 = never unload).
# Per-model `ttl:` overrides this; both default to never-unload upstream.
globalTTL: 900

# Graceful-shutdown window in seconds before force-kill on unload
unloadTimeout: 10

# Seconds to wait for a model to become ready (minimum 15)
healthCheckTimeout: 300

# --- Macros ---------------------------------------------------------------
macros:
  default_ctx: 262144
  models_dir: "${env.HOME}/models"
  llama-server-default: |
    -ctk q8_0 -ctv iq4_nl
    -ctkd q8_0 -ctvd iq4_nl
    --no-kv-unified
    -fa on
    --fit on

# --- Models ---------------------------------------------------------------
# All model IDs below are placeholders; replace <placeholder> values with
# your own local GGUF artifacts / HF repos.
models:
  "<placeholder-main-model>":
    cmd: |
      llama-server --port ${PORT}
      -hf <placeholder-org>/<placeholder-repo>:<placeholder-quant>
      --alias '<placeholder-main-model>'
      --ctx-size ${default_ctx}
      ${llama-server-default}
    # Automatically unload after 15 minutes idle (overrides globalTTL)
    ttl: 900
    aliases:
      - "<placeholder-friendly-alias>"

  "<placeholder-secondary-model>":
    cmd: |
      llama-server --port ${PORT}
      --model ${models_dir}/<placeholder-model-file>.gguf
      --ctx-size ${default_ctx}
      ${llama-server-default}
    # Never auto-unload this one; unload via API/UI only
    ttl: 0

  "<placeholder-background-model>":
    # unlisted: hidden from /v1/models, still requestable
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      --model ${models_dir}/<placeholder-small-model>.gguf
      --ctx-size 16384
    ttl: 300

  "qwen3-embed-0.6B":
    # unlisted: hidden from /v1/models, still requestable
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      -hf Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      --alias 'qwen3-embed-0.6B'
      --embedding --pooling last
      --ctx-size 32768
      -ub 8192
    ttl: 0

  "bge-reranker-v2-m3":
    # unlisted: hidden from /v1/models, still requestable
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      -hf gpustack/bge-reranker-v2-m3-GGUF:Q4_K_M
      --alias 'bge-reranker-v2-m3'
      --reranking
      --ctx-size 8192
    ttl: 0

  "llama-guard-3-1b":
    # unlisted: hidden from /v1/models, still requestable
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      -hf QuantFactory/Llama-Guard-3-1B-GGUF:Q4_K_M
      --alias 'llama-guard-3-1b'
      --ctx-size 8192
    ttl: 0

  "comfyui_auto":
    # Fixed id consumed by upstream /comfyui compatibility endpoint;
    # do NOT rename (proxy routes /comfyui + /comfyui/{path} here).
    # compatibility.ignoreWebsockets keeps /ws out of swap/TTL accounting.
    cmd: |
      python ${models_dir}/../comfyui/main.py --port ${PORT}
    ttl: 0
    compatibility:
      ignoreWebsockets: true
    # ComfyUI has no /health; /system_stats is the lightweight ready probe.
    checkEndpoint: /system_stats

  "laya-english":
    # Shortest llama.cpp path: backbone-only GGUF served with --embeddings.
    # fr0stbit3/laya-gguf (Apache-2.0): laya-F16.gguf 791MB / Q8_0 421MB /
    # Q6_K 344MB / Q4_K_M 272MB, via `-hf fr0stbit3/laya-gguf:<quant>`.
    # Loads in llama.cpp as `modern-bert` — `--embeddings --pooling none`;
    # batch flags `-ub/-b` must cover the longest input. The decision head is
    # NOT in the GGUF: sibling `laya-head.safetensors` + `laya_head.py`
    # (load_head) run outside llama.cpp (see that repo's quickstart.py).
    # Prefer F16 or Q8_0 (Q4_K_M drifts ~0.02-0.03 prob on one sample).
    # CPU-only: omit -ngl entirely (llama.cpp default is CPU).
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      -hf fr0stbit3/laya-gguf:Q8_0
      --alias 'laya-english'
      --embeddings --pooling none
      -c 2048 -ub 2048 -b 2048
    ttl: 0

  "laya-multilingual":
    # Same pattern for 100+ languages (mmBERT-base, ctx 1024):
    # fr0stbit3/laya-multilingual-gguf. Route non-Latin script here, else english.
    # Full-model alternative (backbone+head, one binary, NOT llama.cpp):
    # mys/laya-GGUF + mys/laya-multilingual-GGUF are ggmlc builds run with the
    # `laya` CLI (`laya serve file.gguf --port 8080` → POST /api/decide). They
    # FAIL in llama-server; pick one serving story per deployment.
    unlisted: true
    cmd: |
      llama-server --port ${PORT}
      -hf fr0stbit3/laya-multilingual-gguf:Q8_0
      --alias 'laya-multilingual'
      --embeddings --pooling none
      -c 2048 -ub 2048 -b 2048
    ttl: 0

# --- Routing / rotation ---------------------------------------------------
# Default `group` engine. Loading a member of an exclusive group unloads
# every other group; members of a swap:true group rotate among themselves.
routing:
  router:
    use: group
    settings:
      groups:
        # Main LLMs rotate: only one of these is resident at a time,
        # and loading one evicts everything else (default llama-swap behavior)
        "llm-rotation":
          swap: true
          exclusive: true
          members:
            - "<placeholder-main-model>"
            - "<placeholder-secondary-model>"

        # Background helpers coexist with each other and are not evicted
        # by other groups' loads (persistent). See upstream issue #109
        # for full group semantics; the `matrix` engine offers a more
        # expressive concurrency DSL if groups are insufficient.
        "helpers":
          swap: false # members run together, no rotation
          exclusive: false # loading here leaves other groups alone
          persistent: true # not evicted by other groups' loads
          members:
            - "<placeholder-background-model>"
            - "qwen3-embed-0.6B"
            - "bge-reranker-v2-m3"
            - "llama-guard-3-1b"
            - "comfyui_auto"
            - "laya-english"
            - "laya-multilingual"

# --- Startup preload ------------------------------------------------------
hooks:
  on_startup:
    # Preload one model at startup. Preloading multiple requires a shared
    # group with swap:false, otherwise they swap each other out.
    preload:
      - "<placeholder-main-model>"

# --- Profiles: runtime model-ID rerouting --------------------------------
# Switch which model answers an ID via UI or PUT /api/profiles/active.
profiles:
  "default":
    description: "Standard routing"
    pins: {}
  "light":
    description: "Route main IDs to the small background model to save VRAM"
    pins:
      "<placeholder-main-model>": "<placeholder-background-model>"
