# Encryption configuration example (YAML)
# Domain: encryption — at-rest data encryption
# Twin of config.encryption.example.toml

encryption:
  required: false
  compressThreshold: 128 # bytes — compress plaintext smaller than this
  compressAlgorithm: "gzip" # gzip | brotli | zstd
  keyRotationDays: 90
  anonymous: false

  # Optional: server-side encryption key (overrides SMK)
  # serverEncryptionKey: "base64-encoded-key"
