# ───────────────────────────────────────────────────────────
# Example: loop-lore config for local external-server testing
# ───────────────────────────────────────────────────────────
# Copy to config.server-external.yaml, edit paths, then start:
#   bun run src/server.ts
#
# Port strategy:
#   loop-lore app    → 9000
#   sd-server        → 9010
#   llama.cpp        → 9011
#   llama-swap       → 9020+ (one per model)
#   Additional models → increment from 9021
# ───────────────────────────────────────────────────────────

server:
  port: 9000
  host: "localhost"

db:
  type: sqlite
  sqliteFilename: "../loop-lore-data/loop-lore.db"

auth:
  required: false
  registrationOpen: true
  demoUsername: demo
  demoAutoSetup: true

logging:
  level: debug

# ── LLM Provider (llama.cpp via llama-swap) ─────────────
generation:
  providers:
    openaiCompatible:
      - name: llama-swap-default
        label: "Llama-Swap Default"
        baseUrl: http://localhost:9020/v1
        model: <MODEL_ALIAS>
        timeout: 60000
        retries: 2
        allowUserApiKey: false
        models:
          <MODEL_ALIAS>:
            contextLimit: 8192
            maxOutput: 4096

      # Additional llama-swap model (next port)
      # - name: llama-swap-model2
      #   label: "Llama-Swap Model 2"
      #   baseUrl: http://localhost:9021/v1
      #   model: <MODEL2_ALIAS>
      #   timeout: 60000
      #   retries: 2
      #   allowUserApiKey: false
      #   models:
      #     <MODEL2_ALIAS>:
      #       contextLimit: 262144
      #       maxOutput: 4096

      # Direct llama.cpp (no proxy)
      # - name: llama-cpp-direct
      #   label: "llama.cpp Direct"
      #   baseUrl: http://localhost:9011/v1
      #   model: <MODEL_ALIAS>
      #   timeout: 60000
      #   retries: 2
      #   allowUserApiKey: false
      #   models:
      #     <MODEL_ALIAS>:
      #       contextLimit: 8192
      #       maxOutput: 4096

    # ── Image Provider (sd.cpp via sd-server) ────────────
    sd:
      name: sd-cpp-local
      label: "SD CPP Local"
      baseUrl: http://localhost:9010
      apiFamily: sdapi
      timeout: 10000
      generationTimeout: 120000
      defaults:
        width: 512
        height: 512
        steps: 20
        cfgScale: 2.0
        sampler: euler_a
        scheduler: discrete
        negativePrompt: "worst quality, incorrect anatomy"
        # loraModelDir: "/path/to/ai-models/Lora"
        # loras:
        #   - path: "sdxl/AddMicroDetails_Illustrious_v5.safetensors"
        #     multiplier: 0.9
        #     isHighNoise: false

  defaultProvider: llama-swap-default
  defaultModels:
    llama-swap-default: <MODEL_ALIAS>

messages:
  maxGenerationRetries: 3
  generationTimeoutMs: 60000
