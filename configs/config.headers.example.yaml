# Headers configuration example (YAML)
# Domain: headers — security headers (CSP, HSTS, etc.)
# Twin of config.headers.example.toml

headers:
  enabled: true
  referrerPolicy: "strict-origin-when-cross-origin"
  xContentTypeOptions: true
  xFrameOptions: "DENY" # DENY | SAMEORIGIN
  permissionsPolicy: "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), usb=()"
  crossOriginOpenerPolicy: "same-origin"
  crossOriginEmbedderPolicy: "credentialless" # require-corp | credentialless (credentialless keeps CDN/model loads working)
  crossOriginResourcePolicy: "cross-origin"
  timingAllowOrigin: ""
  immutableHashedAssets: true
  csp:
    enabled: true
    defaultSrc: ["'self'"]
    scriptSrc: ["'self'", "'unsafe-eval'", "https://cdn.jsdelivr.net"]
    styleSrc: ["'self'", "'unsafe-inline'"]
    imgSrc: ["'self'", "data:", "blob:"]
    fontSrc: ["'self'"]
    connectSrc: ["'self'", "wss:", "https:"]
    workerSrc: ["'self'", "blob:"]
    objectSrc: ["'none'"]
    baseUri: ["'self'"]
    frameAncestors: ["'none'"]
    formAction: ["'self'"]
    upgradeInsecureRequests: true
    reportOnly: false

    # Optional: client hints and early hints
    # acceptClientHints: ["sec-ch-ua", "sec-ch-ua-platform"]
    # saveData: true
    # earlyHints: { enabled: false }

    # Optional: reporting
    # nel: { enabled: false, reportTo: "default" }

  reportingEndpoints: {}
  nel: null
