# loop-lore environment overrides
# Loaded after config.yaml — overrides config file values
# Env vars (process.env) still win over everything
# Rename to env.yaml to activate
# $schema: ../schemas/loop-lore-config.schema.json

# ── Minimal example — uncomment and set what you need ──

# server:
#   port: 3000

# db:
#   type: sqlite
#   sqliteFilename: ../loop-lore-data/loop-lore.db

# auth:
#   required: true
#   registrationOpen: false

# ── LLM Provider example ──
# Supports arrays, nested objects, multiline strings
# generation:
#   defaultProvider: default
#   providers:
#     openaiCompatible:
#       - name: default
#         label: "Local LLM"
#         baseUrl: "http://localhost:8080/v1"
#         apiKey: ""  # or use process.env.LLM_API_KEY
#         model: "claude-3-haiku"
#         timeout: 30000
#         retries: 3
#         allowUserApiKey: true
#         models:
#           claude-3-haiku:
#             contextLimit: 200000
#             maxOutput: 4096

# ── Complete ENV_MAP key reference ──
# All keys below are flattened: dot.path → UPPER_SNAKE_CASE.
# See src/config/schema-class/env-map.ts for the authoritative source.
# Secrets and special keys are marked with a comment.

# ── server ──────────────────────────────────────────────────────────────────
# PORT: server.port                               # numeric; 0 = random
# HOST: server.host
# TLS_CERT: server.tls.cert                      # path to PEM cert
# TLS_KEY: server.tls.key                        # path to PEM key
# SERVER_TRUST_PROXY: server.trustProxy          # boolean; honor X-Forwarded-For
# SERVER_PUBLIC_ORIGIN: server.publicOrigin      # scheme+host when behind TLS terminator

# ── db ─────────────────────────────────────────────────────────────────────
# DB_TYPE: db.type
# SQLITE_FILENAME: db.sqliteFilename
# DATABASE_URL: db.url                            # Postgres connection string

# ── assets ──────────────────────────────────────────────────────────────────
# ENABLE_ASSETS: assets.enabled
# ASSETS_UPLOAD_DIR: assets.uploadDir
# ASSETS_MAX_FILE_SIZE: assets.maxFileSize
# ASSETS_COMPRESSION: assets.compression
# ASSETS_SIGNED_URL_SECRET: assets.signedUrlSecret
# ASSETS_SIGNED_URL_EXPIRY_SECONDS: assets.signedUrlExpirySeconds

# ── assistant ────────────────────────────────────────────────────────────────
# ENABLE_ASSISTANT: assistant.enabled

# ── logging ──────────────────────────────────────────────────────────────────
# LOG_LEVEL: logging.level                       # trace|debug|info|warn|error|fatal

# ── tui ──────────────────────────────────────────────────────────────────────
# ENABLE_TUI: tui.enabled

# ── docs ─────────────────────────────────────────────────────────────────────
# ENABLE_DOCS: docs.enabled

# ── ageGate ──────────────────────────────────────────────────────────────────
# AGE_GATE_ENABLED: ageGate.enabled
# AGE_GATE_MINIMUM_AGE: ageGate.minimumAge
# AGE_GATE_MODE: ageGate.mode                    # none|self-declaration|verification

# ── auth ─────────────────────────────────────────────────────────────────────
# AUTH_REQUIRED: auth.required
# AUTH_REGISTRATION_OPEN: auth.registrationOpen
# SESSION_TIMEOUT_HOURS: auth.sessionTimeoutHours
# SESSION_MAX_PER_USER: auth.maxSessionsPerUser
# DEMO_USERNAME: auth.demoUsername
# DEMO_AUTO_SETUP: auth.demoAutoSetup
# AUTH_ADMIN_USERNAME: auth.adminUsername
# AUTH_ADMIN_PASSWORD: auth.adminPassword         # ⚠ SECRET — set securely, never commit
# AUTH_LEGACY_OPAQUE_TOKEN_FALLBACK: auth.legacyOpaqueTokenFallback

# ── transport ────────────────────────────────────────────────────────────────
# TRANSPORT_DEFAULT_PROTOCOL: transport.defaultProtocol
# TRANSPORT_ENABLE_WEBSOCKET: transport.enableWebSocket
# TRANSPORT_ENABLE_WEBTRANSPORT: transport.enableWebTransport
# TRANSPORT_ENABLE_H2: transport.enableH2
# TRANSPORT_ENABLE_H3: transport.enableH3
# TRANSPORT_COMPRESSION_ENABLED: transport.compression.enabled
# TRANSPORT_COMPRESSION_DEFAULT: transport.compression.default
# TRANSPORT_COMPRESSION_THRESHOLD: transport.compression.threshold
# TRANSPORT_MAX_FRAME_SIZE: transport.limits.maxFrameSize
# TRANSPORT_MAX_PAYLOAD: transport.limits.maxPayload
# TRANSPORT_MAX_CONCURRENT_STREAMS: transport.limits.maxConcurrentStreams

# ── messages ────────────────────────────────────────────────────────────────
# MESSAGE_AUTO_HIDE_INVALID: messages.autoHideInvalid
# MESSAGE_HIDE_CONFIRMATION: messages.hideConfirmation
# MESSAGE_MAX_LENGTH: messages.maxLength
# MESSAGE_MAX_GENERATION_RETRIES: messages.maxGenerationRetries
# MESSAGE_GENERATION_TIMEOUT_MS: messages.generationTimeoutMs
# MESSAGE_IDEMPOTENCY_EXPIRY_HOURS: messages.idempotencyExpiryHours

# ── nsfw ─────────────────────────────────────────────────────────────────────
# ALLOW_NSFW: nsfw.allowNsfw
# NSFW_MIN_AGE: nsfw.nsfwMinAge
# NSFW_DEFAULT_SCOPE: nsfw.defaultNsfwScope         # chat|user|world
# NSFW_CONSENT_REQUIRED: nsfw.consentRequired
# NSFW_AUDIT_LOGGING: nsfw.auditLogging
# NSFW_USE_LLM_CLASSIFIER: nsfw.useLlmClassifier
# NSFW_PII_SECRET: nsfw.piiSecret                  # ⚠ SECRET — HMAC key, required in prod
# NSFW_FLAG_REPORTER_HASH_SECRET: nsfw.reporterHashSecret  # ⚠ SECRET — HMAC for reporter hashes
# NSFW_MODERATION_HMAC_SECRET: nsfw.reporterHashSecret    # ⚠ alias for NSFW_FLAG_REPORTER_HASH_SECRET

# ── observability ────────────────────────────────────────────────────────────
# TELEMETRY_PII_SECRET: observability.telemetry.piiSecret  # ⚠ SECRET — HMAC for telemetry PII redaction

# ── hooks ────────────────────────────────────────────────────────────────────
# ENABLE_MOOD_HOOKS: hooks.enableMoodHooks
# ENABLE_EMOTION_HOOKS: hooks.enableEmotionHooks
# ENABLE_NSFW_HOOKS: hooks.enableNsfwHooks
# ENABLE_MODERATION_HOOKS: hooks.enableModerationHooks

# ── generation ────────────────────────────────────────────────────────────────
# LLM_DEFAULT_PROVIDER: generation.defaultProvider

# ── byoKey ───────────────────────────────────────────────────────────────────
# BYO_KEY_ENABLED: byoKey.enabled
# BYO_KEY_ENCRYPTION_KEY: byoKey.encryptionKey     # ⚠ SECRET

# ── encryption ────────────────────────────────────────────────────────────────
# SERVER_ENCRYPTION_KEY: encryption.serverEncryptionKey  # ⚠ SECRET — 256-bit hex; SMK
# ENCRYPTION_REQUIRED: encryption.required
# COMPRESS_THRESHOLD: encryption.compressThreshold
# COMPRESS_ALGORITHM: encryption.compressAlgorithm  # gzip|brotli|zstd
# KEY_ROTATION_DAYS: encryption.keyRotationDays

# ── dynamicResponse ───────────────────────────────────────────────────────────
# DYNAMICRESPONSE_ENABLED: dynamicResponse.enabled
# DYNAMICRESPONSE_MINIFY: dynamicResponse.minify
# DYNAMICRESPONSE_VALIDATE: dynamicResponse.validate
# DYNAMICRESPONSE_COMPRESS: dynamicResponse.compress
# DYNAMICRESPONSE_COMPRESS_ALGORITHM: dynamicResponse.compressAlgorithm
# DYNAMICRESPONSE_COMPRESS_THRESHOLD: dynamicResponse.compressThreshold

# ── frontend ─────────────────────────────────────────────────────────────────
# FRONTEND_MODE: frontend.mode

# ── cron ─────────────────────────────────────────────────────────────────────
# CRON_ENABLED: cron.enabled

# ── federation ────────────────────────────────────────────────────────────────
# MESH_PSK: federation.meshPsk                     # ⚠ SECRET — pre-shared key for mesh auth

# ── testing (dev only) ──────────────────────────────────────────────────────
# TESTING_LLAMA_MODEL: testing.llamaModel
# TESTING_SD_MODEL: testing.sdModel
# TESTING_LLAMA_PORT: testing.llamaPort
# TESTING_SD_PORT: testing.sdPort
