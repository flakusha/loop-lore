# Avatar Templates
#
# Emotion-to-asset mapping and intent patterns for avatar changes.
# Merge strategy: replace | extend (default) | override
#
# extend: adds new emotions/patterns, existing keys from config win on conflict
# replace: wipes all built-in emotions, uses only these
# override: deep merges over built-ins

merge = "extend"

# Emotion key -> asset mapping
# Each emotion maps to an asset file and an intent description for LLM context

[emotions.happy]
asset = "happy.png"
intent = "The character smiles warmly"

[emotions.sad]
asset = "sad.png"
intent = "The character looks downcast"

[emotions.angry]
asset = "angry.png"
intent = "The character frowns with irritation"

[emotions.surprised]
asset = "surprised.png"
intent = "The character raises an eyebrow"

[emotions.thinking]
asset = "thinking.png"
intent = "The character looks thoughtful"

[emotions.embarrassed]
asset = "embarrassed.png"
intent = "The character blushes slightly"

# Intent patterns for detecting avatar change requests
# pattern: text to match (substring or regex)
# emotion: target emotion key from the emotions map above

[[intentPatterns]]
pattern = "smile"
emotion = "happy"

[[intentPatterns]]
pattern = "grin"
emotion = "happy"

[[intentPatterns]]
pattern = "laugh"
emotion = "happy"

[[intentPatterns]]
pattern = "cry"
emotion = "sad"

[[intentPatterns]]
pattern = "weep"
emotion = "sad"

[[intentPatterns]]
pattern = "frown"
emotion = "angry"

[[intentPatterns]]
pattern = "scowl"
emotion = "angry"

[[intentPatterns]]
pattern = "surprise"
emotion = "surprised"

[[intentPatterns]]
pattern = "shock"
emotion = "surprised"

[[intentPatterns]]
pattern = "think"
emotion = "thinking"

[[intentPatterns]]
pattern = "ponder"
emotion = "thinking"

[[intentPatterns]]
pattern = "blush"
emotion = "embarrassed"

[[intentPatterns]]
pattern = "embarrass"
emotion = "embarrassed"

# ── Outfit × Emotion variant matrix (wardrobe/loadout feature) ──────────
# The wardrobe/loadout avatar variant feature (epic-wardrobe-avatar-variants.md)
# extends the variant key from emotion-only to (outfit_id, emotion). Each
# entry below is one cell of the variant matrix; the asset is the
# pre-generated image at configs/assets/characters/<actor>/<outfit>/<emotion>.png
# and the intent is the prompt-fragment fed to the avatar generator.
# Selection algorithm resolves (outfit, emotion) with the fallback ladder:
#   (outfit,emotion) → (outfit,neutral) → (default,emotion) → base avatar
#
# [[outfits]]
# id = "default"           # base outfit (always present)
# descriptor = "default appearance"
# default_outfit = true
#
# [outfits.variants.happy]
# asset = "characters/elara/default/happy.png"
# intent = "warm smile, default robes"
#
# [outfits.variants.sad]
# asset = "characters/elara/default/sad.png"
# intent = "downcast, default robes"
#
# [[outfits]]
# id = "court-dress"
# descriptor = "elegant silk court dress in deep blue and silver"
#
# [outfits.variants.happy]
# asset = "characters/elara/court-dress/happy.png"
# intent = "smiling, court dress, formal headdress"
#
# [outfits.variants.sad]
# asset = "characters/elara/court-dress/sad.png"
# intent = "composed, court dress, formal headdress"
#
# [outfits.variants.angry]
# asset = "characters/elara/court-dress/angry.png"
# intent = "stern, court dress, formal headdress"
#
# # Default outfit when no context binding fires; defaults to "default".
# default_outfit = "default"
