# Guided entity-creation workflows (TASK-gm-reuse-workflowrunner-for-guided-entity-creation).
# Each workflow walks the user through prompt construction step by step via
# src/assistant/workflow-runner.ts; the assembled prompt feeds the /create
# description, which keeps generate -> quality gates -> create-entity-preview
# confirmation (entities are never persisted without user approval).
#
# `intent` lets src/assistant/workflow-routing.ts match a message through the
# INTENT_PATTERNS taxonomy (epic-assistant-creative-studio-workflows section 7.4),
# which catches phrasings the literal `triggers` list misses.
# `entityType` keys this workflow into entity-types.yaml, which cross-validates
# the required steps, quality gates, and dispatch target at load time.
merge: extend

workflows:
  entity-character:
    id: entity-character
    name: Guided character creation
    description: Step-by-step character prompt building for GM-guided creation.
    triggers:
      - create a character
      - new character
      - guided character
    intent:
      type: generate
      target: character
    entityType: character
    steps:
      - id: name
        name: Name
        type: text
        description: Character name.
        minLength: 1
        maxLength: 120
        formatTemplate: "Name: {value}"
      - id: description
        name: Description
        type: text
        description: Physical description and background.
        minLength: 4
        maxLength: 2000
        formatTemplate: "Description: {value}"
      - id: appearance
        name: Appearance
        type: text
        description: Distinctive features, clothing, and silhouette.
        recommendations:
          - weathered leathers, close-cropped hair, a scar across the knuckles
        minLength: 2
        maxLength: 1000
        formatTemplate: "Appearance: {value}"
      - id: personality
        name: Personality
        type: text
        description: Personality traits and voice.
        recommendations:
          - brave but cautious, dry humor
        minLength: 2
        maxLength: 1000
        formatTemplate: "Personality: {value}"
      - id: scenario
        name: Opening scenario
        type: text
        description: How this character enters the story.
        minLength: 2
        maxLength: 2000
        required: false
        formatTemplate: "Scenario: {value}"
      - id: motivation
        name: Motivation
        type: text
        description: What this character wants right now.
        minLength: 2
        maxLength: 1000
        required: false
        formatTemplate: "Motivation: {value}"
    dispatch:
      backend: assistant-create
      target: /create char
      payloadTemplate:
        description: "{prompt}"
      nsfwPolicy: prefilter
    approval:
      type: confirm
      preview: true

