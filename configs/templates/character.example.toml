# Character Template Configuration (TOML format)
#
# TOML supports multiline strings with triple quotes:
#
# Basic string (auto-combines lines):
#   description = """lines
#   are auto-combined"""
#
# Literal string (no escape processing):
#   welcome_message = '''preserve
#   backslashes \n \t'''
#
# One-line strings work too:
#   name = "My Character"
#
# Copy this file to configs/templates/character.toml and customize as needed.

merge = "extend" # extend | override | replace

