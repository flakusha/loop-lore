<!-- Fractal Tab (recursive tree + travel routes + transport attach) -->
<div
  x-show="activeTab === 'fractal'"
  x-data="fractalLocationsState('{{worldId}}')"
  data-testid="fractal-locations"
>
  <div style="display: flex; gap: var(--space-4); flex-wrap: wrap">
    <!-- Tree column -->
    <div style="flex: 1 1 40%; min-width: 280px">
      <h3 style="margin-top: 0">Location tree</h3>
      <div x-show="loadingTree" class="empty-state">Loading…</div>
      <div x-show="error" class="empty-state"><div class="title">Tree load failed</div></div>
      <div x-show="loadedTree && tree.length === 0" class="empty-state">
        <div class="title">No locations yet</div>
      </div>
      <div style="display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2)">
        <template x-for="kind in fractalKindOptions" :key="kind">
          <button
            type="button"
            class="btn btn-sm"
            :class="filterKind === (kind === 'All' ? '' : kind) ? 'btn-primary' : 'btn-ghost'"
            @click="filterKind = kind === 'All' ? '' : kind"
            x-text="kind"
            :data-testid="'fractal-kind-' + kind"
          >
          </button>
        </template>
      </div>
      <div data-testid="fractal-tree" x-html="fractalTreeMarkup(tree, routeMeta, filterKind)"></div>
    </div>

    <!-- Routes column -->
    <div style="flex: 1 1 55%; min-width: 320px">
      <h3 style="margin-top: 0">Travel routes</h3>

      <!-- New route form -->
      <div style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); margin-bottom: var(--space-4)">
        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center">
          <input
            class="form-input"
            type="text"
            placeholder="Route name"
            x-model="newRoute.name"
            style="flex: 1 1 200px; min-width: 0"
            data-testid="fractal-route-name"
          />
          <select class="form-input" x-model="newRoute.kind" data-testid="fractal-route-kind">
            <option value="sea">sea</option>
            <option value="road">road</option>
            <option value="air">air</option>
            <option value="rail">rail</option>
            <option value="custom">custom</option>
          </select>
          <label style="font-size: 12px"><input type="checkbox" x-model="newRoute.loop" /> loop</label>
          <input
            class="form-input"
            type="number"
            x-model.number="newRoute.secondsPerUnit"
            min="1"
            max="86400"
            style="width: 90px"
            data-testid="fractal-route-seconds"
          />
          <button
            class="btn btn-primary"
            :disabled="creatingRoute || !newRoute.name.trim()"
            @click="createRoute()"
            data-testid="fractal-route-create"
          >
            Create
          </button>
        </div>
      </div>

      <!-- Routes list -->
      <div x-show="loadingRoutes">Loading…</div>
      <div x-show="loadedRoutes && routes.length === 0" class="empty-state">
        <div class="title">No routes yet</div>
      </div>
      <ul style="list-style: none; padding-left: 0">
        <template x-for="r in routes" :key="r.id">
          <li
            style="padding: var(--space-2); border: 1px solid var(--border-default); border-radius: var(--radius-sm); margin-bottom: var(--space-2); cursor: pointer"
            :class="{ active: selectedRouteId === r.id }"
            @click="selectRoute(r.id)"
          >
            <div style="display: flex; gap: var(--space-2); align-items: center">
              <strong x-text="r.name"></strong>
              <span class="badge" x-text="r.kind"></span>
              <span x-show="r.loop === 1" class="badge">loop</span>
            </div>
            <div
              x-show="selectedRouteId === r.id && routeDetail"
              style="margin-top: var(--space-2); font-size: 13px"
            >
              <div>seconds_per_unit: <span x-text="r.seconds_per_unit"></span></div>
              <div>stops (<span x-text="routeDetail.stops.length"></span>):</div>
              <ol>
                <template x-for="s in routeDetail.stops" :key="s.id">
                  <li>
                    stop #<span x-text="s.stop_order"></span> — location <span
                      x-text="s.location_id.slice(0, 8)"
                    ></span>
                  </li>
                </template>
              </ol>
            </div>
          </li>
        </template>
      </ul>

      <!-- Attach transport -->
      <div style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); margin-top: var(--space-3)">
        <h4 style="margin-top: 0">Attach transport to route</h4>
        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center">
          <select class="form-input" x-model="attachRouteId" data-testid="fractal-attach-route">
            <option value="">— pick route —</option>
            <template x-for="r in routes" :key="r.id">
              <option :value="r.id" x-text="r.name"></option>
            </template>
          </select>
          <select class="form-input" x-model="attachLocationId" data-testid="fractal-attach-location">
            <option value="">— pick transport —</option>
            <template x-for="loc in flatLocations" :key="loc.id">
              <option :value="loc.id" x-text="loc.label"></option>
            </template>
          </select>
          <button
            class="btn btn-primary"
            :disabled="attaching || !attachLocationId || !attachRouteId"
            @click="attachTransport()"
            data-testid="fractal-attach-btn"
          >
            Attach
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
