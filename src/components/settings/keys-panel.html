<div x-show="activeTab === 'keys'" class="settings-tab-content" data-testid="settings-keys">
  <div class="settings-section" x-data="keyManagement()" x-init="init()">
    <div class="section-title">{{{t("settings.encryptionKeys")}}}</div>
    <div class="section-description">
      {{{t("settings.encryptionKeysDescription")}}}
    </div>

    <!-- Error message -->
    <template x-if="error">
      <div
        class="p-3 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-lg text-sm"
        x-text="error"
      >
      </div>
    </template>

    <!-- Loading indicator -->
    <template x-if="loading">
      <div class="text-center py-4 text-gray-500">
        <span
          class="animate-spin inline-block w-5 h-5 border-2 border-current border-t-transparent rounded-full"
        ></span>
      </div>
    </template>

    <!-- Actions -->
    <div class="flex gap-2 flex-wrap mb-4">
      <button @click="showGenerateModal = true" class="btn btn-primary">
        {{{t("settings.generateNewKey")}}}
      </button>
      <button @click="showRotateConfirm = true" :disabled="loading" class="btn btn-warning">
        {{{t("settings.rotatePrimaryKey")}}}
      </button>
    </div>

    <!-- Keys list -->
    <div class="space-y-2">
      <template x-if="!loading && keys.length === 0">
        <p class="text-gray-500 text-sm">{{{t("settings.noEncryptionKeys")}}}</p>
      </template>

      <template x-for="key in keys" :key="key.id">
        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-800 rounded-lg">
          <div class="space-y-1">
            <div class="font-medium" x-text="key.name"></div>
            <div class="text-xs text-gray-500 space-x-3">
              <span x-text="t('settings.keyId', { id: key.id.slice(0, 8) }) + '...'"></span>
              <span x-text="t('settings.keyCreated', { date: formatDate(key.createdAt) })"></span>
              <template x-if="key.expiresAt">
                <span x-text="t('settings.keyExpires', { date: formatDate(key.expiresAt) })"></span>
              </template>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span
              class="text-xs font-medium uppercase"
              :class="statusColor(key.status)"
              x-text="key.status"
            ></span>
            <template x-if="key.status === 'active'">
              <button @click="confirmRevoke(key)" class="text-red-600 hover:text-red-700 text-sm">
                {{{t("settings.revoke")}}}
              </button>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Generate Key Modal -->
    <template x-if="showGenerateModal">
      <div
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
        @click.self="showGenerateModal = false"
      >
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md space-y-4">
          <h3 class="text-lg font-semibold">{{{t("settings.generateNewKey")}}}</h3>
          <div>
            <label class="block text-sm font-medium mb-1">{{{t("settings.keyName")}}}</label>
            <input
              type="text"
              x-model="newKeyName"
              @keydown.enter="generateKey()"
              class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600"
              x-bind:placeholder="t('settings.keyNamePlaceholder')"
              autofocus
            >
          </div>
          <div class="flex justify-end gap-2">
            <button
              @click="showGenerateModal = false"
              class="px-3 py-1.5 text-gray-600 hover:text-gray-800 text-sm"
            >
              {{{t("common.cancel")}}}
            </button>
            <button
              @click="generateKey()"
              :disabled="!newKeyName.trim() || loading"
              class="btn btn-primary disabled:opacity-50"
            >
              {{{t("settings.generate")}}}
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Revoke Confirmation Modal -->
    <template x-if="showRevokeModal">
      <div
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
        @click.self="showRevokeModal = false"
      >
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md space-y-4">
          <h3 class="text-lg font-semibold text-red-600">{{{t("settings.revokeKey")}}}</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400">
            {{{t("settings.revokeWarning")}}}
          </p>
          <p class="text-sm font-medium">
            {{{t("settings.keyToRevoke")}}} <span class="text-red-600" x-text="revokeKeyName"></span>
          </p>
          <div class="flex justify-end gap-2">
            <button
              @click="showRevokeModal = false"
              class="px-3 py-1.5 text-gray-600 hover:text-gray-800 text-sm"
            >
              {{{t("common.cancel")}}}
            </button>
            <button @click="revokeKey()" :disabled="loading" class="btn btn-danger disabled:opacity-50">
              {{{t("settings.revokeKey")}}}
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Rotate Confirmation Modal -->
    <template x-if="showRotateConfirm">
      <div
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
        @click.self="showRotateConfirm = false"
      >
        <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md space-y-4">
          <h3 class="text-lg font-semibold text-yellow-600">{{{t("settings.rotateKey")}}}</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400">
            {{{t("settings.rotateWarning")}}}
          </p>
          <div class="p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-lg">
            <p class="text-sm text-yellow-800 dark:text-yellow-200 font-medium">
              {{{t("settings.forwardSecrecy")}}}
            </p>
            <p class="text-sm text-yellow-700 dark:text-yellow-300 mt-1">
              {{{t("settings.forwardSecrecyDescription")}}}
            </p>
          </div>
          <div class="flex justify-end gap-2">
            <button
              @click="showRotateConfirm = false"
              class="px-3 py-1.5 text-gray-600 hover:text-gray-800 text-sm"
            >
              {{{t("common.cancel")}}}
            </button>
            <button
              @click="rotateKey(); showRotateConfirm = false"
              :disabled="loading"
              class="btn btn-warning disabled:opacity-50"
            >
              {{{t("settings.rotateKey")}}}
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
