<div x-show="activeTab === 'api'" class="settings-tab-content" data-testid="settings-api">
  <div class="settings-section">
    <div class="form-group">
      <label class="form-label" for="api-provider">{{{t("settings.provider")}}}<span
          class="info-bubble-host"
          x-data="infoBubble({ helpKey: 'help.settings.provider' })"
        >{{> info-bubble.html }}</span></label>
      <select
        class="form-select"
        id="api-provider"
        name="provider"
        data-testid="api-provider"
        x-model="provider"
        @change="onProviderChange(); saveApi()"
      >
        <template x-for="p in providerList" :key="p.name">
          <option :value="p.name" x-text="p.label"></option>
        </template>
        <option value="Custom">{{{t("settings.custom")}}}</option>
      </select>
      <template x-if="providerListNotice !== ''">
        <div
          style="padding: 10px 14px; margin-top: 8px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; font-size: 13px; color: #6b5400"
          role="alert"
          data-testid="provider-list-notice"
        >
          <strong x-text="t(providerListNotice)"></strong>
        </div>
      </template>
    </div>
    <div class="form-group">
      <label class="form-label" for="apiKey">{{{t("settings.apiKey")}}}<span
          class="info-bubble-host"
          x-data="infoBubble({ helpKey: 'help.settings.apiKey' })"
        >{{> info-bubble.html }}</span></label>
      <div class="form-row">
        <input
          type="password"
          class="form-input"
          id="apiKey"
          name="apiKey"
          x-model="apiKey"
          x-bind:placeholder="t('settings.enterApiKey')"
        />
        <button type="button" class="btn btn-secondary" @click="clearApiKey()">{{{t("common.clear")}}}</button>
      </div>
    </div>
    <div class="form-group" id="api-endpoint-group" style="display: none">
      <label class="form-label" for="apiEndpoint">{{{t("settings.apiEndpoint")}}}</label>
      <input
        type="text"
        class="form-input"
        id="apiEndpoint"
        name="apiEndpoint"
        x-model="apiEndpoint"
        x-bind:placeholder="t('settings.apiEndpointPlaceholder')"
      />
    </div>
    <div class="form-group">
      <label class="form-label" for="model">{{{t("settings.model")}}}<span
          class="info-bubble-host"
          x-data="infoBubble({ helpKey: 'help.settings.model' })"
        >{{> info-bubble.html }}</span></label>
      <input
        type="text"
        class="form-input"
        id="model"
        name="model"
        x-model="model"
        x-bind:placeholder="t('settings.modelPlaceholder')"
      />
    </div>
    <div class="form-group">
      <label class="form-label" for="maxTokens">{{{t("settings.maxTokens")}}}<span
          class="info-bubble-host"
          x-data="infoBubble({ helpKey: 'help.settings.maxTokens' })"
        >{{> info-bubble.html }}</span></label>
      <input
        type="number"
        class="form-input"
        id="maxTokens"
        name="maxTokens"
        x-model="maxTokens"
        step="256"
        min="1024"
        max="128000"
      />
    </div>
    <div class="form-group">
      <label class="form-label">{{{t("settings.temperature")}}}<span
          class="info-bubble-host"
          x-data="infoBubble({ helpKey: 'help.settings.temperature' })"
        >{{> info-bubble.html }}</span>: <span
          id="temp-value"
          x-text="Number(temperature).toFixed(1)"
        ></span></label>
      <input
        type="range"
        class="form-range"
        name="temperature"
        x-model="temperature"
        min="0"
        max="2"
        step="0.1"
        data-testid="temp-slider"
        @input="onTempInput()"
      />
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" :disabled="saving" @click="testConnection()">
        {{{t("settings.testConnection")}}}
      </button>
    </div>
  </div>
</div>
