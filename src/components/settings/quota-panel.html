<div x-show="activeTab === 'quota'" class="settings-tab-content" data-testid="settings-quota">
  <div class="settings-section">
    <template x-if="quotaNotice === 'quotaExhausted'">
      <div
        style="padding: 10px 14px; margin-bottom: 12px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; font-size: 13px; color: #6b5400"
        role="alert"
        data-testid="quota-exhaustion-notice"
      >
        <strong>{{{t("settings.quotaExhausted")}}}</strong>
        <span>{{{t("settings.quotaFallbackNote")}}}</span>
      </div>
    </template>
    <template x-if="quotaResources.length === 0">
      <p class="text-gray-500 text-sm">{{{t("settings.quotaEmpty")}}}</p>
    </template>
    <template x-for="r in quotaResources" :key="r.id">
      <div
        style="padding: 12px; background: var(--bg-secondary, #f8f9fa); border-radius: 6px; margin-bottom: 8px"
        data-testid="quota-gauge"
      >
        <div style="display: flex; align-items: center; gap: 8px">
          <strong x-text="r.id"></strong>
          <span style="font-size: 12px; color: var(--text-secondary)" x-text="r.provider + ' / ' + r.type"></span>
          <template x-if="r.overQuota">
            <span
              style="font-size: 11px; padding: 1px 6px; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 10px; color: #721c24"
              data-testid="quota-over-flag"
            >{{{t("settings.quotaOver")}}}</span>
          </template>
          <template x-if="quotaIsAdmin">
            <button
              class="btn btn-secondary btn-xs"
              style="margin-left: auto"
              @click="overrideQuota(r.id)"
              data-testid="quota-override"
            >
              {{{t("settings.quotaOverride")}}}
            </button>
          </template>
        </div>
        <template x-for="d in r.dimensions" :key="d.key">
          <div style="margin-top: 6px; font-size: 12px">
            <span
              x-text="d.key + ': ' + d.used + ' / ' + (d.ceiling === null ? t('settings.quotaUnlimited') : d.ceiling)"
            ></span>
            <div style="height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; margin-top: 4px">
              <div
                style="height: 100%; background: var(--accent-primary, #6cf)"
                :style="{ width: quotaPercent(d.used, d.ceiling) + '%' }"
              >
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>
