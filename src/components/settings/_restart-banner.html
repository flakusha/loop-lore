<!-- Restart-required banner (TASK-restart-required-indicator-on-system-config-changes) -->
<div
  x-show="hasPendingRestart()"
  x-cloak
  style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 12px 0; background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; font-size: 13px; color: #6b5400"
  role="alert"
>
  <span style="font-size: 18px">⚠️</span>
  <span style="flex: 1">
    <strong>Server restart pending.</strong>
    Some saved system-config values require a restart before they take effect:
    <code x-text="pendingRestartKeys.join(', ')"></code>.
  </span>
  <button class="btn btn-secondary btn-xs" @click="dismissRestartBanner()">Dismiss</button>
</div>
