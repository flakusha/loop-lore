<div x-show="activeTab === 'workflows'" class="settings-tab-content" data-testid="settings-workflows">
  <div class="settings-section">
    <template x-for="entry in workflowUseCases" :key="entry.useCase">
      <div class="form-group">
        <label
          class="form-label"
          :for="'workflow-' + entry.useCase"
          x-text="workflowUseCaseLabel(entry.useCase)"
        ></label>
        <select
          class="form-select"
          :id="'workflow-' + entry.useCase"
          @change="onWorkflowChange(entry.useCase, $event.target.value)"
        >
          <template x-for="option in entry.supported" :key="option.id">
            <option
              :value="option.id"
              :selected="option.id === (workflowSelections[entry.useCase] || entry.selected)"
              x-text="option.label"
            >
            </option>
          </template>
        </select>
      </div>
    </template>
  </div>
</div>
