<!-- Header Component (Reusable across pages) -->
<header id="header-slot" class="main-header" hx-swap-oob="beforebegin:#app-root" data-testid="page-header">
  <button
    class="hamburger"
    @click="$store.sidebar.open = !$store.sidebar.open"
    x-show="!$store.sidebar.open"
    data-testid="hamburger"
  >
    ☰
  </button>
  <span class="title" id="page-title">{{title}}</span>
  <div class="actions">
    <!-- Action buttons dynamically inserted via page-specific templates -->
  </div>
</header>
