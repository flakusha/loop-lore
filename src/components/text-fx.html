<!--
  Text Effects (TASK-025)
  -----------------------
  Inline wrapper that applies shake / glow / typewriter / fade
  effects to its slot via the `fx` attribute (one of:
    shake | glow | typewriter | fade
  no value defaults to "fade").

  Driven from src/frontend/effects/text-fx.ts. CSS owns the
  keyframes (see fx-* classes in app.css); this partial just
  exposes a uniform surface and applies the right class.

  Accessibility: when prefers-reduced-motion is set, the global
  CSS rule disables fx-shake / fx-glow keyframes — the end state
  is identical (an opaque element with no transform).
-->
<span
  class="text-fx"
  :class="fxClass"
  x-data="{ fx: $el.getAttribute('fx') || 'fade', get fxClass(){ return 'fx-' + this.fx; } }"
  data-testid="text-fx"
>
  <slot></slot>
</span>
