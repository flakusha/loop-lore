<div class="form-field">
  <label for="username">Username</label>
  <input
    type="text"
    id="username"
    name="username"
    required
    autofocus
    autocomplete="username"
    class="form-input"
    data-testid="username-input"
  />
</div>

<div class="form-field">
  <label for="password">Password</label>
  <input
    type="password"
    id="password"
    name="password"
    required
    autocomplete="current-password"
    class="form-input"
    data-testid="password-input"
  />
</div>
