<!--
  Emotion avatar batch generation panel for character info. Bound to
  the `actorEmotionAvatarsFactory` Alpine plugin.
-->
<div
  x-data="actorEmotionAvatarsFactory(actorId,)"
  x-init="setActorId(actorId,)"
  class="emotion-avatars-panel"
>
  <h3>Generate emotion avatars</h3>

  <label>
    Base avatar id
    <input type="text" x-model="baseAvatarId" placeholder="av-1" />
  </label>

  <fieldset>
    <legend>Emotions</legend>
    <template x-for="emotion in emotionTypes" :key="emotion">
      <label class="emotion-toggle">
        <input type="checkbox" :checked="selectedEmotions.includes(emotion)" @change="toggleEmotion(emotion)" />
        <span x-text="emotion"></span>
      </label>
    </template>
  </fieldset>

  <label>
    Prompt prefix (optional)
    <input type="text" x-model="promptPrefix" />
  </label>

  <label>
    Negative prompt (optional)
    <input type="text" x-model="negativePrompt" />
  </label>

  <label>
    Base seed (optional)
    <input type="number" x-model.number="seed" min="0" :disabled="reuseSeed" placeholder="random" />
  </label>

  <label class="emotion-toggle">
    <input type="checkbox" x-model="reuseSeed" />
    Reuse the seed recorded for this actor
  </label>

  <button
    type="button"
    :disabled="busy || !_eaActorId || !baseAvatarId || selectedEmotions.length === 0"
    @click="startGeneration()"
  >
    Start batch generation
  </button>

  <button type="button" :disabled="busy || !_eaActorId" @click="regenerate()">
    Regenerate all
  </button>

  <button
    type="button"
    :disabled="busy || !_eaActorId || selectedEmotions.length === 0"
    @click="regenerate(selectedEmotions)"
  >
    Regenerate selected
  </button>

  <p x-show="message" x-text="message" class="emotion-avatars-message"></p>
  <p x-show="error" x-text="error" class="emotion-avatars-error"></p>

  <h3>Current emotion avatars</h3>
  <button type="button" :disabled="busy" @click="loadVariants()">
    Refresh variants
  </button>
  <ul class="emotion-avatars-variants">
    <template x-for="variant in variants" :key="variant.id">
      <li>
        <img :src="'/api/v1/assets/' + variant.assetId + '/thumb'" :alt="variant.label" width="56" height="56" />
        <span x-text="variant.emotion"></span>
        <button type="button" :disabled="busy" @click="regenerate([variant.emotion])">
          Re-roll
        </button>
      </li>
    </template>
  </ul>
  <p x-show="variants.length === 0" class="emotion-avatars-hint">
    No emotion avatars yet.
  </p>

  <h3>Jobs</h3>
  <button type="button" :disabled="jobsLoading" @click="refresh()">Refresh</button>
  <p x-show="jobsLoading">Loading…</p>
  <p x-show="jobsError" x-text="jobsError" class="emotion-avatars-error"></p>

  <table>
    <thead>
      <tr>
        <th>Job</th>
        <th>Status</th>
        <th>Progress</th>
        <th>Emotions</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="job in jobs" :key="job.id">
        <tr>
          <td x-text="job.id"></td>
          <td x-text="job.status"></td>
          <td>
            <template x-if="isJobActive(job) && job.progress && job.progress.total > 0">
              <span class="emotion-avatars-progress">
                <progress
                  :value="job.progress.done"
                  :max="job.progress.total"
                  :title="t('status.emotionAvatarsProgress', { done: String(job.progress.done), total: String(job.progress.total), })"
                >
                </progress>
                <span x-text="job.progress.done + '/' + job.progress.total"></span>
              </span>
            </template>
          </td>
          <td x-text="(job.emotions || []).join(', ')"></td>
          <td>
            <button type="button" x-show="isJobActive(job)" @click="cancelJob(job.id)">
              Cancel
            </button>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
</div>
