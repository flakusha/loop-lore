<!-- Character Card Component (reusable) -->
<template x-for="char in characters" :key="char.id">
  <div class="character-card" @click="selectCharacter(char)" :data-testid="'character-card-' + char.id">
    <div class="card-img">
      <span>👤</span>
    </div>
    <div class="card-body">
      <div class="name" x-text="char.display_name"></div>
      <div class="description" x-text="char.description || 'No description'"></div>
    </div>
  </div>
</template>
