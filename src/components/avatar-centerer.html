<!--
  Avatar Centerer (TASK-001)
  --------------------------
  Pure-DOM wrapper that centers a single avatar slot inside its host
  across viewport widths from 360px to 1920px.

  Math:
    translate(-50%, -50%) places the slot's geometric center at the
    host's (50%, 50%) point. A small clamp step (--avatar-safe-pad)
    pulls the slot inward by 12px on narrow phones so the avatar never
    touches the modal chrome edges. The math is recomputed on window
    resize (debounced 50ms) but is NOT animated — applying the result
    is a single style mutation, so prefers-reduced-motion users get
    the same end state without any motion at all.

  Pair with: src/frontend/components/avatar-centerer.ts (the
  avatarCenterer() Alpine data factory).
-->
<div
  class="avatar-centerer"
  x-data="avatarCenterer()"
  x-init="recompute()"
  @resize.window.debounce.50ms="recompute()"
  :style="centerStyle"
  data-testid="avatar-centerer"
>
  <slot></slot>
</div>
