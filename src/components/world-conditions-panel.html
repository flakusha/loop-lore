<!--
  Conditions strip: time/weather widget (TASK-time-weather). Values come
  from the world conditions engine via the SSE `conditions` event —
  weather / time_of_day / season / temperature on the world clock, plus a
  seeded three-day forecast. Host scope: worldState(worldId).
-->
<section
  class="panel world-conditions-panel"
  aria-labelledby="conditions-heading"
  data-testid="time-weather"
>
  <h3 id="conditions-heading">{{{ t("worlds.conditionsTitle") }}}</h3>
  <div x-show="!hasConditions" class="muted">{{{ t("worlds.conditionsNone") }}}</div>
  <!--
    Live region: SSE pushes swap the values in place; polite so the
    change is announced without interrupting screen-reader output.
  -->
  <div x-show="hasConditions" class="conditions-row" aria-live="polite" aria-atomic="false">
    <span
      class="condition"
      data-testid="condition-time"
      :aria-label="t('worlds.conditionTimeOfDay')"
      x-text="`${timeIcon} ${timeOfDay || '—'}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-weather"
      :aria-label="t('worlds.conditionWeather')"
      x-text="`${weatherIcon} ${weather || '—'}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-season"
      x-show="hasSeason"
      :aria-label="t('worlds.conditionSeason')"
      x-text="`${seasonIcon} ${season}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-temperature"
      x-show="temperature !== null"
      :aria-label="t('worlds.conditionTemperature')"
      x-text="`${temperature}°`"
    ></span>
    <span
      class="condition"
      data-testid="condition-world-day"
      x-show="conditionsDay !== null"
      :aria-label="t('worlds.conditionsDayLabel')"
      x-text="`${t('worlds.conditionsDayLabel')} ${conditionsDay}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-day-night"
      x-show="timeOfDay"
      :aria-label="t('worlds.conditionDayNight')"
      x-text="t(isNightNow ? 'worlds.nightLabel' : 'worlds.dayLabel')"
    ></span>
    <span
      class="sse-dot"
      :class="sseConnected ? 'on' : 'off'"
      :aria-label="sseConnected ? t('worlds.conditionLive') : t('worlds.conditionOffline')"
      x-text="sseConnected ? t('worlds.conditionLive') : t('worlds.conditionOffline')"
    ></span>
  </div>
  <div x-show="forecastAvailable" class="conditions-forecast" data-testid="conditions-forecast">
    <span class="conditions-forecast-title">{{{ t("worlds.forecastTitle") }}}</span>
    <template x-for="f in forecast" :key="f.day">
      <span
        class="condition forecast-day"
        :aria-label="t('worlds.forecastTitle')"
        x-text="`${iconForWeather(f.weather)} ${f.weather} · ${t('worlds.conditionsDayLabel')} ${f.day} · ${f.temperature}°`"
      ></span>
    </template>
  </div>
</section>
