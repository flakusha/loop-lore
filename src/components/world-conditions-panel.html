<!--
  Conditions strip: time/weather widget (TASK-time-weather). Values are
  author-set labels read from the location_states columns — this build has no
  weather or clock engine, so the panel says so instead of implying
  simulation. Host scope: worldState(worldId).
-->
<section
  class="panel world-conditions-panel"
  aria-labelledby="conditions-heading"
  data-testid="time-weather"
>
  <h3 id="conditions-heading">{{{ t("worlds.conditionsTitle") }}}</h3>
  <div x-show="!hasConditions" class="muted">{{{ t("worlds.conditionsNone") }}}</div>
  <div x-show="hasConditions" class="conditions-row">
    <span
      class="condition"
      data-testid="condition-time"
      :aria-label="t('worlds.conditionTimeOfDay')"
      x-text="`${timeIcon} ${timeOfDay || '—'}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-weather"
      :aria-label="t('worlds.conditionWeather')"
      x-text="`${weatherIcon} ${weather || '—'}`"
    ></span>
    <span
      class="condition"
      data-testid="condition-season"
      x-show="hasSeason"
      :aria-label="t('worlds.conditionSeason')"
      x-text="season"
    ></span>
    <span
      class="condition muted"
      data-testid="condition-season-empty"
      x-show="!hasSeason"
      :aria-label="t('worlds.conditionSeason')"
      x-text="t('worlds.conditionSeasonUnavailable')"
    ></span>
    <span class="condition" data-testid="condition-day-night" x-text="dayNightLabel"></span>
    <span class="condition muted" x-show="conditionsLocationName" x-text="conditionsLocationName"></span>
    <span
      class="sse-dot"
      :class="sseConnected ? 'on' : 'off'"
      :aria-label="sseConnected ? t('worlds.conditionLive') : t('worlds.conditionOffline')"
      x-text="sseConnected ? t('worlds.conditionLive') : t('worlds.conditionOffline')"
    ></span>
  </div>
  <div x-show="conditionsAreAuthorSet" class="muted" data-testid="conditions-author-set">
    {{{ t("worlds.conditionsAuthorSet") }}}
  </div>
  <div x-show="!forecastAvailable" class="muted">{{{ t("worlds.forecastUnavailable") }}}</div>
</section>
