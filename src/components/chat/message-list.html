<!-- Messages -->
<div
  class="chat-area"
  id="message-list"
  x-ref="messageList"
  data-testid="message-list"
  @scroll="trackCurrentSection()"
  :class="{ 'section-transfer-fx': _transferFx }"
>
  <div x-ref="scrollSentinel" id="scroll-sentinel" style="height: 1px"></div>
  <div x-show="loadingOlder" class="loading-older">
    <span class="spinner"></span> {{{t("chats.loadingOlder")}}}
  </div>
  <template x-if="!activeChat">
    <div class="empty-state">
      <div class="icon">💬</div>
      <div class="title">{{{t("chats.selectChat")}}}</div>
      <div class="description">{{{t("chats.selectChatDescription")}}}</div>
    </div>
  </template>
  <template x-if="activeChat && messages.length === 0 && !loadingMessages">
    <div class="empty-state">
      <div class="icon">💬</div>
      <div class="title">{{{t("chats.noMessages")}}}</div>
      <div class="description">{{{t("chats.noMessagesHint")}}}</div>
    </div>
  </template>
  <template x-if="activeChat && loadingMessages">
    <div class="empty-state">
      <div class="icon">⏳</div>
      <div class="title">{{{t("chats.loadingMessages")}}}</div>
    </div>
  </template>
  <template x-if="activeChat && loadingError">
    <div class="error-banner" x-text="loadingError"></div>
  </template>

  <!-- Sticky location header: current section while scrolling (Phase 3) -->
  <div
    class="location-header"
    x-show="activeChat && _currentSectionId && !_vnEnabled"
    x-cloak
    data-testid="location-header"
  >
    <div class="location-header-label">
      <span class="section-divider-icon" aria-hidden="true">📍</span>
      <span x-text="currentSectionName"></span>
      <span
        class="location-header-count"
        x-show="sectionMessageCounts().get(_currentSectionId)"
        x-text="'(' + sectionMessageCounts().get(_currentSectionId) + ' msgs)'"
      ></span>
    </div>
    <div class="location-header-actions">
      <button class="btn-icon btn-xs" @click="toggleStoryMap()" title="Story map" data-testid="location-header-map">
        🗺️
      </button>
      <button
        class="btn-icon btn-xs"
        @click="transferToSection(_currentSectionId)"
        title="Transfer here"
        data-testid="location-header-transfer"
      >
        ⤵
      </button>
    </div>
  </div>
  <template x-for="(msg, i) in groupedMessages" :key="msg.id">
    <div
      class="message"
      :class="msg.role"
      :data-message-id="msg.id"
      @contextmenu="openContextMenu($event, msg.id)"
    >
      <!-- Section divider: shown when this message starts a new section -->
      <template x-if="sectionDividerFor(i, msg.section_id) !== null">
        <div
          class="section-divider"
          :data-section-id="msg.section_id ?? ''"
          data-testid="section-divider"
        >
          <div class="section-divider-line"></div>
          <div class="section-divider-label">
            <span class="section-divider-icon" aria-hidden="true">📍</span>
            <span x-text="sectionLabel(msg.section_id)"></span>
            <span
              class="section-divider-meta"
              x-text="'— ' + sectionDividerMeta(msg.section_id).count + ' msgs'"
            ></span>
            <span
              class="section-divider-meta"
              x-show="sectionDividerMeta(msg.section_id).startTime"
              x-text="'· ' + formatSectionTime(sectionDividerMeta(msg.section_id).startTime)"
            ></span>
          </div>
          <div class="section-divider-line"></div>
        </div>
      </template>

      <!-- System / narration: centered narrative line, no bubble, actions, or stats -->
      <template x-if="msg.role === 'system'">
        <div class="system-message" data-testid="system-message">
          <span class="system-marker" aria-hidden="true">◆</span>
          <div class="content" x-html="renderMarkdown(msg.content)"></div>
        </div>
      </template>
      <template x-if="msg.role !== 'system'">
        <div class="message-content">
          <!--
            Avatar for character/assistant messages (first in group only);
            resolved per message from its detected emotion via `avatarForMessage`
          -->
          <template
            x-if="!msg.group && (msg.role !== 'user') && (msg.emotion ? avatarForMessage(msg) !== null : !!currentCharacter?.avatar_asset_id)"
          >
            <img
              class="avatar"
              :src="`/api/assets/${avatarForMessage(msg) || currentCharacter?.avatar_asset_id}/thumb`"
              :alt="displayName(msg)"
              data-testid="message-avatar"
            />
          </template>
          <template x-if="msg.role !== 'user' && msg.group && currentCharacter?.avatar_asset_id">
            <div class="avatar avatar-spacer" aria-hidden="true"></div>
          </template>
          <div class="bubble">
            <div class="meta">
              <span class="name" x-text="displayName(msg)" data-testid="message-author"></span>
              <span
                class="time"
                x-text="msg.group ? formatTimeShort(msg.created_at) : formatTime(msg.created_at)"
              ></span>
              <span class="edited-label" x-show="msg.edited_at" data-testid="edited-indicator"
              >{{{t("chats.edited")}}}</span>
              <!-- Story mode: quality score badge from the matching story turn -->
              <template x-if="isStoryMode && turnForMessage(msg.id)?.qualityScore != null">
                <span
                  class="story-quality-badge"
                  :class="qualityClass(turnForMessage(msg.id).qualityScore ?? 0)"
                  :title="t('story.qualityScore')"
                  data-testid="story-quality-score"
                  x-text="Math.round(turnForMessage(msg.id).qualityScore ?? 0) + '/100'"
                ></span>
              </template>
            </div>
            <!-- Thinking: per-chat visibility control -->
            <template x-if="msg.thinking && thinkingVisibility === 'collapsed'">
              <details class="thinking-block" data-testid="thinking-block">
                <summary>{{{t("chats.thinkingProcess")}}}</summary>
                <div class="thinking-content" x-html="renderMarkdown(msg.thinking)"></div>
              </details>
            </template>
            <template x-if="msg.thinking && thinkingVisibility === 'visible'">
              <div class="thinking-block thinking-visible" data-testid="thinking-block-visible">
                <div class="thinking-content" x-html="renderMarkdown(msg.thinking)"></div>
              </div>
            </template>
            <!-- Tool calls the assistant invoked (function-calling display) -->
            <template x-if="msg.tool_calls && msg.tool_calls.length > 0">
              <div class="tool-calls" data-testid="tool-calls">
                <template x-for="tc in msg.tool_calls" :key="tc.id">
                  <details class="tool-call-block">
                    <summary>
                      🛠 {{{t("chats.callTool")}}}:
                      <code class="tool-call-name" x-text="tc.function.name"></code>
                    </summary>
                    <pre class="tool-call-args" x-text="tc.function.arguments"></pre>
                  </details>
                </template>
              </div>
            </template>
            <template x-if="editingMessageId !== msg.id">
              <div class="content" x-html="renderMarkdown(msg.content)"></div>
            </template>
            <template x-if="editingMessageId === msg.id">
              <div class="edit-area">
                <textarea
                  class="form-input edit-textarea"
                  x-model="editContent"
                  @keydown.escape="cancelEdit()"
                  @keydown.ctrl.enter="saveEdit(msg.id)"
                ></textarea>
                <div class="edit-actions">
                  <button class="btn btn-ghost btn-sm" @click="cancelEdit()">{{{t("common.cancel")}}}</button>
                  <button class="btn btn-primary btn-sm" @click="saveEdit(msg.id)">{{{t("common.save")}}}</button>
                </div>
              </div>
            </template>
            <template x-if="msg.attachments && msg.attachments.length > 0">
              <div class="media-attachments" :class="'count-' + msg.attachments.length">
                <template x-for="(asset, aIdx) in msg.attachments" :key="asset.assetId">
                  <div
                    class="media-item"
                    :class="asset.type === 'image' ? 'media-image' : 'media-file'"
                    :style="getMediaStyle(asset, msg.attachments.length)"
                  >
                    <template x-if="asset.type === 'image'">
                      <img
                        :src="asset.url"
                        :alt="asset.caption || asset.filename"
                        loading="lazy"
                        @click="openMediaPreview(asset)"
                      />
                    </template>
                    <template x-if="asset.type === 'audio'">
                      <audio controls :src="asset.url"></audio>
                    </template>
                    <template x-if="asset.type === 'video'">
                      <video controls :src="asset.url"></video>
                    </template>
                    <template x-if="asset.caption">
                      <div class="media-caption" x-text="asset.caption"></div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <!-- Emoji reactions: chips + quick-picker trigger -->
            <div class="message-reactions" data-testid="reaction-bar">
              <template x-if="msg.reactions && msg.reactions.length > 0">
                <template x-for="r in msg.reactions" :key="r.emoji">
                  <button
                    class="reaction-badge"
                    :class="{ 'reaction-active': r.userReacted }"
                    @click="toggleReaction(msg.id, r.emoji)"
                    data-testid="reaction-chip"
                  >
                    <span class="reaction-emoji" x-text="r.emoji"></span>
                    <span class="reaction-count" x-text="r.count"></span>
                  </button>
                </template>
              </template>
              <button
                class="reaction-add-btn"
                @click="showReactionPicker(msg.id, $event)"
                x-bind:title="t('chats.addReaction')"
                data-testid="reaction-add"
              >
                🙂
              </button>
            </div>
            <!-- Detailed (nerd) mode: full button row + stats -->
            <div class="actions-full" x-show="detailLevel === 'Detailed'" :data-detail="detailLevel">
              <button class="btn-icon-action" @click="copyMessage(msg.id, $event)" x-bind:title="t('chats.copy')">
                📋
              </button>
              <button class="btn-icon-action" @click="startEdit(msg.id)" x-bind:title="t('common.edit')">✏️</button>
              <template x-if="msg.role === 'assistant'">
                <button class="btn-icon-action" x-bind:title="t('chats.regenerate')" @click="regenerateVariant(msg.id)">
                  ♻
                </button>
              </template>
              <template x-if="msg.role === 'assistant' && msg.totalVariants && msg.totalVariants > 1">
                <span class="variant-switcher">
                  <button
                    class="btn-icon-action"
                    x-bind:title="t('common.previous')"
                    @click="switchVariant(msg.id, -1)"
                  >
                    ◀
                  </button>
                  <span
                    class="variant-counter"
                    x-text="(msg.variantIndex ?? 0) + 1 + '/' + msg.totalVariants"
                  ></span>
                  <button class="btn-icon-action" x-bind:title="t('common.next')" @click="switchVariant(msg.id, 1)">
                    ▶
                  </button>
                </span>
              </template>
              <template x-if="msg.role === 'assistant' && (msg.status === 'cancelled' || msg.status === 'partial')">
                <button
                  class="btn-icon-action action-continue"
                  x-bind:title="t('chats.continueAction')"
                  @click="continueMessage(msg.id)"
                >
                  ↳
                </button>
              </template>
              <template x-if="msg.role === 'assistant'">
                <button
                  class="btn-icon-action"
                  :class="impersonationActive ? 'action-active' : ''"
                  @click="toggleImpersonate()"
                  :title="impersonationActive ? 'Stop playing as character' : 'Play as character'"
                >
                  🎭
                </button>
              </template>
              <button
                class="btn-icon-action"
                @click="generateImageFromMessage(msg.id)"
                x-bind:title="t('chats.generateImage')"
              >
                🖼
              </button>
              <template x-if="msg.attachments && msg.attachments.length > 0">
                <button class="btn-icon-action" @click="captionMessage(msg.id)" x-bind:title="t('chats.captionImages')">
                  💬
                </button>
              </template>
              <button
                class="btn-icon-action"
                @click="pinMessage(msg.id)"
                title="Pin message"
                aria-label="Pin message"
              >
                📌
              </button>
              <button
                class="btn-icon-action action-remove"
                @click="removeMessage(msg.id, $event)"
                x-bind:title="t('common.remove')"
              >
                🗑
              </button>
            </div>
            <div
              class="stats-line"
              x-show="detailLevel === 'Detailed' && (msg.model_id || msg.provider)"
              x-text="statsLine(msg)"
            >
            </div>

            <!-- Inline stats for Basic mode (subtle text, brightens on hover) -->
            <div
              class="stats-line stats-basic"
              x-show="detailLevel === 'Basic' && (msg.generation_time_ms || msg.token_count_total)"
              x-text="statsLine(msg)"
            >
            </div>

            <!-- Prompt Debug View -->
            <template x-if="_debugView && msg.model_id">
              <div class="debug-panel" data-testid="debug-panel">
                <div class="debug-row">
                  <span class="debug-label">{{{t("chats.model")}}}</span> <span x-text="msg.model_id"></span>
                </div>
                <div class="debug-row" x-show="msg.provider">
                  <span class="debug-label">{{{t("chats.provider")}}}</span> <span x-text="msg.provider"></span>
                </div>
                <div class="debug-row" x-show="msg.token_count_prompt != null">
                  <span class="debug-label">{{{t("chats.promptTokens")}}}</span> <span
                    x-text="msg.token_count_prompt"
                  ></span>
                </div>
                <div class="debug-row" x-show="msg.token_count_completion != null">
                  <span class="debug-label">{{{t("chats.completionTokens")}}}</span>
                  <span x-text="msg.token_count_completion"></span>
                </div>
                <div class="debug-row" x-show="msg.token_count_total != null">
                  <span class="debug-label">{{{t("chats.totalTokens")}}}</span> <span
                    x-text="msg.token_count_total"
                  ></span>
                </div>
                <div class="debug-row" x-show="msg.generation_time_ms != null">
                  <span class="debug-label">{{{t("chats.genTime")}}}</span>
                  <span x-text="formattedGenerationTime(msg.generation_time_ms)"></span>
                </div>
                <div class="debug-row" x-show="msg.tokens_per_second != null">
                  <span class="debug-label">{{{t("chats.speed")}}}</span> <span
                    x-text="formattedTokensPerSecond(msg)"
                  ></span>
                </div>
              </div>
            </template>

            <!-- Compact mode (Immersion + Basic): hamburger menus -->
            <div class="actions-compact" x-show="detailLevel !== 'Detailed'" :data-detail="detailLevel">
              <!-- Actions hamburger -->
              <div class="action-hamburger">
                <button
                  class="btn-icon-action"
                  :class="_hamburgerOpen[msg.id] ? 'action-active' : ''"
                  @click="_hamburgerOpen[msg.id] = !_hamburgerOpen[msg.id]"
                  title="Actions"
                >
                  ⋮
                </button>
                <div
                  class="dropdown-base action-dropdown"
                  x-show="_hamburgerOpen[msg.id]"
                  @click.outside="_hamburgerOpen[msg.id] = false"
                >
                  <button @click="copyMessage(msg.id, $event); _hamburgerOpen[msg.id] = false">
                    📋 {{{t("chats.copy")}}}
                  </button>
                  <button @click="startEdit(msg.id); _hamburgerOpen[msg.id] = false">
                    ✏️ {{{t("common.edit")}}}
                  </button>
                  <template x-if="msg.role === 'assistant'">
                    <button @click="regenerateVariant(msg.id); _hamburgerOpen[msg.id] = false">
                      ♻ {{{t("chats.regenerate")}}}
                    </button>
                  </template>
                  <template x-if="msg.role === 'assistant' && msg.totalVariants && msg.totalVariants > 1">
                    <button @click="switchVariant(msg.id, -1); _hamburgerOpen[msg.id] = false">
                      ◀ {{{t("chats.prevVariant")}}}
                    </button>
                  </template>
                  <template x-if="msg.role === 'assistant' && msg.totalVariants && msg.totalVariants > 1">
                    <button @click="switchVariant(msg.id, 1); _hamburgerOpen[msg.id] = false">
                      ▶ {{{t("chats.nextVariant")}}}
                    </button>
                  </template>
                  <template x-if="msg.role === 'assistant' && (msg.status === 'cancelled' || msg.status === 'partial')">
                    <button @click="continueMessage(msg.id); _hamburgerOpen[msg.id] = false">
                      ↳ {{{t("chats.continueAction")}}}
                    </button>
                  </template>
                  <template x-if="msg.role === 'assistant'">
                    <button
                      @click="toggleImpersonate(); _hamburgerOpen[msg.id] = false"
                      :class="impersonationActive ? 'dropdown-active' : ''"
                    >
                      🎭 {{{t("chats.impersonateAction")}}}
                    </button>
                  </template>
                  <button @click="generateImageFromMessage(msg.id); _hamburgerOpen[msg.id] = false">
                    🖼 {{{t("chats.generateImage")}}}
                  </button>
                  <template x-if="msg.attachments && msg.attachments.length > 0">
                    <button @click="captionMessage(msg.id); _hamburgerOpen[msg.id] = false">
                      💬 {{{t("chats.captionImages")}}}
                    </button>
                  </template>
                  <button @click="pinMessage(msg.id); _hamburgerOpen[msg.id] = false">
                    📌 Pin
                  </button>
                  <button @click="_archiveConfirmId = msg.id; _archiveConfirmOpen = true; _hamburgerOpen[msg.id] = false">
                    📦 Archive
                  </button>
                  <button
                    class="dropdown-danger"
                    @click="removeMessage(msg.id, $event); _hamburgerOpen[msg.id] = false"
                  >
                    🗑 {{{t("common.remove")}}}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- "New message below" floating button -->
  <button
    class="new-message-btn"
    x-show="_isScrolledUp"
    x-cloak
    @click="scrollToBottomSmooth()"
    data-testid="new-message-btn"
  >
    {{{t("chats.newMessages")}}}
  </button>

  <!-- Context menu (right-click / long-press) -->
  <div
    class="dropdown-base context-menu"
    x-show="_contextMenu.visible"
    :style="{ left: _contextMenu.x + 'px', top: _contextMenu.y + 'px' }"
    @click.outside="closeContextMenu()"
    @keydown.escape.window="closeContextMenu()"
    data-testid="context-menu"
    x-cloak
  >
    <button @click="copyMessage(_contextMenu.messageId, $event); closeContextMenu()">📋 {{{t("chats.copy")}}}</button>
    <button @click="startEdit(_contextMenu.messageId); closeContextMenu()">✏️ {{{t("common.edit")}}}</button>
    <template
      x-if="(() => { const m = messages.find(msg => msg.id === _contextMenu.messageId); return m && m.role === 'assistant'; })()"
    >
      <button @click="regenerateVariant(_contextMenu.messageId); closeContextMenu()">
        ♻ {{{t("chats.regenerate")}}}
      </button>
    </template>
    <template
      x-if="(() => { const m = messages.find(msg => msg.id === _contextMenu.messageId); return m && (m.status === 'cancelled' || m.status === 'partial'); })()"
    >
      <button @click="continueMessage(_contextMenu.messageId); closeContextMenu()">
        ↳ {{{t("chats.continueAction")}}}
      </button>
    </template>
    <button @click="generateImageFromMessage(_contextMenu.messageId); closeContextMenu()">
      🖼 {{{t("chats.generateImage")}}}
    </button>
    <button @click="pinMessage(_contextMenu.messageId); closeContextMenu()">
      📌 Pin
    </button>
    <div class="context-menu-divider"></div>
    <button @click="_archiveConfirmId = _contextMenu.messageId; _archiveConfirmOpen = true; closeContextMenu()">
      📦 Archive
    </button>
    <button
      class="dropdown-danger"
      @click="removeMessage(_contextMenu.messageId, $event); closeContextMenu()"
    >
      🗑 {{{t("common.remove")}}}
    </button>
  </div>

  <!-- Reaction quick-picker popover -->
  <div
    class="dropdown-base reaction-picker"
    x-show="_reactionPicker.visible"
    :style="{ left: _reactionPicker.x + 'px', top: _reactionPicker.y + 'px' }"
    @click.outside="closeReactionPicker()"
    @keydown.escape.window="closeReactionPicker()"
    data-testid="reaction-picker"
    x-cloak
  >
    <template x-for="emoji in _quickEmojis" :key="emoji">
      <button class="reaction-option" @click="toggleReaction(_reactionPicker.messageId, emoji); closeReactionPicker()">
        <span x-text="emoji"></span>
      </button>
    </template>
  </div>

  <!-- Stream container for SSE streaming generation -->
  <div id="stream-container" x-show="isGenerating" x-cloak data-testid="stream-container"></div>
</div>
