<!--
  Story points chip — shows the calling actor's current story-point balance
  next to the /agency affordance. Reads GET /api/agency/balance (auth-scoped:
  the actor is always the session user). This component owns read + display only;
  the spend menu is deferred (see TASK-story-points-prototype — earn hooks +
  spend menu are unchecked acceptance items).

  Mounted from `src/views/chat.html` as the `chat/story-points-chip.html`
  partial, alongside the input area. Depends on the surrounding Alpine scope
  exposing the chat store (`$store.chat.activeChat.world_id`).
-->
<div
  class="story-points-chip"
  x-data="{
    balance: 0,
    cap: null,
    async refresh() {
      const worldId = this.$store?.chat?.activeChat?.world_id || null;
      const qs = worldId ? `?world_id=${encodeURIComponent(worldId)}` : '';
      const res = await fetch(`/api/agency/balance${qs}`, { credentials: 'include' })
        .catch(() => null);
      if (!res || !res.ok) { return; }
      const data = await res.json().catch(() => null);
      if (!data) { return; }
      this.balance = data.balance ?? 0;
      this.cap = data.cap ?? null;
    },
  }"
  x-init="refresh()"
  data-testid="story-points-chip"
  title="Story points — your Bennies / FATE points / Inspiration"
>
  <span class="story-points-chip-label">⭐</span>
  <span class="story-points-chip-value" x-text="balance"></span>
  <template x-if="cap !== null">
    <span class="story-points-chip-cap" x-text="'/' + cap"></span>
  </template>
</div>
