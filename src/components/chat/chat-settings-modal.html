<!-- Chat Settings Modal -->
<div
  x-show="$store.ui.showChatSettings"
  x-cloak
  x-effect="if($store.ui.showChatSettings) openChatSettings()"
  class="modal-overlay"
  @click.self="$store.ui.showChatSettings = false"
  data-testid="chat-settings-modal"
>
  <div class="modal" style="max-width: 420px">
    <div class="modal-header">
      <span class="title">Chat Settings</span>
      <button class="btn-icon" @click="$store.ui.showChatSettings = false">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Chat Name</label>
        <input
          class="form-input"
          type="text"
          x-model="_chatSettingsName"
          placeholder="Chat name"
          data-testid="settings-chat-name"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Mode</label>
        <select class="form-input" x-model="_chatSettingsMode" data-testid="settings-chat-mode">
          <option value="chat">Chat</option>
          <option value="roleplay">Roleplay</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Turn Strategy</label>
        <select class="form-input" x-model="_chatSettingsTurnStrategy" data-testid="settings-turn-strategy">
          <option value="round_robin">Round Robin</option>
          <option value="first_participant">First Participant</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Persona</label>
        <select class="form-input" x-model="_selectedPersonaId" data-testid="settings-persona">
          <option value="">Default</option>
          <template x-for="p in _personas" :key="p.id">
            <option :value="p.id" x-text="p.name"></option>
          </template>
        </select>
      </div>
      <div class="form-group" x-show="currentCharacter">
        <label style="display: flex; align-items: center; gap: var(--space-2)">
          <input type="checkbox" x-model="impersonationActive" />
          Impersonate
          <span x-text="currentCharacter?.display_name || currentCharacter?.name || 'character'"></span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" @click="$store.ui.showChatSettings = false">Cancel</button>
      <button class="btn btn-primary" @click="saveChatSettings()" data-testid="settings-save-btn">
        Save
      </button>
    </div>
  </div>
</div>
