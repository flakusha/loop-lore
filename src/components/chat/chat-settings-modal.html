<!-- Chat Settings Modal -->
<div
  x-show="$store.ui.showChatSettings"
  x-cloak
  :class="{ open: $store.ui.showChatSettings }"
  x-effect="if($store.ui.showChatSettings) openChatSettings()"
  class="modal-overlay"
  @click.self="$store.ui.showChatSettings = false"
  data-testid="chat-settings-modal"
>
  <div class="modal" style="max-width: 420px">
    <div class="modal-header">
      <span class="title">Chat Settings</span>
      <button class="btn-icon" @click="$store.ui.showChatSettings = false">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="settings-chat-name">Chat Name</label>
        <input
          class="form-input"
          type="text"
          id="settings-chat-name"
          x-model="_chatSettingsName"
          placeholder="Chat name"
          data-testid="settings-chat-name"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="settings-chat-mode">Mode</label>
        <select
          class="form-input"
          id="settings-chat-mode"
          x-model="_chatSettingsMode"
          data-testid="settings-chat-mode"
        >
          <option value="chat">Chat</option>
          <option value="roleplay">Roleplay</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="settings-turn-strategy">Turn Strategy</label>
        <select
          class="form-input"
          id="settings-turn-strategy"
          x-model="_chatSettingsTurnStrategy"
          data-testid="settings-turn-strategy"
        >
          <option value="round_robin">Round Robin</option>
          <option value="scene_based">Scene Based</option>
          <option value="initiative">Initiative (Weighted)</option>
          <option value="quest_driven">Quest Driven</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>
      <div class="form-group" x-show="currentChat?.type === 'group'">
        <label style="display: flex; align-items: center; gap: var(--space-2)">
          <input type="checkbox" x-model="_groupPaused" />
          Pause AI Generation
        </label>
        <small style="color: var(--text-secondary)">When paused, only user messages are allowed</small>
      </div>
      <div class="form-group">
        <label class="form-label" for="settings-persona">Persona</label>
        <select
          class="form-input"
          id="settings-persona"
          x-model="_selectedPersonaId"
          data-testid="settings-persona"
        >
          <option value="">Default</option>
          <template x-for="p in _personas" :key="p.id">
            <option :value="p.id" x-text="p.name"></option>
          </template>
        </select>
      </div>
      <div class="form-group" x-show="currentCharacter">
        <label style="display: flex; align-items: center; gap: var(--space-2)">
          <input type="checkbox" x-model="impersonationActive" />
          Impersonate
          <span x-text="currentCharacter?.display_name || currentCharacter?.name || 'character'"></span>
        </label>
      </div>
      <div class="form-group" x-show="currentChat?.mode === 'story'">
        <label class="form-label" for="settings-assistant-role">Assistant Role</label>
        <select
          class="form-input"
          id="settings-assistant-role"
          x-model="_assistantRole"
          data-testid="settings-assistant-role"
        >
          <option value="off">Off</option>
          <option value="helper">Helper (text/image)</option>
          <option value="gm">Game Master</option>
          <option value="moderator">Moderator</option>
        </select>
      </div>

      <!-- Mood Editing (GM/Admin only) -->
      <template x-if="_moodCanEdit">
        <div class="form-group">
          <label class="form-label" for="mood-happiness-slider">
            Character Happiness (<span x-text="_mood?.happiness ?? 50"></span>%)
          </label>
          <input
            type="range"
            id="mood-happiness-slider"
            min="0"
            max="100"
            x-model.number="_moodSliderValue"
            @input="updateMoodHappiness(_moodSliderValue)"
            data-testid="mood-happiness-slider"
          />
          <div style="display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--text-secondary)">
            <span>Miserable</span>
            <span>Neutral</span>
            <span>Ecstatic</span>
          </div>
          <div x-show="_mood" style="margin-top: var(--space-2)">
            <span x-text="_getMoodEmoji(_mood.currentMood)" style="font-size: 20px"></span>
            <span x-text="_mood.currentMood" style="margin-left: var(--space-2)"></span>
          </div>
          <small style="color: var(--text-secondary); display: block; margin-top: var(--space-2)">
            GM/Admin only: Direct mood manipulation. Character mood is normally managed by interactions and story
            development.
          </small>
        </div>
      </template>

      <!-- Visual Novel Mode Settings -->
      <div class="form-group">
        <label style="display: flex; align-items: center; gap: var(--space-2)">
          <input type="checkbox" x-model="_vnEnabled" data-testid="vn-toggle" />
          Visual Novel Mode
        </label>
        <small style="color: var(--text-secondary)">Cinematic scene display with backgrounds and portraits</small>
      </div>
      <template x-if="_vnEnabled">
        <div>
          <div class="form-group">
            <label class="form-label" for="vn-layout">Layout</label>
            <select class="form-input" id="vn-layout" x-model="_vnLayout" data-testid="vn-layout">
              <option value="overlay">Overlay (text over image)</option>
              <option value="below">Below (image top, text bottom)</option>
              <option value="split">Split (portrait left, text right)</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display: flex; align-items: center; gap: var(--space-2)">
              <input type="checkbox" x-model="_vnTypewriter" data-testid="vn-typewriter" />
              Typewriter Text Effect
            </label>
          </div>
          <div class="form-group" x-show="_vnTypewriter">
            <label class="form-label">Text Speed (<span x-text="_vnTypewriterSpeed"></span>ms)</label>
            <input type="range" min="10" max="100" x-model.number="_vnTypewriterSpeed" data-testid="vn-speed" />
          </div>
          <div class="form-group">
            <label class="form-label" for="vn-transition">Transition</label>
            <select class="form-input" id="vn-transition" x-model="_vnTransition" data-testid="vn-transition">
              <option value="fade">Fade</option>
              <option value="cut">Cut (instant)</option>
              <option value="dissolve">Dissolve</option>
              <option value="slide">Slide</option>
              <option value="wipe">Wipe</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display: flex; align-items: center; gap: var(--space-2)">
              <input type="checkbox" x-model="_vnAutoAdvance" data-testid="vn-auto-advance" />
              Auto-Advance Scenes
            </label>
          </div>
        </div>
      </template>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" @click="$store.ui.showChatSettings = false">Cancel</button>
      <button class="btn btn-primary" @click="saveChatSettings()" data-testid="settings-save-btn">
        Save
      </button>
    </div>
  </div>
</div>
