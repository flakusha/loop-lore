<!-- Add Co-Owner Modal — participant selector + optional reason -->
<div
  x-show="_addOwnerModalOpen"
  x-cloak
  :class="{ open: _addOwnerModalOpen }"
  class="modal-overlay"
  @click.self="closeAddOwnerModal()"
  @keydown.escape.window="closeAddOwnerModal()"
  data-testid="add-owner-modal"
>
  <div class="modal" style="max-width: 380px">
    <div class="modal-header">
      <span class="title">{{{t("chat.owners.addTitle")}}}</span>
      <button
        class="btn-icon"
        @click="closeAddOwnerModal()"
        x-bind:aria-label="t('common.close')"
        data-testid="add-owner-close"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="add-owner-participant">{{{t("chat.owners.addSelectLabel")}}}</label>
        <select
          class="form-input"
          id="add-owner-participant"
          x-model="_addOwnerId"
          data-testid="add-owner-participant"
        >
          <option value="">{{{t("chat.owners.selectParticipant")}}}</option>
          <template x-for="p in addableParticipants()" :key="p.actor_id">
            <option :value="p.actor_id" x-text="p.display_name || p.name"></option>
          </template>
        </select>
        <p
          x-show="addableParticipants().length === 0"
          style="font-size: 12px; color: var(--text-secondary); margin-top: var(--space-1)"
          data-testid="add-owner-no-participants"
        >
          {{{t("chat.owners.noEligibleParticipants")}}}
        </p>
      </div>
      <div class="form-group">
        <label class="form-label" for="add-owner-reason">{{{t("chat.owners.reasonLabel")}}}</label>
        <textarea
          class="form-input form-textarea"
          id="add-owner-reason"
          rows="2"
          maxlength="500"
          x-model="_addOwnerReason"
          x-init="autoResize($el)"
          @input="autoResize($el)"
          :placeholder="t('chat.owners.reasonPlaceholder')"
          data-testid="add-owner-reason"
        ></textarea>
      </div>
      <div
        x-show="_addOwnerError"
        class="form-group"
        style="color: var(--color-error, #c00); font-size: 13px"
        data-testid="add-owner-error"
      >
        <span x-text="_addOwnerError"></span>
      </div>
    </div>
    <div class="modal-footer">
      <button
        class="btn btn-ghost"
        @click="closeAddOwnerModal()"
        data-testid="add-owner-cancel"
      >
        {{{t("chat.owners.cancel")}}}
      </button>
      <button
        class="btn btn-primary"
        @click="submitAddOwner()"
        :disabled="_addOwnerSubmitting || !_addOwnerId"
        data-testid="add-owner-submit"
      >
        <span x-show="!_addOwnerSubmitting">{{{t("chat.owners.addSubmit")}}}</span>
        <span x-show="_addOwnerSubmitting">{{{t("chat.owners.addSubmitting")}}}</span>
      </button>
    </div>
  </div>
</div>
