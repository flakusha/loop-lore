<!-- Classifier Tag Subset Picker (FEAT-classifier-tag-vocabulary-admin-ui) -->
<div
  class="form-group"
  x-show="_classifierVocabulary.length > 0"
  style="margin-top: var(--space-3); border-top: 1px solid var(--border); padding-top: var(--space-3)"
  data-testid="classifier-tags-section"
>
  <span class="form-label">{{{t("chat.classifierTags.title")}}}</span>
  <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-2)">
    {{{t("chat.classifierTags.description")}}}
  </p>
  <template x-for="tag in _classifierVocabulary" :key="tag">
    <label style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1)">
      <input
        type="checkbox"
        :checked="_classifierActive.includes(tag)"
        @change="toggleClassifierTag(tag)"
        :data-testid="'classifier-tag-' + tag"
      />
      <span style="font-size: 13px" x-text="tag"></span>
    </label>
  </template>
  <button
    class="btn btn-primary btn-sm"
    @click="saveClassifierTags()"
    :disabled="!_classifierDirty"
    data-testid="classifier-tags-save"
  >
    {{{t("chat.classifierTags.save")}}}
  </button>
</div>

<div class="form-group" x-show="!_chatOnline">
  <label class="form-label" for="settings-assistant-temperature">
    Assistant Temperature (<span x-text="_assistantTemperature ?? 'default'"></span>)
  </label>
  <input
    type="range"
    id="settings-assistant-temperature"
    min="0"
    max="2"
    step="0.1"
    x-model.number="_assistantTemperature"
    data-testid="settings-assistant-temperature"
  />
  <small style="color: var(--text-secondary); display: block; margin-top: var(--space-1)">
    Per-chat override for regular assistant replies. Clear to use the server default.
  </small>
</div>

<div class="form-group" x-show="!_chatOnline">
  <label class="form-label" for="settings-assistant-maxtokens">Assistant Max Tokens</label>
  <input
    class="form-input"
    type="number"
    id="settings-assistant-maxtokens"
    min="1"
    max="8192"
    x-model.number="_assistantMaxTokens"
    placeholder="Server default"
    data-testid="settings-assistant-maxtokens"
  />
</div>

<div class="form-group" x-show="currentChat?.mode === 'story' && !_chatOnline">
  <label class="form-label">Per-Actor Models (multi-LLM)</label>
  <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-2)">
    Assign a different model to each story participant. Blank = use the GM model above.
  </p>
  <template x-for="row in _actorModelRows" :key="row.actor_id">
    <div style="display: flex; gap: var(--space-2); margin-bottom: var(--space-2); align-items: center">
      <span style="min-width: 120px; font-size: 13px" x-text="row.label"></span>
      <input
        class="form-input"
        type="text"
        x-model="row.slot.model"
        placeholder="model"
        :data-testid="'settings-actor-model-' + row.actor_id"
      />
      <input
        class="form-input"
        type="text"
        x-model="row.slot.provider"
        placeholder="provider"
        :data-testid="'settings-actor-provider-' + row.actor_id"
      />
    </div>
  </template>
</div>
