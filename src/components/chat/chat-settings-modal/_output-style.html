<div class="form-group">
  <label class="form-label" for="settings-output-style">Output Style</label>
  <select
    class="form-input"
    id="settings-output-style"
    x-model="_outputStylePreset"
    data-testid="settings-output-style"
  >
    <option value="">None (no style directive)</option>
    <option value="neutral">Neutral</option>
    <option value="high_fantasy">High Fantasy</option>
    <option value="sci_fi">Sci-Fi</option>
    <option value="modern">Modern</option>
    <option value="noir">Noir</option>
    <option value="cyberpunk">Cyberpunk</option>
    <option value="pulp">Pulp Adventure</option>
    <option value="literary">Literary</option>
    <option value="horror">Horror</option>
    <option value="western">Western</option>
  </select>
  <div x-show="_outputStylePreset !== ''" style="margin-top: var(--space-2)">
    <label class="form-label" for="settings-output-style-intensity">
      Style Intensity (<span x-text="_outputStyleIntensity"></span>)
    </label>
    <input
      type="range"
      id="settings-output-style-intensity"
      min="0"
      max="1"
      step="0.05"
      x-model.number="_outputStyleIntensity"
      data-testid="settings-output-style-intensity"
    />
    <small style="color: var(--text-secondary); display: block; margin-top: var(--space-1)">
      How strongly the writing style is imposed on generated replies.
    </small>
  </div>
</div>
<div class="form-group">
  <label class="form-label" for="settings-carriage">Hidden carriage context</label>
  <input
    type="checkbox"
    id="settings-carriage"
    x-model="_carriageEnabled"
    data-testid="settings-carriage-toggle"
  />
  <small style="color: var(--text-secondary); display: block; margin-top: var(--space-1)">
    Inject the hidden TOML episode-context block (dev/debug-visible). Off keeps the prompt byte-identical.
  </small>
</div>
<div class="form-group">
  <label class="form-label" for="settings-response-length">Response Length</label>
  <select
    class="form-input"
    id="settings-response-length"
    x-model="_responseLengthPreset"
    data-testid="settings-response-length"
  >
    <option value="short">Short (~500 tokens)</option>
    <option value="medium">Medium (~1000 tokens)</option>
    <option value="long">Long (~1500 tokens)</option>
    <option value="custom">Custom (50–2000)</option>
  </select>
  <div
    x-show="_responseLengthPreset === 'custom'"
    style="margin-top: var(--space-2)"
  >
    <input
      type="number"
      class="form-input"
      x-model.number="_responseLengthCustom"
      min="50"
      max="2000"
      step="50"
      placeholder="50-2000 tokens"
      data-testid="settings-response-length-custom"
    />
  </div>
</div>
