<!--
  Creation Wizard Preview Panel — multi-step entity draft review.

  Step 1: Edit generated entity fields
  Step 2: Set additional options (world, visibility)
  Step 3: Final review and confirm
-->
<div
  x-show="wizardPreviewOpen && wizardDraft"
  x-cloak
  class="wizard-panel"
  data-testid="wizard-panel"
  x-transition:enter="panel-enter"
  x-transition:leave="panel-leave"
>
  <div class="wizard-panel-inner">
    <div class="wizard-panel-header">
      <h3>
        <span x-text="wizardDraft?.label ? t('wizard.previewTitle', { type: wizardDraft.label }) : ''"></span>
      </h3>
      <div class="wizard-step-indicator">
        <span
          x-for="s in wizardTotalSteps"
          :key="s"
          class="wizard-step-dot"
          :class="{ active: wizardStep === s, completed: s < wizardStep }"
        ></span>
      </div>
      <button
        class="btn btn-ghost btn-sm"
        @click="cancelWizard(wizardDraft?.wizardId ?? '')"
        x-bind:title="t('common.cancel')"
      >
        ✕
      </button>
    </div>

    <div class="wizard-panel-body" x-show="wizardDraft">
      <!-- Quality gate warnings -->
      <template x-if="wizardDraft?.warnings?.length > 0">
        <div class="wizard-warnings">
          <template x-for="warning in wizardDraft.warnings" :key="warning">
            <div class="wizard-warning-item" x-text="'⚠️ ' + warning"></div>
          </template>
        </div>
      </template>

      <!-- Step 1: Edit entity fields -->
      <div x-show="wizardStep === 1">
        <h4 class="wizard-step-title">{{{ t("wizard.stepEditFields") }}}</h4>
        <template x-for="[field, value] in Object.entries(wizardDraft?.fields ?? {})" :key="field">
          <div class="wizard-field">
            <label class="wizard-field-label" x-text="field"></label>
            <textarea
              class="wizard-field-textarea"
              :value="value ?? ''"
              @input="updateWizardField(field, $event.target.value)"
              rows="2"
            ></textarea>
          </div>
        </template>
      </div>

      <!-- Step 2: Additional options -->
      <div x-show="wizardStep === 2">
        <h4 class="wizard-step-title">{{{ t("wizard.stepOptions") }}}</h4>
        <div class="wizard-field">
          <label class="wizard-field-label">{{{ t("wizard.worldScope") }}}</label>
          <input
            type="text"
            class="wizard-field-input"
            :value="wizardDraft?.worldId ?? ''"
            @input="if (wizardDraft) wizardDraft.worldId = $event.target.value"
            placeholder="world-id (optional)"
          />
        </div>
        <div class="wizard-field">
          <label class="wizard-field-label">{{{ t("wizard.visibility") }}}</label>
          <select
            class="wizard-field-select"
            x-model="wizardDraft.visibility"
          >
            <option value="private">{{{ t("wizard.private") }}}</option>
            <option value="public">{{{ t("wizard.public") }}}</option>
          </select>
        </div>
      </div>

      <!-- Step 3: Final review -->
      <div x-show="wizardStep === 3">
        <h4 class="wizard-step-title">{{{ t("wizard.stepReview") }}}</h4>
        <div class="wizard-review-summary">
          <template x-for="[field, value] in Object.entries(wizardDraft?.fields ?? {})" :key="field">
            <div class="wizard-review-row">
              <span class="wizard-review-label" x-text="field + ':'"></span>
              <span class="wizard-review-value" x-text="value ?? ''"></span>
            </div>
          </template>
          <div class="wizard-review-row" x-show="wizardDraft?.worldId">
            <span class="wizard-review-label">{{{ t("wizard.worldScope") }}}:</span>
            <span class="wizard-review-value" x-text="wizardDraft?.worldId"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="wizard-panel-footer">
      <div class="wizard-footer-left">
        <button
          class="btn btn-ghost"
          @click="cancelWizard(wizardDraft?.wizardId ?? '')"
        >
          {{{ t("common.cancel") }}}
        </button>
      </div>
      <div class="wizard-footer-right">
        <button
          class="btn btn-ghost"
          x-show="wizardStep > 1"
          @click="wizardPrevStep()"
        >
          {{{ t("common.back") }}}
        </button>
        <button
          class="btn btn-primary"
          x-show="wizardStep < wizardTotalSteps"
          @click="wizardNextStep()"
        >
          {{{ t("common.next") }}}
        </button>
        <button
          class="btn btn-primary"
          x-show="wizardStep === wizardTotalSteps"
          @click="confirmWizard(wizardDraft?.wizardId ?? '')"
        >
          {{{ t("wizard.confirm") }}}
        </button>
      </div>
    </div>
  </div>
</div>
