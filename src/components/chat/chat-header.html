<header id="header-slot" class="main-header" data-testid="chat-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">Welcome to loop-lore</span>
  <div class="actions">
    <button
      class="btn-icon"
      title="View chats"
      aria-label="View chats"
      @click="$store.ui.showChatList = !$store.ui.showChatList"
      data-testid="toggle-chat-list"
    >
      {{icon:messages}}
    </button>
    <button
      class="btn-icon"
      title="Toggle gallery sidebar"
      aria-label="Toggle gallery sidebar"
      @click="$store.ui.showGallery = !$store.ui.showGallery"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-gallery"
    >
      {{icon:photo}}
    </button>
    <button
      class="btn-icon"
      title="Character info"
      aria-label="Character info"
      @click="$store.ui.showCharacterInfo = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-character-info"
    >
      {{icon:info-circle}}
    </button>
    <button
      class="btn-icon"
      title="Chat settings"
      aria-label="Chat settings"
      @click="$store.ui.showChatSettings = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-chat-settings"
    >
      {{icon:settings}}
    </button>
    <button
      class="btn-icon"
      title="User preferences"
      aria-label="User preferences"
      @click="window.dispatchEvent(new CustomEvent('settings-modal'))"
      data-testid="toggle-user-preferences"
    >
      {{icon:adjustments}}
    </button>
    <button
      class="btn-icon"
      :title="window.isChatPaused($store.chat?.currentChat) ? 'Resume AI generation' : 'Pause AI generation'"
      :aria-label="window.isChatPaused($store.chat?.currentChat) ? 'Resume AI generation' : 'Pause AI generation'"
      @click="window.toggleGroupPause()"
      x-show="$store.ui.hasActiveChat && $store.chat?.currentChat?.type === 'group'"
      :style="window.isChatPaused($store.chat?.currentChat) ? 'color: #f59e0b' : ''"
      data-testid="toggle-group-pause"
    >
      <span x-show="!window.isChatPaused($store.chat?.currentChat)">{{icon:player-pause}}</span>
      <span x-show="window.isChatPaused($store.chat?.currentChat)">{{icon:player-play}}</span>
    </button>
  </div>
</header>
