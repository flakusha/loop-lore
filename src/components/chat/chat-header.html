<header id="header-slot" class="main-header" data-testid="chat-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">Welcome to loop-lore</span>
  <div class="actions">
    <button
      class="btn-icon"
      title="View chats"
      aria-label="View chats"
      @click="$store.ui.showChatList = !$store.ui.showChatList"
      data-testid="toggle-chat-list"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14l-3 -3h-7a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h9a1 1 0 0 1 1 1v10" /><path d="M14 15v2a1 1 0 0 1 -1 1h-7l-3 3v-10a1 1 0 0 1 1 -1h2" /></svg>
    </button>
    <button
      class="btn-icon"
      title="Toggle gallery sidebar"
      aria-label="Toggle gallery sidebar"
      @click="$store.ui.showGallery = !$store.ui.showGallery"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-gallery"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h.01" /><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg>
    </button>
    <button
      class="btn-icon"
      title="Character info"
      aria-label="Character info"
      @click="$store.ui.showCharacterInfo = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-character-info"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg>
    </button>
    <button
      class="btn-icon"
      title="Chat settings"
      aria-label="Chat settings"
      @click="$store.ui.showChatSettings = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-chat-settings"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
    </button>
    <button
      class="btn-icon"
      title="User preferences"
      aria-label="User preferences"
      @click="window.dispatchEvent(new CustomEvent('settings-modal'))"
      data-testid="toggle-user-preferences"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M6 4v4" /><path d="M6 12v8" /><path d="M10 16a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12 4v10" /><path d="M12 18v2" /><path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M18 4v1" /><path d="M18 9v11" /></svg>
    </button>
    <button
      class="btn-icon"
      :title="window.isChatPaused($store.chat?.currentChat) ? 'Resume AI generation' : 'Pause AI generation'"
      :aria-label="window.isChatPaused($store.chat?.currentChat) ? 'Resume AI generation' : 'Pause AI generation'"
      @click="window.toggleGroupPause()"
      x-show="$store.ui.hasActiveChat && $store.chat?.currentChat?.type === 'group'"
      :style="window.isChatPaused($store.chat?.currentChat) ? 'color: #f59e0b' : ''"
      data-testid="toggle-group-pause"
    >
      <svg x-show="!window.isChatPaused($store.chat?.currentChat)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" /><path d="M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" /></svg>
      <svg x-show="window.isChatPaused($store.chat?.currentChat)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13 -8l-13 -8" /></svg>
    </button>
  </div>
</header>
