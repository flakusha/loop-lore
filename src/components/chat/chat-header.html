<header id="header-slot" class="main-header" data-testid="chat-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">{{{t("tooltips.viewChats")}}}</span>
  <div class="actions">
    <button
      class="btn-icon"
      x-bind:title="t('tooltips.viewChats')"
      x-bind:aria-label="t('tooltips.viewChats')"
      @click="$store.ui.showChatList = !$store.ui.showChatList"
      data-testid="toggle-chat-list"
    >
      {{icon:messages}}
    </button>
    <button
      class="btn-icon"
      x-bind:title="t('gallery.toggleGallery')"
      x-bind:aria-label="t('gallery.toggleGallery')"
      @click="$store.ui.showGallery = !$store.ui.showGallery"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-gallery"
    >
      {{icon:photo}}
    </button>
    <button
      class="btn-icon"
      x-bind:title="t('gallery.characterInfo')"
      x-bind:aria-label="t('gallery.characterInfo')"
      @click="$store.ui.showCharacterInfo = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-character-info"
    >
      {{icon:info-circle}}
    </button>
    <button
      class="btn-icon"
      x-bind:title="t('gallery.chatSettings')"
      x-bind:aria-label="t('gallery.chatSettings')"
      @click="$store.ui.showChatSettings = true"
      x-show="$store.ui.hasActiveChat"
      data-testid="toggle-chat-settings"
    >
      {{icon:settings}}
    </button>
    <button
      class="btn-icon"
      x-bind:title="t('gallery.userPreferences')"
      x-bind:aria-label="t('gallery.userPreferences')"
      @click="window.dispatchEvent(new CustomEvent('settings-modal'))"
      data-testid="toggle-user-preferences"
    >
      {{icon:adjustments}}
    </button>
    <button
      class="btn-icon"
      :title="window.isChatPaused($store.chat?.currentChat) ? t('chats.resumeAI') : t('chats.pauseAI')"
      :aria-label="window.isChatPaused($store.chat?.currentChat) ? t('chats.resumeAI') : t('chats.pauseAI')"
      @click="window.toggleGroupPause()"
      x-show="$store.ui.hasActiveChat && $store.chat?.currentChat?.type === 'group'"
      :style="window.isChatPaused($store.chat?.currentChat) ? 'color: #f59e0b' : ''"
      data-testid="toggle-group-pause"
    >
      <span x-show="!window.isChatPaused($store.chat?.currentChat)">{{icon:player-pause}}</span>
      <span x-show="window.isChatPaused($store.chat?.currentChat)">{{icon:player-play}}</span>
    </button>
    <button
      class="btn-icon"
      :class="showGmPanel ? 'gm-toggle-active' : ''"
      @click="showGmPanel = !showGmPanel"
      title="GM Panel"
      aria-label="Toggle GM Panel"
      data-testid="gm-toggle"
    >
      🎭
    </button>
    <div class="notif-bell" x-data="notificationsBell()" x-init="init()" x-show="unreadCount > 0">
      <button
        class="btn-icon"
        x-bind:title="t('chats.notifications')"
        x-bind:aria-label="t('chats.notifications')"
        @click="toggle()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="badge" x-show="unreadCount > 0" x-text="unreadCount"></span>
      </button>
      <div
        class="notif-dropdown"
        x-show="open"
        @click.outside="open = false"
        role="region"
        aria-label="Notification list"
      >
        <div class="notif-header">
          <span>{{{t("chats.notifications")}}}</span>
          <button
            class="btn-link"
            x-on:click="markAllRead()"
            x-show="unreadCount > 0"
          >
            {{{t("chats.markAllRead")}}}
          </button>
        </div>
        <template x-for="n in items" :key="n.id">
          <div class="notif-item" :class="{ unread: !n.read }" @click="goTo(n.link)">
            <span class="notif-icon" x-text="iconFor(n.type)"></span>
            <div class="notif-body">
              <div class="notif-title" x-text="n.title"></div>
              <div class="notif-sub" x-text="n.body" x-show="n.body"></div>
            </div>
            <button class="btn-icon-sm" x-bind:title="t('chats.dismiss')" @click.stop="dismiss(n.id)">✕</button>
            <button
              class="btn-icon-sm"
              x-bind:title="t('chats.markRead')"
              x-show="!n.read"
              @click.stop="markRead(n.id)"
            >
              ✓
            </button>
          </div>
        </template>
        <div class="notif-empty" x-show="items.length === 0">{{{t("chats.noNotifications")}}}</div>
      </div>
    </div>
  </div>
</header>
