<!-- Backdrop for chat list panel -->
<div
  class="panel-backdrop"
  x-show="$store.ui.showChatList"
  @click="$store.ui.showChatList = false"
  x-cloak
>
</div>
<!-- Chat list panel (component) -->
<div
  class="chat-list-panel"
  :style="{ display: $store?.ui?.showChatList ? 'flex' : 'none' }"
  x-cloak
  data-testid="chat-list-panel"
>
  <div class="chat-list-header">
    <span class="nav-section-title">Chats</span>
    <div class="nav-section-actions">
      <input
        class="form-input chat-list-search"
        type="search"
        placeholder="Filter…"
        aria-label="Filter chats"
        x-model="_chatFilter"
        @input="searchChats(_chatFilter)"
        style="width: 140px; font-size: 12px; height: 26px"
      />
      <button class="btn-icon" @click="$store.ui.showChatList = false" title="Close">&times;</button>
    </div>
  </div>
  <!-- Batch action bar -->
  <div
    class="batch-bar"
    x-show="selectedChats.length > 0"
    style="display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-default); background: var(--bg-tertiary); align-items: center"
    x-cloak
  >
    <span
      style="font-size: 12px; color: var(--text-secondary)"
      x-text="`${selectedChats.length} selected`"
    ></span>
    <button class="btn-xs" @click="batchArchive()" title="Archive selected">📦 Archive</button>
    <button class="btn-xs" @click="batchDelete()" title="Delete selected" style="color: var(--accent-red)">
      🗑 Delete
    </button>
    <button class="btn-xs" @click="batchExport()" title="Export selected">📥 Export</button>
    <button class="btn-xs" @click="selectedChats = []" title="Clear selection">✕ Clear</button>
  </div>
  <!-- Filters bar (server-side GET /api/chats params) -->
  <div
    class="chat-list-filters"
    style="display: flex; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-bottom: 1px solid var(--border-default); align-items: center; flex-wrap: wrap"
  >
    <select
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      x-model="_chatType"
      @change="applyChatFilters()"
      aria-label="Filter by type"
    >
      <option value="all">All types</option>
      <option value="direct">Direct</option>
      <option value="group">Group</option>
    </select>
    <select
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      x-model="_chatStatus"
      @change="applyChatFilters()"
      aria-label="Filter by status"
    >
      <option value="all">All status</option>
      <option value="active">Active</option>
      <option value="archived">Archived</option>
    </select>
    <select
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      x-model="_chatSort"
      @change="applyChatFilters()"
      aria-label="Sort chats"
    >
      <option value="recent">Recent</option>
      <option value="name">Name</option>
      <option value="unread">Unread</option>
      <option value="pinned-first">Pinned first</option>
    </select>
    <select
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      x-model="_chatWorld"
      @change="applyChatFilters()"
      aria-label="Filter by world"
    >
      <option value="">All worlds</option>
      <template x-for="w in _worlds" :key="w.id">
        <option :value="w.id" x-text="w.name"></option>
      </template>
    </select>
    <input
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      type="number"
      min="0"
      placeholder="Min msgs"
      x-model="_chatMinMessages"
      @change="applyChatFilters()"
      aria-label="Minimum message count"
    />
    <input
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      type="number"
      min="0"
      placeholder="Max msgs"
      x-model="_chatMaxMessages"
      @change="applyChatFilters()"
      aria-label="Maximum message count"
    />
    <input
      class="form-input"
      style="font-size: 12px; height: 26px; flex: 1; min-width: 0"
      type="date"
      x-model="_chatUpdatedSince"
      @change="applyChatFilters()"
      aria-label="Updated since"
    />
  </div>
  <div id="chat-list">
    <template x-if="chats.length === 0 && _searchResults.length === 0">
      <div class="nav-item" style="color: var(--text-tertiary); font-size: 13px">No chats yet</div>
    </template>
    <!-- Server-side search results -->
    <template x-if="_searchResults.length > 0">
      <div>
        <div
          class="nav-item"
          style="color: var(--text-secondary); font-size: 11px; padding: var(--space-2) var(--space-3)"
        >
          Search results (<span x-text="_searchResults.length"></span>)
        </div>
        <template x-for="result in _searchResults" :key="result.chatId">
          <div class="nav-item-row">
            <a
              class="nav-item"
              :class="{ active: activeChat === result.chatId }"
              href="#"
              @click.prevent="selectChat(result.chatId)"
            >
              <span class="name" x-text="result.chatName"></span>
              <span
                class="badge"
                style="font-size: 10px; color: var(--text-tertiary)"
                x-text="result.characterName"
              ></span>
            </a>
            <span class="nav-item-actions">
              <button class="btn-icon btn-xs" title="Rename" @click.prevent="renameChat(result.chatId)">✏️</button>
            </span>
          </div>
        </template>
      </div>
    </template>
    <!-- World channels (chat-only worlds) tree -->
    <template x-if="_worlds.length > 0">
      <div
        class="chat-world-tree"
        style="border-bottom: 1px solid var(--border-default); padding-bottom: var(--space-2)"
      >
        <div class="nav-section-title" style="padding: var(--space-2) var(--space-3) 0">World channels</div>
        <template x-for="world in _worlds" :key="world.id">
          <div class="world-node">
            <a
              class="nav-item"
              href="#"
              @click.prevent="toggleWorld(world.id)"
              style="display: flex; justify-content: space-between; align-items: center"
            >
              <span class="name" x-text="world.name"></span>
              <span class="badge" x-text="_worldExpanded[world.id] ? '▾' : '▸'"></span>
            </a>
            <template x-if="_worldExpanded[world.id]">
              <div class="world-node-children" style="padding-left: var(--space-3)">
                <template x-for="group in worldChatGroups(world.id)" :key="group.locationId">
                  <div class="location-node">
                    <div
                      class="nav-section-title"
                      style="padding: var(--space-1) var(--space-3); font-size: 11px; color: var(--text-secondary)"
                    >
                      <span x-text="group.locationName"></span>
                    </div>
                    <template x-for="chat in group.chats" :key="chat.id">
                      <a
                        class="nav-item"
                        :class="{ active: activeChat === chat.id }"
                        href="#"
                        @click.prevent="selectChat(chat.id)"
                        style="padding-left: var(--space-4)"
                      >
                        <span class="name" x-text="chat.name"></span>
                      </a>
                    </template>
                  </div>
                </template>
                <template x-if="worldChatGroups(world.id).length === 0">
                  <div class="nav-item" style="color: var(--text-tertiary); font-size: 13px">No channels yet</div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
    <!-- Join a world via invite code -->
    <div class="nav-item-row" style="padding: var(--space-1) var(--space-3); gap: var(--space-2)">
      <input
        type="text"
        class="form-input"
        x-model="worldJoinCode"
        placeholder="World invite code"
        style="font-size: 12px; padding: var(--space-1) var(--space-2); flex: 1; min-width: 0"
        @keydown.enter="joinWorldByCode()"
        data-testid="world-join-code"
      />
      <button class="btn btn-ghost" @click="joinWorldByCode()" style="font-size: 12px; white-space: nowrap">
        Join
      </button>
    </div>
    <!-- Client-side filtered list -->
    <template x-if="_searchResults.length === 0">
      <div>
        <template x-for="chat in filteredChats" :key="chat.id">
          <div class="nav-item-row" :class="{ selected: selectedChats.includes(chat.id) }">
            <input
              type="checkbox"
              :checked="selectedChats.includes(chat.id)"
              @change="toggleChatSelection(chat.id)"
              style="margin: 0 0 0 var(--space-2); flex-shrink: 0"
              aria-label="Select chat"
            />
            <a
              class="nav-item"
              :class="{ active: activeChat === chat.id }"
              href="#"
              @click.prevent="selectChat(chat.id)"
            >
              <span class="name" x-text="chat.name"></span>
              <span class="badge" x-show="_unseenCounts[chat.id] > 0" x-text="_unseenCounts[chat.id]"></span>
            </a>
            <span class="nav-item-actions">
              <button
                class="btn-icon btn-xs"
                :title="chat.isPinned === 'pinned' ? 'Unpin' : 'Pin'"
                @click.prevent="toggleChatPin(chat.id)"
                :style="chat.isPinned === 'pinned' ? 'color:var(--accent-yellow)' : ''"
                x-text="chat.isPinned === 'pinned' ? '★' : '☆'"
              >
              </button>
              <button class="btn-icon btn-xs" title="Rename" @click.prevent="renameChat(chat.id)">✏️</button>
              <button class="btn-icon btn-xs" title="Delete" @click.prevent="deleteChat(chat.id, $event)">
                🗑
              </button>
            </span>
          </div>
        </template>
      </div>
    </template>
  </div>
  <div style="padding: var(--space-3)">
    <a
      class="btn btn-secondary"
      style="width: 100%; text-align: center; text-decoration: none"
      href="/views/new-chat"
      hx-get="/views/new-chat"
      hx-target="#app-root"
      hx-swap="innerHTML"
      hx-push-url="true"
    >
      + New Chat
    </a>
    <template x-if="_joinableChats.length > 0">
      <div style="margin-top: var(--space-3)">
        <div
          class="nav-item"
          style="color: var(--text-secondary); font-size: 11px; padding: var(--space-1) var(--space-2)"
        >
          Discover
        </div>
        <template x-for="room in _joinableChats" :key="room.chatId">
          <div class="nav-item-row" style="padding: var(--space-1) 0">
            <a
              class="nav-item"
              href="#"
              @click.prevent="selectChat(room.chatId); loadJoinableChats()"
              style="flex: 1; overflow: hidden"
            >
              <span class="name" x-text="room.chatName" style="font-size: 12px"></span>
              <span
                class="badge"
                style="font-size: 10px; color: var(--text-tertiary)"
                x-text="room.participantCount + ' participants'"
              ></span>
            </a>
            <button
              class="btn btn-xs btn-primary"
              @click.prevent="joinChat(room.chatId)"
              style="margin-left: var(--space-2); flex-shrink: 0"
            >
              Join
            </button>
          </div>
        </template>
      </div>
    </template>
  </div>
</div>
