<!--
  Chat ownership transfer panel. Bound to the `chatTransferFactory` Alpine
  plugin. Requires explicit confirmation before the POST fires.
-->
<div x-data="chatTransferFactory(chatId,)" x-init="setChatId(chatId,)" class="chat-transfer-panel">
  <h3>Transfer ownership</h3>

  <form @submit.prevent="submit()">
    <label>
      New owner id
      <input type="text" x-model="newOwnerId" placeholder="user or actor id" />
    </label>

    <label>
      Reason (optional)
      <textarea x-model="reason" rows="3" maxlength="500" placeholder="Optional context for the transfer"></textarea>
    </label>

    <label class="chat-transfer-confirm">
      <input type="checkbox" x-model="confirm" />
      I confirm the transfer of ownership.
    </label>

    <button type="submit" :disabled="!canSubmit()">Transfer ownership</button>
    <button type="button" @click="reset()">Reset</button>
  </form>

  <p x-show="message" x-text="message" class="chat-transfer-message"></p>
  <p x-show="error" x-text="error" class="chat-transfer-error"></p>

  <template x-if="lastResult">
    <pre x-text="JSON.stringify(lastResult, null, 2)"></pre>
  </template>
</div>
