<div class="meta">
  <!--
    Speaker badge (T8 group-chat viewer): initial for the message
    author. First character of the resolved display name; CSS
    colors it per author via [data-speaker] when present.
  -->
  <span
    class="speaker-badge"
    :data-speaker="msg.actor_id || msg.role"
    x-text="displayName(msg).slice(0, 1).toUpperCase()"
    :title="displayName(msg)"
    data-testid="speaker-badge"
  ></span>
  <span class="name" x-text="displayName(msg)" data-testid="message-author"></span>
  <!--
    Impersonation marker: the row carries an actor but a group
    participant is speaking through it (human-as-actor).
  -->
  <template x-if="msg.actor_id && impersonatedActorIds().has(msg.actor_id)">
    <span
      class="impersonation-badge"
      title="Human-played"
      data-testid="impersonation-badge"
    >🎭</span>
  </template>
  <!-- Ownership indicator: shows owner badge for user-created actors -->
  <span
    class="owner-badge"
    x-show="msg.actor_id && msg.actor_id.startsWith('actor-user')"
    x-bind:title="t('chats.ownerMessage')"
    data-testid="owner-badge"
  >👑</span>
  <!-- Branch indicator: shown on messages branches were forked from (FEAT-047) -->
  <template x-if="window.branchCountFor(msg.id) > 0">
    <span
      class="branch-indicator"
      :title="t('branches.forkPoint') + ' (' + window.branchCountFor(msg.id) + ')'"
      data-testid="branch-indicator"
    >&#11010;</span>
  </template>
  <span
    class="time"
    x-text="msg.group ? formatTimeShort(msg.created_at) : formatTime(msg.created_at)"
  ></span>
  <span class="edited-label" x-show="msg.edited_at" data-testid="edited-indicator">{{{t("chats.edited")}}}</span>
  <!-- Offline send queue (slices 2-3): optimistic row awaiting reconnect -->
  <span
    class="queued-label"
    x-show="msg.status === 'queued'"
    x-text="t('chats.queuedOffline')"
    x-bind:title="t('chats.queuedOffline')"
    data-testid="queued-indicator"
  >⏳</span>
  <!-- Story mode: quality score badge from the matching story turn -->
  <template x-if="isStoryMode && turnForMessage(msg.id)?.qualityScore != null">
    <span
      class="story-quality-badge"
      :class="qualityClass(turnForMessage(msg.id).qualityScore ?? 0)"
      :title="t('story.qualityScore')"
      data-testid="story-quality-score"
      x-text="Math.round(turnForMessage(msg.id).qualityScore ?? 0) + '/100'"
    ></span>
  </template>
</div>
