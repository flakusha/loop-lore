<!--
  Avatar for character/assistant messages (first in group only).
  `avatar_asset_id` is the server's outfit-aware answer; when absent
  the resolver falls back to the per-message emotion walk.
-->
<template
  x-if="!msg.group && (msg.role !== 'user') && (msg.avatar_asset_id ? true : (msg.emotion ? avatarForMessage(msg) !== null : !!currentCharacter?.avatar_asset_id))"
>
  <img
    class="avatar"
    :class="{ 'nsfw-blur': nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) }"
    :src="`/api/v1/assets/${avatarForMessage(msg) || currentCharacter?.avatar_asset_id}/thumb`"
    :alt="displayName(msg)"
    :role="nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) ? 'button' : null"
    :tabindex="nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) ? 0 : null"
    :aria-label="nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) ? t('nsfw.blurReveal') : null"
    x-on:click="nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) && revealNsfw('avatar-' + msg.id)"
    x-on:keydown.enter.prevent="nsfwBlurOn(msg.avatar_nsfw, 'avatar-' + msg.id) && revealNsfw('avatar-' + msg.id)"
    data-testid="message-avatar"
  />
</template>
<template x-if="msg.role !== 'user' && msg.group && currentCharacter?.avatar_asset_id">
  <div class="avatar avatar-spacer" aria-hidden="true"></div>
</template>
