<!-- Variants browser: swipe siblings via GET /api/v1/messages/:id/variants -->
<div
  class="modal-overlay"
  x-show="_variantsOpen"
  @click.self="closeVariants()"
  @keydown.escape.window="closeVariants()"
  x-cloak
  data-testid="variants-modal"
>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Browse variants">
    <div class="modal-header">
      <h3>Variants</h3>
      <button class="btn-icon btn-xs" @click="closeVariants()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div x-show="_variantsLoading">Loading…</div>
      <div x-show="!_variantsLoading && _variants.length === 0">No variants.</div>
      <template x-for="(v, idx) in _variants" :key="v.id">
        <div
          class="variant-row"
          style="display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-default)"
        >
          <span style="font-weight: 600" x-text="idx + 1"></span>
          <p style="flex: 1; margin: 0; font-size: 13px" x-text="v.content.slice(0, 200)"></p>
          <button class="btn btn-ghost btn-xs" @click="selectVariantByIndex(_variantsFor, idx)">Use</button>
        </div>
      </template>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" @click="closeVariants()">Cancel</button>
      <button
        class="btn btn-primary btn-sm"
        @click="window.openBranchMerge(_variants.map(v => ({ tipMessageId: v.id, branchId: null }))); closeVariants()"
        :disabled="_variants.length < 2"
        data-testid="variants-merge-selected"
      >
        {{{t("branches.mergeVariants")}}}
      </button>
    </div>
  </div>
</div>
