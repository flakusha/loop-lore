<!--
  Unified GM & Assistant Panel (C1 remainder) — replaces the separate GM
  panel, quest log and participant toggles with one consolidated sidebar.
  Tabs driven by `$store.ui.gmAssistantTab` (single source of truth set by
  the header/quest/participant buttons); Shadow + Whitenotes keep the
  gmPanel CRUD, Story reuses gm-story-panel + guidance + participant mgmt,
  Quests and Assistant are dedicated surfaces.
-->
<div
  x-show="$store.ui.showGmPanel"
  x-cloak
  class="gm-panel"
  @keydown.escape.window="$store.ui.showGmPanel = false"
  data-testid="gm-panel"
>
  <div class="gm-panel-header">
    <h3>{{{t("story.gmAssistant")}}}</h3>
    <button class="btn-icon" @click="$store.ui.showGmPanel = false" aria-label="Close GM & Assistant Panel">
      &times;
    </button>
  </div>

  <div class="gm-panel-body" x-data="gmPanel()" x-init="init()">
    <!-- Tab switcher -->
    <div class="gm-tabs">
      <button
        class="btn btn-sm"
        :class="$store.ui.gmAssistantTab === 'shadow' ? 'btn-primary' : 'btn-ghost'"
        @click="$store.ui.gmAssistantTab = 'shadow'"
        data-testid="gm-tab-shadow"
      >
        Shadow Notes
      </button>
      <button
        class="btn btn-sm"
        :class="$store.ui.gmAssistantTab === 'white' ? 'btn-primary' : 'btn-ghost'"
        @click="$store.ui.gmAssistantTab = 'white'"
        data-testid="gm-tab-white"
      >
        Whitenotes
      </button>
      <button
        class="btn btn-sm"
        :class="$store.ui.gmAssistantTab === 'story' ? 'btn-primary' : 'btn-ghost'"
        @click="$store.ui.gmAssistantTab = 'story'"
        x-show="isStoryMode"
        data-testid="gm-tab-story"
      >
        Story
      </button>
      <button
        class="btn btn-sm"
        :class="$store.ui.gmAssistantTab === 'quests' ? 'btn-primary' : 'btn-ghost'"
        @click="$store.ui.gmAssistantTab = 'quests'"
        x-show="isStoryMode"
        data-testid="gm-tab-quests"
      >
        Quests
      </button>
      <button
        class="btn btn-sm"
        :class="$store.ui.gmAssistantTab === 'assistant' ? 'btn-primary' : 'btn-ghost'"
        @click="$store.ui.gmAssistantTab = 'assistant'"
        data-testid="gm-tab-assistant"
      >
        Assistant
      </button>
    </div>

    <!-- Shadow Notes Tab -->
    <div x-show="$store.ui.gmAssistantTab === 'shadow'">
      <div class="gm-form-group">
        <label class="form-label">Type</label>
        <select class="form-input" x-model="newShadowType">
          <option value="foreshadowing">Foreshadowing</option>
          <option value="consequence">Consequence</option>
          <option value="hidden_fact">Hidden Fact</option>
          <option value="player_motivation">Player Motivation</option>
          <option value="world_secret">World Secret</option>
          <option value="narrative_hook">Narrative Hook</option>
        </select>
      </div>
      <div class="gm-form-group">
        <textarea
          class="form-input"
          x-model="newShadowContent"
          placeholder="Hidden narrative influence..."
          rows="3"
        ></textarea>
      </div>
      <button class="btn btn-primary btn-sm gm-full-width" @click="addShadowNote()">Add Shadow Note</button>

      <div class="gm-count"><span x-text="shadowNotes.length"></span> shadow note(s)</div>
      <template x-for="note in shadowNotes" :key="note.id">
        <div class="gm-note-card">
          <div class="gm-note-header">
            <span class="gm-note-type" x-text="note.type"></span>
            <span x-show="note.revealed" class="gm-badge-revealed">Revealed</span>
          </div>
          <p class="gm-note-content" x-text="note.content"></p>
          <div class="gm-note-actions">
            <button class="btn btn-ghost btn-sm" @click="revealShadowNote(note.id)" x-show="!note.revealed">
              Reveal to Players
            </button>
            <button class="btn btn-ghost btn-sm gm-danger" @click="deleteShadowNote(note.id)">Delete</button>
          </div>
        </div>
      </template>
    </div>

    <!-- Whitenotes Tab -->
    <div x-show="$store.ui.gmAssistantTab === 'white'">
      <div class="gm-form-group">
        <label class="form-label">Type</label>
        <select class="form-input" x-model="newWhiteneoteType">
          <option value="narrative_direction">Narrative Direction</option>
          <option value="character_context">Character Context</option>
          <option value="world_state">World State</option>
          <option value="tone">Tone</option>
          <option value="pacing">Pacing</option>
          <option value="theme">Theme</option>
        </select>
      </div>
      <div class="gm-form-group">
        <textarea
          class="form-input"
          x-model="newWhiteneoteContent"
          placeholder="Visible GM annotation..."
          rows="3"
        ></textarea>
      </div>
      <div class="gm-form-group">
        <label class="form-label">Priority (<span x-text="newWhiteneotePriority"></span>)</label>
        <input type="range" min="1" max="10" x-model.number="newWhiteneotePriority" />
      </div>
      <button class="btn btn-primary btn-sm gm-full-width" @click="addWhiteneote()">Add Whiteneote</button>

      <div class="gm-count"><span x-text="whitenotes.length"></span> whiteneote(s)</div>
      <template x-for="note in whitenotes" :key="note.id">
        <div class="gm-note-card">
          <div class="gm-note-header">
            <span class="gm-note-type" x-text="note.type"></span>
            <span class="gm-note-priority">P<span x-text="note.priority"></span></span>
          </div>
          <p class="gm-note-content" x-text="note.content"></p>
          <button class="btn btn-ghost btn-sm gm-danger" @click="deleteWhiteneote(note.id)">Delete</button>
        </div>
      </template>
    </div>

    <!--
      Story Control Tab (story chats only): status, turn order, GM guidance,
      participant/actor management
    -->
    <div x-show="$store.ui.gmAssistantTab === 'story'">
      {{> chat/gm-story-panel.html }}
      <div class="gm-story-guidance">
        <h4 class="gm-section-title">{{{t("story.guidance")}}}</h4>
        <div x-data="gmGuidance" x-init="init()">
          {{> chat/gm-guidance-panel.html }}
        </div>
      </div>
      <div class="gm-story-participants">
        <h4 class="gm-section-title">{{{t("story.participants")}}}</h4>
        {{> chat/participant-mgmt.html }}
      </div>
    </div>

    <!-- Quests Tab (story chats only) -->
    <div x-show="$store.ui.gmAssistantTab === 'quests'">
      {{> chat/gm-quests-panel.html }}
    </div>

    <!-- Assistant Tab -->
    <div x-show="$store.ui.gmAssistantTab === 'assistant'">
      {{> chat/assistant-panel.html }}
    </div>
  </div>
</div>
