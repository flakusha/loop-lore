<!-- Music embed: shown inside a message bubble after media-attachments -->
<template x-if="msg.type === 'music_link'">
  <div class="music-embed" data-testid="music-embed">
    <template x-if="!msg.nsfwHidden">
      <div class="music-embed-player" x-html="renderMusicEmbed(msg)"></div>
    </template>
    <template x-if="msg.nsfwHidden">
      <div class="music-embed-nsfw">
        <span>🔒 Explicit content hidden</span>
      </div>
    </template>
  </div>
</template>
