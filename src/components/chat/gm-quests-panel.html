<!--
  Quests tab — unified GM & Assistant panel (C1 remainder).
  Active quest progress (from storyState scope) with create/delete, mirroring
  the quest controls from the GM Story tab in a dedicated surface.
-->
<div class="gm-quests-tab" data-testid="gm-quests-tab">
  <div class="gm-section">
    <div class="gm-quests" x-show="quests.length > 0">
      <template x-for="quest in quests" :key="quest.id">
        <div class="gm-quest-row">
          <div class="gm-quest-head">
            <span class="gm-quest-name" x-text="quest.name"></span>
            <span class="gm-quest-pct" x-text="questProgressPct(quest) + '%'"></span>
            <button
              class="btn-icon gm-quest-delete"
              :title="t('story.deleteQuest')"
              @click="deleteQuest(quest.id)"
              :data-testid="'gm-quests-delete-' + quest.id"
            >
              &times;
            </button>
          </div>
          <div class="gm-quest-bar">
            <div
              class="gm-quest-bar-fill"
              :style="'width: ' + questProgressPct(quest) + '%'"
              :class="quest.status === 'completed' ? 'is-complete' : ''"
            >
            </div>
          </div>
        </div>
      </template>
    </div>
    <p class="gm-section-hint" x-show="quests.length === 0">{{{t("story.noQuests")}}}</p>
    <div class="gm-new-quest">
      <input
        class="form-input"
        x-ref="newQuestName"
        x-model="$refs.newQuestName.value"
        :placeholder="t('story.newQuestPlaceholder')"
        :data-testid="'gm-quests-new-input'"
      />
      <button
        class="btn btn-primary btn-sm"
        @click="createQuest($refs.newQuestName.value); $refs.newQuestName.value = ''"
        data-testid="gm-quests-new-submit"
      >
        {{{t("story.newQuest")}}}
      </button>
    </div>
  </div>
</div>
