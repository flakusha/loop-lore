<!-- Mood Panel — Character mood & emotions display -->
<template x-if="_mood">
  <div class="mood-section">
    <div class="mood-header">
      <h4 class="mood-title">Mood</h4>
      <span class="mood-emoji" x-text="_getMoodEmoji(_mood.currentMood)"></span>
    </div>

    <!-- Happiness Bar -->
    <div class="mood-happiness">
      <div class="mood-happiness-label">
        <span x-text="_mood.currentMood"></span>
        <span class="mood-happiness-value" x-text="_mood.happiness + '%'"></span>
      </div>
      <div class="mood-progress-track">
        <div
          class="mood-progress-fill"
          :style="{
            width: (_mood.happiness ?? 50) + '%',
            backgroundColor: _getMoodColor(_mood.happiness)
          }"
        >
        </div>
      </div>
    </div>

    <!-- Happiness Slider -->
    <div class="mood-slider">
      <label class="mood-slider-label">Adjust Happiness</label>
      <input
        type="range"
        min="-20"
        max="20"
        value="5"
        x-model.number="_moodSliderValue"
        class="mood-range-input"
      />
      <button
        class="btn btn-secondary btn-xs"
        @click="applyMoodDelta(_moodSliderValue)"
      >
        Apply <span x-text="(_moodSliderValue > 0 ? '+' : '') + _moodSliderValue"></span>
      </button>
    </div>

    <!-- Expression Modifiers -->
    <template x-if="_mood.expressionModifiers && Object.keys(_mood.expressionModifiers).length > 0">
      <div class="mood-expressions">
        <div class="mood-expression-title">Expression Modifiers</div>
        <template x-for="[key, value] in Object.entries(_mood.expressionModifiers)" :key="key">
          <div class="mood-expression-row">
            <span class="mood-expression-name" x-text="key"></span>
            <div class="mood-expression-bar">
              <div
                class="mood-expression-fill"
                :style="{ width: Math.abs(value as number) * 50 + '%', backgroundColor: (value as number) >= 0 ? 'var(--accent-green)' : 'var(--accent-red)' }"
              >
              </div>
            </div>
            <span class="mood-expression-value" x-text="(value as number) > 0 ? '+' + value : value"></span>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>

<!-- Active Emotions -->
<template x-if="getActiveEmotions().length > 0">
  <div class="mood-emotions-section">
    <div class="mood-emotions-title">Active Emotions</div>
    <div class="mood-emotions-list">
      <template x-for="emotion in getActiveEmotions()" :key="emotion.def.id">
        <div class="mood-emotion-chip">
          <span class="mood-emotion-icon" x-text="emotion.def.icon || '💭'"></span>
          <span class="mood-emotion-name" x-text="emotion.def.display_name"></span>
          <div class="mood-emotion-intensity">
            <div
              class="mood-emotion-intensity-fill"
              :style="{ width: (emotion.intensity * 100) + '%' }"
            >
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>

<!-- Emotion Avatar Generation -->
<div class="mood-emotions-section">
  <div class="mood-emotions-title">Emotion Avatars</div>
  <p style="color: var(--text-secondary); font-size: 12px; margin: 4px 0 8px">
    Generate emotion-specific avatars from the character's base avatar.
  </p>
  <button
    class="btn btn-secondary btn-xs"
    @click="generateEmotionAvatars()"
    :disabled="_emotionGenRunning"
  >
    <span x-show="_emotionGenRunning">Generating...</span>
    <span x-show="!_emotionGenRunning">Generate emotion avatars</span>
  </button>
  <div
    x-show="_emotionGenStatus"
    style="margin-top: 8px; font-size: 12px; color: var(--text-secondary)"
    x-text="_emotionGenStatus"
  >
  </div>
</div>

<!-- No Mood State -->
<template x-if="!_mood && !_moodLoading">
  <div class="mood-section mood-empty">
    <div class="mood-empty-icon">😐</div>
    <div class="mood-empty-text">No mood data for this character.</div>
    <button
      class="btn btn-secondary btn-xs"
      @click="loadMood()"
    >
      Initialize Mood
    </button>
  </div>
</template>

<!-- Loading State -->
<template x-if="_moodLoading">
  <div class="mood-section mood-loading">
    <div class="mood-loading-spinner"></div>
    <span>Loading mood...</span>
  </div>
</template>
