<!-- Quest Log Panel — active quest progress list for story chats -->
<div
  x-show="$store.ui.showQuestLog && isStoryMode"
  x-cloak
  class="quest-log-panel"
  @keydown.escape.window="$store.ui.showQuestLog = false"
  data-testid="quest-log-panel"
>
  <div class="gm-panel-header">
    <h3>{{{t("story.questLog")}}}</h3>
    <button class="btn-icon" @click="$store.ui.showQuestLog = false" aria-label="Close Quest Log">&times;</button>
  </div>
  <div class="quest-log-body">
    <p class="gm-section-hint" x-show="quests.length === 0">{{{t("story.noQuests")}}}</p>
    <template x-for="quest in quests" :key="quest.id">
      <div class="gm-quest-row">
        <div class="gm-quest-head">
          <span class="gm-quest-name" x-text="quest.name"></span>
          <span class="gm-quest-pct" x-text="questProgressPct(quest) + '%'"></span>
        </div>
        <div class="gm-quest-bar">
          <div
            class="gm-quest-bar-fill"
            :style="'width: ' + questProgressPct(quest) + '%'"
            :class="quest.status === 'completed' ? 'is-complete' : ''"
          >
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
