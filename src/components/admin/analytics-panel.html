<div x-show="activeTab === 'analytics'">
  <div x-show="loadingAnalytics" class="empty-state" style="padding: var(--space-12)">
    <div class="icon">⏳</div>
    <div class="title">Loading analytics...</div>
  </div>
  <template x-if="!loadingAnalytics">
    <div style="padding: var(--space-6)">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
        <h3 style="font-size: 16px; font-weight: 600">Telemetry Summary</h3>
        <div style="display: flex; gap: var(--space-2)">
          <button class="btn btn-secondary btn-xs" @click="loadAnalytics()">Refresh</button>
          <button class="btn btn-danger btn-xs" @click="purgeAnalytics()">Purge Old</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6)">
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="analyticsSummary.total">0</div>
          <div class="admin-stat-label">Total Events</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="analyticsSummary.distinct_sessions">0</div>
          <div class="admin-stat-label">Sessions</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="analyticsSummary.distinct_users">0</div>
          <div class="admin-stat-label">Active Users</div>
        </div>
      </div>
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">Conversation Analytics</h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6)">
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="conversationOverview.totalMessages">0</div>
          <div class="admin-stat-label">Messages</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="conversationOverview.totalTokens">0</div>
          <div class="admin-stat-label">Tokens</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="(conversationOverview.averageSessionLength ?? 0).toFixed(1)">
            0
          </div>
          <div class="admin-stat-label">Avg Session Messages</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="(conversationOverview.avgLatencyMs ?? 0).toFixed(0)">0</div>
          <div class="admin-stat-label">Avg Latency (ms)</div>
        </div>
      </div>
      <h3
        style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
        x-text="t('admin.messageVolume')"
      >
      </h3>
      <div
        style="display: flex; align-items: flex-end; gap: 2px; height: 120px; margin-bottom: var(--space-6)"
        data-testid="analytics-message-volume"
      >
        <div
          x-show="analyticsDailyBars.length === 0"
          class="empty-state"
          style="padding: var(--space-4); font-size: 13px; align-self: center"
          x-text="t('admin.noDailyData')"
        >
        </div>
        <template x-for="d in analyticsDailyBars" :key="d.date">
          <div
            style="flex: 1 1 0; min-width: 4px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end"
            :title="d.date + ': ' + d.count"
          >
            <div
              style="width: 100%; background: var(--color-primary, #4f46e5); border-radius: 2px 2px 0 0"
              :style="'height: ' + d.pct + '%'"
            >
            </div>
          </div>
        </template>
      </div>
      <h3
        style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
        x-text="t('admin.tokenUsageByRole')"
      >
      </h3>
      <div data-testid="analytics-token-usage" style="margin-bottom: var(--space-6)">
        <div style="display: flex; height: 24px; border-radius: 4px; overflow: hidden; background: var(--border-default, #e9ecef)">
          <template x-for="seg in analyticsRoleSegments" :key="seg.role">
            <div
              :style="'width: ' + seg.pct + '%; background: ' + seg.color"
              :title="seg.label + ': ' + seg.tokens"
            >
            </div>
          </template>
        </div>
        <div style="display: flex; gap: var(--space-4); margin-top: var(--space-2); font-size: 12px">
          <template x-for="seg in analyticsRoleSegments" :key="seg.role + '-legend'">
            <span>
              <span
                :style="'display:inline-block;width:10px;height:10px;border-radius:2px;background:' + seg.color"
              ></span>
              <span x-text="seg.label"></span>
              <span x-text="seg.tokens"></span>
            </span>
          </template>
        </div>
      </div>
      <h3
        style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
        x-text="t('admin.latencyDistribution')"
      >
      </h3>
      <div
        style="display: flex; align-items: flex-end; gap: var(--space-2); height: 120px; margin-bottom: var(--space-6)"
        data-testid="analytics-latency-histogram"
      >
        <template x-for="b in analyticsLatencyBars" :key="b.label">
          <div
            style="flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center"
            :title="b.label + ': ' + b.count"
          >
            <div
              style="width: 100%; background: #0891b2; border-radius: 2px 2px 0 0"
              :style="'height: ' + b.pct + '%'"
            >
            </div>
            <div
              style="font-size: 10px; color: var(--text-muted, #6b7280); margin-top: 4px; white-space: nowrap"
              x-text="b.label"
            >
            </div>
          </div>
        </template>
      </div>
      <div data-testid="analytics-quality-panel" style="margin-bottom: var(--space-6)">
        <h3
          style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
          x-text="t('admin.qualityMetrics')"
        >
        </h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-4)">
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="analyticsQualityTotals?.generations ?? 0">0</div>
            <div class="admin-stat-label" x-text="t('admin.generations')"></div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="analyticsQualityTotals?.withQualityMetrics ?? 0">0</div>
            <div class="admin-stat-label" x-text="t('admin.generationsWithMetrics')"></div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="analyticsQualityTotals?.totalTokens ?? 0">0</div>
            <div class="admin-stat-label" x-text="t('admin.tokens')"></div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="(analyticsQualityTotals?.avgLatencyMs ?? 0).toFixed(0)">0</div>
            <div class="admin-stat-label" x-text="t('admin.avgLatencyMs')"></div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="(analyticsQualityTotals?.avgTokensPerSecond ?? 0).toFixed(1)">
              0
            </div>
            <div class="admin-stat-label" x-text="t('admin.avgTokensPerSecond')"></div>
          </div>
          <div class="admin-stat-card">
            <div
              class="admin-stat-value"
              x-text="((analyticsQualityTotals?.avgRepetitionRate ?? 0) * 100).toFixed(1)"
            >
              0
            </div>
            <div class="admin-stat-label" x-text="t('admin.avgRepetitionRate')"></div>
          </div>
        </div>
        <div
          x-show="analyticsQualityTrend.length === 0"
          class="empty-state"
          style="padding: var(--space-4); font-size: 13px"
          x-text="t('admin.noQualityData')"
        >
        </div>
        <div data-testid="analytics-quality-trend" x-show="analyticsQualityTrend.length > 0">
          <div style="margin-bottom: var(--space-4)">
            <div
              style="font-size: 12px; color: var(--text-muted, #6b7280); margin-bottom: var(--space-2)"
              x-text="t('admin.avgLatencyMs')"
            >
            </div>
            <div style="display: flex; align-items: flex-end; gap: 2px; height: 90px">
              <template x-for="d in analyticsQualityTrend" :key="'q-lat-' + d.date">
                <div
                  style="flex: 1 1 0; min-width: 4px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end"
                  :title="d.date + ': ' + d.avgLatencyMs + 'ms'"
                >
                  <div
                    style="width: 100%; background: #0891b2; border-radius: 2px 2px 0 0"
                    :style="'height: ' + d.latencyPct + '%'"
                  >
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div style="margin-bottom: var(--space-4)">
            <div
              style="font-size: 12px; color: var(--text-muted, #6b7280); margin-bottom: var(--space-2)"
              x-text="t('admin.avgTokensPerSecond')"
            >
            </div>
            <div style="display: flex; align-items: flex-end; gap: 2px; height: 90px">
              <template x-for="d in analyticsQualityTrend" :key="'q-tps-' + d.date">
                <div
                  style="flex: 1 1 0; min-width: 4px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end"
                  :title="d.date + ': ' + d.avgTokensPerSecond + ' t/s'"
                >
                  <div
                    style="width: 100%; background: var(--color-primary, #4f46e5); border-radius: 2px 2px 0 0"
                    :style="'height: ' + d.tokensPerSecondPct + '%'"
                  >
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div style="margin-bottom: var(--space-4)">
            <div
              style="font-size: 12px; color: var(--text-muted, #6b7280); margin-bottom: var(--space-2)"
              x-text="t('admin.avgRepetitionRate')"
            >
            </div>
            <div style="display: flex; align-items: flex-end; gap: 2px; height: 90px">
              <template x-for="d in analyticsQualityTrend" :key="'q-rep-' + d.date">
                <div
                  style="flex: 1 1 0; min-width: 4px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end"
                  :title="d.date + ': ' + ((d.avgRepetitionRate ?? 0) * 100).toFixed(1) + '%'"
                >
                  <div
                    style="width: 100%; background: #d97706; border-radius: 2px 2px 0 0"
                    :style="'height: ' + d.repetitionPct + '%'"
                  >
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div
            style="font-size: 12px; color: var(--text-muted, #6b7280); margin-bottom: var(--space-2)"
            x-text="t('admin.finishReasons')"
          >
          </div>
          <template x-for="r in analyticsQualityFinishReasons" :key="'q-fin-' + r.reason">
            <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1)">
              <span style="font-size: 12px; width: 90px" x-text="r.reason"></span>
              <div style="flex: 1 1 0; height: 10px; background: var(--border-default, #e9ecef); border-radius: 2px">
                <div
                  style="height: 100%; background: #059669; border-radius: 2px"
                  :style="'width: ' + r.pct + '%'"
                >
                </div>
              </div>
              <span style="font-size: 12px; color: var(--text-muted, #6b7280)" x-text="r.count"></span>
            </div>
          </template>
        </div>
        <h4
          style="font-size: 13px; font-weight: 600; margin-bottom: var(--space-3)"
          x-text="t('admin.qualityModelComparison')"
        >
        </h4>
        <div
          x-show="analyticsQualityModels.length === 0"
          class="empty-state"
          style="padding: var(--space-4); font-size: 13px"
          x-text="t('admin.noQualityData')"
        >
        </div>
        <table
          class="admin-table"
          data-testid="analytics-quality-models"
          x-show="analyticsQualityModels.length > 0"
        >
          <thead>
            <tr>
              <th x-text="t('admin.model')"></th>
              <th x-text="t('admin.provider')"></th>
              <th x-text="t('admin.generations')"></th>
              <th x-text="t('admin.tokens')"></th>
              <th x-text="t('admin.avgLatencyMs')"></th>
              <th x-text="t('admin.avgTokensPerSecond')"></th>
              <th x-text="t('admin.avgRepetitionRate')"></th>
            </tr>
          </thead>
          <tbody>
            <template
              x-for="m in analyticsQualityModels"
              :key="'q-model-' + (m.model ?? '?') + '-' + (m.provider ?? '?')"
            >
              <tr>
                <td x-text="m.model ?? t('admin.unknownModel')"></td>
                <td x-text="m.provider ?? '-'"></td>
                <td x-text="m.generations"></td>
                <td x-text="m.totalTokens"></td>
                <td>
                  <div style="display: flex; align-items: center; gap: var(--space-2)">
                    <span style="width: 55px" x-text="(m.avgLatencyMs ?? 0).toFixed(0)"></span>
                    <div style="flex: 1 1 0; height: 8px; background: var(--border-default, #e9ecef); border-radius: 2px">
                      <div
                        style="height: 100%; background: #0891b2; border-radius: 2px"
                        :style="'width: ' + m.latencyPct + '%'"
                      >
                      </div>
                    </div>
                  </div>
                </td>
                <td>
                  <div style="display: flex; align-items: center; gap: var(--space-2)">
                    <span style="width: 55px" x-text="(m.avgTokensPerSecond ?? 0).toFixed(1)"></span>
                    <div style="flex: 1 1 0; height: 8px; background: var(--border-default, #e9ecef); border-radius: 2px">
                      <div
                        style="height: 100%; background: var(--color-primary, #4f46e5); border-radius: 2px"
                        :style="'width: ' + m.tokensPerSecondPct + '%'"
                      >
                      </div>
                    </div>
                  </div>
                </td>
                <td x-text="((m.avgRepetitionRate ?? 0) * 100).toFixed(1) + '%'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <h3
        style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
        x-text="t('admin.characterComparison')"
      >
      </h3>
      <div
        x-show="analyticsCharacters.length === 0"
        class="empty-state"
        style="padding: var(--space-4); font-size: 13px"
        x-text="t('admin.noCharacterData')"
      >
      </div>
      <table
        class="admin-table"
        data-testid="analytics-character-table"
        x-show="analyticsCharacters.length > 0"
        style="margin-bottom: var(--space-6)"
      >
        <thead>
          <tr>
            <th x-text="t('admin.character')"></th>
            <th x-text="t('admin.messages')"></th>
            <th x-text="t('admin.tokens')"></th>
            <th x-text="t('admin.avgResponseLength')"></th>
            <th x-text="t('admin.tokensPerMessage')"></th>
          </tr>
        </thead>
        <tbody aria-busy="true">
          <template x-for="c in analyticsCharacters" :key="c.id">
            <tr>
              <td x-text="c.name"></td>
              <td x-text="c.totalMessages"></td>
              <td x-text="c.totalTokens"></td>
              <td x-text="c.avgResponseLength"></td>
              <td x-text="c.tokensPerMessage"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <template x-if="conversationOverview.topChats.length > 0"><div style="margin-bottom: var(--space-6)">
          <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">
            Top Conversations by Tokens
          </h3>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Chat</th>
                <th>Messages</th>
                <th>Tokens</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="chat in conversationOverview.topChats" :key="chat.id"><tr>
                  <td x-text="chat.name"></td>
                  <td x-text="chat.totalMessages"></td>
                  <td x-text="chat.totalTokens"></td>
                </tr></template>
            </tbody>
          </table>
        </div></template>
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">Daily Events</h3>
      <div
        x-show="dailyStats.length === 0"
        class="empty-state"
        style="padding: var(--space-4); font-size: 13px"
      >
        No daily data available
      </div>
      <table x-show="dailyStats.length > 0" class="admin-table" style="margin-bottom: var(--space-6)">
        <thead>
          <tr>
            <th>Date</th>
            <th>Events</th>
            <th>Active Users</th>
          </tr>
        </thead>
        <tbody aria-busy="true">
          <template x-for="d in dailyStats" :key="d.date">
            <tr>
              <td x-text="d.date"></td>
              <td x-text="d.count"></td>
              <td x-text="d.active_users"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <h3
        style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)"
        x-text="t('admin.knowledgeGraph')"
      >
      </h3>
      <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3)">
        <button class="btn btn-secondary btn-xs" @click="loadKnowledgeGraph()" x-text="t('admin.refresh')"></button>
        <span style="font-size: 12px; color: var(--text-muted, #6b7280)">
          <span
            style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--success)"
          ></span>
          <span x-text="t('admin.kgAssets')"></span>
          <span
            style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--warning); margin-left: var(--space-2)"
          ></span>
          <span x-text="t('admin.kgEntities')"></span>
        </span>
      </div>
      <div
        x-show="kgNodes.length === 0 && !loadingKnowledgeGraph"
        class="empty-state"
        style="padding: var(--space-4); font-size: 13px; margin-bottom: var(--space-6)"
        x-text="t('admin.noGraphData')"
      >
      </div>
      <svg
        x-show="kgNodes.length > 0"
        data-testid="knowledge-graph"
        viewBox="0 0 400 400"
        style="width: 100%; max-width: 520px; height: auto; margin-bottom: var(--space-6); border: 1px solid var(--border-default, #e9ecef); border-radius: 4px; color: var(--text-secondary, #6b7280)"
        x-html="kgGraphSvg"
      >
      </svg>
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">Recent Errors</h3>
      <div
        x-show="errorEvents.length === 0"
        class="empty-state"
        style="padding: var(--space-4); font-size: 13px"
      >
        No errors recorded
      </div>
      <table x-show="errorEvents.length > 0" class="admin-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Session</th>
          </tr>
        </thead>
        <tbody aria-busy="true">
          <template x-for="e in errorEvents.slice(0, 20)" :key="e.id">
            <tr>
              <td x-text="formatDate(e.created_at)" style="font-size: 12px; white-space: nowrap"></td>
              <td x-text="e.event_type" style="font-size: 12px"></td>
              <td x-text="e.session_id?.slice(0, 8) || '-'" style="font-size: 12px"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>
</div>
