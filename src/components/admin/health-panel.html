<!-- Health Tab -->
<div x-show="activeTab === 'health'">
  <div x-show="loadingHealth" class="empty-state" style="padding: var(--space-12)">
    <div class="icon">⏳</div>
    <div class="title">Loading health status...</div>
  </div>
  <template x-if="!loadingHealth">
    <div style="padding: var(--space-6)">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
        <div style="display: flex; align-items: center; gap: var(--space-3)">
          <h3 style="font-size: 16px; font-weight: 600">Server Health</h3>
          <span
            style="font-size: 12px; padding: 2px 8px; border-radius: 4px"
            :style="{background: healthStatus === 'ok' ? '#28a74522' : '#dc354522', color: healthStatus === 'ok' ? '#28a745' : '#dc3545'}"
            x-text="healthStatus"
          ></span>
        </div>
        <button class="btn btn-primary btn-xs" @click="refreshHealthWithRescan()" :disabled="loadingHealth">
          Rescan & Refresh
        </button>
        <button
          class="btn btn-secondary btn-xs"
          @click="toggleHealthAutoRefresh()"
          :class="healthAutoRefresh ? 'btn-primary' : ''"
          x-text="healthAutoRefresh ? 'Auto: ON' : 'Auto: OFF'"
        >
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6)">
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="healthUptime"></div>
          <div class="admin-stat-label">Uptime (s)</div>
        </div>
        <div class="admin-stat-card">
          <div class="admin-stat-value" x-text="healthProviders.length"></div>
          <div class="admin-stat-label">Providers</div>
        </div>
        <div class="admin-stat-card">
          <div
            class="admin-stat-value"
            x-text="healthProviders.filter(p => p.status === 'healthy').length"
          >
          </div>
          <div class="admin-stat-label">Healthy</div>
        </div>
        <div class="admin-stat-card">
          <div
            class="admin-stat-value"
            x-text="healthProviders.filter(p => p.status !== 'healthy').length"
          >
          </div>
          <div class="admin-stat-label">Degraded</div>
        </div>
      </div>
      <div
        x-show="healthTimestamp"
        style="font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-4)"
      >
        Last checked: <span x-text="healthTimestamp"></span>
      </div>
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">Providers</h3>
      <div style="font-size: 11px; color: var(--text-secondary, #6c757d); margin-bottom: var(--space-2)">
        Note: Image generation and Bedrock providers are not yet in the provider registry.
      </div>
      <div style="display: grid; gap: var(--space-3)">
        <template x-for="p in healthProviders" :key="p.name">
          <div style="padding: var(--space-3); background: var(--bg-secondary, #f8f9fa); border-radius: 6px; border: 1px solid var(--border-default, #e9ecef)">
            <div
              style="display: flex; align-items: center; gap: var(--space-3); cursor: pointer"
              @click="expandHealthProvider = expandHealthProvider === p.name ? '' : p.name"
            >
              <span
                style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0"
                :style="{background: p.status === 'healthy' ? '#28a745' : p.status === 'degraded' ? '#ffc107' : '#dc3545'}"
              ></span>
              <strong style="font-size: 14px" x-text="p.name"></strong>
              <span
                style="font-size: 11px; padding: 1px 6px; border-radius: 3px"
                :style="{background: p.status === 'healthy' ? '#28a74522' : '#dc354522', color: p.status === 'healthy' ? '#28a745' : '#dc3545'}"
                x-text="p.status"
              ></span>
              <span
                style="font-size: 12px; color: var(--text-secondary)"
                x-text="p.models?.length + ' model(s)'"
              ></span>
              <span
                x-show="p.latencyMs"
                style="font-size: 12px; color: var(--text-secondary)"
                x-text="p.latencyMs + 'ms'"
              ></span>
              <span
                x-show="p.error"
                style="font-size: 11px; color: #dc3545; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                x-text="p.error"
              ></span>
              <span
                style="font-size: 11px; color: var(--text-secondary); margin-left: auto"
                x-text="expandHealthProvider === p.name ? '▲' : '▼'"
              ></span>
            </div>
            <div
              x-show="expandHealthProvider === p.name"
              style="margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-default, #e9ecef)"
            >
              <div style="font-size: 12px; color: var(--text-secondary, #6c757d); margin-bottom: var(--space-2)">
                Available Models:
              </div>
              <div
                x-show="!p.models || p.models.length === 0"
                style="font-size: 12px; color: var(--text-secondary)"
              >
                No models discovered
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <template x-for="m in p.models" :key="m">
                  <span
                    style="font-size: 11px; padding: 3px 8px; background: var(--bg-tertiary, #fff); border: 1px solid var(--border-default, #e9ecef); border-radius: 4px"
                    x-text="typeof m === 'string' ? m : m.id"
                  ></span>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
      <!-- AUX Generation Telemetry -->
      <div style="margin-top: var(--space-8)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3)">
          <h3 style="font-size: 14px; font-weight: 600">Generation Telemetry (AUX)</h3>
          <button
            class="btn btn-secondary btn-xs"
            @click="loadAuxTelemetry()"
            :disabled="loadingAuxTelemetry"
          >
            Refresh
          </button>
        </div>
        <div x-show="loadingAuxTelemetry" style="font-size: 12px; color: var(--text-secondary)">
          Loading telemetry…
        </div>
        <div
          x-show="!loadingAuxTelemetry && auxEvents.length === 0"
          style="font-size: 12px; color: var(--text-secondary); padding: var(--space-4)"
        >
          No AUX generation calls recorded yet.
        </div>
        <template x-if="!loadingAuxTelemetry && auxAggregates.length > 0">
          <div style="margin-bottom: var(--space-4)">
            <div style="font-size: 12px; font-weight: 600; margin-bottom: var(--space-2)">By task</div>
            <table style="width: 100%; border-collapse: collapse; font-size: 12px">
              <thead>
                <tr style="text-align: left; color: var(--text-secondary, #6c757d)">
                  <th style="padding: 4px 6px">Task</th>
                  <th style="padding: 4px 6px">Calls</th>
                  <th style="padding: 4px 6px">Success</th>
                  <th style="padding: 4px 6px">Fail</th>
                  <th style="padding: 4px 6px">Avg Latency</th>
                  <th style="padding: 4px 6px">Tokens (in/out)</th>
                </tr>
              </thead>
              <tbody aria-busy="true">
                <template x-for="agg in auxAggregates" :key="agg.task">
                  <tr style="border-top: 1px solid var(--border-default, #e9ecef)">
                    <td style="padding: 4px 6px" x-text="agg.task"></td>
                    <td style="padding: 4px 6px" x-text="agg.totalCalls"></td>
                    <td style="padding: 4px 6px; color: var(--color-success, #28a745)" x-text="agg.successCount"></td>
                    <td style="padding: 4px 6px; color: #dc3545" x-text="agg.failureCount"></td>
                    <td style="padding: 4px 6px" x-text="agg.avgLatencyMs + 'ms'"></td>
                    <td style="padding: 4px 6px" x-text="agg.totalPromptTokens + '/' + agg.totalCompletionTokens"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template x-if="!loadingAuxTelemetry && auxEvents.length > 0">
          <div>
            <div style="font-size: 12px; font-weight: 600; margin-bottom: var(--space-2)">
              Recent calls <span
                style="color: var(--text-secondary, #6c757d); font-weight: 400"
                x-text="'(' + auxEvents.length + ' of ' + auxTotal + ')'"
              ></span>
            </div>
            <div style="display: grid; gap: var(--space-2)">
              <template x-for="ev in auxEvents" :key="ev.id">
                <div style="display: flex; align-items: center; gap: var(--space-2); font-size: 12px; padding: var(--space-2); background: var(--bg-secondary, #f8f9fa); border: 1px solid var(--border-default, #e9ecef); border-radius: 4px">
                  <span
                    style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0"
                    :style="{background: ev.success ? '#28a745' : '#dc3545'}"
                  ></span>
                  <span style="font-weight: 500" x-text="ev.task || 'aux'"></span>
                  <span x-show="ev.model" style="color: var(--text-secondary)" x-text="ev.model"></span>
                  <span
                    x-show="ev.latencyMs"
                    style="color: var(--text-secondary)"
                    x-text="ev.latencyMs + 'ms'"
                  ></span>
                  <span
                    x-show="ev.error"
                    style="color: #dc3545; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px"
                    x-text="ev.error"
                  ></span>
                  <span
                    style="color: var(--text-secondary, #6c757d); margin-left: auto; font-size: 11px"
                    x-text="new Date(ev.createdAt).toLocaleString()"
                  ></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
