<!-- Shared Header Component
     Usage via component include.
     Variables substituted by views system:
       - {{page}} → page identifier (characters, gallery, worlds, etc)
       - {{testid}} → unique test identifier
       - {{title}} → page title
       - {{{actions}}} → action buttons HTML
-->
<header
  id="header-slot"
  class="main-header"
  data-page="{{page}}"
  data-testid="{{testid}}"
  data-breadcrumb="{{breadcrumb}}"
>
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{title}}</span>
  <div class="actions">{{{actions}}}</div>
</header>
