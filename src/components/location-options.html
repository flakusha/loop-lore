<!--
  Shared location <option> rows for Alpine selects. Iterates
  `optionItems` on the host scope — each host exposes it as a view-model
  getter over its own location list (WorldPageState.optionItems,
  ChatState.optionItems).
-->
<template :key="loc.id" x-for="loc in optionItems">
  <option x-text="loc.name" :value="loc.id"></option>
</template>
