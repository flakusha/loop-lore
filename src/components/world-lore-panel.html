<!--
  World lore editor (TASK-world-dashboard): constant / enabled / disabled
  lore entries. Host scope: worldState(worldId). Group labels use static t()
  keys — a concatenated key would be invisible to the i18n static-key gate.
-->
<section
  class="panel world-lore-panel"
  aria-labelledby="lore-heading"
  data-testid="world-lore"
>
  <h3 id="lore-heading">{{{ t("worlds.loreTitle") }}}</h3>
  <div class="quick-actions">
    <button
      class="btn btn-primary btn-sm"
      data-testid="lore-new"
      @click="openLoreForm(null)"
      aria-label="{{{ t('worlds.loreNewEntry') }}}"
    >
      {{{ t("worlds.loreNewEntry") }}}
    </button>
  </div>
  <div x-show="loreLoading" class="muted">{{{ t("worlds.loreLoading") }}}</div>
  <div x-show="loreError" class="muted" role="alert">{{{ t("worlds.loreLoadFailed") }}}</div>
  <div x-show="loreMessage" class="muted" role="status" x-text="loreMessage"></div>

  <!-- Editor form (create + edit) -->
  <template x-if="loreFormOpen">
    <div class="lore-form" data-testid="lore-form">
      <div class="form-group">
        <label class="form-label" for="lore-name">{{{ t("worlds.loreName") }}}</label>
        <input
          id="lore-name"
          class="form-input"
          x-model="loreForm.name"
          placeholder="{{{ t('worlds.loreNamePlaceholder') }}}"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-content">{{{ t("worlds.loreContent") }}}</label>
        <textarea
          id="lore-content"
          class="form-input"
          x-model="loreForm.content"
          rows="4"
          placeholder="{{{ t('worlds.loreContentPlaceholder') }}}"
        ></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-keys">{{{ t("worlds.loreKeywords") }}}</label>
        <input
          id="lore-keys"
          class="form-input"
          x-model="loreForm.keys"
          placeholder="{{{ t('worlds.loreKeywordsPlaceholder') }}}"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-priority">{{{ t("worlds.lorePriority") }}}</label>
        <input
          id="lore-priority"
          class="form-input"
          type="number"
          x-model="loreForm.priority"
          aria-label="{{{ t('worlds.lorePriority') }}}"
        />
        <label class="condition">
          <input type="checkbox" x-model="loreForm.constant" />
          {{{ t("worlds.loreConstant") }}}
        </label>
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-rarity">{{{ t("worlds.loreRarity") }}}</label>
        <select
          id="lore-rarity"
          class="form-input"
          x-model="loreForm.rarity"
          data-testid="lore-rarity"
          aria-label="{{{ t('worlds.loreRarity') }}}"
        >
          <template x-for="tier in loreRarityTiers" :key="tier">
            <option :value="tier" x-text="tier"></option>
          </template>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-timeline">{{{ t("worlds.loreTimelineId") }}}</label>
        <input
          id="lore-timeline"
          class="form-input"
          x-model="loreForm.timelineId"
          placeholder="{{{ t('worlds.loreTimelineIdPlaceholder') }}}"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="lore-reveal">{{{ t("worlds.loreRevealCondition") }}}</label>
        <textarea
          id="lore-reveal"
          class="form-input"
          x-model="loreForm.revealCondition"
          rows="3"
          spellcheck="false"
          data-testid="lore-reveal-condition"
          placeholder="{{{ t('worlds.loreRevealConditionPlaceholder') }}}"
        ></textarea>
        <p class="muted" x-show="!loreFormError">{{{ t("worlds.loreRevealConditionHint") }}}</p>
        <p
          class="muted"
          role="alert"
          x-show="loreFormError"
          x-text="loreFormError"
          data-testid="lore-reveal-error"
        >
        </p>
      </div>
      <div class="quick-actions">
        <button class="btn btn-secondary btn-sm" @click="cancelLoreForm()">
          {{{ t("wizard.cancel") }}}
        </button>
        <button
          class="btn btn-primary btn-sm"
          :disabled="loreBusy"
          data-testid="lore-save"
          @click="saveLore()"
          :aria-label="loreEditingId ? t('common.save') : t('common.create')"
          x-text="loreEditingId ? t('common.save') : t('common.create')"
        >
        </button>
      </div>
    </div>
  </template>

  <!-- Entries grouped: constant / enabled / disabled -->
  <div x-show="!loreLoading && loreEntries.length === 0" class="muted">{{{ t("worlds.loreNoEntries") }}}</div>
  <template
    x-for="group in [
      { label: t('worlds.loreGroupConstant'), rows: loreGroups.constant },
      { label: t('worlds.loreGroupEnabled'), rows: loreGroups.enabled },
      { label: t('worlds.loreGroupDisabled'), rows: loreGroups.disabled }
    ]"
    :key="group.label"
  >
    <div x-show="group.rows.length > 0" class="lore-group">
      <h5 x-text="group.label"></h5>
      <template x-for="entry in group.rows" :key="entry.id">
        <div class="lore-entry" data-testid="lore-entry">
          <div>
            <strong x-text="entry.name || t('worlds.loreUntitled')"></strong>
            <span
              class="muted"
              x-show="entry.rarity && entry.rarity !== 'common'"
              x-text="` · ${entry.rarity}`"
            ></span>
            <span class="muted" x-show="entry.revealCondition" x-text="` · ${t('worlds.loreSecretBadge')}`"></span>
            <span class="muted" x-show="entry.timelineId" x-text="` · @${entry.timelineId}`"></span>
            <span
              class="muted"
              x-show="entry.priority"
              x-text="` · ${t('worlds.lorePriorityValue', { value: entry.priority })}`"
            ></span>
            <div
              class="muted"
              x-show="parseLoreKeys(entry.keys).length"
              x-text="parseLoreKeys(entry.keys).join(', ')"
            >
            </div>
            <p class="lore-content" x-text="entry.content"></p>
          </div>
          <div class="quick-actions">
            <button
              class="btn btn-secondary btn-sm"
              @click="openLoreForm(entry.id)"
              :aria-label="t('common.edit') + ' ' + (entry.name || t('worlds.loreUntitled'))"
            >
              {{{ t("common.edit") }}}
            </button>
            <button
              class="btn btn-secondary btn-sm"
              :disabled="loreBusy"
              @click="deleteLore(entry.id)"
              :aria-label="t('common.delete') + ' ' + (entry.name || t('worlds.loreUntitled'))"
            >
              {{{ t("common.delete") }}}
            </button>
          </div>
        </div>
      </template>
    </div>
  </template>
</section>
