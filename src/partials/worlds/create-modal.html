<div
  id="create-world-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="create-world-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("worlds.create") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form x-on:submit="window.createWorld($event)" data-testid="create-world-form">
        <div class="form-group">
          <label class="form-label" for="world-name">{{{ t("worlds.name") }}}</label>
          <input
            class="form-input"
            type="text"
            name="name"
            id="world-name"
            required
            placeholder="e.g., The Forgotten Realm"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="world-description">{{{ t("worlds.description") }}}</label>
          <div style="display: flex; gap: var(--space-1); align-items: flex-start">
            <textarea
              class="form-input form-textarea"
              name="description"
              id="world-description"
              style="flex: 1"
              rows="2"
              placeholder="Short summary for the world card"
              x-init="autoResize($el)"
              @input="autoResize($el)"
            ></textarea>
            <div x-data="textToolbar({ target: '#world-description' })">
              {{> text-toolbar.html }}
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="world-lore">{{{ t("worlds.lore") }}}</label>
          <div style="display: flex; gap: var(--space-1); align-items: flex-start">
            <textarea
              class="form-input form-textarea"
              name="lore"
              id="world-lore"
              style="flex: 1"
              rows="4"
              placeholder="Full setting description..."
              x-init="autoResize($el)"
              @input="autoResize($el)"
            ></textarea>
            <div x-data="textToolbar({ target: '#world-lore' })">
              {{> text-toolbar.html }}
            </div>
          </div>
        </div>
        <div style="display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6)">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
            {{{ t("common.cancel") }}}
          </button>
          <button type="submit" class="btn btn-primary">{{{ t("common.create") }}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
