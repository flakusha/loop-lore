<div
  id="import-world-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="import-world-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("worlds.importWorld") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form onsubmit="return importWorld(event,)" data-testid="import-world-form">
        <div
          class="drop-zone"
          style="margin-bottom: var(--space-4)"
          x-on:click="window.document.getElementById('world-import-file-input').click()"
        >
          <div class="icon">🌍</div>
          <div class="text">{{{ t("worlds.importWorld") }}}</div>
          <div class="hint">Import a .world.json bundle (world + locations + lore + quests + states)</div>
          <input
            type="file"
            name="file"
            accept=".json, application/json"
            style="display: none"
            id="world-import-file-input"
            required
          />
        </div>

        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
            {{{ t("common.cancel") }}}
          </button>
          <button type="submit" class="btn btn-primary">{{{ t("common.import") }}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
