<div
  id="edit-world-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="edit-world-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("worlds.edit") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form
        hx-put="/api/worlds/{{worldId}}"
        hx-target="#world-detail"
        hx-swap="innerHTML"
        hx-target-error="#toast-container"
        data-hx-success-event="world:saved"
        data-testid="edit-world-form"
      >
        <div class="form-group">
          <label class="form-label" for="edit-name">{{{ t("worlds.name") }}}</label>
          <input class="form-input" type="text" name="name" id="edit-name" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-description">{{{ t("worlds.description") }}}</label>
          <textarea class="form-input" name="description" id="edit-description" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-lore">{{{ t("worlds.lore") }}}</label>
          <textarea class="form-input" name="lore" id="edit-lore" rows="4"></textarea>
        </div>
        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
            {{{ t("common.cancel") }}}
          </button>
          <button type="submit" class="btn btn-primary">{{{ t("common.save") }}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
