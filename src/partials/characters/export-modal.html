<div
  id="export-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="export-character-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("characters.exportCharacter") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom: var(--space-4)">
        <div style="font-weight: 600; margin-bottom: var(--space-2)">{{{ t("characters.title") }}}:</div>
        <div id="export-character-name" style="color: var(--text-secondary)"></div>
      </div>

      <div style="margin-bottom: var(--space-4)">
        <div style="font-weight: 600; margin-bottom: var(--space-2)">{{{ t("characters.exportFormat") }}}:</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
          <label
            class="format-option"
            style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer"
          >
            <input type="radio" name="export-format" value="png" checked />
            <div>
              <div style="font-weight: 500">{{{ t("characters.pngRecommended") }}}</div>
              <div style="font-size: 0.85em; color: var(--text-secondary)">
                {{{ t("characters.sillyTavernCompatible") }}}
              </div>
            </div>
          </label>
          <label
            class="format-option"
            style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer"
          >
            <input type="radio" name="export-format" value="json" />
            <div>
              <div style="font-weight: 500">{{{ t("characters.jsonV3") }}}</div>
              <div style="font-size: 0.85em; color: var(--text-secondary)">{{{ t("characters.standardFormat") }}}</div>
            </div>
          </label>
          <label
            class="format-option"
            style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer"
          >
            <input type="radio" name="export-format" value="yaml" />
            <div>
              <div style="font-weight: 500">{{{ t("characters.yaml") }}}</div>
              <div style="font-size: 0.85em; color: var(--text-secondary)">{{{ t("characters.humanReadable") }}}</div>
            </div>
          </label>
          <label
            class="format-option"
            style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer"
          >
            <input type="radio" name="export-format" value="toml" />
            <div>
              <div style="font-weight: 500">{{{ t("characters.toml") }}}</div>
              <div style="font-size: 0.85em; color: var(--text-secondary)">{{{ t("characters.configStyle") }}}</div>
            </div>
          </label>
        </div>
      </div>

      <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
        <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
          {{{ t("common.cancel") }}}
        </button>
        <button
          type="button"
          class="btn btn-primary"
          x-on:click="window.exportCharacter($el)"
          data-testid="export-character-btn"
        >
          {{{ t("common.export") }}}
        </button>
      </div>
    </div>
  </div>
</div>
