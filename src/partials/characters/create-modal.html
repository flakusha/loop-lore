<div
  id="create-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="create-character-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">Create Character</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form
        hx-post="/api/actors"
        hx-target="#app-root"
        hx-swap="innerHTML"
        hx-target-error="#toast-container"
        data-hx-success-event="character:created"
        data-testid="create-character-form"
      >
        <div class="form-group">
          <label class="form-label" for="char-name">Character Name</label>
          <input
            class="form-input"
            type="text"
            name="displayName"
            id="char-name"
            required
            placeholder="e.g., Alice"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="char-type">Type</label>
          <select class="form-select" name="actorType" id="char-type">
            <option value="character">Character</option>
            <option value="persona">Persona</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-desc">Description</label>
          <textarea
            class="form-input form-textarea"
            name="description"
            id="char-desc"
            rows="3"
            placeholder="Brief description..."
          ></textarea>
        </div>
        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
</div>
