<div
  id="create-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="create-character-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("characters.create") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form
        hx-post="/api/actors"
        hx-swap="none"
        hx-target-error="#toast-container"
        data-hx-success-event="character:created"
        data-testid="create-character-form"
      >
        <div class="form-group">
          <label class="form-label" for="char-name">{{{ t("characters.name") }}}</label>
          <input
            class="form-input"
            type="text"
            name="displayName"
            id="char-name"
            required
            placeholder="e.g., Alice"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="char-type">{{{ t("characters.type") }}}</label>
          <select class="form-select" name="actorType" id="char-type">
            <option value="character">{{{ t("characters.character") }}}</option>
            <option value="persona">{{{ t("characters.persona") }}}</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-desc">{{{ t("characters.description") }}}</label>
          <textarea
            class="form-input form-textarea"
            name="description"
            id="char-desc"
            rows="3"
            placeholder="Brief description..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-personality">{{{ t("characters.personality") }}}</label>
          <textarea
            class="form-input form-textarea"
            name="personality"
            id="char-personality"
            rows="2"
            placeholder="Traits, mannerisms, speech patterns..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-scenario">{{{ t("characters.scenario") }}}</label>
          <textarea
            class="form-input form-textarea"
            name="scenario"
            id="char-scenario"
            rows="2"
            placeholder="Initial scene/setting context..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-greeting">{{{ t("characters.firstMessage") }}}</label>
          <textarea
            class="form-input form-textarea"
            name="welcomeMessage"
            id="char-greeting"
            rows="3"
            placeholder="First message the character sends..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="char-tags">{{{ t("characters.tags") }}}</label>
          <input
            class="form-input"
            type="text"
            name="tags"
            id="char-tags"
            placeholder="Comma-separated (e.g., fantasy, elf, mentor)"
          />
        </div>
        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
            {{{ t("common.cancel") }}}
          </button>
          <button type="submit" class="btn btn-primary">{{{ t("common.create") }}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
