<div
  id="import-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="import-character-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">Import Character Card</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form
        hx-post="/api/actors/import"
        hx-encoding="multipart/form-data"
        hx-target="#app-root"
        hx-swap="innerHTML"
        hx-target-error="#toast-container"
        data-hx-success-event="character:imported"
        data-testid="import-character-form"
      >
        <div
          class="drop-zone"
          style="margin-bottom: var(--space-4)"
          x-on:click="window.document.getElementById('import-file-input').click()"
        >
          <div class="icon">📄</div>
          <div class="text">Upload a character card</div>
          <div class="hint">Supports JSON (V2/V3), PNG (embedded), YAML, TOML, CHARX, Character.AI</div>
          <input
            type="file"
            name="file"
            accept=".json,.png,.yaml,.yml,.toml,.charx"
            style="display: none"
            id="import-file-input"
          />
        </div>

        <div
          class="format-info"
          style="
            margin-bottom: var(--space-4);
            padding: var(--space-3);
            background: var(--bg-secondary);
            border-radius: 6px;
            font-size: 0.9em;
          "
        >
          <div style="font-weight: 600; margin-bottom: var(--space-2)">Supported Formats:</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
            <div>
              <div style="font-weight: 500">Character Cards</div>
              <div style="color: var(--text-secondary)">• CCv2 (SillyTavern/Chub)</div>
              <div style="color: var(--text-secondary)">• CCv3 (RisuAI)</div>
              <div style="color: var(--text-secondary)">• Character.AI export</div>
            </div>
            <div>
              <div style="font-weight: 500">File Formats</div>
              <div style="color: var(--text-secondary)">• PNG (embedded data)</div>
              <div style="color: var(--text-secondary)">• CHARX (ZIP bundle)</div>
              <div style="color: var(--text-secondary)">• YAML / TOML</div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">Cancel</button>
          <button type="submit" class="btn btn-primary">Import</button>
        </div>
      </form>
    </div>
  </div>
</div>
