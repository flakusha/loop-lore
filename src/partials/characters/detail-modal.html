<div
  id="character-detail-modal"
  class="modal-overlay"
  onclick="if (event.target === this) { closeModal(this,); }"
  data-testid="character-detail-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title" data-field="name"></span>
      <button class="btn-icon" onclick="closeModal(this.closest('.modal-overlay',),)">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display: flex; gap: var(--space-4); margin-bottom: var(--space-4)">
        <div
          style="width: 80px; height: 80px; border-radius: var(--radius-md); background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; overflow: hidden"
          data-field="avatar"
        >
          <span>👤</span>
        </div>
        <div style="flex: 1">
          <div style="font-size: var(--fs-lg); font-weight: 600" data-field="name"></div>
          <div
            style="font-size: var(--fs-base-sm); color: var(--text-secondary); margin-top: var(--space-2)"
            data-field="description"
          >
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{{ t("characters.systemPrompt") }}}</label>
        <div
          style="font-size: var(--fs-base-sm); color: var(--text-secondary); white-space: pre-wrap; background: var(--bg-tertiary); padding: var(--space-3); border-radius: var(--radius-sm); max-height: 200px; overflow-y: auto"
          data-field="system-prompt"
        >
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{{ t("characters.personality") }}}</label>
        <div
          style="font-size: var(--fs-base-sm); color: var(--text-secondary); white-space: pre-wrap; background: var(--bg-tertiary); padding: var(--space-3); border-radius: var(--radius-sm); max-height: 120px; overflow-y: auto"
          data-field="personality"
        >
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{{ t("characters.scenario") }}}</label>
        <div
          style="font-size: var(--fs-base-sm); color: var(--text-secondary); white-space: pre-wrap; background: var(--bg-tertiary); padding: var(--space-3); border-radius: var(--radius-sm); max-height: 120px; overflow-y: auto"
          data-field="scenario"
        >
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{{ t("characters.firstMessage") }}}</label>
        <div
          style="font-size: var(--fs-base-sm); color: var(--text-secondary); white-space: pre-wrap; background: var(--bg-tertiary); padding: var(--space-3); border-radius: var(--radius-sm); max-height: 120px; overflow-y: auto"
          data-field="welcome-message"
        >
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">{{{ t("characters.tags") }}}</label>
        <div
          style="display: flex; flex-wrap: wrap; gap: var(--space-2)"
          data-field="tags"
        >
        </div>
      </div>
      <!-- Mood Display -->
      <div class="form-group" data-field="mood-section" style="display: none">
        <label class="form-label">{{{ t("characters.mood") }}}</label>
        <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--bg-tertiary); border-radius: var(--radius-sm)">
          <span style="font-size: 24px" data-field="mood-emoji">😐</span>
          <div style="flex: 1">
            <div style="font-size: var(--fs-base-sm); font-weight: 500" data-field="mood-label">
              {{{ t("characters.neutral") }}}
            </div>
            <div style="height: 4px; background: var(--border-default); border-radius: 2px; margin-top: 4px; overflow: hidden">
              <div
                style="height: 100%; width: 50%; background: var(--text-secondary); border-radius: 2px"
                data-field="mood-bar"
              >
              </div>
            </div>
          </div>
          <span style="font-size: 12px; color: var(--text-secondary)" data-field="mood-happiness">50%</span>
        </div>
      </div>
      <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
        <button
          class="btn btn-secondary"
          data-action="start-chat"
          onclick="startChatFromChar(this,)"
          data-testid="start-chat-btn"
        >
          {{{ t("characters.startChat") }}}
        </button>
        <button
          class="btn btn-secondary"
          data-action="edit-char"
          onclick="editCharacter(this,)"
          data-testid="edit-character-btn"
        >
          ✏️ {{{ t("common.edit") }}}
        </button>
        <button
          class="btn btn-danger"
          data-action="delete-char"
          onclick="deleteCharacter(this,)"
          data-testid="delete-character-btn"
        >
          🗑 {{{ t("common.delete") }}}
        </button>
      </div>
    </div>
  </div>
</div>
