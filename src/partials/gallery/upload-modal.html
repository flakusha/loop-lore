<div
  id="upload-modal"
  class="modal-overlay"
  x-on:click="window.closeModalOnBackdrop($event)"
  data-testid="upload-modal"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">{{{ t("gallery.uploadAsset") }}}</span>
      <button class="btn-icon" x-on:click="window.closeModal($el)">&times;</button>
    </div>
    <div class="modal-body">
      <form
        hx-post="/api/assets"
        hx-encoding="multipart/form-data"
        hx-target="#asset-grid"
        hx-swap="innerHTML"
        hx-target-error="#toast-container"
        data-testid="upload-form"
      >
        <div class="drop-zone" style="margin-bottom: var(--space-4)" id="upload-dropzone">
          <div class="icon">📤</div>
          <div class="text">{{{ t("gallery.dragDrop") }}}</div>
          <div class="hint">{{{ t("gallery.orClickToBrowse") }}}</div>
          <input
            type="file"
            name="file"
            accept="image/*, audio/*, video/*"
            style="display: none"
            id="upload-file-input"
          />
        </div>
        <div class="form-group" style="margin-top: var(--space-4)">
          <label class="form-label" for="asset-label">{{{ t("gallery.labelOptional") }}}</label>
          <input
            class="form-input"
            type="text"
            name="alt_text"
            id="asset-label"
            placeholder="e.g., Character portrait"
          />
        </div>
        <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
          <button type="button" class="btn btn-secondary" x-on:click="window.closeModal($el)">
            {{{ t("common.cancel") }}}
          </button>
          <button type="submit" class="btn btn-primary">{{{ t("common.upload") }}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
