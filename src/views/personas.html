<!-- Personas List Page -->
<header id="header-slot" class="main-header" data-page="personas" data-testid="personas-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("personas.title")}}}</span>
  <div class="actions">
    <button
      class="btn btn-primary"
      @click="$store.ui.activePersona = null; $store.ui.showPersonaForm = true"
      data-testid="create-persona"
    >
      {{{t("personas.newPersona")}}}
    </button>
  </div>
</header>

<div class="app-layout" x-data="personasPage()" x-init="init()">
  <main class="main-content">
    <div class="chat-area">
      <div class="list-toolbar">
        <input
          class="form-input list-search"
          type="search"
          :placeholder="t('personas.searchPlaceholder')"
          x-bind:aria-label="t('personas.searchPlaceholder')"
          x-model="search"
          @input="filterList()"
          data-testid="persona-search"
        />
      </div>
      <div id="persona-list" data-testid="persona-list" style="max-width: 600px; width: 100%; margin: 0 auto">
        <template x-if="loading">
          <div class="empty-state" style="padding: var(--space-12)">
            <div class="icon">⏳</div>
            <div class="title">{{{t("personas.loading")}}}</div>
          </div>
        </template>
        <template x-if="!loading && filtered.length === 0 && personas.length === 0">
          <div class="empty-state" style="padding: var(--space-12)">
            <div class="icon">🎭</div>
            <div class="title">{{{t("personas.noPersonasYet")}}}</div>
            <div class="description">
              {{{t("personas.emptyHint")}}}
            </div>
          </div>
        </template>
        <template x-if="!loading && filtered.length === 0 && personas.length > 0">
          <div class="empty-state" style="padding: var(--space-12)">
            <div class="icon">🔍</div>
            <div class="title">{{{t("personas.noResults")}}}</div>
          </div>
        </template>
        <template x-for="p in filtered" :key="p.id">
          <div
            class="list-card"
            style="display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-default); cursor: pointer"
            @click="editPersona(p)"
            data-testid="persona-item"
          >
            <div style="font-size: var(--fs-2xl); flex-shrink: 0">🎭</div>
            <div style="flex: 1; min-width: 0">
              <div style="font-weight: 600" x-text="p.name"></div>
              <div
                style="font-size: var(--fs-base-sm); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
                x-text="p.description || t('personas.noDescription')"
              >
              </div>
            </div>
            <div style="display: flex; gap: var(--space-2); flex-shrink: 0">
              <template x-if="p.is_default">
                <span style="font-size: var(--fs-sm); color: var(--accent-green); padding: 0 var(--space-2)"
                >{{{t("personas.default")}}}</span>
              </template>
              <button
                class="btn-icon"
                x-bind:title="t('common.delete')"
                @click.stop="deletePersona(p.id)"
                data-testid="delete-persona"
              >
                🗑
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <!-- Persona Create/Edit Modal -->
  <div
    x-show="$store.ui.showPersonaForm"
    x-cloak
    class="modal-overlay"
    @click.self="$store.ui.showPersonaForm = false"
    data-testid="persona-form-modal"
  >
    <div class="modal" style="max-width: 480px">
      <div class="modal-header">
        <span
          class="title"
          x-text="$store.ui.activePersona ? t('personas.editPersona') : t('personas.newPersonaTitle')"
        ></span>
        <button class="btn-icon" @click="$store.ui.showPersonaForm = false">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="persona-name">{{{t("personas.name")}}}</label>
          <input
            class="form-input"
            type="text"
            id="persona-name"
            x-model="formName"
            :placeholder="t('personas.namePlaceholder')"
            data-testid="persona-name"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="persona-title">{{{t("personas.titleField")}}}</label>
          <input
            class="form-input"
            type="text"
            id="persona-title"
            x-model="formTitle"
            :placeholder="t('personas.titlePlaceholder')"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="persona-description">{{{t("personas.description")}}}</label>
          <textarea
            class="form-input form-textarea"
            id="persona-description"
            x-model="formDescription"
            rows="4"
            :placeholder="t('personas.descriptionPlaceholder')"
          ></textarea>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: var(--space-2)">
            <input type="checkbox" x-model="formIsDefault" @change="onDefaultChange()" />
            {{{t("personas.setDefault")}}}
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" @click="$store.ui.showPersonaForm = false">{{{t("common.cancel")}}}</button>
        <button
          class="btn btn-primary"
          @click="savePersona()"
          :disabled="!formName.trim() || saving"
          x-text="saving ? t('personas.saving') : $store.ui.activePersona ? t('personas.update') : t('personas.create')"
          data-testid="persona-save-btn"
        >
        </button>
      </div>
    </div>
  </div>
</div>
