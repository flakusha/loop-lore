<!-- World Edit Page -->
<header id="header-slot" class="main-header" data-testid="world-edit-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("worlds.editTitle")}}}</span>
  <div class="actions">
    <a href="/worlds/{{worldId}}" class="btn btn-ghost" data-testid="back-to-world">{{{t("common.back")}}}</a>
  </div>
</header>

<div class="app-layout" x-data="worldEditState()">
  <main class="main-content">
    <div class="chat-area">
      <div id="world-edit-form" data-world-id="{{worldId}}">
        <div x-show="loading" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">{{{t("worlds.loading")}}}</div>
        </div>

        <div x-show="!loading && error" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⚠️</div>
          <div class="title">{{{t("worlds.loadFailed")}}}</div>
        </div>

        <template x-if="!loading && !error && world">
          <div style="max-width: 720px; margin: 0 auto; width: 100%">
            <!-- Tab Bar -->
            <div class="world-edit-tabs">
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'general' }"
                @click="activeTab = 'general'"
              >
                {{{t("worlds.tabGeneral")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'locations' }"
                @click="activeTab = 'locations'; loadLocations()"
              >
                {{{t("worlds.tabLocations")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'explore' }"
                @click="activeTab = 'explore'"
              >
                Explore
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'items' }"
                @click="activeTab = 'items'; loadItems()"
              >
                Items
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'invites' }"
                @click="activeTab = 'invites'; loadInvites()"
              >
                {{{t("worlds.tabInvites")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'npcs' }"
                @click="activeTab = 'npcs'"
              >
                NPCs
              </button>
            </div>

            <!-- General Tab -->
            <div x-show="activeTab === 'general'">
              <form @submit.prevent="saveWorld()" data-testid="edit-world-form">
                <div class="form-group">
                  <label class="form-label" for="edit-name">{{{t("worlds.name")}}}</label>
                  <input class="form-input" type="text" id="edit-name" x-model="world.name" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-description">{{{t("worlds.description")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="edit-description"
                    x-model="world.description"
                    rows="3"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-lore">{{{t("worlds.lore")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="edit-lore"
                    x-model="world.lore"
                    rows="6"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="world-tags">{{{t("worlds.tags")}}}</label>
                  <input
                    type="text"
                    class="form-input"
                    id="world-tags"
                    x-model="tagsStr"
                    :placeholder="t('worlds.tagsPlaceholder')"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-kind">{{{t("worlds.kind")}}}</label>
                  <select class="form-input" id="edit-kind" x-model="world.kind">
                    <option value="rpg">RPG</option>
                    <option value="chat">Chat channels</option>
                  </select>
                  <p class="form-hint">{{{t("worlds.kindHint")}}}</p>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-visibility">{{{t("worlds.visibility")}}}</label>
                  <select class="form-input" id="edit-visibility" x-model="world.visibility">
                    <option value="private">Private</option>
                    <option value="unlisted">Unlisted</option>
                    <option value="public">Public</option>
                  </select>
                  <p class="form-hint">{{{t("worlds.visibilityHint")}}}</p>
                </div>
                <div style="display: flex; gap: var(--space-3); justify-content: space-between; margin-top: var(--space-6)">
                  <button
                    type="button"
                    class="btn btn-danger"
                    style="color: var(--accent-red)"
                    @click.prevent="deleteWorld()"
                    data-testid="delete-world-btn"
                  >
                    {{{t("worlds.delete")}}}
                  </button>
                  <div style="display: flex; gap: var(--space-3)">
                    <a href="/worlds/{{worldId}}" class="btn btn-secondary" data-testid="cancel-edit-world"
                    >{{{t("common.cancel")}}}</a>
                    <button type="submit" class="btn btn-primary" data-testid="save-world-btn">
                      {{{t("worlds.saveWorld")}}}
                    </button>
                  </div>
                </div>
              </form>
            </div>

            <!-- Locations Tab (Alpine-rendered from loadLocations()) -->
            <div x-show="activeTab === 'locations'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                <h3 style="margin: 0">{{{t("worlds.tabLocations")}}}</h3>
                <button
                  class="btn btn-primary"
                  @click="showAddForm = !showAddForm"
                  x-text="showAddForm ? t('common.cancel') : t('worlds.addLocation')"
                >
                </button>
              </div>

              <div class="add-location-form" x-show="showAddForm" x-cloak>
                <div class="form-group">
                  <label class="form-label" for="loc-name">{{{t("worlds.locationNameRequired")}}}</label>
                  <input
                    class="form-input"
                    type="text"
                    id="loc-name"
                    x-model="newLocName"
                    :placeholder="t('worlds.locationNamePlaceholder')"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="loc-desc">{{{t("worlds.description")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="loc-desc"
                    x-model="newLocDesc"
                    rows="2"
                    :placeholder="t('worlds.locationDescriptionPlaceholder')"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="loc-parent">{{{t("worlds.parentLocation")}}}</label>
                  <select class="form-input" id="loc-parent" x-model="newLocParentId">
                    <option value="">{{{t("worlds.none")}}}</option>
                    <template x-for="loc in locations" :key="loc.id">
                      <option :value="loc.id" x-text="loc.name"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group" x-show="locations.length > 0">
                  <span class="form-label">{{{t("worlds.connections")}}}</span>
                  <template x-for="loc in locations" :key="loc.id">
                    <label
                      style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1)"
                    >
                      <input type="checkbox" :value="loc.id" x-model="newLocConnections" />
                      <span x-text="loc.name"></span>
                    </label>
                  </template>
                </div>
                <button class="btn btn-primary" @click="addLocation()" :disabled="!newLocName.trim()">
                  {{{t("common.add")}}}
                </button>
              </div>

              <div x-show="loadingLocations" class="empty-state" style="padding: var(--space-8)">
                <div class="icon">⏳</div>
                <div class="title">{{{t("worlds.loadingLocations")}}}</div>
              </div>

              <div x-show="!loadingLocations && locations.length > 0">
                <template x-for="loc in locations" :key="loc.id">
                  <div
                    class="location-item"
                    style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer"
                    @click="expandLoc(loc.id)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center">
                      <div class="location-info">
                        <div class="location-name" x-text="loc.name"></div>
                        <div
                          class="location-desc"
                          x-show="loc.description && expandedLoc !== loc.id"
                          x-text="loc.description"
                        >
                        </div>
                      </div>
                      <div class="location-actions" @click.stop>
                        <button
                          class="btn btn-danger"
                          style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-3)"
                          @click="deleteLocation(loc.id)"
                        >
                          {{{t("common.delete")}}}
                        </button>
                      </div>
                    </div>
                    <div
                      x-show="expandedLoc === loc.id"
                      @click.stop
                      style="margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-default)"
                    >
                      <div style="display: grid; gap: var(--space-2)">
                        <input
                          class="form-input"
                          style="font-size: var(--fs-base-sm)"
                          x-model="editLocName"
                        />
                        <textarea
                          class="form-input form-textarea"
                          rows="2"
                          style="font-size: var(--fs-base-sm)"
                          x-model="editLocDesc"
                          :placeholder="t('worlds.description')"
                        ></textarea>
                        <button
                          class="btn btn-primary btn-xs"
                          @click="saveLocation(loc.id)"
                          style="justify-self: flex-start"
                        >
                          {{{t("common.save")}}}
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <div
                x-show="!loadingLocations && locationsLoaded && locations.length === 0"
                class="empty-state"
                style="padding: var(--space-12)"
              >
                <div class="icon">🗺️</div>
                <div class="title">{{{t("worlds.noLocationsYet")}}}</div>
                <div class="description">{{{t("worlds.addLocationsHint")}}}</div>
              </div>
            </div>

            <!-- Items Tab (item creation + item settings) -->
            <div x-show="activeTab === 'items'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                <h3 style="margin: 0">Items</h3>
                <button
                  class="btn btn-primary"
                  @click="showAddForm = !showAddForm"
                  x-text="showAddForm ? t('common.cancel') : 'Add Item'"
                >
                </button>
              </div>

              <div class="add-location-form" x-show="showAddForm" x-cloak>
                <div class="form-group">
                  <label class="form-label" for="item-name">Name</label>
                  <input
                    class="form-input"
                    type="text"
                    id="item-name"
                    x-model="newItemName"
                    placeholder="e.g., Iron Sword"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="item-desc">Description</label>
                  <textarea
                    class="form-input form-textarea"
                    id="item-desc"
                    x-model="newItemDesc"
                    rows="2"
                    placeholder="Short description"
                  ></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3)">
                  <div class="form-group">
                    <label class="form-label" for="item-category">Category</label>
                    <select class="form-input" id="item-category" x-model="newItemCategory">
                      <option value="weapon">Weapon</option>
                      <option value="armor">Armor</option>
                      <option value="consumable">Consumable</option>
                      <option value="key_item">Key Item</option>
                      <option value="quest_item">Quest Item</option>
                      <option value="material">Material</option>
                      <option value="tool">Tool</option>
                      <option value="container">Container</option>
                      <option value="treasure">Treasure</option>
                      <option value="book">Book</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="item-rarity">Rarity</label>
                    <select class="form-input" id="item-rarity" x-model="newItemRarity">
                      <option value="common">Common</option>
                      <option value="uncommon">Uncommon</option>
                      <option value="rare">Rare</option>
                      <option value="epic">Epic</option>
                      <option value="legendary">Legendary</option>
                      <option value="unique">Unique</option>
                    </select>
                  </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3)">
                  <div class="form-group">
                    <label class="form-label" for="item-value">Value</label>
                    <input class="form-input" type="number" id="item-value" x-model.number="newItemValue" min="0" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="item-weight">Weight</label>
                    <input class="form-input" type="number" id="item-weight" x-model.number="newItemWeight" min="0" />
                  </div>
                </div>
                <button class="btn btn-primary" @click="addItem()" :disabled="!newItemName.trim()">
                  {{{t("common.add")}}}
                </button>
              </div>

              <div x-show="loadingItems" class="empty-state" style="padding: var(--space-8)">
                <div class="icon">⏳</div>
                <div class="title">Loading items...</div>
              </div>

              <div x-show="!loadingItems && items.length > 0">
                <template x-for="item in items" :key="item.id">
                  <div
                    class="location-item"
                    style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer"
                    @click="expandItem(item.id); loadInstances(item.id)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center">
                      <div class="location-info">
                        <div class="location-name" x-text="item.name"></div>
                        <div class="location-desc" x-text="(item.category + ' · ' + item.rarity)"></div>
                      </div>
                      <div class="location-actions" @click.stop>
                        <button
                          class="btn btn-danger"
                          style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-3)"
                          @click="deleteItem(item.id)"
                        >
                          {{{t("common.delete")}}}
                        </button>
                      </div>
                    </div>
                    <div
                      x-show="expandedItem === item.id"
                      @click.stop
                      style="margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-default)"
                    >
                      <div style="display: grid; gap: var(--space-2)">
                        <input class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemName" />
                        <textarea
                          class="form-input form-textarea"
                          rows="2"
                          style="font-size: var(--fs-base-sm)"
                          x-model="editItemDesc"
                          placeholder="Description"
                        ></textarea>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
                          <select class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemCategory">
                            <option value="weapon">Weapon</option>
                            <option value="armor">Armor</option>
                            <option value="consumable">Consumable</option>
                            <option value="key_item">Key Item</option>
                            <option value="quest_item">Quest Item</option>
                            <option value="material">Material</option>
                            <option value="tool">Tool</option>
                            <option value="container">Container</option>
                            <option value="treasure">Treasure</option>
                            <option value="book">Book</option>
                            <option value="other">Other</option>
                          </select>
                          <select class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemRarity">
                            <option value="common">Common</option>
                            <option value="uncommon">Uncommon</option>
                            <option value="rare">Rare</option>
                            <option value="epic">Epic</option>
                            <option value="legendary">Legendary</option>
                            <option value="unique">Unique</option>
                          </select>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
                          <input
                            class="form-input"
                            type="number"
                            style="font-size: var(--fs-base-sm)"
                            x-model.number="editItemValue"
                            min="0"
                            placeholder="Value"
                          />
                          <input
                            class="form-input"
                            type="number"
                            style="font-size: var(--fs-base-sm)"
                            x-model.number="editItemWeight"
                            min="0"
                            placeholder="Weight"
                          />
                        </div>
                        <button
                          class="btn btn-primary btn-xs"
                          @click="saveItem(item.id)"
                          style="justify-self: flex-start"
                        >
                          {{{t("common.save")}}}
                        </button>
                      </div>

                      <!-- Placed instances -->
                      <div style="margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border-default)">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2)">
                          <strong style="font-size: var(--fs-base-sm)">Instances</strong>
                        </div>

                        <div
                          x-show="locations.length > 0"
                          style="display: flex; gap: var(--space-2); margin-bottom: var(--space-3)"
                        >
                          <select
                            class="form-input"
                            style="font-size: var(--fs-base-sm); flex: 1"
                            x-model="placeLocationId"
                            :disabled="locations.length === 0"
                          >
                            <option value="">Place at location…</option>
                            <template x-for="lc in locations" :key="lc.id">
                              <option :value="lc.id" x-text="lc.name"></option>
                            </template>
                          </select>
                          <input
                            class="form-input"
                            type="number"
                            min="1"
                            style="font-size: var(--fs-base-sm); width: 80px"
                            x-model.number="placeQuantity"
                            placeholder="Qty"
                          />
                          <button
                            class="btn btn-secondary btn-xs"
                            @click="placeInstance(item.id)"
                            :disabled="!placeLocationId || !Number(placeQuantity)"
                          >
                            Place
                          </button>
                        </div>
                        <div x-show="locations.length === 0" class="form-label" style="margin-bottom: var(--space-2)">
                          No locations in this world yet — add one in the Locations tab to place items.
                        </div>

                        <div x-show="loadingInstances" class="form-label">Loading instances…</div>

                        <div x-show="!loadingInstances && instances.length > 0">
                          <template x-for="inst in instances" :key="inst.id">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-default)">
                              <span
                                style="font-size: var(--fs-base-sm)"
                                x-text="(locName(inst.location_id) + ' · ×' + inst.quantity)"
                              ></span>
                              <button
                                class="btn btn-danger btn-xs"
                                style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-2)"
                                @click="destroyInstance(inst.id)"
                              >
                                Destroy
                              </button>
                            </div>
                          </template>
                        </div>
                        <div
                          x-show="!loadingInstances && instancesLoaded && instances.length === 0"
                          class="form-label"
                        >
                          No placed instances yet.
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <div
                x-show="!loadingItems && itemsLoaded && items.length === 0"
                class="empty-state"
                style="padding: var(--space-12)"
              >
                <div class="icon">📦</div>
                <div class="title">No items yet</div>
                <div class="description">Create an item definition for this world.</div>
              </div>
            </div>

            <!-- Explore Tab (location explorer + details) -->
            <div
              x-show="activeTab === 'explore'"
              x-data="locationExplorerState('{{worldId}}')"
              data-testid="location-explorer"
            >
              <!-- Filter bar (collapses to a single row on narrow viewports) -->
              <div
                class="loc-explorer-filters"
                style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-3)"
              >
                <input
                  class="form-input"
                  type="text"
                  placeholder="Search by name or description…"
                  x-model="search"
                  data-testid="loc-explorer-search"
                  style="flex: 1 1 200px; min-width: 0"
                />
                <select
                  class="form-input"
                  x-model="filterStatus"
                  data-testid="loc-explorer-status"
                  style="flex: 0 1 140px"
                >
                  <option value="">Status: any</option>
                  <template x-for="s in statusOptions()" :key="s">
                    <option :value="s" x-text="s"></option>
                  </template>
                </select>
                <select class="form-input" x-model="filterHasState" style="flex: 0 1 130px">
                  <option value="">State: any</option>
                  <option value="yes">Has state</option>
                  <option value="no">No state</option>
                </select>
                <select
                  class="form-input"
                  x-model="filterAtmosphere"
                  style="flex: 0 1 140px"
                  :disabled="atmosphereOptions.length === 0"
                >
                  <option value="">Atmosphere: any</option>
                  <template x-for="a in atmosphereOptions" :key="a">
                    <option :value="a" x-text="a"></option>
                  </template>
                </select>
                <select
                  class="form-input"
                  x-model="filterWeather"
                  style="flex: 0 1 130px"
                  :disabled="weatherOptions.length === 0"
                >
                  <option value="">Weather: any</option>
                  <template x-for="w in weatherOptions" :key="w">
                    <option :value="w" x-text="w"></option>
                  </template>
                </select>
                <select
                  class="form-input"
                  x-model="filterTimeOfDay"
                  style="flex: 0 1 130px"
                  :disabled="timeOfDayOptions.length === 0"
                >
                  <option value="">Time: any</option>
                  <template x-for="t in timeOfDayOptions" :key="t">
                    <option :value="t" x-text="t"></option>
                  </template>
                </select>
                <label
                  style="display: flex; gap: var(--space-1); align-items: center; font-size: 12px; color: var(--text-secondary)"
                >
                  <input type="checkbox" x-model="filterTopLevelOnly" />
                  Top-level only
                </label>
                <button
                  class="btn btn-ghost"
                  x-show="hasActiveFilters()"
                  @click="clearFilters()"
                  data-testid="loc-explorer-clear"
                  style="font-size: 12px"
                >
                  Clear filters
                </button>
              </div>

              <div class="loc-explorer-layout" style="display: flex; gap: var(--space-4)">
                <!-- Tree / browse column -->
                <div class="loc-explorer-tree" style="flex: 1 1 40%; min-width: 0">
                  <div x-show="loading" class="empty-state" style="padding: var(--space-6)">
                    <div class="icon">⏳</div>
                    <div class="title">Loading…</div>
                  </div>
                  <div x-show="!loading && error" class="empty-state" style="padding: var(--space-6)">
                    <div class="title">Failed to load locations.</div>
                  </div>
                  <div style="display: grid; gap: var(--space-1)">
                    <template x-for="loc in filteredLocations" :key="loc.id">
                      <div
                        class="panel-item"
                        style="cursor: pointer; display: flex; gap: var(--space-2); align-items: center"
                        @click="selectLoc(loc.id)"
                        @mouseenter="hoverLoc(loc.id)"
                        @mouseleave="leaveLoc()"
                        :class="{ 'active-section': selectedLocId === loc.id }"
                        :data-loc-id="loc.id"
                      >
                        <span x-show="hasChildren(loc.id)" style="cursor: pointer">
                          <span @click.stop="toggleExpand(loc.id)" x-text="isExpanded(loc.id) ? '▾' : '▸'"></span>
                        </span>
                        <span x-show="!hasChildren(loc.id)">&nbsp;</span>
                        <span style="font-weight: 600" x-text="loc.name"></span>
                        <span
                          style="font-size: 11px; color: var(--text-secondary)"
                          x-text="connectionNames(loc)"
                        ></span>
                      </div>
                    </template>
                    <div
                      x-show="!loading && loaded && filteredLocations.length === 0"
                      style="font-size: 12px; color: var(--text-secondary)"
                    >
                      No matching locations.
                    </div>
                  </div>
                </div>

                <!-- Detail pane -->
                <div
                  class="loc-explorer-detail"
                  style="flex: 1 1 60%; min-width: 0; border-left: 1px solid var(--border-default); padding-left: var(--space-4)"
                >
                  <div x-show="!detail" class="empty-state" style="padding: var(--space-8)">
                    <div class="title">Select a location</div>
                  </div>
                  <template x-if="detail">
                    <div>
                      <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-2)">
                        <h3 style="margin: 0" x-text="detail.name"></h3>
                        <button
                          class="btn btn-primary"
                          @click="navigateTo(detail.id)"
                          data-testid="loc-explorer-navigate"
                          style="font-size: 12px"
                        >
                          Open
                        </button>
                      </div>
                      <p x-show="detail.description" x-text="detail.description" style="color: var(--text-secondary)">
                      </p>
                      <p x-show="!detail.description" style="color: var(--text-secondary)">(no description)</p>
                      <div style="display: grid; gap: var(--space-1); margin-top: var(--space-3); font-size: 14px">
                        <template x-if="detail.parent">
                          <div><strong>Parent:</strong> <span x-text="detail.parent.name"></span></div>
                        </template>
                        <template x-if="detail.connections && detail.connections.length > 0">
                          <div>
                            <strong>Connections:</strong>
                            <span x-text="detail.connections.map(c => c.name).join(', ')"></span>
                          </div>
                        </template>
                        <template x-if="detail.state">
                          <div style="margin-top: var(--space-2); border-top: 1px solid var(--border-default); padding-top: var(--space-2)">
                            <div class="nav-section-title">State</div>
                            <div x-show="detail.state.atmosphere">
                              <strong>Atmosphere:</strong> <span x-text="detail.state.atmosphere"></span>
                            </div>
                            <div x-show="detail.state.description_override">
                              <strong>Override:</strong> <span x-text="detail.state.description_override"></span>
                            </div>
                            <div x-show="detail.state.weather">
                              <strong>Weather:</strong> <span x-text="detail.state.weather"></span>
                            </div>
                            <div x-show="detail.state.time_of_day">
                              <strong>Time:</strong> <span x-text="detail.state.time_of_day"></span>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Invites Tab (world invite codes: create/copy/revoke) -->
            <div x-show="activeTab === 'invites'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                <h3 style="margin: 0">{{{t("worlds.tabInvites")}}}</h3>
                <button
                  class="btn btn-primary"
                  x-show="!showInviteForm"
                  @click="showInviteForm = true"
                  data-testid="show-create-invite-btn"
                >
                  + {{{t("worlds.createInvite")}}}
                </button>
              </div>

              <!-- Create form -->
              <div
                x-show="showInviteForm"
                style="margin-bottom: var(--space-4); padding: var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-md)"
              >
                <div class="form-group">
                  <label class="form-label" for="invite-max-uses">{{{t("worlds.inviteMaxUses")}}}</label>
                  <input
                    type="number"
                    id="invite-max-uses"
                    class="form-input"
                    x-model="newInviteMaxUses"
                    min="1"
                    :placeholder="t('worlds.inviteMaxUsesPlaceholder')"
                  />
                  <p class="form-hint">{{{t("worlds.inviteMaxUsesHint")}}}</p>
                </div>
                <div style="display: flex; gap: var(--space-3)">
                  <button class="btn btn-primary" @click="createInvite()" data-testid="submit-create-invite">
                    {{{t("worlds.createInvite")}}}
                  </button>
                  <button class="btn btn-secondary" @click="showInviteForm = false">{{{t("common.cancel")}}}</button>
                </div>
              </div>

              <!-- Invite list -->
              <div x-show="loadingInvites" class="empty-state" style="padding: var(--space-8)">
                <div class="icon">⏳</div>
                <div class="title">{{{t("worlds.loading")}}}</div>
              </div>
              <div
                x-show="!loadingInvites && invitesLoaded && invites.length === 0"
                class="empty-state"
                style="padding: var(--space-8)"
              >
                <div class="icon">🔗</div>
                <div class="title">{{{t("worlds.noInvitesYet")}}}</div>
                <div class="description">{{{t("worlds.invitesHint")}}}</div>
              </div>
              <div style="display: grid; gap: var(--space-2)" x-show="invites.length > 0">
                <template x-for="invite in invites" :key="invite.id">
                  <div
                    class="panel-item"
                    style="display: grid; grid-template-columns: 1fr auto auto; gap: var(--space-3); align-items: center"
                  >
                    <div style="min-width: 0">
                      <code style="font-size: 14px; font-weight: 600" x-text="invite.code"></code>
                      <div style="font-size: 12px; color: var(--text-secondary); margin-top: var(--space-1)">
                        <span
                          x-text="t('worlds.inviteUses') + ': ' + invite.uses + (invite.maxUses ? ' / ' + invite.maxUses : '')"
                        ></span>
                        <span> · </span>
                        <span
                          x-text="t('worlds.inviteExpires') + ': ' + (invite.expiresAt ? new Date(invite.expiresAt).toLocaleString() : t('worlds.inviteNever'))"
                        ></span>
                        <span> · </span>
                        <span
                          :class="{ 'invite-revoked': invite.revoked }"
                          x-text="invite.revoked ? t('worlds.inviteRevoked') : t('worlds.inviteActive')"
                        ></span>
                      </div>
                    </div>
                    <button
                      class="btn btn-ghost"
                      x-show="!invite.revoked"
                      @click="copyInviteCode(invite.code)"
                      data-testid="copy-invite-code"
                    >
                      {{ t("worlds.inviteCopy") }}
                    </button>
                    <button
                      class="btn btn-ghost"
                      x-show="!invite.revoked"
                      @click="revokeInvite(invite.id)"
                      data-testid="revoke-invite"
                      style="color: var(--accent-red)"
                    >
                      {{ t("worlds.inviteRevoke") }}
                    </button>
                  </div>
                </template>
              </div>
            </div>

            <!-- NPCs Tab -->
            <div x-show="activeTab === 'npcs'" x-data="npcManagementState()">
              <!-- Sub-tab bar -->
              <div class="world-edit-tabs" style="margin-bottom: var(--space-4)">
                <button
                  class="world-edit-tab"
                  :class="{ active: npcActivePanel === 'viewer' }"
                  @click="npcActivePanel = 'viewer'"
                >
                  NPCs
                </button>
                <button
                  class="world-edit-tab"
                  :class="{ active: npcActivePanel === 'relationships' }"
                  @click="npcActivePanel = 'relationships'"
                >
                  Relationships
                </button>
                <button
                  class="world-edit-tab"
                  :class="{ active: npcActivePanel === 'factions' }"
                  @click="npcActivePanel = 'factions'"
                >
                  Factions
                </button>
                <button
                  class="world-edit-tab"
                  :class="{ active: npcActivePanel === 'karma' }"
                  @click="npcActivePanel = 'karma'"
                >
                  Karma
                </button>
              </div>

              <!-- NPC Viewer Panel -->
              <div x-show="npcActivePanel === 'viewer'">
                <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-4)">
                  <input
                    class="form-input"
                    type="text"
                    x-model="npcSearch"
                    placeholder="Search NPCs..."
                    style="flex: 1"
                  />
                  <select class="form-input" x-model="npcFilter" style="width: auto">
                    <option value="all">All</option>
                    <option value="hostile">Hostile</option>
                    <option value="unfriendly">Unfriendly</option>
                    <option value="neutral">Neutral</option>
                    <option value="friendly">Friendly</option>
                    <option value="honored">Honored</option>
                    <option value="revered">Revered</option>
                    <option value="exalted">Exalted</option>
                  </select>
                </div>

                <div x-show="loadingNpcs" class="empty-state" style="padding: var(--space-8)">
                  <div class="icon">⏳</div>
                  <div class="title">Loading NPCs...</div>
                </div>

                <div x-show="!loadingNpcs" style="display: grid; grid-template-columns: 240px 1fr; gap: var(--space-4)">
                  <!-- NPC List -->
                  <div style="border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden">
                    <template x-for="npc in filteredNpcs" :key="npc.id">
                      <div
                        style="padding: var(--space-3); cursor: pointer; border-bottom: 1px solid var(--border-default)"
                        :style="{ background: selectedNpcId === npc.id ? 'var(--bg-elevated)' : '' }"
                        @click="selectNpc(npc.id)"
                      >
                        <div style="display: flex; justify-content: space-between; align-items: center">
                          <span style="font-weight: 600" x-text="npc.name"></span>
                          <span
                            style="font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--radius-sm)"
                            :style="{ color: getDispositionColor(npc.disposition), border: '1px solid ' + getDispositionColor(npc.disposition) }"
                            x-text="getDispositionLabel(npc.disposition)"
                          ></span>
                        </div>
                        <div style="font-size: var(--fs-sm); color: var(--text-secondary)" x-text="npc.role"></div>
                      </div>
                    </template>
                    <div
                      x-show="filteredNpcs.length === 0"
                      style="padding: var(--space-4); text-align: center; color: var(--text-muted)"
                    >
                      No NPCs found
                    </div>
                  </div>

                  <!-- NPC Details -->
                  <div
                    x-show="selectedNpc"
                    style="border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-4)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                      <h3 style="margin: 0" x-text="selectedNpc?.name"></h3>
                      <span
                        style="font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--radius-sm)"
                        :style="{ color: getDispositionColor(selectedNpc?.disposition ?? ''), border: '1px solid ' + getDispositionColor(selectedNpc?.disposition ?? '') }"
                        x-text="getDispositionLabel(selectedNpc?.disposition ?? '') + ' (' + (selectedNpc?.dispositionScore ?? 0) + ')'"
                      ></span>
                    </div>

                    <div style="display: grid; gap: var(--space-3)">
                      <div>
                        <span style="font-weight: 600">Role:</span>
                        <span x-text="selectedNpc?.role"></span>
                      </div>
                      <div>
                        <span style="font-weight: 600">Location:</span>
                        <span x-text="selectedNpc?.location"></span>
                      </div>
                      <div x-show="selectedNpc?.description">
                        <span style="font-weight: 600">Description:</span>
                        <span x-text="selectedNpc?.description"></span>
                      </div>

                      <!-- Stats -->
                      <div x-show="selectedNpc?.stats && selectedNpc.stats.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Stats</div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--space-2)">
                          <template x-for="stat in selectedNpc?.stats ?? []" :key="stat.name">
                            <div style="padding: var(--space-2); background: var(--bg-elevated); border-radius: var(--radius-sm); text-align: center">
                              <div style="font-size: var(--fs-sm); color: var(--text-secondary)" x-text="stat.name">
                              </div>
                              <div style="font-size: var(--fs-lg); font-weight: 700" x-text="stat.value"></div>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Inventory -->
                      <div x-show="selectedNpc?.inventory && selectedNpc.inventory.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Inventory</div>
                        <div style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
                          <template x-for="item in selectedNpc?.inventory ?? []" :key="item.id">
                            <span
                              style="padding: var(--space-1) var(--space-2); background: var(--bg-elevated); border-radius: var(--radius-sm); font-size: var(--fs-sm)"
                            >
                              <span x-text="item.name"></span>
                              <span
                                x-show="item.quantity > 1"
                                style="color: var(--text-secondary)"
                                x-text="' ×' + item.quantity"
                              ></span>
                            </span>
                          </template>
                        </div>
                      </div>

                      <!-- Schedule -->
                      <div x-show="selectedNpc?.schedule && selectedNpc.schedule.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Schedule</div>
                        <div style="display: grid; gap: var(--space-1)">
                          <template
                            x-for="entry in selectedNpc?.schedule ?? []"
                            :key="entry.startTime + entry.activity"
                          >
                            <div style="display: flex; gap: var(--space-3); font-size: var(--fs-sm)">
                              <span
                                style="color: var(--text-secondary); min-width: 100px"
                                x-text="entry.startTime + '–' + entry.endTime"
                              ></span>
                              <span x-text="entry.activity"></span>
                              <span style="color: var(--text-muted)" x-text="'(' + entry.location + ')'"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div
                    x-show="!selectedNpc && !loadingNpcs"
                    style="grid-column: 2; text-align: center; padding: var(--space-8); color: var(--text-muted)"
                  >
                    Select an NPC to view details
                  </div>
                </div>
              </div>

              <!-- Relationship Map Panel -->
              <div x-show="npcActivePanel === 'relationships'">
                <div x-show="loadingRelationships" class="empty-state" style="padding: var(--space-8)">
                  <div class="icon">⏳</div>
                  <div class="title">Loading relationships...</div>
                </div>

                <div x-show="!loadingRelationships">
                  <h4 style="margin: 0 0 var(--space-3)">Player Relationships</h4>
                  <div style="display: grid; gap: var(--space-3); margin-bottom: var(--space-6)">
                    <template x-for="rel in playerRelationships()" :key="rel.id">
                      <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md)">
                        <div style="flex: 1">
                          <span style="font-weight: 600">Player</span>
                          <span style="color: var(--text-secondary)"> → </span>
                          <span style="font-weight: 600" x-text="rel.toName"></span>
                        </div>
                        <span
                          style="padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--fs-sm)"
                          :style="{ color: getRelationshipColor(rel.type), border: '1px solid ' + getRelationshipColor(rel.type) }"
                          x-text="rel.type"
                        ></span>
                        <span
                          style="font-size: var(--fs-sm); color: var(--text-secondary)"
                          x-text="getStrengthLabel(rel.strength) + ' (' + rel.strength + ')'"
                        ></span>
                      </div>
                    </template>
                  </div>

                  <h4 style="margin: 0 0 var(--space-3)">NPC-to-NPC Relationships</h4>
                  <div style="display: grid; gap: var(--space-3)">
                    <template x-for="rel in npcRelationships()" :key="rel.id">
                      <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md)">
                        <div style="flex: 1">
                          <span style="font-weight: 600" x-text="rel.fromName"></span>
                          <span style="color: var(--text-secondary)"> → </span>
                          <span style="font-weight: 600" x-text="rel.toName"></span>
                        </div>
                        <span
                          style="padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--fs-sm)"
                          :style="{ color: getRelationshipColor(rel.type), border: '1px solid ' + getRelationshipColor(rel.type) }"
                          x-text="rel.type"
                        ></span>
                        <span
                          style="font-size: var(--fs-sm); color: var(--text-secondary)"
                          x-text="getStrengthLabel(rel.strength) + ' (' + rel.strength + ')'"
                        ></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Faction Relations Panel -->
              <div x-show="npcActivePanel === 'factions'">
                <div x-show="loadingFactions" class="empty-state" style="padding: var(--space-8)">
                  <div class="icon">⏳</div>
                  <div class="title">Loading factions...</div>
                </div>

                <div
                  x-show="!loadingFactions"
                  style="display: grid; grid-template-columns: 240px 1fr; gap: var(--space-4)"
                >
                  <!-- Faction List -->
                  <div style="border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden">
                    <template x-for="faction in factions" :key="faction.id">
                      <div
                        style="padding: var(--space-3); cursor: pointer; border-bottom: 1px solid var(--border-default)"
                        :style="{ background: selectedFactionId === faction.id ? 'var(--bg-elevated)' : '' }"
                        @click="selectFaction(faction.id)"
                      >
                        <div style="display: flex; justify-content: space-between; align-items: center">
                          <span>
                            <span x-text="faction.icon"></span>
                            <span style="font-weight: 600" x-text="faction.name"></span>
                          </span>
                          <span
                            style="font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--radius-sm)"
                            :style="{ color: getFactionStandingColor(faction.standing), border: '1px solid ' + getFactionStandingColor(faction.standing) }"
                            x-text="getFactionTier(faction.standing) + ' (' + (faction.standing > 0 ? '+' : '') + faction.standing + ')'"
                          ></span>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- Faction Details -->
                  <div
                    x-show="selectedFaction"
                    style="border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-4)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                      <h3 style="margin: 0">
                        <span x-text="selectedFaction?.icon"></span>
                        <span x-text="selectedFaction?.name"></span>
                      </h3>
                      <span
                        style="font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--radius-sm)"
                        :style="{ color: getFactionStandingColor(selectedFaction?.standing ?? 0), border: '1px solid ' + getFactionStandingColor(selectedFaction?.standing ?? 0) }"
                        x-text="getFactionTier(selectedFaction?.standing ?? 0) + ' (' + ((selectedFaction?.standing ?? 0) > 0 ? '+' : '') + (selectedFaction?.standing ?? 0) + ')'"
                      ></span>
                    </div>

                    <div style="display: grid; gap: var(--space-3)">
                      <div x-show="selectedFaction?.description">
                        <span style="font-weight: 600">Description:</span>
                        <span x-text="selectedFaction?.description"></span>
                      </div>

                      <!-- Benefits -->
                      <div x-show="selectedFaction?.benefits && selectedFaction.benefits.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Benefits</div>
                        <div style="margin: 0; padding-left: var(--space-5)">
                          <template x-for="benefit in selectedFaction?.benefits ?? []" :key="benefit">
                            <div x-text="benefit"></div>
                          </template>
                        </div>
                      </div>

                      <!-- Quests -->
                      <div x-show="selectedFaction?.quests && selectedFaction.quests.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Quests</div>
                        <div style="display: grid; gap: var(--space-2)">
                          <template x-for="quest in selectedFaction?.quests ?? []" :key="quest.id">
                            <div style="display: flex; align-items: center; gap: var(--space-2)">
                              <span x-text="quest.completed ? '✅' : '⬜'"></span>
                              <span
                                :style="{ 'text-decoration': quest.completed ? 'line-through' : 'none', color: quest.completed ? 'var(--text-muted)' : 'inherit' }"
                                x-text="quest.name"
                              ></span>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Members -->
                      <div x-show="selectedFaction?.members && selectedFaction.members.length > 0">
                        <div style="font-weight: 600; margin-bottom: var(--space-2)">Members</div>
                        <div style="display: grid; gap: var(--space-2)">
                          <template x-for="member in selectedFaction?.members ?? []" :key="member.id">
                            <div style="display: flex; gap: var(--space-2)">
                              <span style="font-weight: 600" x-text="member.name"></span>
                              <span style="color: var(--text-secondary)" x-text="'(' + member.role + ')'"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div
                    x-show="!selectedFaction && !loadingFactions"
                    style="grid-column: 2; text-align: center; padding: var(--space-8); color: var(--text-muted)"
                  >
                    Select a faction to view details
                  </div>
                </div>
              </div>

              <!-- Karma Panel -->
              <div x-show="npcActivePanel === 'karma'">
                <div x-show="loadingKarma" class="empty-state" style="padding: var(--space-8)">
                  <div class="icon">⏳</div>
                  <div class="title">Loading karma...</div>
                </div>

                <div x-show="!loadingKarma && karma" style="max-width: 600px">
                  <!-- Overall Karma -->
                  <div style="margin-bottom: var(--space-6)">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2)">
                      <h4 style="margin: 0">Overall Karma</h4>
                      <span
                        :style="{ color: getKarmaColor(karma?.overall ?? 0) }"
                        x-text="getKarmaLabel(karma?.overall ?? 0) + ' (' + ((karma?.overall ?? 0) > 0 ? '+' : '') + (karma?.overall ?? 0) + ')'"
                      ></span>
                    </div>
                    <div style="height: 24px; background: var(--bg-elevated); border-radius: var(--radius-md); overflow: hidden">
                      <div
                        style="height: 100%; border-radius: var(--radius-md); transition: width 0.3s"
                        :style="{ width: karmaPercent(karma?.overall ?? 0) + '%', background: getKarmaColor(karma?.overall ?? 0) }"
                      >
                      </div>
                    </div>
                  </div>

                  <!-- Categories -->
                  <div style="margin-bottom: var(--space-6)">
                    <h4 style="margin: 0 0 var(--space-3)">Categories</h4>
                    <div style="display: grid; gap: var(--space-3)">
                      <template x-for="cat in karma?.categories ?? []" :key="cat.name">
                        <div>
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1)">
                            <span style="text-transform: capitalize; font-weight: 600" x-text="cat.name"></span>
                            <span
                              style="font-size: var(--fs-sm)"
                              :style="{ color: getKarmaColor(cat.value) }"
                              x-text="cat.label + ' (' + (cat.value > 0 ? '+' : '') + cat.value + ')'"
                            ></span>
                          </div>
                          <div style="height: 16px; background: var(--bg-elevated); border-radius: var(--radius-sm); overflow: hidden">
                            <div
                              style="height: 100%; border-radius: var(--radius-sm); transition: width 0.3s"
                              :style="{ width: karmaPercent(cat.value) + '%', background: getKarmaColor(cat.value) }"
                            >
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <!-- Titles -->
                  <div x-show="karma?.titles && karma.titles.length > 0">
                    <h4 style="margin: 0 0 var(--space-3)">Titles</h4>
                    <div style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
                      <template x-for="title in karma?.titles ?? []" :key="title">
                        <span
                          style="padding: var(--space-1) var(--space-3); background: var(--bg-elevated); border-radius: var(--radius-sm); font-size: var(--fs-sm); border: 1px solid var(--accent-gold)"
                        >
                          <span x-text="title"></span>
                        </span>
                      </template>
                    </div>
                  </div>

                  <!-- Standing Tiers Legend -->
                  <div style="margin-top: var(--space-6)">
                    <h4 style="margin: 0 0 var(--space-3)">Standing Tiers</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-2)">
                      <template x-for="tier in standingTiers" :key="tier.name">
                        <div style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-sm)">
                          <div
                            style="width: 12px; height: 12px; border-radius: 50%"
                            :style="{ background: tier.color }"
                          >
                          </div>
                          <span x-text="tier.name"></span>
                          <span
                            style="color: var(--text-muted)"
                            x-text="'(' + tier.min + ' to ' + tier.max + ')'"
                          ></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
