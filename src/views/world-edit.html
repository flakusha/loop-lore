<!-- World Edit Page -->
<header id="header-slot" class="main-header" data-testid="world-edit-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("worlds.editTitle")}}}</span>
  <div class="actions">
    <a href="/worlds/{{worldId}}" class="btn btn-ghost" data-testid="back-to-world">{{{t("common.back")}}}</a>
  </div>
</header>

<div class="app-layout" x-data="worldEditState()">
  <main class="main-content">
    <div class="chat-area">
      <div id="world-edit-form" data-world-id="{{worldId}}">
        <div x-show="loading" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">{{{t("worlds.loading")}}}</div>
        </div>

        <div x-show="!loading && error" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⚠️</div>
          <div class="title">{{{t("worlds.loadFailed")}}}</div>
        </div>

        <template x-if="!loading && !error && world">
          <div style="max-width: 720px; margin: 0 auto; width: 100%">
            <!-- Tab Bar -->
            <div class="world-edit-tabs">
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'general' }"
                @click="activeTab = 'general'"
              >
                {{{t("worlds.tabGeneral")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'locations' }"
                @click="activeTab = 'locations'; loadLocations()"
              >
                {{{t("worlds.tabLocations")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'explore' }"
                @click="activeTab = 'explore'"
              >
                Explore
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'items' }"
                @click="activeTab = 'items'; loadItems()"
              >
                Items
              </button>
            </div>

            <!-- General Tab -->
            <div x-show="activeTab === 'general'">
              <form @submit.prevent="saveWorld()" data-testid="edit-world-form">
                <div class="form-group">
                  <label class="form-label" for="edit-name">{{{t("worlds.name")}}}</label>
                  <input class="form-input" type="text" id="edit-name" x-model="world.name" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-description">{{{t("worlds.description")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="edit-description"
                    x-model="world.description"
                    rows="3"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-lore">{{{t("worlds.lore")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="edit-lore"
                    x-model="world.lore"
                    rows="6"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="world-tags">{{{t("worlds.tags")}}}</label>
                  <input
                    type="text"
                    class="form-input"
                    id="world-tags"
                    x-model="tagsStr"
                    :placeholder="t('worlds.tagsPlaceholder')"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-kind">{{{t("worlds.kind")}}}</label>
                  <select class="form-input" id="edit-kind" x-model="world.kind">
                    <option value="rpg">RPG</option>
                    <option value="chat">Chat channels</option>
                  </select>
                  <p class="form-hint">{{{t("worlds.kindHint")}}}</p>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-visibility">{{{t("worlds.visibility")}}}</label>
                  <select class="form-input" id="edit-visibility" x-model="world.visibility">
                    <option value="private">Private</option>
                    <option value="unlisted">Unlisted</option>
                    <option value="public">Public</option>
                  </select>
                  <p class="form-hint">{{{t("worlds.visibilityHint")}}}</p>
                </div>
                <div style="display: flex; gap: var(--space-3); justify-content: space-between; margin-top: var(--space-6)">
                  <button
                    type="button"
                    class="btn btn-danger"
                    style="color: var(--accent-red)"
                    @click.prevent="deleteWorld()"
                    data-testid="delete-world-btn"
                  >
                    {{{t("worlds.delete")}}}
                  </button>
                  <div style="display: flex; gap: var(--space-3)">
                    <a href="/worlds/{{worldId}}" class="btn btn-secondary" data-testid="cancel-edit-world"
                    >{{{t("common.cancel")}}}</a>
                    <button type="submit" class="btn btn-primary" data-testid="save-world-btn">
                      {{{t("worlds.saveWorld")}}}
                    </button>
                  </div>
                </div>
              </form>
            </div>

            <!-- Locations Tab (Alpine-rendered from loadLocations()) -->
            <div x-show="activeTab === 'locations'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                <h3 style="margin: 0">{{{t("worlds.tabLocations")}}}</h3>
                <button
                  class="btn btn-primary"
                  @click="showAddForm = !showAddForm"
                  x-text="showAddForm ? t('common.cancel') : t('worlds.addLocation')"
                >
                </button>
              </div>

              <div class="add-location-form" x-show="showAddForm" x-cloak>
                <div class="form-group">
                  <label class="form-label" for="loc-name">{{{t("worlds.locationNameRequired")}}}</label>
                  <input
                    class="form-input"
                    type="text"
                    id="loc-name"
                    x-model="newLocName"
                    :placeholder="t('worlds.locationNamePlaceholder')"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="loc-desc">{{{t("worlds.description")}}}</label>
                  <textarea
                    class="form-input form-textarea"
                    id="loc-desc"
                    x-model="newLocDesc"
                    rows="2"
                    :placeholder="t('worlds.locationDescriptionPlaceholder')"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="loc-parent">{{{t("worlds.parentLocation")}}}</label>
                  <select class="form-input" id="loc-parent" x-model="newLocParentId">
                    <option value="">{{{t("worlds.none")}}}</option>
                    <template x-for="loc in locations" :key="loc.id">
                      <option :value="loc.id" x-text="loc.name"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group" x-show="locations.length > 0">
                  <span class="form-label">{{{t("worlds.connections")}}}</span>
                  <template x-for="loc in locations" :key="loc.id">
                    <label
                      style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1)"
                    >
                      <input type="checkbox" :value="loc.id" x-model="newLocConnections" />
                      <span x-text="loc.name"></span>
                    </label>
                  </template>
                </div>
                <button class="btn btn-primary" @click="addLocation()" :disabled="!newLocName.trim()">
                  {{{t("common.add")}}}
                </button>
              </div>

              <div x-show="loadingLocations" class="empty-state" style="padding: var(--space-8)">
                <div class="icon">⏳</div>
                <div class="title">{{{t("worlds.loadingLocations")}}}</div>
              </div>

              <div x-show="!loadingLocations && locations.length > 0">
                <template x-for="loc in locations" :key="loc.id">
                  <div
                    class="location-item"
                    style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer"
                    @click="expandLoc(loc.id)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center">
                      <div class="location-info">
                        <div class="location-name" x-text="loc.name"></div>
                        <div
                          class="location-desc"
                          x-show="loc.description && expandedLoc !== loc.id"
                          x-text="loc.description"
                        >
                        </div>
                      </div>
                      <div class="location-actions" @click.stop>
                        <button
                          class="btn btn-danger"
                          style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-3)"
                          @click="deleteLocation(loc.id)"
                        >
                          {{{t("common.delete")}}}
                        </button>
                      </div>
                    </div>
                    <div
                      x-show="expandedLoc === loc.id"
                      @click.stop
                      style="margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-default)"
                    >
                      <div style="display: grid; gap: var(--space-2)">
                        <input
                          class="form-input"
                          style="font-size: var(--fs-base-sm)"
                          x-model="editLocName"
                        />
                        <textarea
                          class="form-input form-textarea"
                          rows="2"
                          style="font-size: var(--fs-base-sm)"
                          x-model="editLocDesc"
                          :placeholder="t('worlds.description')"
                        ></textarea>
                        <button
                          class="btn btn-primary btn-xs"
                          @click="saveLocation(loc.id)"
                          style="justify-self: flex-start"
                        >
                          {{{t("common.save")}}}
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

            <div
              x-show="!loadingLocations && locationsLoaded && locations.length === 0"
              class="empty-state"
              style="padding: var(--space-12)"
            >
              <div class="icon">🗺️</div>
              <div class="title">{{{t("worlds.noLocationsYet")}}}</div>
              <div class="description">{{{t("worlds.addLocationsHint")}}}</div>
            </div>
            </div>

            <!-- Items Tab (item creation + item settings) -->
            <div x-show="activeTab === 'items'">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4)">
                <h3 style="margin: 0">Items</h3>
                <button
                  class="btn btn-primary"
                  @click="showAddForm = !showAddForm"
                  x-text="showAddForm ? t('common.cancel') : 'Add Item'"
                >
                </button>
              </div>

              <div class="add-location-form" x-show="showAddForm" x-cloak>
                <div class="form-group">
                  <label class="form-label" for="item-name">Name</label>
                  <input class="form-input" type="text" id="item-name" x-model="newItemName" placeholder="e.g., Iron Sword" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="item-desc">Description</label>
                  <textarea class="form-input form-textarea" id="item-desc" x-model="newItemDesc" rows="2" placeholder="Short description"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3)">
                  <div class="form-group">
                    <label class="form-label" for="item-category">Category</label>
                    <select class="form-input" id="item-category" x-model="newItemCategory">
                      <option value="weapon">Weapon</option>
                      <option value="armor">Armor</option>
                      <option value="consumable">Consumable</option>
                      <option value="key_item">Key Item</option>
                      <option value="quest_item">Quest Item</option>
                      <option value="material">Material</option>
                      <option value="tool">Tool</option>
                      <option value="container">Container</option>
                      <option value="treasure">Treasure</option>
                      <option value="book">Book</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="item-rarity">Rarity</label>
                    <select class="form-input" id="item-rarity" x-model="newItemRarity">
                      <option value="common">Common</option>
                      <option value="uncommon">Uncommon</option>
                      <option value="rare">Rare</option>
                      <option value="epic">Epic</option>
                      <option value="legendary">Legendary</option>
                      <option value="unique">Unique</option>
                    </select>
                  </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3)">
                  <div class="form-group">
                    <label class="form-label" for="item-value">Value</label>
                    <input class="form-input" type="number" id="item-value" x-model.number="newItemValue" min="0" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="item-weight">Weight</label>
                    <input class="form-input" type="number" id="item-weight" x-model.number="newItemWeight" min="0" />
                  </div>
                </div>
                <button class="btn btn-primary" @click="addItem()" :disabled="!newItemName.trim()">
                  {{{t("common.add")}}}
                </button>
              </div>

              <div x-show="loadingItems" class="empty-state" style="padding: var(--space-8)">
                <div class="icon">⏳</div>
                <div class="title">Loading items...</div>
              </div>

              <div x-show="!loadingItems && items.length > 0">
                <template x-for="item in items" :key="item.id">
                  <div
                    class="location-item"
                    style="padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer"
                    @click="expandItem(item.id); loadInstances(item.id)"
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center">
                      <div class="location-info">
                        <div class="location-name" x-text="item.name"></div>
                        <div class="location-desc" x-text="(item.category + ' · ' + item.rarity)"></div>
                      </div>
                      <div class="location-actions" @click.stop>
                        <button
                          class="btn btn-danger"
                          style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-3)"
                          @click="deleteItem(item.id)"
                        >
                          {{{t("common.delete")}}}
                        </button>
                      </div>
                    </div>
                    <div
                      x-show="expandedItem === item.id"
                      @click.stop
                      style="margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-default)"
                    >
                      <div style="display: grid; gap: var(--space-2)">
                        <input class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemName" />
                        <textarea class="form-input form-textarea" rows="2" style="font-size: var(--fs-base-sm)" x-model="editItemDesc" placeholder="Description"></textarea>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
                          <select class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemCategory">
                            <option value="weapon">Weapon</option>
                            <option value="armor">Armor</option>
                            <option value="consumable">Consumable</option>
                            <option value="key_item">Key Item</option>
                            <option value="quest_item">Quest Item</option>
                            <option value="material">Material</option>
                            <option value="tool">Tool</option>
                            <option value="container">Container</option>
                            <option value="treasure">Treasure</option>
                            <option value="book">Book</option>
                            <option value="other">Other</option>
                          </select>
                          <select class="form-input" style="font-size: var(--fs-base-sm)" x-model="editItemRarity">
                            <option value="common">Common</option>
                            <option value="uncommon">Uncommon</option>
                            <option value="rare">Rare</option>
                            <option value="epic">Epic</option>
                            <option value="legendary">Legendary</option>
                            <option value="unique">Unique</option>
                          </select>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2)">
                          <input class="form-input" type="number" style="font-size: var(--fs-base-sm)" x-model.number="editItemValue" min="0" placeholder="Value" />
                          <input class="form-input" type="number" style="font-size: var(--fs-base-sm)" x-model.number="editItemWeight" min="0" placeholder="Weight" />
                        </div>
                        <button
                          class="btn btn-primary btn-xs"
                          @click="saveItem(item.id)"
                          style="justify-self: flex-start"
                        >
                          {{{t("common.save")}}}
                        </button>
                      </div>

                      <!-- Placed instances -->
                      <div style="margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border-default)">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2)">
                          <strong style="font-size: var(--fs-base-sm)">Instances</strong>
                        </div>

                        <div x-show="locations.length > 0" style="display: flex; gap: var(--space-2); margin-bottom: var(--space-3)">
                          <select
                            class="form-input"
                            style="font-size: var(--fs-base-sm); flex: 1"
                            x-model="placeLocationId"
                            :disabled="locations.length === 0"
                          >
                            <option value="">Place at location…</option>
                            <template x-for="lc in locations" :key="lc.id">
                              <option :value="lc.id" x-text="lc.name"></option>
                            </template>
                          </select>
                          <input
                            class="form-input"
                            type="number"
                            min="1"
                            style="font-size: var(--fs-base-sm); width: 80px"
                            x-model.number="placeQuantity"
                            placeholder="Qty"
                          />
                          <button
                            class="btn btn-secondary btn-xs"
                            @click="placeInstance(item.id)"
                            :disabled="!placeLocationId || !Number(placeQuantity)"
                          >
                            Place
                          </button>
                        </div>
                        <div x-show="locations.length === 0" class="form-label" style="margin-bottom: var(--space-2)">
                          No locations in this world yet — add one in the Locations tab to place items.
                        </div>

                        <div x-show="loadingInstances" class="form-label">Loading instances…</div>

                        <div x-show="!loadingInstances && instances.length > 0">
                          <template x-for="inst in instances" :key="inst.id">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-default)">
                              <span style="font-size: var(--fs-base-sm)" x-text="(locName(inst.location_id) + ' · ×' + inst.quantity)"></span>
                              <button
                                class="btn btn-danger btn-xs"
                                style="font-size: var(--fs-sm); padding: var(--space-1) var(--space-2)"
                                @click="destroyInstance(inst.id)"
                              >
                                Destroy
                              </button>
                            </div>
                          </template>
                        </div>
                        <div
                          x-show="!loadingInstances && instancesLoaded && instances.length === 0"
                          class="form-label"
                        >
                          No placed instances yet.
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <div
                x-show="!loadingItems && itemsLoaded && items.length === 0"
                class="empty-state"
                style="padding: var(--space-12)"
              >
                <div class="icon">📦</div>
                <div class="title">No items yet</div>
                <div class="description">Create an item definition for this world.</div>
              </div>
            </div>

            <!-- Explore Tab (location explorer + details) -->
            <div
              x-show="activeTab === 'explore'"
              x-data="locationExplorerState('{{worldId}}')"
              data-testid="location-explorer"
            >
              <div style="display: flex; gap: var(--space-4)">
                <!-- Tree / browse column -->
                <div style="flex: 1 1 40%; min-width: 0">
                  <input
                    class="form-input"
                    type="text"
                    placeholder="Search locations…"
                    x-model="search"
                    style="margin-bottom: var(--space-3)"
                  />
                  <div x-show="loading" class="empty-state" style="padding: var(--space-6)">
                    <div class="icon">⏳</div>
                    <div class="title">Loading…</div>
                  </div>
                  <div x-show="!loading && error" class="empty-state" style="padding: var(--space-6)">
                    <div class="title">Failed to load locations.</div>
                  </div>
                  <div style="display: grid; gap: var(--space-1)">
                    <template x-for="loc in filteredLocations" :key="loc.id">
                      <div
                        class="panel-item"
                        style="cursor: pointer; display: flex; gap: var(--space-2); align-items: center"
                        @click="selectLoc(loc.id)"
                        :class="{ 'active-section': selectedLocId === loc.id }"
                      >
                        <span x-show="hasChildren(loc.id)" style="cursor: pointer">
                          <span @click.stop="toggleExpand(loc.id)" x-text="isExpanded(loc.id) ? '▾' : '▸'"></span>
                        </span>
                        <span x-show="!hasChildren(loc.id)">&nbsp;</span>
                        <span style="font-weight: 600" x-text="loc.name"></span>
                        <span
                          style="font-size: 11px; color: var(--text-secondary)"
                          x-text="connectionNames(loc)"
                        ></span>
                      </div>
                    </template>
                    <div
                      x-show="!loading && loaded && filteredLocations.length === 0"
                      style="font-size: 12px; color: var(--text-secondary)"
                    >
                      No matching locations.
                    </div>
                  </div>
                </div>

                <!-- Detail pane -->
                <div style="flex: 1 1 60%; min-width: 0; border-left: 1px solid var(--border-default); padding-left: var(--space-4)">
                  <div x-show="!detail" class="empty-state" style="padding: var(--space-8)">
                    <div class="title">Select a location</div>
                  </div>
                  <template x-if="detail">
                    <div>
                      <h3 style="margin: 0 0 var(--space-2)" x-text="detail.name"></h3>
                      <p x-show="detail.description" x-text="detail.description" style="color: var(--text-secondary)">
                      </p>
                      <p x-show="!detail.description" style="color: var(--text-secondary)">(no description)</p>
                      <div style="display: grid; gap: var(--space-1); margin-top: var(--space-3); font-size: 14px">
                        <template x-if="detail.parent">
                          <div><strong>Parent:</strong> <span x-text="detail.parent.name"></span></div>
                        </template>
                        <template x-if="detail.connections && detail.connections.length > 0">
                          <div>
                            <strong>Connections:</strong>
                            <span x-text="detail.connections.map(c => c.name).join(', ')"></span>
                          </div>
                        </template>
                        <template x-if="detail.state">
                          <div style="margin-top: var(--space-2); border-top: 1px solid var(--border-default); padding-top: var(--space-2)">
                            <div class="nav-section-title">State</div>
                            <div x-show="detail.state.atmosphere">
                              <strong>Atmosphere:</strong> <span x-text="detail.state.atmosphere"></span>
                            </div>
                            <div x-show="detail.state.description_override">
                              <strong>Override:</strong> <span x-text="detail.state.description_override"></span>
                            </div>
                            <div x-show="detail.state.weather">
                              <strong>Weather:</strong> <span x-text="detail.state.weather"></span>
                            </div>
                            <div x-show="detail.state.time_of_day">
                              <strong>Time:</strong> <span x-text="detail.state.time_of_day"></span>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
