<!-- World Edit Page -->
<header id="header-slot" class="main-header" data-testid="world-edit-header">
  <button
    class="hamburger"
    x-on:click="window.toggleSidebar()"
    data-testid="hamburger"
    aria-label="{{{t('accessibility.toggleSidebar')}}}"
  >
    ☰
  </button>
  <h1 class="title">{{{t("worlds.editTitle")}}}</h1>
  <div class="actions">
    <a href="/worlds/{{worldId}}" class="btn btn-ghost" data-testid="back-to-world">{{{t("common.back")}}}</a>
  </div>
</header>

<div class="app-layout" x-data="worldEditState()">
  <main class="main-content">
    <div class="chat-area">
      <div id="world-edit-form" data-world-id="{{worldId}}">
        <div x-show="loading" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">{{{t("worlds.loading")}}}</div>
        </div>

        <div x-show="!loading && error" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⚠️</div>
          <div class="title">{{{t("worlds.loadFailed")}}}</div>
        </div>

        <template x-if="!loading && !error && world">
          <div style="max-width: 720px; margin: 0 auto; width: 100%">
            <!-- Tab Bar -->
            <div class="world-edit-tabs">
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'general' }"
                @click="activeTab = 'general'"
              >
                {{{t("worlds.tabGeneral")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'locations' }"
                @click="activeTab = 'locations'; loadLocations()"
              >
                {{{t("worlds.tabLocations")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'explore' }"
                @click="activeTab = 'explore'"
              >
                Explore
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'items' }"
                @click="activeTab = 'items'; loadItems()"
              >
                Items
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'invites' }"
                @click="activeTab = 'invites'; loadInvites()"
              >
                {{{t("worlds.tabInvites")}}}
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'npcs' }"
                @click="activeTab = 'npcs'"
              >
                NPCs
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'fractal' }"
                @click="activeTab = 'fractal'"
              >
                Fractal
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'edges' }"
                @click="activeTab = 'edges'"
                data-testid="tab-edges"
              >
                Edges
              </button>
              <button
                class="world-edit-tab"
                :class="{ active: activeTab === 'autonomy' }"
                @click="activeTab = 'autonomy'"
                data-testid="tab-autonomy"
              >
                Autonomy
              </button>
            </div>

            {{> world-edit/general-panel.html }}

            <!--
              Autonomy tab: the world-layer pacing default plus the
              loop controls. A chat can still override this, and a
              character can override that.
            -->
            <div x-show="activeTab === 'autonomy'" data-testid="autonomy-tab">
              <div x-data="autonomyPanelFactory({ worldId: '{{worldId}}', layer: 'world' })" x-init="init()">
                {{> autonomy-panel.html }}
              </div>
            </div>

            {{> world-edit/locations-panel.html }} {{> world-edit/items-panel.html }} {{> world-edit/explore-panel.html
            }} {{> world-edit/fractal-panel.html }} {{> world-edit/edges-panel.html }} {{> world-edit/invites-panel.html
            }} {{> world-edit/npcs-panel.html }}
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
