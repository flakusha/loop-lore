<!-- New Chat Form -->
<header id="header-slot" class="main-header" data-page="new-chat" data-testid="new-chat-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">New Chat</span>
</header>

<div class="app-layout">
  <main class="main-content">
    <div
      class="chat-area"
      style="overflow-y: auto; justify-content: center; align-items: flex-start; padding-top: var(--space-12)"
    >
      <div style="width: 100%; max-width: 480px; margin: 0 auto; padding: 0 var(--space-4)">
        <div class="empty-state" style="margin-bottom: var(--space-6)">
          <div class="icon">💬</div>
          <div class="title">Start a New Conversation</div>
          <div class="description">Choose a chat type and add participants to begin.</div>
        </div>

        <form id="create-chat-form" data-testid="create-chat-form">
          <div class="form-group">
            <label class="form-label" for="chat-name">Chat Name</label>
            <input
              class="form-input"
              type="text"
              name="name"
              id="chat-name"
              required
              placeholder="e.g., Adventure in the Forgotten Forest"
              data-testid="chat-name-input"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="chat-type">Chat Type</label>
            <select class="form-select" name="type" id="chat-type" data-testid="chat-type-select">
              <option value="direct">1-on-1 Chat</option>
              <option value="group">Group Chat</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="chat-mode">Chat Mode</label>
            <select class="form-select" name="mode" id="chat-mode" data-testid="chat-mode-select">
              <option value="direct">Chat</option>
              <option value="story">Roleplay / Story</option>
            </select>
          </div>
          <div class="form-group" id="participant-group">
            <label class="form-label" for="participant-search">Character / Participant</label>
            <div style="position: relative">
              <input
                type="text"
                class="form-input"
                id="participant-search"
                placeholder="Search characters..."
                autocomplete="off"
                data-testid="participant-search"
              />
              <div
                id="participant-results"
                style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); max-height: 200px; overflow-y: auto; z-index: 10; margin-top: 2px; box-shadow: var(--shadow-md)"
              >
              </div>
            </div>
            <div
              id="selected-participants"
              style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2)"
            >
            </div>
            <!-- Impersonation: play as selected character -->
            <div class="form-group" id="impersonate-group" style="display: none; margin-top: var(--space-3)">
              <label class="form-label" style="display: flex; align-items: center; gap: var(--space-2)">
                <input type="checkbox" id="impersonate-toggle" />
                Impersonate character (play as them)
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="persona-select">Your Persona</label>
            <select class="form-select" id="persona-select" data-testid="persona-select">
              <option value="">Default</option>
            </select>
          </div>
          <div style="display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6)">
            <a class="btn btn-secondary" href="/views/chat" data-testid="cancel-create-chat">Cancel</a>
            <button type="submit" class="btn btn-primary" data-testid="create-chat-btn">Create Chat</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
