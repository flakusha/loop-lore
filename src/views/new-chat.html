<!-- New Chat Form -->
<header id="header-slot" class="main-header" data-page="new-chat" data-testid="new-chat-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("chats.newChatTitle")}}}</span>
</header>

<div class="app-layout">
  <main class="main-content">
    <div
      class="chat-area"
      style="overflow-y: auto; justify-content: center; align-items: flex-start; padding-top: var(--space-12)"
    >
      <div style="width: 100%; max-width: 480px; margin: 0 auto; padding: 0 var(--space-4)">
        <div class="empty-state" style="margin-bottom: var(--space-6)">
          <div class="icon">💬</div>
          <div class="title">{{{t("chats.startNewConversation")}}}</div>
          <div class="description">{{{t("chats.chooseChatType")}}}</div>
        </div>

        <form id="create-chat-form" data-testid="create-chat-form">
          <div class="form-group">
            <label class="form-label" for="chat-name">{{{t("chatSettings.chatName")}}}</label>
            <input
              class="form-input"
              type="text"
              name="name"
              id="chat-name"
              required
              placeholder="e.g., Adventure in the Forgotten Forest"
              data-testid="chat-name-input"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="chat-type">{{{t("chats.chatType")}}}</label>
            <select class="form-select" name="type" id="chat-type" data-testid="chat-type-select">
              <option value="direct">{{{t("chats.direct")}}}</option>
              <option value="group">{{{t("chats.group")}}}</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="chat-mode">{{{t("chats.chatMode")}}}</label>
            <select class="form-select" name="mode" id="chat-mode" data-testid="chat-mode-select">
              <option value="direct">{{{t("chats.direct")}}}</option>
              <option value="story">{{{t("chats.roleplayStory")}}}</option>
            </select>
          </div>
          <div class="form-group" id="participant-group">
            <label class="form-label" for="participant-search">{{{t("chats.characterParticipant")}}}</label>
            <div style="position: relative">
              <input
                type="text"
                class="form-input"
                id="participant-search"
                x-bind:placeholder="t('chats.searchCharacters')"
                autocomplete="off"
                data-testid="participant-search"
              />
              <div
                id="participant-results"
                style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); max-height: 200px; overflow-y: auto; z-index: 10; margin-top: 2px; box-shadow: var(--shadow-md)"
              >
              </div>
            </div>
            <div
              id="selected-participants"
              style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2)"
            >
            </div>
            <!-- Impersonation: play as selected character -->
            <div class="form-group" id="impersonate-group" style="display: none; margin-top: var(--space-3)">
              <label class="form-label" style="display: flex; align-items: center; gap: var(--space-2)">
                <input type="checkbox" id="impersonate-toggle" />
                {{{t("chats.impersonateCharacter")}}}
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="persona-select">{{{t("chats.yourPersona")}}}</label>
            <select class="form-select" id="persona-select" data-testid="persona-select">
              <option value="">{{{t("chats.default")}}}</option>
            </select>
          </div>
          <div class="form-group" id="memory-carry-group" style="display: none">
            <label class="form-label">{{{t("chats.memoryCarry")}}}</label>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-2)">
              {{{t("chats.memoryCarryDescription")}}}
            </p>
            <div style="display: flex; flex-direction: column; gap: var(--space-2)">
              <label style="display: flex; align-items: center; gap: var(--space-2); font-size: 13px; cursor: pointer">
                <input type="radio" name="memory_carry" value="full" checked />
                {{{t("chats.fullCarry")}}}
              </label>
              <label style="display: flex; align-items: center; gap: var(--space-2); font-size: 13px; cursor: pointer">
                <input type="radio" name="memory_carry" value="selective" />
                {{{t("chats.selectiveCarry")}}}
              </label>
              <label style="display: flex; align-items: center; gap: var(--space-2); font-size: 13px; cursor: pointer">
                <input type="radio" name="memory_carry" value="fresh" />
                {{{t("chats.startFresh")}}}
              </label>
            </div>
            <!-- Selective memory list -->
            <div
              id="memory-selective-list"
              style="display: none; margin-top: var(--space-3); max-height: 300px; overflow-y: auto; border: 1px solid var(--border-default, #e9ecef); border-radius: var(--radius-md); padding: var(--space-2)"
            >
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2)">
                <span style="font-size: 12px; color: var(--text-secondary)" id="memory-count-label">0 memories</span>
                <button type="button" class="btn btn-secondary btn-xs" id="memory-select-all-btn">Select All</button>
              </div>
              <div id="memory-checkbox-list"></div>
            </div>
            <!-- Token estimate -->
            <div
              id="memory-token-estimate"
              style="display: none; font-size: 11px; color: var(--text-secondary); margin-top: var(--space-2)"
            >
              Estimated token cost: <span id="memory-token-count">0</span> tokens
            </div>
          </div>
          <div style="display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6)">
            <a class="btn btn-secondary" href="/views/chat" data-testid="cancel-create-chat"
            >{{{t("common.cancel")}}}</a>
            <button type="submit" class="btn btn-primary" data-testid="create-chat-btn">
              {{{t("worlds.createChat")}}}
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
