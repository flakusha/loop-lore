<!-- Settings Page -->
<header id="header-slot" class="main-header" data-page="settings" data-testid="settings-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Settings</span>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-general">
        <div class="icon" style="font-size: 32px; margin-bottom: var(--space-4)">⚙</div>
        <div class="title">General Settings</div>

        <div style="margin-top: var(--space-6); width: 100%; max-width: 400px">
          <div class="form-group">
            <label class="form-label">Display Name</label>
            <input
              type="text"
              class="form-input"
              name="displayName"
              placeholder="Your display name"
              value="User"
              hx-patch="/api/users/me"
              hx-trigger="change"
              hx-target-error="#toast-container"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Birth Date (for age-gated content)</label>
            <input
              type="date"
              class="form-input"
              name="birthDate"
              hx-patch="/api/users/me"
              hx-trigger="change"
              hx-target-error="#toast-container"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Theme</label>
            <select class="form-select" data-testid="theme-select">
              <option value="default">Default (Dark)</option>
              <option value="light">Light</option>
              <option value="bright">Bright</option>
              <option value="colorful">Colorful</option>
              <option value="monochrome">Monochrome</option>
              <option value="no-icons">No Icons</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="github-dark">GitHub Dark</option>
              <option value="material">Material</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Language</label>
            <select class="form-select" data-testid="locale-select">
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>

      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-chat">
        <h3 class="section-title">Chat Settings</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div class="form-group">
            <label class="form-label">Enter to send</label>
            <label class="toggle">
              <input type="checkbox" id="enter-to-send" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label">Auto-scroll to bottom</label>
            <label class="toggle">
              <input type="checkbox" checked id="auto-scroll" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label">Inline image preview</label>
            <label class="toggle">
              <input type="checkbox" checked id="inline-preview" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label">Message detail level</label>
            <select class="form-select" id="detail-level">
              <option value="Immersion">Immersion</option>
              <option value="Basic">Basic</option>
              <option value="Detailed">Detailed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-api">
        <h3 class="section-title">API Settings</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div class="form-group">
            <label class="form-label">Provider</label>
            <select class="form-select" name="provider" data-testid="api-provider">
              <option value="OpenAI">OpenAI</option>
              <option value="Anthropic">Anthropic</option>
              <option value="OpenRouter">OpenRouter</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">API Key</label>
            <div style="display: flex; gap: var(--space-2); align-items: center">
              <input
                type="password"
                class="form-input"
                name="apiKey"
                placeholder="Enter your API key"
                style="flex: 1"
              />
              <button type="button" class="btn btn-secondary" data-action="clear-api-key">Clear</button>
            </div>
          </div>
          <div class="form-group" id="api-endpoint-group" style="display: none">
            <label class="form-label">API Endpoint URL</label>
            <input
              type="text"
              class="form-input"
              name="apiEndpoint"
              placeholder="https://api.openai.com/v1"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Model</label>
            <input type="text" class="form-input" name="model" placeholder="e.g., gpt-4o" />
          </div>
          <div class="form-group">
            <label class="form-label">Max context tokens</label>
            <input type="number" class="form-input" name="maxTokens" step="256" min="1024" max="128000" />
          </div>
          <div class="form-group">
            <label class="form-label">Temperature: <span id="temp-value">1.0</span></label>
            <input
              type="range"
              class="form-range"
              name="temperature"
              min="0"
              max="2"
              step="0.1"
              style="width: 100%"
              data-testid="temp-slider"
            />
          </div>
          <div style="display: flex; gap: var(--space-2); margin-top: var(--space-4)">
            <button
              type="button"
              class="btn btn-secondary"
              hx-post="/api/generation/test-connection"
              hx-target-error="#toast-container"
            >
              Test Connection
            </button>
            <button
              type="button"
              class="btn btn-primary"
              hx-post="/api/users/me/settings"
              hx-target-error="#toast-container"
            >
              Save API Settings
            </button>
          </div>
        </div>
      </div>

      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-data">
        <h3 class="section-title">Data Management</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div style="display: flex; gap: var(--space-2); margin-bottom: var(--space-4)">
            <button type="button" class="btn btn-secondary">Export All Chats</button>
            <button type="button" class="btn btn-secondary">Import Chats</button>
          </div>
          <div class="danger-zone">
            <div class="zone-title">⚠ Danger Zone</div>
            <p style="margin-bottom: var(--space-3); font-size: 13px; color: var(--text-secondary)">
              This action permanently deletes all data. Type <strong>DELETE</strong> to confirm.
            </p>
            <input
              type="text"
              class="form-input"
              id="confirm-delete-input"
              placeholder='Type "DELETE" to confirm'
              style="margin-bottom: var(--space-3); border-color: var(--accent-red)"
            />
            <button type="button" class="btn btn-danger" id="delete-all-btn" disabled>Delete All Data</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
