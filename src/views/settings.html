<!-- Settings Page -->
<div class="app-layout" x-data="settingsPage()" x-init="init()">
  <header id="header-slot" class="main-header" data-page="settings" data-testid="settings-header">
    <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
    <span class="title" x-text="'Settings'"></span>
    <div class="actions">
      <button class="btn btn-primary" @click="saveGeneral()" :disabled="!loadable" data-testid="save-general">
        Save General
      </button>
    </div>
  </header>

  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <!-- General Settings -->
      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-general">
        <div class="icon" style="font-size: 32px; margin-bottom: var(--space-4)">⚙</div>
        <div class="title">General Settings</div>

        <div style="margin-top: var(--space-6); width: 100%; max-width: 400px">
          <div class="form-group">
            <label class="form-label" for="displayName">Display Name</label>
            <input
              type="text"
              class="form-input"
              id="displayName"
              name="displayName"
              x-model="displayName"
              placeholder="Your display name"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="birthDate">Birth Date (for age-gated content)</label>
            <input type="date" class="form-input" id="birthDate" name="birthDate" x-model="birthDate" />
          </div>

          <div class="form-group">
            <label class="form-label" for="theme-select">Theme</label>
            <select
              class="form-select"
              id="theme-select"
              data-testid="theme-select"
              x-model="theme"
              @change="saveGeneral()"
            >
              <option value="default">Default (Dark)</option>
              <option value="light">Light</option>
              <option value="right">Bright</option>
              <option value="colorful">Colorful</option>
              <option value="monochrome">Monochrome</option>
              <option value="no-icons">No Icons</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="github-dark">GitHub Dark</option>
              <option value="material">Material</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="locale-select">Language</label>
            <select
              class="form-select"
              id="locale-select"
              data-testid="locale-select"
              x-model="locale"
              @change="saveGeneral()"
            >
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Chat Settings -->
      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-chat">
        <h3 class="section-title">Chat Settings</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div class="form-group">
            <span class="form-label">Enter to send</span>
            <label class="toggle">
              <input type="checkbox" id="enter-to-send" x-model="enterToSend" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <span class="form-label">Auto-scroll to bottom</span>
            <label class="toggle">
              <input type="checkbox" id="auto-scroll" x-model="autoScroll" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <span class="form-label">Inline image preview</span>
            <label class="toggle">
              <input type="checkbox" id="inline-preview" x-model="inlinePreview" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label" for="detail-level">Message detail level</label>
            <select class="form-select" id="detail-level" x-model="detailLevel" @change="saveChat()">
              <option value="Immersion">Immersion</option>
              <option value="Basic">Basic</option>
              <option value="Detailed">Detailed</option>
            </select>
          </div>
        </div>
      </div>

      <!-- API Settings -->
      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-api">
        <h3 class="section-title">API Settings</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div class="form-group">
            <label class="form-label" for="api-provider">Provider</label>
            <select
              class="form-select"
              id="api-provider"
              name="provider"
              data-testid="api-provider"
              x-model="provider"
              @change="onProviderChange(); saveApi()"
            >
              <option value="OpenAI">OpenAI</option>
              <option value="Anthropic">Anthropic</option>
              <option value="OpenRouter">OpenRouter</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="apiKey">API Key</label>
            <div style="display: flex; gap: var(--space-2); align-items: center">
              <input
                type="password"
                class="form-input"
                id="apiKey"
                name="apiKey"
                x-model="apiKey"
                placeholder="Enter your API key"
                style="flex: 1"
              />
              <button type="button" class="btn btn-secondary" @click="clearApiKey()">Clear</button>
            </div>
          </div>
          <div class="form-group" id="api-endpoint-group" style="display: none">
            <label class="form-label" for="apiEndpoint">API Endpoint URL</label>
            <input
              type="text"
              class="form-input"
              id="apiEndpoint"
              name="apiEndpoint"
              x-model="apiEndpoint"
              placeholder="https://api.openai.com/v1"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="model">Model</label>
            <input
              type="text"
              class="form-input"
              id="model"
              name="model"
              x-model="model"
              placeholder="e.g., gpt-4o"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="maxTokens">Max context tokens</label>
            <input
              type="number"
              class="form-input"
              id="maxTokens"
              name="maxTokens"
              x-model="maxTokens"
              step="256"
              min="1024"
              max="128000"
            />
          </div>
          <div class="form-group">
            <label class="form-label"
              >Temperature: <span id="temp-value" x-text="Number(temperature).toFixed(1)"></span
            ></label>
            <input
              type="range"
              class="form-range"
              name="temperature"
              x-model="temperature"
              min="0"
              max="2"
              step="0.1"
              style="width: 100%"
              data-testid="temp-slider"
              @input="onTempInput()"
            />
          </div>
          <div style="display: flex; gap: var(--space-2); margin-top: var(--space-4)">
            <button type="button" class="btn btn-secondary" :disabled="saving" @click="testConnection()">
              Test Connection
            </button>
            <button
              type="button"
              class="btn btn-primary"
              :disabled="saving"
              @click="saveApi()"
              data-testid="save-api"
            >
              Save API Settings
            </button>
          </div>
        </div>
      </div>

      <!-- Data Management -->
      <div class="empty-state" style="padding: var(--space-6)" data-testid="settings-data">
        <h3 class="section-title">Data Management</h3>
        <div style="margin-top: var(--space-4); width: 100%; max-width: 400px">
          <div style="display: flex; gap: var(--space-2); margin-bottom: var(--space-4)">
            <button type="button" class="btn btn-secondary" @click="exportAllData()" data-testid="export-all">
              Export All Data
            </button>
            <button type="button" class="btn btn-secondary">Import Chats</button>
          </div>
          <div class="danger-zone">
            <div class="zone-title">⚠ Danger Zone</div>
            <p style="margin-bottom: var(--space-3); font-size: 13px; color: var(--text-secondary)">
              This action permanently deletes all data. Type <strong>DELETE</strong> to confirm.
            </p>
            <input
              type="text"
              class="form-input"
              id="confirm-delete-input"
              x-model="confirmDeleteText"
              @input="onConfirmDeleteInput()"
              placeholder='Type "DELETE" to confirm'
              style="margin-bottom: var(--space-3); border-color: var(--accent-red)"
            />
            <button
              type="button"
              class="btn btn-danger"
              id="delete-all-btn"
              :disabled="confirmDeleteText !== 'DELETE'"
              @click="deleteAllData()"
              data-testid="delete-all"
            >
              Delete All Data
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
