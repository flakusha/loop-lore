<!-- Settings Page -->
<div class="app-layout" x-data="settingsPage()" x-init="init()">
  <header id="header-slot" class="main-header" data-page="settings" data-testid="settings-header">
    <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
    <span class="title" x-text="'Settings'"></span>
    <div class="actions">
      <template x-if="activeTab === 'general'">
        <button class="btn btn-primary" @click="saveGeneral()" :disabled="!loaded" data-testid="save-general">
          Save General
        </button>
      </template>
      <template x-if="activeTab === 'api'">
        <button
          type="button"
          class="btn btn-primary"
          :disabled="saving"
          @click="saveApi()"
          data-testid="save-api"
        >
          Save API Settings
        </button>
      </template>
    </div>
  </header>

  <main class="main-content">
    <div class="chat-area" style="max-width: 960px; margin: 0 auto; width: 100%">
      <!-- Tab Bar -->
      <div class="world-edit-tabs">
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'general' }"
          @click="activeTab = 'general'"
        >
          General
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'chat' }" @click="activeTab = 'chat'">
          Chat
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'api' }" @click="activeTab = 'api'">
          API
        </button>
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'notifications' }"
          @click="activeTab = 'notifications'"
        >
          Notifications
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'data' }" @click="activeTab = 'data'">
          Data
        </button>
      </div>

      <!-- General Tab -->
      <div x-show="activeTab === 'general'" class="settings-tab-content" data-testid="settings-general">
        <div class="settings-section">
          <div class="form-group">
            <label class="form-label" for="displayName">Display Name</label>
            <input
              type="text"
              class="form-input"
              id="displayName"
              name="displayName"
              x-model="displayName"
              placeholder="Your display name"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="birthDate">Birth Date (for age-gated content)</label>
            <input type="date" class="form-input" id="birthDate" name="birthDate" x-model="birthDate" />
          </div>

          <div class="form-group">
            <label class="form-label" for="theme-select">Theme</label>
            <select
              class="form-select"
              id="theme-select"
              data-testid="theme-select"
              x-model="theme"
              @change="saveGeneral()"
            >
              <option value="default">Default (Dark)</option>
              <option value="light">Light</option>
              <option value="bright">Bright</option>
              <option value="colorful">Colorful</option>
              <option value="monochrome">Monochrome</option>
              <option value="no-icons">No Icons</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="github-dark">GitHub Dark</option>
              <option value="material">Material</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="locale-select">Language</label>
            <select
              class="form-select"
              id="locale-select"
              data-testid="locale-select"
              x-model="locale"
              @change="saveGeneral()"
            >
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Chat Tab -->
      <div x-show="activeTab === 'chat'" class="settings-tab-content" data-testid="settings-chat">
        <div class="settings-section">
          <div class="form-group">
            <span class="form-label">Enter to send</span>
            <label class="toggle">
              <input type="checkbox" id="enter-to-send" x-model="enterToSend" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <span class="form-label">Auto-scroll to bottom</span>
            <label class="toggle">
              <input type="checkbox" id="auto-scroll" x-model="autoScroll" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <span class="form-label">Inline image preview</span>
            <label class="toggle">
              <input type="checkbox" id="inline-preview" x-model="inlinePreview" @change="saveChat()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label" for="detail-level">Message detail level</label>
            <select class="form-select" id="detail-level" x-model="detailLevel" @change="saveChat()">
              <option value="Immersion">Immersion</option>
              <option value="Basic">Basic</option>
              <option value="Detailed">Detailed</option>
            </select>
          </div>
        </div>
      </div>

      <!-- API Tab -->
      <div x-show="activeTab === 'api'" class="settings-tab-content" data-testid="settings-api">
        <div class="settings-section">
          <div class="form-group">
            <label class="form-label" for="api-provider">Provider</label>
            <select
              class="form-select"
              id="api-provider"
              name="provider"
              data-testid="api-provider"
              x-model="provider"
              @change="onProviderChange(); saveApi()"
            >
              <option value="OpenAI">OpenAI</option>
              <option value="Anthropic">Anthropic</option>
              <option value="OpenRouter">OpenRouter</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="apiKey">API Key</label>
            <div class="form-row">
              <input
                type="password"
                class="form-input"
                id="apiKey"
                name="apiKey"
                x-model="apiKey"
                placeholder="Enter your API key"
              />
              <button type="button" class="btn btn-secondary" @click="clearApiKey()">Clear</button>
            </div>
          </div>
          <div class="form-group" id="api-endpoint-group" style="display: none">
            <label class="form-label" for="apiEndpoint">API Endpoint URL</label>
            <input
              type="text"
              class="form-input"
              id="apiEndpoint"
              name="apiEndpoint"
              x-model="apiEndpoint"
              placeholder="https://api.openai.com/v1"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="model">Model</label>
            <input
              type="text"
              class="form-input"
              id="model"
              name="model"
              x-model="model"
              placeholder="e.g., gpt-4o"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="maxTokens">Max context tokens</label>
            <input
              type="number"
              class="form-input"
              id="maxTokens"
              name="maxTokens"
              x-model="maxTokens"
              step="256"
              min="1024"
              max="128000"
            />
          </div>
          <div class="form-group">
            <label class="form-label"
              >Temperature: <span id="temp-value" x-text="Number(temperature).toFixed(1)"></span
            ></label>
            <input
              type="range"
              class="form-range"
              name="temperature"
              x-model="temperature"
              min="0"
              max="2"
              step="0.1"
              data-testid="temp-slider"
              @input="onTempInput()"
            />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" :disabled="saving" @click="testConnection()">
              Test Connection
            </button>
          </div>
        </div>
      </div>

      <!-- Notifications Tab -->
      <div
        x-show="activeTab === 'notifications'"
        class="settings-tab-content"
        data-testid="settings-notifications"
      >
        <div class="settings-section" x-data="notificationPrefs()" x-init="init()">
          <h3>Notification Preferences</h3>
          <p class="muted">Choose which events notify you.</p>
          <template x-for="t in types" :key="t.key">
            <label class="pref-row">
              <input type="checkbox" :checked="enabled[t.key]" @change="toggleType(t.key)" />
              <span x-text="t.label"></span>
            </label>
          </template>
          <h3>Muted Worlds</h3>
          <p class="muted">World IDs to silence (comma-separated).</p>
          <input
            type="text"
            class="text-input"
            :value="mutedWorlds.join(', ')"
            @change="mutedWorlds = $event.target.value.split(',').map(s => s.trim()).filter(Boolean); save()"
          />
          <p class="muted" x-show="saving">Saving…</p>
        </div>
      </div>

      <!-- Data Tab -->
      <div x-show="activeTab === 'data'" class="settings-tab-content" data-testid="settings-data">
        <div class="settings-section">
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" @click="exportAllData()" data-testid="export-all">
              Export All Data
            </button>
            <button type="button" class="btn btn-secondary">Import Chats</button>
          </div>
          <div class="danger-zone">
            <div class="zone-title">⚠ Danger Zone</div>
            <p class="zone-description">
              This action permanently deletes all data. Type <strong>DELETE</strong> to confirm.
            </p>
            <input
              type="text"
              class="form-input"
              id="confirm-delete-input"
              x-model="confirmDeleteText"
              @input="onConfirmDeleteInput()"
              placeholder='Type "DELETE" to confirm'
            />
            <button
              type="button"
              class="btn btn-danger"
              id="delete-all-btn"
              :disabled="confirmDeleteText !== 'DELETE'"
              @click="deleteAllData()"
              data-testid="delete-all"
            >
              Delete All Data
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
