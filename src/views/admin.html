<!-- Admin Dashboard -->
<header id="header-slot" class="main-header" data-testid="admin-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Admin Dashboard</span>
</header>

<div class="app-layout" x-data="adminPage()" x-init="init()">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area" style="max-width: 960px; margin: 0 auto; width: 100%">
      <!-- Tab Bar -->
      <div class="world-edit-tabs" style="flex-wrap: wrap; gap: 2px">
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'overview' }"
          @click="showTab('overview')"
        >
          Overview
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'users' }" @click="showTab('users')">
          Users
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'worlds' }" @click="showTab('worlds')">
          Worlds
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'chats' }" @click="showTab('chats')">
          Chats
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'audit' }" @click="showTab('audit')">
          Audit
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'models' }" @click="showTab('models')">
          Models
        </button>
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'plugins' }"
          @click="showTab('plugins')"
        >
          Plugins
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'system' }" @click="showTab('system')">
          System
        </button>
      </div>

      <!-- Overview Tab -->
      <div x-show="activeTab === 'overview'">
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-4);
            padding: var(--space-6);
          "
        >
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.users">0</div>
            <div class="admin-stat-label">Users</div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.chats">0</div>
            <div class="admin-stat-label">Chats</div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.messages">0</div>
            <div class="admin-stat-label">Messages</div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.characters">0</div>
            <div class="admin-stat-label">Characters</div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.assets">0</div>
            <div class="admin-stat-label">Assets</div>
          </div>
          <div class="admin-stat-card">
            <div class="admin-stat-value" x-text="stats.worlds">0</div>
            <div class="admin-stat-label">Worlds</div>
          </div>
        </div>
        <div style="padding: 0 var(--space-6) var(--space-6)" x-show="recentEntries.length > 0">
          <h3 style="font-size: 14px; font-weight: 600; margin-bottom: var(--space-3)">Recent Activity</h3>
          <template x-for="e in recentEntries" :key="e.id">
            <div
              style="
                padding: var(--space-2) 0;
                border-bottom: 1px solid var(--color-border, #e9ecef);
                font-size: 13px;
              "
            >
              <span x-text="formatDate(e.created_at)"></span>
              <span style="margin: 0 4px">—</span>
              <span x-text="e.message" style="color: var(--color-text-secondary, #6c757d)"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Users Tab -->
      <div x-show="activeTab === 'users'">
        <div x-show="loadingUsers" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading users...</div>
        </div>
        <template x-if="!loadingUsers">
          <div style="padding: var(--space-6)">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Display Name</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Last Seen</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody aria-busy="true">
                <template x-if="users.length === 0">
                  <tr>
                    <td colspan="7" class="empty-state" style="padding: var(--space-8)">No users found</td>
                  </tr>
                </template>
                <template x-for="u in users" :key="u.id">
                  <tr>
                    <td x-text="u.username"></td>
                    <td x-text="u.display_name || '-'"></td>
                    <td>
                      <template x-if="editRoleUserId === u.id">
                        <select
                          x-model="editRoleValue"
                          class="form-input"
                          style="width: 100px; padding: 2px 6px; font-size: 13px"
                        >
                          <option value="admin">Admin</option>
                          <option value="user">User</option>
                          <option value="viewer">Viewer</option>
                        </select>
                      </template>
                      <template x-if="editRoleUserId !== u.id">
                        <span :class="'role-badge role-' + u.role" x-text="u.role"></span>
                      </template>
                    </td>
                    <td :class="'status-badge status-' + u.status" x-text="u.status"></td>
                    <td x-text="formatDate(u.created_at)"></td>
                    <td x-text="formatDate(u.last_seen_at)"></td>
                    <td>
                      <template x-if="editRoleUserId === u.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-primary btn-xs" @click="saveRole()">Save</button>
                          <button class="btn btn-secondary btn-xs" @click="cancelEditRole()">Cancel</button>
                        </div>
                      </template>
                      <template x-if="editRoleUserId !== u.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-secondary btn-xs" @click="startEditRole(u)">Role</button>
                          <template x-if="confirmDeleteUser !== u.id">
                            <button class="btn btn-danger btn-xs" @click="confirmDeleteUser = u.id">
                              Delete
                            </button>
                          </template>
                          <template x-if="confirmDeleteUser === u.id">
                            <div style="display: flex; gap: 4px">
                              <button class="btn btn-danger btn-xs" @click="deleteUser(u.id)">Confirm</button>
                              <button class="btn btn-secondary btn-xs" @click="confirmDeleteUser = ''">
                                Cancel
                              </button>
                            </div>
                          </template>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div
              x-show="userPages > 1"
              style="display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-4)"
            >
              <button
                class="btn btn-secondary btn-xs"
                :disabled="userPage === 1"
                @click="goUsersPage(userPage - 1)"
              >
                Prev
              </button>
              <span
                style="display: flex; align-items: center; font-size: 13px"
                x-text="'Page ' + userPage + ' of ' + userPages"
              ></span>
              <button
                class="btn btn-secondary btn-xs"
                :disabled="userPage >= userPages"
                @click="goUsersPage(userPage + 1)"
              >
                Next
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Worlds Tab -->
      <div x-show="activeTab === 'worlds'">
        <div x-show="loadingWorlds" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading worlds...</div>
        </div>
        <template x-if="!loadingWorlds">
          <div style="padding: var(--space-6)">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>ID</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody aria-busy="true">
                <template x-if="worlds.length === 0">
                  <tr>
                    <td colspan="4" class="empty-state" style="padding: var(--space-8)">No worlds found</td>
                  </tr>
                </template>
                <template x-for="w in worlds" :key="w.id">
                  <tr>
                    <td x-text="w.name"></td>
                    <td x-text="w.id" style="font-size: 12px; color: var(--color-text-secondary)"></td>
                    <td x-text="formatDate(w.created_at)"></td>
                    <td>
                      <template x-if="confirmDeleteWorld !== w.id">
                        <button class="btn btn-danger btn-xs" @click="confirmDeleteWorld = w.id">
                          Delete
                        </button>
                      </template>
                      <template x-if="confirmDeleteWorld === w.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-danger btn-xs" @click="deleteWorld(w.id)">Confirm</button>
                          <button class="btn btn-secondary btn-xs" @click="confirmDeleteWorld = ''">
                            Cancel
                          </button>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div
              x-show="worldPages > 1"
              style="display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-4)"
            >
              <button
                class="btn btn-secondary btn-xs"
                :disabled="worldPage === 1"
                @click="goWorldsPage(worldPage - 1)"
              >
                Prev
              </button>
              <span
                style="display: flex; align-items: center; font-size: 13px"
                x-text="'Page ' + worldPage + ' of ' + worldPages"
              ></span>
              <button
                class="btn btn-secondary btn-xs"
                :disabled="worldPage >= worldPages"
                @click="goWorldsPage(worldPage + 1)"
              >
                Next
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Chats Tab -->
      <div x-show="activeTab === 'chats'">
        <div x-show="loadingChats" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading chats...</div>
        </div>
        <template x-if="!loadingChats">
          <div style="padding: var(--space-6)">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody aria-busy="true">
                <template x-if="adminChats.length === 0">
                  <tr>
                    <td colspan="4" class="empty-state" style="padding: var(--space-8)">No chats found</td>
                  </tr>
                </template>
                <template x-for="c in adminChats" :key="c.id">
                  <tr>
                    <td x-text="c.name || 'Untitled'"></td>
                    <td x-text="c.type"></td>
                    <td x-text="formatDate(c.created_at)"></td>
                    <td>
                      <template x-if="confirmDeleteChat !== c.id">
                        <button class="btn btn-danger btn-xs" @click="confirmDeleteChat = c.id">
                          Delete
                        </button>
                      </template>
                      <template x-if="confirmDeleteChat === c.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-danger btn-xs" @click="deleteChat(c.id)">
                            Confirm Delete
                          </button>
                          <button class="btn btn-secondary btn-xs" @click="confirmDeleteChat = ''">
                            Cancel
                          </button>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div
              x-show="chatPages > 1"
              style="display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-4)"
            >
              <button
                class="btn btn-secondary btn-xs"
                :disabled="chatPage === 1"
                @click="goChatsPage(chatPage - 1)"
              >
                Prev
              </button>
              <span
                style="display: flex; align-items: center; font-size: 13px"
                x-text="'Page ' + chatPage + ' of ' + chatPages"
              ></span>
              <button
                class="btn btn-secondary btn-xs"
                :disabled="chatPage >= chatPages"
                @click="goChatsPage(chatPage + 1)"
              >
                Next
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Audit Tab -->
      <div x-show="activeTab === 'audit'">
        <div style="padding: var(--space-6)">
          <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap">
            <select class="form-input" style="width: auto" x-model="auditEventType" @change="loadAudit()">
              <option value="">All event types</option>
              <option value="auth">Auth</option>
              <option value="user">User</option>
              <option value="chat">Chat</option>
              <option value="world">World</option>
              <option value="asset">Asset</option>
              <option value="system">System</option>
              <option value="plugin">Plugin</option>
            </select>
            <select class="form-input" style="width: auto" x-model="auditEntityType" @change="loadAudit()">
              <option value="">All entities</option>
              <option value="user">User</option>
              <option value="chat">Chat</option>
              <option value="world">World</option>
              <option value="asset">Asset</option>
            </select>
          </div>
          <div x-show="loadingAudit" class="empty-state" style="padding: var(--space-8)">
            <div class="icon">⏳</div>
          </div>
          <template x-if="!loadingAudit">
            <div>
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Module</th>
                    <th>Event</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody aria-busy="true">
                  <template x-if="auditEntries.length === 0">
                    <tr>
                      <td colspan="4" class="empty-state" style="padding: var(--space-8)">
                        No audit entries
                      </td>
                    </tr>
                  </template>
                  <template x-for="e in auditEntries" :key="e.id">
                    <tr>
                      <td x-text="formatDate(e.created_at)" style="white-space: nowrap; font-size: 12px"></td>
                      <td x-text="e.module || '-'" style="font-size: 12px"></td>
                      <td x-text="e.event_type || '-'" style="font-size: 12px"></td>
                      <td
                        x-text="e.message"
                        style="
                          font-size: 12px;
                          max-width: 300px;
                          overflow: hidden;
                          text-overflow: ellipsis;
                          white-space: nowrap;
                        "
                      ></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div
                x-show="auditPages > 1"
                style="
                  display: flex;
                  justify-content: center;
                  gap: var(--space-2);
                  margin-top: var(--space-4);
                "
              >
                <button
                  class="btn btn-secondary btn-xs"
                  :disabled="auditPage === 1"
                  @click="goAuditPage(auditPage - 1)"
                >
                  Prev
                </button>
                <span
                  style="display: flex; align-items: center; font-size: 13px"
                  x-text="'Page ' + auditPage + ' of ' + auditPages"
                ></span>
                <button
                  class="btn btn-secondary btn-xs"
                  :disabled="auditPage >= auditPages"
                  @click="goAuditPage(auditPage + 1)"
                >
                  Next
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Models Tab -->
      <div x-show="activeTab === 'models'">
        <div x-show="loadingModels" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading providers...</div>
        </div>
        <template x-if="!loadingModels">
          <div style="padding: var(--space-6)">
            <div style="display: flex; justify-content: flex-end; margin-bottom: var(--space-4)">
              <button
                class="btn btn-secondary btn-sm"
                @click="rescanProviders()"
                :disabled="scanning"
                x-text="scanning ? 'Scanning...' : 'Rescan Providers'"
              ></button>
            </div>
            <div style="margin-bottom: var(--space-6)">
              <h3 style="font-size: 16px; font-weight: 600; margin-bottom: var(--space-3)">
                Model Role Assignments
              </h3>
              <div style="display: grid; gap: var(--space-3)">
                <template x-for="role in ['main', 'captioning', 'moderation']" :key="role">
                  <div
                    style="
                      display: grid;
                      grid-template-columns: 120px 1fr 1fr auto;
                      gap: var(--space-3);
                      align-items: center;
                      padding: var(--space-3);
                      background: var(--color-surface, #f8f9fa);
                      border-radius: 6px;
                    "
                  >
                    <div style="font-weight: 500; text-transform: capitalize" x-text="role"></div>
                    <select
                      class="form-input"
                      style="font-size: 13px"
                      @change="onRoleProviderChange(role, $event.target.value)"
                    >
                      <option value="">Select provider...</option>
                      <template x-for="p in providers" :key="p.name">
                        <option
                          :value="p.name"
                          x-text="p.label"
                          :selected="modelRoles[role]?.provider === p.name"
                        ></option>
                      </template>
                    </select>
                    <select
                      class="form-input"
                      style="font-size: 13px"
                      @change="onRoleModelChange(role, $event.target.value)"
                    >
                      <option value="">Select model...</option>
                      <template x-for="m in getModelsForRole(role)" :key="m">
                        <option :value="m" x-text="m" :selected="modelRoles[role]?.model === m"></option>
                      </template>
                    </select>
                    <div style="display: flex; gap: 4px">
                      <button
                        class="btn btn-primary btn-xs"
                        @click="saveModelRole(role)"
                        :disabled="!modelRoles[role]?.provider || !modelRoles[role]?.model"
                      >
                        Save
                      </button>
                      <button
                        class="btn btn-secondary btn-xs"
                        @click="clearModelRole(role)"
                        x-show="overrides[role]"
                      >
                        Clear
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <div>
              <h3 style="font-size: 16px; font-weight: 600; margin-bottom: var(--space-3)">Providers</h3>
              <div style="display: grid; gap: var(--space-3)">
                <template x-for="p in providers" :key="p.name">
                  <div
                    style="
                      padding: var(--space-4);
                      background: var(--color-surface, #f8f9fa);
                      border-radius: 6px;
                      border: 1px solid var(--color-border, #e9ecef);
                    "
                  >
                    <div
                      style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: var(--space-2);
                      "
                    >
                      <div style="display: flex; align-items: center; gap: var(--space-2)">
                        <span
                          style="display: inline-block; width: 8px; height: 8px; border-radius: 50%"
                          :style="{background: p.status === 'healthy' ? '#28a745' : '#dc3545'}"
                        ></span>
                        <strong x-text="p.label"></strong>
                        <span
                          style="font-size: 12px; color: var(--color-text-secondary, #6c757d)"
                          x-text="'(' + p.name + ')'"
                        ></span>
                      </div>
                      <div
                        style="
                          display: flex;
                          align-items: center;
                          gap: var(--space-3);
                          font-size: 12px;
                          color: var(--color-text-secondary, #6c757d);
                        "
                      >
                        <span x-text="p.modelCount + ' model(s)'"></span>
                        <span x-show="p.latencyMs" x-text="p.latencyMs + 'ms'"></span>
                        <button
                          class="btn btn-secondary btn-xs"
                          @click="expandProvider = expandProvider === p.name ? '' : p.name"
                          x-text="expandProvider === p.name ? 'Collapse' : 'Expand'"
                        ></button>
                      </div>
                    </div>
                    <div
                      x-show="p.error"
                      style="font-size: 12px; color: #dc3545; margin-bottom: var(--space-2)"
                      x-text="p.error"
                    ></div>
                    <div x-show="expandProvider === p.name" style="margin-top: var(--space-2)">
                      <div
                        style="
                          font-size: 12px;
                          color: var(--color-text-secondary, #6c757d);
                          margin-bottom: var(--space-1);
                        "
                      >
                        Available Models:
                      </div>
                      <div style="display: flex; flex-wrap: wrap; gap: 4px">
                        <template x-for="m in getProviderModels(p.name)" :key="m">
                          <span
                            style="
                              font-size: 11px;
                              padding: 2px 6px;
                              background: var(--color-background, #fff);
                              border: 1px solid var(--color-border, #e9ecef);
                              border-radius: 4px;
                            "
                            x-text="m"
                          ></span>
                        </template>
                        <span
                          x-show="getProviderModels(p.name).length === 0"
                          style="font-size: 12px; color: var(--color-text-secondary, #6c757d)"
                          >No models discovered</span
                        >
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Plugins Tab -->
      <div x-show="activeTab === 'plugins'">
        <div x-show="loadingPlugins" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading plugins...</div>
        </div>
        <template x-if="!loadingPlugins">
          <div style="padding: var(--space-6)">
            <template x-if="pluginList.length === 0">
              <div class="empty-state" style="padding: var(--space-8)">
                <div class="title">No plugins found</div>
              </div>
            </template>
            <div style="display: grid; gap: var(--space-3)">
              <template x-for="p in pluginList" :key="p.name">
                <div
                  style="
                    padding: var(--space-4);
                    background: var(--color-surface, #f8f9fa);
                    border-radius: 6px;
                    border: 1px solid var(--color-border, #e9ecef);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                  "
                >
                  <div>
                    <strong x-text="p.name"></strong>
                    <span
                      style="font-size: 12px; color: var(--color-text-secondary); margin-left: var(--space-2)"
                      x-text="'v' + p.version"
                    ></span>
                    <span
                      style="font-size: 11px; color: var(--color-text-secondary); margin-left: var(--space-2)"
                      x-text="'(' + p.origin + ')'"
                    ></span>
                    <div
                      style="font-size: 12px; color: var(--color-text-secondary); margin-top: 2px"
                      x-text="p.description"
                    ></div>
                  </div>
                  <div style="display: flex; align-items: center; gap: var(--space-3)">
                    <span
                      :class="p.enabled ? 'status-badge status-active' : 'status-badge status-disabled'"
                      x-text="p.enabled ? 'Enabled' : 'Disabled'"
                    ></span>
                    <template x-if="p.enabled">
                      <button class="btn btn-secondary btn-xs" @click="togglePlugin(p.name, false)">
                        Disable
                      </button>
                    </template>
                    <template x-if="!p.enabled">
                      <button class="btn btn-primary btn-xs" @click="togglePlugin(p.name, true)">
                        Enable
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- System Tab -->
      <div x-show="activeTab === 'system'">
        <div x-show="loadingSystemConfig" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading configuration...</div>
        </div>
        <template x-if="!loadingSystemConfig">
          <div style="padding: var(--space-6)">
            <div style="display: grid; gap: var(--space-4)">
              <template x-for="c in systemConfig" :key="c.key">
                <div
                  style="
                    display: grid;
                    grid-template-columns: 200px 1fr auto;
                    gap: var(--space-3);
                    align-items: center;
                    padding: var(--space-3);
                    border-bottom: 1px solid var(--color-border, #e9ecef);
                  "
                >
                  <div>
                    <span x-text="displayKey(c.key)" style="font-weight: 500; font-size: 13px"></span>
                    <div
                      x-text="c.description"
                      style="font-size: 11px; color: var(--color-text-secondary)"
                      x-show="c.description"
                    ></div>
                  </div>
                  <input
                    class="form-input"
                    style="font-size: 13px"
                    :value="c.value"
                    @input="sysConfigDirty[c.key] = $event.target.value"
                  />
                  <button class="btn btn-primary btn-xs" @click="saveSystemConfig(c.key)">Save</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
