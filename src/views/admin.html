<!-- Admin Dashboard -->
<header id="header-slot" class="main-header" data-testid="admin-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Admin Dashboard</span>
</header>

<div class="app-layout" x-data="adminPage()">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area" style="max-width: 900px; margin: 0 auto; width: 100%">
      <!-- Tab Bar -->
      <div class="world-edit-tabs">
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'users' }"
          @click="activeTab = 'users'"
        >
          Users
        </button>
        <button class="world-edit-tab" :class="{ active: activeTab === 'models' }" @click="loadModelsTab()">
          Models
        </button>
        <button
          class="world-edit-tab"
          :class="{ active: activeTab === 'stats' }"
          @click="activeTab = 'stats'"
        >
          Stats
        </button>
      </div>

      <!-- Health Warning Banner -->
      <div
        x-show="activeTab === 'models' && unhealthyProviders.length > 0"
        class="admin-health-banner"
        style="
          background: var(--color-warning-bg, #fff3cd);
          border: 1px solid var(--color-warning-border, #ffc107);
          border-radius: 6px;
          padding: var(--space-3) var(--space-4);
          margin: var(--space-4) var(--space-6);
          display: flex;
          align-items: center;
          gap: var(--space-2);
        "
      >
        <span style="font-size: 18px">⚠️</span>
        <span>
          <strong x-text="unhealthyProviders.length"></strong> provider(s) unreachable:
          <span x-text="unhealthyProviders.join(', ')"></span>. Check endpoints in config or click Rescan.
        </span>
      </div>

      <!-- Models Tab -->
      <div x-show="activeTab === 'models'">
        <!-- Loading -->
        <div x-show="loadingModels" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading providers...</div>
        </div>

        <template x-if="!loadingModels">
          <div style="padding: var(--space-6)">
            <!-- Rescan Button -->
            <div style="display: flex; justify-content: flex-end; margin-bottom: var(--space-4)">
              <button
                class="btn btn-secondary btn-sm"
                @click="rescanProviders()"
                :disabled="scanning"
                x-text="scanning ? 'Scanning...' : 'Rescan Providers'"
              ></button>
            </div>

            <!-- Model Role Assignments -->
            <div style="margin-bottom: var(--space-6)">
              <h3 style="font-size: 16px; font-weight: 600; margin-bottom: var(--space-3)">
                Model Role Assignments
              </h3>
              <div style="display: grid; gap: var(--space-3)">
                <template x-for="role in ['main', 'captioning', 'moderation']" :key="role">
                  <div
                    style="
                      display: grid;
                      grid-template-columns: 120px 1fr 1fr auto;
                      gap: var(--space-3);
                      align-items: center;
                      padding: var(--space-3);
                      background: var(--color-surface, #f8f9fa);
                      border-radius: 6px;
                    "
                  >
                    <div style="font-weight: 500; text-transform: capitalize" x-text="role"></div>
                    <select
                      class="form-input"
                      style="font-size: 13px"
                      @change="onRoleProviderChange(role, $event.target.value)"
                    >
                      <option value="">Select provider...</option>
                      <template x-for="p in providers" :key="p.name">
                        <option
                          :value="p.name"
                          x-text="p.label"
                          :selected="modelRoles[role]?.provider === p.name"
                        ></option>
                      </template>
                    </select>
                    <select
                      class="form-input"
                      style="font-size: 13px"
                      @change="onRoleModelChange(role, $event.target.value)"
                    >
                      <option value="">Select model...</option>
                      <template x-for="m in getModelsForRole(role)" :key="m">
                        <option :value="m" x-text="m" :selected="modelRoles[role]?.model === m"></option>
                      </template>
                    </select>
                    <div style="display: flex; gap: 4px">
                      <button
                        class="btn btn-primary btn-xs"
                        @click="saveModelRole(role)"
                        :disabled="!modelRoles[role]?.provider || !modelRoles[role]?.model"
                      >
                        Save
                      </button>
                      <button
                        class="btn btn-secondary btn-xs"
                        @click="clearModelRole(role)"
                        x-show="overrides[role]"
                      >
                        Clear
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Provider Cards -->
            <div>
              <h3 style="font-size: 16px; font-weight: 600; margin-bottom: var(--space-3)">Providers</h3>
              <div style="display: grid; gap: var(--space-3)">
                <template x-for="p in providers" :key="p.name">
                  <div
                    style="
                      padding: var(--space-4);
                      background: var(--color-surface, #f8f9fa);
                      border-radius: 6px;
                      border: 1px solid var(--color-border, #e9ecef);
                    "
                  >
                    <div
                      style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: var(--space-2);
                      "
                    >
                      <div style="display: flex; align-items: center; gap: var(--space-2)">
                        <span
                          style="display: inline-block; width: 8px; height: 8px; border-radius: 50%"
                          :style="{ background: p.status === 'healthy' ? '#28a745' : '#dc3545' }"
                        ></span>
                        <strong x-text="p.label"></strong>
                        <span
                          style="font-size: 12px; color: var(--color-text-secondary, #6c757d)"
                          x-text="'(' + p.name + ')'"
                        ></span>
                      </div>
                      <div
                        style="
                          display: flex;
                          align-items: center;
                          gap: var(--space-3);
                          font-size: 12px;
                          color: var(--color-text-secondary, #6c757d);
                        "
                      >
                        <span x-text="p.modelCount + ' model(s)'"></span>
                        <span x-show="p.latencyMs" x-text="p.latencyMs + 'ms'"></span>
                        <button
                          class="btn btn-secondary btn-xs"
                          @click="expandProvider = expandProvider === p.name ? '' : p.name"
                          x-text="expandProvider === p.name ? 'Collapse' : 'Expand'"
                        ></button>
                      </div>
                    </div>
                    <div
                      x-show="p.error"
                      style="font-size: 12px; color: #dc3545; margin-bottom: var(--space-2)"
                      x-text="p.error"
                    ></div>
                    <div x-show="expandProvider === p.name" style="margin-top: var(--space-2)">
                      <div
                        style="
                          font-size: 12px;
                          color: var(--color-text-secondary, #6c757d);
                          margin-bottom: var(--space-1);
                        "
                      >
                        Available Models:
                      </div>
                      <div style="display: flex; flex-wrap: wrap; gap: 4px">
                        <template x-for="m in getProviderModels(p.name)" :key="m">
                          <span
                            style="
                              font-size: 11px;
                              padding: 2px 6px;
                              background: var(--color-background, #fff);
                              border: 1px solid var(--color-border, #e9ecef);
                              border-radius: 4px;
                            "
                            x-text="m"
                          ></span>
                        </template>
                        <span
                          x-show="getProviderModels(p.name).length === 0"
                          style="font-size: 12px; color: var(--color-text-secondary, #6c757d)"
                          >No models discovered</span
                        >
                      </div>
                    </div>
                  </div>
                </template>
                <div x-show="providers.length === 0" class="empty-state" style="padding: var(--space-8)">
                  <div class="title">No providers configured</div>
                  <div
                    style="
                      font-size: 13px;
                      color: var(--color-text-secondary, #6c757d);
                      margin-top: var(--space-2);
                    "
                  >
                    Add providers in your config file or via environment variables.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Stats Tab -->
      <div x-show="activeTab === 'stats'">
        <div x-show="loadingStats" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading stats...</div>
        </div>
        <template x-if="!loadingStats">
          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
              gap: var(--space-4);
              padding: var(--space-6);
            "
          >
            <div class="admin-stat-card">
              <div class="admin-stat-value" x-text="stats.users">0</div>
              <div class="admin-stat-label">Users</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-value" x-text="stats.chats">0</div>
              <div class="admin-stat-label">Chats</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-value" x-text="stats.messages">0</div>
              <div class="admin-stat-label">Messages</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-value" x-text="stats.characters">0</div>
              <div class="admin-stat-label">Characters</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-value" x-text="stats.assets">0</div>
              <div class="admin-stat-label">Assets</div>
            </div>
          </div>
        </template>
      </div>

      <!-- Users Tab -->
      <div x-show="activeTab === 'users'">
        <!-- Loading -->
        <div x-show="loadingUsers" class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading users...</div>
        </div>

        <!-- User table -->
        <template x-if="!loadingUsers">
          <div style="padding: var(--space-6)">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Display Name</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Last Seen</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <template x-if="users.length === 0" aria-busy="true">
                  <tr>
                    <td colspan="7" class="empty-state" style="padding: var(--space-8)">No users found</td>
                  </tr>
                </template>
                <template x-for="u in users" :key="u.id" aria-busy="true">
                  <tr>
                    <td x-text="u.username"></td>
                    <td x-text="u.display_name || '-'"></td>
                    <td>
                      <template x-if="editRoleUserId === u.id">
                        <select
                          x-model="editRoleValue"
                          class="form-input"
                          style="width: 120px; padding: 2px 6px; font-size: 13px"
                        >
                          <option value="admin">Admin</option>
                          <option value="user">User</option>
                          <option value="viewer">Viewer</option>
                        </select>
                      </template>
                      <template x-if="editRoleUserId !== u.id">
                        <span :class="'role-badge role-' + u.role" x-text="u.role"></span>
                      </template>
                    </td>
                    <td :class="'status-badge status-' + u.status" x-text="u.status"></td>
                    <td x-text="formatDate(u.created_at)"></td>
                    <td x-text="formatDate(u.last_seen_at)"></td>
                    <td>
                      <template x-if="editRoleUserId === u.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-primary btn-xs" @click="saveRole()">Save</button>
                          <button class="btn btn-secondary btn-xs" @click="cancelEditRole()">Cancel</button>
                        </div>
                      </template>
                      <template x-if="editRoleUserId !== u.id">
                        <div style="display: flex; gap: 4px">
                          <button class="btn btn-secondary btn-xs" @click="startEditRole(u)">Role</button>
                          <template x-if="confirmDeleteUser !== u.id">
                            <button class="btn btn-danger btn-xs" @click="confirmDeleteUser = u.id">
                              Delete
                            </button>
                          </template>
                          <template x-if="confirmDeleteUser === u.id">
                            <div style="display: flex; gap: 4px">
                              <button class="btn btn-danger btn-xs" @click="deleteUser(u.id)">Confirm</button>
                              <button class="btn btn-secondary btn-xs" @click="confirmDeleteUser = ''">
                                Cancel
                              </button>
                            </div>
                          </template>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>

            <!-- Pagination -->
            <div
              x-show="userPages > 1"
              style="display: flex; justify-content: center; gap: var(--space-2); margin-top: var(--space-4)"
            >
              <button
                class="btn btn-secondary btn-xs"
                :disabled="userPage === 1"
                @click="goUsersPage(userPage - 1)"
              >
                Prev
              </button>
              <span
                style="display: flex; align-items: center; font-size: 13px"
                x-text="'Page ' + userPage + ' of ' + userPages"
              ></span>
              <button
                class="btn btn-secondary btn-xs"
                :disabled="userPage >= userPages"
                @click="goUsersPage(userPage + 1)"
              >
                Next
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
</div>
