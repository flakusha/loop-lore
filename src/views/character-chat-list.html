<!-- Character Chat List Page (skeleton — list loaded via htmx) -->
<header
  id="header-slot"
  class="main-header"
  data-page="character-chat-list"
  data-testid="character-chat-header"
>
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">Chats</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      hx-get="/dynamic/characters/{{characterSlug}}/chat-list"
      hx-target="#character-chat-list"
      hx-swap="innerHTML"
      data-testid="refresh-chats"
    >
      Refresh
    </button>
    <a
      href="/views/new-chat"
      class="btn btn-primary"
      hx-get="/views/new-chat"
      hx-target="#app-root"
      hx-swap="innerHTML"
      data-testid="new-chat-from-character"
    >+ New Chat</a>
  </div>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area">
      <div
        id="character-chat-list"
        class="chat-list"
        data-character-id="{{characterSlug}}"
        data-testid="character-chat-list"
        hx-get="/dynamic/characters/{{characterSlug}}/chat-list"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading chats...</div>
        </div>
      </div>
    </div>
  </main>
</div>
