<!-- Character Chat List Page -->
<header id="header-slot" class="main-header" data-testid="character-chat-header">
  <button class="hamburger" onclick="toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">Chats</span>
  <div class="actions">
    <button class="btn btn-secondary" onclick="loadCharacterChatList()" data-testid="refresh-chats">
      Refresh
    </button>
    <a
      href="/views/new-chat"
      class="btn btn-primary"
      hx-get="/views/new-chat"
      hx-target="#app-root"
      hx-swap="innerHTML"
      data-testid="new-chat-from-character"
      >+ New Chat</a
    >
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <div
        id="character-chat-list"
        class="chat-list"
        data-character-id="{{characterSlug}}"
        data-testid="character-chat-list"
      >
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading chats...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  loadCharacterChatList();
</script>
