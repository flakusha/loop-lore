<!-- Chat View (swapped into #app-root by htmx) -->
<!-- Header: moved to #header-slot by htmx:load handler -->
<header id="header-slot" class="main-header" data-testid="chat-header">
  <button
    class="hamburger"
    @click="$store.sidebar.open = !$store.sidebar.open"
    x-show="!$store.sidebar.open"
    data-testid="hamburger"
  >
    ☰
  </button>
  <span class="title" id="page-title">Welcome to loop-lore</span>
  <div class="actions">
    <button
      class="btn-icon"
      title="View chats"
      @click="$store.ui.showChatList = !$store.ui.showChatList"
      data-testid="toggle-chat-list"
    >
      ☰
    </button>
    <button
      class="btn-icon"
      title="Toggle gallery sidebar"
      @click="$store.ui.showGallery = !$store.ui.showGallery"
      data-testid="toggle-gallery"
    >
      🖼
    </button>
    <button
      class="btn-icon"
      title="Character info"
      @click="$store.ui.showCharacterInfo = true"
      data-testid="toggle-character-info"
    >
      ℹ
    </button>
  </div>
</header>

<div class="app-layout" x-data="chatState()" @htmx:before-swap.window="if($data && typeof $data.destroy==='function') $data.destroy()">
  <main class="main-content" style="padding-top: 0">
    <!-- Chat list panel (component) -->
    <div class="chat-list-panel" x-show="$store.ui.showChatList" x-transition data-testid="chat-list-panel">
      <div class="chat-list-header">
        <span class="nav-section-title">Chats</span>
        <button class="btn-icon" @click="$store.ui.showChatList = false" title="Close">&times;</button>
      </div>
      <div id="chat-list">
        <template x-if="chats.length === 0">
          <div class="nav-item" style="color: var(--text-tertiary); font-size: 13px">No chats yet</div>
        </template>
        <template x-for="chat in chats" :key="chat.id">
          <a
            class="nav-item"
            :class="{ active: activeChat === chat.id }"
            href="#"
            @click.prevent="selectChat(chat.id)"
          >
            <span class="name" x-text="chat.name"></span>
          </a>
        </template>
      </div>
      <div style="padding: var(--space-3)">
        <a
          class="btn btn-secondary"
          style="width: 100%; text-align: center; text-decoration: none"
          href="/views/new-chat"
          hx-get="/views/new-chat"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
        >
          + New Chat
        </a>
      </div>
    </div>

    <!-- Chat container (centered) -->
    <div class="chat-container">
      <!-- Messages -->
      <div class="chat-area" id="message-list" x-ref="messageList" data-testid="message-list">
        <div x-ref="scrollSentinel" id="scroll-sentinel" style="height: 1px"></div>
        <div x-show="loadingOlder" class="loading-older">
          <span class="spinner"></span> Loading older messages...
        </div>
        <template x-if="!activeChat">
          <div class="empty-state">
            <div class="icon">💬</div>
            <div class="title">Select a chat</div>
            <div class="description">Choose a conversation from the sidebar or create a new one.</div>
          </div>
        </template>
        <template x-if="activeChat && messages.length === 0 && !loadingMessages">
          <div class="empty-state">
            <div class="icon">💬</div>
            <div class="title">No messages yet</div>
            <div class="description">Start a conversation below. Messages are persisted automatically.</div>
          </div>
        </template>
        <template x-if="activeChat && loadingMessages">
          <div class="empty-state">
            <div class="icon">⏳</div>
            <div class="title">Loading messages...</div>
          </div>
        </template>
        <template x-if="activeChat && loadingError">
          <div class="error-banner" x-text="loadingError"></div>
        </template>
        <template x-for="msg in groupedMessages" :key="msg.id">
          <div class="message" :class="msg.role" :data-message-id="msg.id">
            <div class="bubble">
              <div class="meta">
                <span class="name" x-text="displayName(msg)" data-testid="message-author"></span>
                <span class="time" x-text="formatTime(msg.created_at)"></span>
              </div>
              <template x-if="msg.thinking">
                <details class="thinking-block">
                  <summary>Thinking process</summary>
                  <div class="thinking-content" x-html="renderMarkdown(msg.thinking)"></div>
                </details>
              </template>
              <template x-if="editingMessageId !== msg.id">
                <div class="content" x-html="renderMarkdown(msg.content)"></div>
              </template>
              <template x-if="editingMessageId === msg.id">
                <div class="edit-area">
                  <textarea
                    class="form-input edit-textarea"
                    x-model="editContent"
                    @keydown.escape="cancelEdit()"
                    @keydown.ctrl.enter="saveEdit(msg.id)"
                  ></textarea>
                  <div class="edit-actions">
                    <button class="btn btn-ghost btn-sm" @click="cancelEdit()">Cancel</button>
                    <button class="btn btn-primary btn-sm" @click="saveEdit(msg.id)">Save</button>
                  </div>
                </div>
              </template>
              <template x-if="msg.attachments && msg.attachments.length > 0">
                <div class="media-attachments" :class="'count-' + msg.attachments.length">
                  <template x-for="(asset, aIdx) in msg.attachments" :key="asset.assetId">
                    <div
                      class="media-item"
                      :class="asset.type === 'image' ? 'media-image' : 'media-file'"
                      :style="getMediaStyle(asset, msg.attachments.length)"
                    >
                      <template x-if="asset.type === 'image'">
                        <img
                          :src="asset.url"
                          :alt="asset.caption || asset.filename"
                          loading="lazy"
                          @click="openMediaPreview(asset)"
                        />
                      </template>
                      <template x-if="asset.type === 'audio'">
                        <audio controls :src="asset.url"></audio>
                      </template>
                      <template x-if="asset.type === 'video'">
                        <video controls :src="asset.url"></video>
                      </template>
                      <template x-if="asset.caption">
                        <div class="media-caption" x-text="asset.caption"></div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <div class="actions">
                <button class="btn-icon action-edit" title="Edit" @click="startEdit(msg.id)">✏️</button>
                <template x-if="msg.role === 'assistant'">
                  <button
                    class="btn-icon action-regenerate"
                    title="Regenerate"
                    @click="regenerateVariant(msg.id)"
                  >
                    ♻
                  </button>
                  <template x-if="msg.totalVariants && msg.totalVariants > 1">
                    <span class="variant-switcher">
                      <button
                        class="btn-icon action-prev-variant"
                        title="Previous variant"
                        @click="switchVariant(msg.id, -1)"
                      >
                        ◀
                      </button>
                      <span
                        class="variant-counter"
                        x-text="(msg.variantIndex ?? 0) + 1 + '/' + msg.totalVariants"
                      ></span>
                      <button
                        class="btn-icon action-next-variant"
                        title="Next variant"
                        @click="switchVariant(msg.id, 1)"
                      >
                        ▶
                      </button>
                    </span>
                  </template>
                  <template x-if="msg.status === 'cancelled' || msg.status === 'partial'">
                    <button
                      class="btn-icon action-continue"
                      title="Continue"
                      @click="continueMessage(msg.id)"
                    >
                      ↳
                    </button>
                  </template>
                </template>
                <button class="btn-icon action-remove" title="Remove" @click="removeMessage(msg.id, $event)">
                  🗑
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Right panel (character info) -->
      <aside
        class="right-panel"
        x-show="$store.ui.showCharacterInfo"
        x-transition
        data-testid="character-info-panel"
      >
        <button class="btn-icon" @click="$store.ui.showCharacterInfo = false" title="Close">&times;</button>
        <div class="panel-content">
          <div class="nav-section-title">Character Info</div>
          <template x-if="currentCharacter">
            <div>
              <h3 class="name" x-text="currentCharacter.display_name || currentCharacter.name"></h3>
              <p class="description" x-text="currentCharacter.description"></p>
            </div>
          </template>
          <template x-if="!currentCharacter">
            <div class="empty-state" style="padding: var(--space-4) 0">
              <div class="icon">👤</div>
              <div class="description">Character info will appear here when a chat is selected.</div>
            </div>
          </template>
        </div>
      </aside>
    </div>

    <!-- Gallery sidebar -->
    <aside class="gallery-sidebar" x-show="$store.ui.showGallery" x-transition data-testid="gallery-sidebar">
      <button class="btn-icon" @click="$store.ui.showGallery = false" title="Close">&times;</button>
      <div class="nav-section-title" style="margin-bottom: var(--space-3)">Chat Assets</div>
      <div id="gallery-items">
        <template x-if="!activeChat">
          <div class="gallery-empty">
            <div class="icon">📁</div>
            <div class="text">Select a chat to see linked assets</div>
          </div>
        </template>
        <template x-if="activeChat && galleryAssets.length === 0">
          <div class="gallery-empty">
            <div class="icon">📁</div>
            <div class="text">No assets linked to this chat</div>
          </div>
        </template>
        <template x-for="asset in galleryAssets" :key="asset.id">
          <div class="gallery-item">
            <div class="name" x-text="asset.name || asset.filename"></div>
          </div>
        </template>
      </div>
    </aside>

    <!-- Media Preview Modal -->
    <div
      x-show="previewMediaAsset"
      x-cloak
      class="modal-overlay"
      @click.self="previewMediaAsset = null"
      data-testid="media-preview-modal"
    >
      <div class="modal" style="max-width: 90vw; max-height: 90vh">
        <div class="modal-header">
          <span class="title" x-text="previewMediaAsset?.caption || previewMediaAsset?.filename"></span>
          <button class="btn-icon" @click="previewMediaAsset = null">&times;</button>
        </div>
        <div class="modal-body" style="padding: 0; text-align: center">
          <template x-if="previewMediaAsset?.type === 'image'">
            <img
              :src="previewMediaAsset.url"
              style="max-width: 100%; max-height: 80vh; display: block; margin: 0 auto"
            />
          </template>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area" x-show="activeChat">
      <div
        x-show="isGenerating"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        class="generation-status"
        data-testid="generation-status"
      >
        <div class="generation-info">
          <span class="typing-indicator">
            <span class="dot" style="animation-delay: 0ms"></span>
            <span class="dot" style="animation-delay: 150ms"></span>
            <span class="dot" style="animation-delay: 300ms"></span>
          </span>
          <span
            class="generation-label"
            x-text="isContinuing ? '↳ Continuing message...' : generationLabel"
          ></span>
          <template x-if="generationDetail">
            <span class="generation-detail">
              <span x-show="generationDetail.elapsedMs"
                >&nbsp;⏱ <span x-text="Math.round(generationDetail.elapsedMs / 1000) + 's'"></span
              ></span>
              <span x-show="generationDetail.charsReceived"
                >&nbsp;📝 <span x-text="generationDetail.charsReceived + ' chars'"></span
              ></span>
              <span x-show="generationDetail.status"
                >&nbsp;· <span x-text="generationDetail.status"></span
              ></span>
            </span>
          </template>
        </div>
        <div class="generation-actions">
          <button
            class="btn btn-ghost btn-cancel"
            @click="cancelGeneration()"
            title="Cancel generation"
            data-testid="cancel-generation"
          >
            ⏹ Cancel
          </button>
        </div>
      </div>

      <form x-ref="messageForm" @submit.prevent="sendMessage()" data-testid="message-form">
        <div class="input-row">
          <label class="btn btn-ghost" style="cursor: pointer; font-size: 12px; padding: var(--space-2)">
            📎
            <input
              type="file"
              accept="image/*,audio/*,video/*"
              multiple
              style="display: none"
              @change="handleAttach($event)"
              data-testid="attach-input"
            />
          </label>
          <textarea
            name="content"
            x-ref="messageInput"
            placeholder="Type a message..."
            rows="1"
            @keydown.enter.shift=""
            @keydown.enter.prevent="sendMessage()"
            @input="autoResize($el)"
            required
            :disabled="!activeChat"
            data-testid="message-input"
          ></textarea>
          <button
            type="submit"
            class="btn btn-primary"
            title="Send"
            :disabled="!activeChat"
            data-testid="send-button"
          >
            ➤
          </button>
        </div>
        <div class="input-toolbar">
          <template x-if="pendingAssets.length > 0">
            <div class="pending-assets">
              <template x-for="(pa, paIdx) in pendingAssets" :key="pa.assetId">
                <span class="tag pending-asset-tag">
                  <span>📎 <span x-text="pa.filename"></span></span>
                  <button
                    class="btn-icon"
                    style="padding: 0; width: 16px; height: 16px; font-size: 12px"
                    @click="removePendingAsset(pa.assetId)"
                  >
                    &times;
                  </button>
                </span>
              </template>
            </div>
          </template>
        </div>
      </form>
    </div>
  </main>
</div>
