<!-- Chat View (swapped into #app-root by htmx) -->
<div class="app-layout" x-data="chatState()">
  <!-- Hamburger button (visible on all viewports) -->
  <button
    class="hamburger"
    @click="showSidebar = true"
    aria-label="Open navigation"
    title="Open navigation"
  >☰</button>

  <!-- Left Sidebar (Hamburger drawer) -->
  <aside class="sidebar" x-show="showSidebar" x-transition>
    <div class="sidebar-header">
      <span class="logo">loop-lore</span>
      <button class="btn-icon" @click="showSidebar = false" title="Close">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Chats</div>

      <!-- Chat list loaded via Alpine -->
      <div id="chat-list">
        <template x-if="chats.length === 0">
          <div class="nav-item" style="color: var(--text-tertiary); font-size: 13px">No chats yet</div>
        </template>
        <template x-for="chat in chats" :key="chat.id">
          <a
            class="nav-item"
            :class="{ active: activeChat === chat.id }"
            href="#"
            @click.prevent="selectChat(chat.id)"
          >
            <span class="name" x-text="chat.name"></span>
          </a>
        </template>
      </div>

      <div style="padding: var(--space-3)">
        <a
          class="btn btn-secondary"
          style="width: 100%; text-align: center; text-decoration: none"
          href="/views/new-chat"
          hx-get="/views/new-chat"
          hx-target="#app-root"
          hx-swap="innerHTML"
        >
          + New Chat
        </a>
      </div>

      <div class="nav-section-title">Characters</div>
      <a
        class="nav-item"
        href="/views/characters"
        hx-get="/views/characters"
        hx-target="#app-root"
        hx-swap="innerHTML"
      >
        <span>Browse Characters</span>
      </a>

      <div class="nav-section-title">Assets</div>
      <a
        class="nav-item"
        href="/views/gallery"
        hx-get="/views/gallery"
        hx-target="#app-root"
        hx-swap="innerHTML"
      >
        <span>Asset Gallery</span>
      </a>

      <div class="nav-section-title">Worlds</div>
      <a
        class="nav-item"
        href="/views/worlds"
        hx-get="/views/worlds"
        hx-target="#app-root"
        hx-swap="innerHTML"
      >
        <span>🌍 Worlds</span>
      </a>
    </nav>

    <!-- Sidebar footer: user info -->
    <div class="sidebar-footer">
      <div class="user-info">
        <img
          class="avatar"
          src="/img/default-avatar.png"
          alt="User avatar"
          onerror="this.style.display = 'none'"
          style="background: var(--bg-tertiary)"
        />
        <div class="details">
          <div class="name" id="user-display-name" x-text="userDisplayName">User</div>
          <div class="role" id="user-role" x-text="userRole">solo</div>
        </div>
        <button
          class="btn-icon"
          hx-get="/views/settings"
          hx-target="#app-root"
          hx-swap="innerHTML"
          title="Settings"
        >
          ⚙
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile backdrop (click to close sidebar) -->
  <div x-show="showSidebar" class="backdrop" x-transition @click="showSidebar = false"></div>

  <!-- Main chat area -->
  <main class="main-content">
    <!-- Header -->
    <header class="main-header">
      <button class="btn-icon" title="Open navigation" @click="showSidebar = true">☰</button>
      <span class="title" id="chat-title" x-text="activeChatName">Welcome to loop-lore</span>
      <div class="actions">
        <button class="btn-icon" title="Toggle gallery sidebar" @click="showGallery = !showGallery">🖼</button>
        <button class="btn-icon" title="Character info" @click="showCharacterInfo = true">ℹ</button>
      </div>
    </header>

    <!-- Chat container (centered) -->
    <div class="chat-container">
      <!-- Messages -->
      <div
        class="chat-area"
        id="message-list"
        x-ref="messageList"
      >
        <template x-if="!activeChat">
          <div class="empty-state">
            <div class="icon">💬</div>
            <div class="title">Select a chat</div>
            <div class="description">Choose a conversation from the sidebar or create a new one.</div>
          </div>
        </template>
        <template x-if="activeChat && messages.length === 0 && !loadingMessages">
          <div class="empty-state">
            <div class="icon">💬</div>
            <div class="title">No messages yet</div>
            <div class="description">Start a conversation below. Messages are persisted automatically.</div>
          </div>
        </template>
        <template x-if="activeChat && loadingMessages">
          <div class="empty-state">
            <div class="icon">⏳</div>
            <div class="title">Loading messages...</div>
          </div>
        </template>
        <template x-if="activeChat && loadingError">
          <div class="error-banner" x-text="loadingError"></div>
        </template>
        <template x-for="msg in groupedMessages" :key="msg.id">
          <div class="message" :class="msg.role" :data-message-id="msg.id">
            <div class="bubble">
              <div class="meta">
                <span class="name" x-text="displayName(msg)"></span>
                <span class="time" x-text="formatTime(msg.created_at)"></span>
              </div>
              <template x-if="msg.thinking">
                <details class="thinking-block">
                  <summary>Thinking process</summary>
                  <div class="thinking-content" x-html="renderMarkdown(msg.thinking)"></div>
                </details>
              </template>
              <div class="content" x-html="renderMarkdown(msg.content)"></div>
              <div class="actions">
                <button class="btn-icon action-copy" title="Copy" @click="copyMessage(msg.id, $event)">📋</button>
                <template x-if="msg.role === 'assistant'">
                  <button class="btn-icon action-retry" title="Retry" @click="regenerateResponse(msg)">🔄</button>
                  <template x-if="msg.status === 'cancelled' || msg.status === 'partial'">
                    <button class="btn-icon action-continue" title="Continue" @click="continueMessage(msg.id)">↳</button>
                  </template>
                </template>
                <button class="btn-icon action-remove" title="Remove" @click="removeMessage(msg.id, $event)">🗑</button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Right panel (character info, world context) -->
      <aside
        class="right-panel"
        x-show="showCharacterInfo"
        x-transition
      >
        <button class="btn-icon" @click="showCharacterInfo = false" title="Close">&times;</button>
        <div class="panel-content">
          <div class="nav-section-title">Character Info</div>
          <template x-if="currentCharacter">
            <div>
              <h3 class="name" x-text="currentCharacter.display_name || currentCharacter.name"></h3>
              <p class="description" x-text="currentCharacter.description"></p>
            </div>
          </template>
          <template x-if="!currentCharacter">
            <div class="empty-state" style="padding: var(--space-4) 0">
              <div class="icon">👤</div>
              <div class="description">Character info will appear here when a chat is selected.</div>
            </div>
          </template>
        </div>
      </aside>
    </div>

    <!-- Gallery sidebar (toggleable, overlays on desktop) -->
    <aside
      class="gallery-sidebar"
      x-show="showGallery"
      x-transition
    >
      <button class="btn-icon" @click="showGallery = false" title="Close">&times;</button>
      <div class="nav-section-title" style="margin-bottom: var(--space-3)">Chat Assets</div>
      <div id="gallery-items">
        <template x-if="!activeChat">
          <div class="gallery-empty">
            <div class="icon">📁</div>
            <div class="text">Select a chat to see linked assets</div>
          </div>
        </template>
        <template x-if="activeChat && galleryAssets.length === 0">
          <div class="gallery-empty">
            <div class="icon">📁</div>
            <div class="text">No assets linked to this chat</div>
          </div>
        </template>
        <template x-for="asset in galleryAssets" :key="asset.id">
          <div class="gallery-item">
            <div class="name" x-text="asset.name || asset.filename"></div>
          </div>
        </template>
      </div>
    </aside>

    <!-- Input area -->
    <div class="input-area">
      <!-- Generation status bar (cancel UI) -->
      <div
        x-show="isGenerating"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        class="generation-status"
      >
        <div class="generation-info">
          <span class="typing-indicator">
            <span class="dot" style="animation-delay: 0ms"></span>
            <span class="dot" style="animation-delay: 150ms"></span>
            <span class="dot" style="animation-delay: 300ms"></span>
          </span>
          <span
            class="generation-label"
            x-text="isContinuing ? '↳ Continuing message...' : generationLabel"
          ></span>
          <template x-if="generationDetail">
            <span class="generation-detail">
              <span class="detail-item" x-show="generationDetail.elapsedMs">&nbsp;⏱ <span x-text="Math.round(generationDetail.elapsedMs / 1000) + 's'"></span></span>
              <span class="detail-item" x-show="generationDetail.charsReceived">&nbsp;📝 <span x-text="generationDetail.charsReceived + ' chars'"></span></span>
              <span class="detail-item" x-show="generationDetail.status">&nbsp;· <span x-text="generationDetail.status"></span></span>
            </span>
          </template>
        </div>
        <div class="generation-actions">
          <button
            class="btn btn-ghost btn-cancel"
            @click="cancelGeneration()"
            title="Cancel generation"
          >
            ⏹ Cancel
          </button>
        </div>
      </div>

      <form
        x-ref="messageForm"
        @submit.prevent="sendMessage()"
      >
        <div class="input-row">
          <textarea
            name="content"
            x-ref="messageInput"
            placeholder="Type a message..."
            rows="1"
            @keydown.enter.shift=""
            @keydown.enter.prevent="sendMessage()"
            @input="autoResize($el)"
            required
            :disabled="!activeChat"
          ></textarea>
          <button type="submit" class="btn btn-primary" title="Send" :disabled="!activeChat">➤</button>
        </div>
        <div class="input-toolbar">
          <label class="btn btn-ghost" style="cursor: pointer; font-size: 12px">
            📎 Attach
            <input
              type="file"
              accept="image/*,audio/*,video/*"
              multiple
              style="display: none"
              @change="handleAttach($event)"
            />
          </label>
        </div>
      </form>
    </div>
  </main>
</div>

<!-- Character Info Modal (fallback for desktop) -->
<div
  x-data="{ showCharacterInfo: false }"
  x-show="false"
  x-cloak
  class="modal-overlay"
  @click.self="showCharacterInfo = false"
>
  <div class="modal">
    <div class="modal-header">
      <span class="title">Character Info</span>
      <button class="btn-icon" @click="showCharacterInfo = false">&times;</button>
    </div>
    <div class="modal-body">
      <div class="empty-state" style="padding: var(--space-6) 0">
        <div class="icon">👤</div>
        <div class="title">Character details</div>
        <div class="description">Character info loaded from the current conversation.</div>
      </div>
    </div>
  </div>
</div>
