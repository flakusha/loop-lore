<!-- Worlds List Page (skeleton — list + modal lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="worlds" data-testid="worlds-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("worlds.title")}}}</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      hx-get="/partials/worlds/import-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after:swap="window.openModal('import-world-modal')"
      aria-label="{{{ t("worlds.importWorld") }}}"
      data-testid="import-world"
    >
      {{{ t("worlds.importWorld") }}}
    </button>
    <!-- Guided create (wizard): name/style → conditions → locations → review. -->
    <button
      class="btn btn-secondary"
      hx-get="/partials/worlds/create-wizard"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after:swap="window.openModal('create-world-wizard-modal')"
      aria-label="{{{ t("worlds.wizardTitle") }}}"
      data-testid="create-world-wizard"
    >
      {{{ t("worlds.wizardTitle") }}}
    </button>
    <button
      class="btn btn-primary"
      hx-get="/partials/worlds/create-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after:swap="window.openModal('create-world-modal')"
      aria-label="{{{ t("worlds.create") }}}"
      data-testid="create-world"
    >
      + New
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area">
      <div class="list-toolbar">
        <div
          data-search-url="/dynamic/worlds/search"
          data-target-id="world-list"
          data-search-placeholder="{{{t("worlds.searchWorlds")}}}"
          data-search-label="{{{t("worlds.searchWorlds")}}}"
          style="display: contents"
        >
          {{> filter-bar.html}}
        </div>
      </div>
<div
        id="world-list"
        data-testid="world-list"
        hx-get="/dynamic/worlds/list"
        hx-trigger="load"
        hx-swap="innerHTML"
        hx-indicator="#worlds-indicator"
      >
        {{> loading-state.html}}
      </div>
      <div id="worlds-indicator" class="htmx-indicator" style="text-align: center; padding: var(--space-4)">
        <span class="spinner"></span>
      </div>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
