<!-- Worlds List Page (skeleton — list + modal lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="worlds" data-testid="worlds-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Worlds</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      x-on:click="window.showToast('info', 'Import feature coming soon')"
      data-testid="import-world"
    >
      Import
    </button>
    <button
      class="btn btn-primary"
      hx-get="/partials/worlds/create-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('create-world-modal')"
      data-testid="create-world"
    >
      + New
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area">
      <div class="list-toolbar">
        <div
          data-search-url="/dynamic/worlds/search"
          data-target-id="world-list"
          data-search-placeholder="Search worlds…"
          data-search-label="Search worlds"
          style="display: contents"
        >
          {{> filter-bar.html}}
        </div>
      </div>
      <div
        id="world-list"
        data-testid="world-list"
        hx-get="/dynamic/worlds/list"
        hx-trigger="load"
        hx-swap="innerHTML"
        hx-indicator="#worlds-indicator"
      >
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading worlds...</div>
        </div>
      </div>
      <div id="worlds-indicator" class="htmx-indicator" style="text-align: center; padding: var(--space-4)">
        <span class="spinner"></span>
      </div>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
