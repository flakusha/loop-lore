<!-- Worlds List Page (swapped into #app-root by htmx) -->
<div class="app-layout" x-data="worldsState()">
  <!-- Main content -->
  <main class="main-content">
    <header class="main-header">
      <span class="title">Worlds</span>
      <div class="actions">
        <button class="btn btn-secondary" @click="showImportForm = true" data-testid="import-world">
          Import
        </button>
        <button class="btn btn-primary" @click="showCreateForm = true" data-testid="create-world">
          + New
        </button>
      </div>
    </header>

    <div class="chat-area">
      <!-- Loading state -->
      <template x-if="loading">
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading worlds...</div>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!loading && worlds.length === 0">
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">🌍</div>
          <div class="title">No worlds yet</div>
          <div class="description">Create your first world to build a shared story setting.</div>
          <button class="btn btn-primary" style="margin-top: var(--space-4)" @click="showCreateForm = true">
            + Create World
          </button>
        </div>
      </template>

      <!-- World list -->
      <template x-if="!loading && worlds.length > 0">
        <div class="world-list" data-testid="world-list">
          <template x-for="world in worlds" :key="world.id">
            <div class="world-card" @click="selectWorld(world)" :data-testid="'world-card-' + world.id">
              <div class="world-header">
                <h3 class="world-name" x-text="world.name"></h3>
                <span class="world-id" x-text="'ID: ' + world.id"></span>
              </div>
              <div class="world-description" x-text="world.description || 'No description'"></div>
              <div class="world-meta">
                <span class="tag" x-text="world.chat_count + ' chats'"></span>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </main>

  <!-- Create World Modal -->
  <div
    x-show="showCreateForm"
    x-cloak
    class="modal-overlay"
    @click.self="showCreateForm = false"
    data-testid="create-world-modal"
  >
    <div class="modal">
      <div class="modal-header">
        <span class="title">Create World</span>
        <button class="btn-icon" @click="showCreateForm = false">&times;</button>
      </div>
      <div class="modal-body">
        <form @submit.prevent="createWorld()" data-testid="create-world-form">
          <div class="form-group">
            <label class="form-label" for="world-name">World Name</label>
            <input
              class="form-input"
              type="text"
              name="name"
              id="world-name"
              required
              placeholder="e.g., The Forgotten Realm"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="world-description">Description</label>
            <textarea
              class="form-input"
              name="description"
              id="world-description"
              rows="2"
              placeholder="Short summary for the world card"
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="world-lore">Lore</label>
            <textarea
              class="form-input"
              name="lore"
              id="world-lore"
              rows="4"
              placeholder="Full setting description, rules, atmosphere..."
            ></textarea>
          </div>

          <div
            style="display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6)"
          >
            <button type="button" class="btn btn-secondary" @click="showCreateForm = false">Cancel</button>
            <button
              type="submit"
              class="btn btn-primary"
              :disabled="submitting"
              x-text="submitting ? 'Creating...' : 'Create'"
            ></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
