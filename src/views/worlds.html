<!-- Worlds List Page -->
<header id="header-slot" class="main-header" data-testid="worlds-header">
  <button class="hamburger" onclick="toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Worlds</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      onclick="showToast('info', 'Import feature coming soon')"
      data-testid="import-world"
    >
      Import
    </button>
    <button
      class="btn btn-primary"
      onclick="document.getElementById('create-world-modal').classList.add('open')"
      data-testid="create-world"
    >
      + New
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <div class="world-list" id="world-list" data-testid="world-list">
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading worlds...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Create World Modal -->
  <div
    id="create-world-modal"
    class="modal-overlay"
    onclick="if (event.target === this) this.classList.remove('open');"
    data-testid="create-world-modal"
  >
    <div class="modal">
      <div class="modal-header">
        <span class="title">Create World</span>
        <button class="btn-icon" onclick="this.closest('.modal-overlay').classList.remove('open')">
          &times;
        </button>
      </div>
      <div class="modal-body">
        <form onsubmit="return createWorld(event);" data-testid="create-world-form">
          <div class="form-group">
            <label class="form-label" for="world-name">World Name</label>
            <input
              class="form-input"
              type="text"
              name="name"
              id="world-name"
              required
              placeholder="e.g., The Forgotten Realm"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="world-description">Description</label>
            <textarea
              class="form-input form-textarea"
              name="description"
              id="world-description"
              rows="2"
              placeholder="Short summary for the world card"
            ></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="world-lore">Lore</label>
            <textarea
              class="form-input form-textarea"
              name="lore"
              id="world-lore"
              rows="4"
              placeholder="Full setting description..."
            ></textarea>
          </div>
          <div
            style="display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6)"
          >
            <button
              type="button"
              class="btn btn-secondary"
              onclick="document.getElementById('create-world-modal').classList.remove('open')"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  (function f() {
    if (typeof loadWorldsPage === "function") loadWorldsPage();
    else setTimeout(f, 10);
  })();
</script>
