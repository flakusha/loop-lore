<!-- Notification Center View -->
<div x-data="notificationCenter()" x-init="init()">
  <header
    id="header-slot"
    class="main-header"
    data-page="notifications"
    data-testid="notifications-header"
  >
    <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger" aria-label="Toggle sidebar">
      ☰
    </button>
    <span class="title">{{{t("notifications.title")}}}</span>
    <div class="actions">
      <button
        class="btn btn-secondary"
        x-on:click="showFilters = !showFilters"
        data-testid="notifications-filters-toggle"
      >
        {{{t("notifications.filters")}}}
      </button>
      <button
        class="btn btn-primary"
        x-on:click="markAllRead()"
        x-show="unreadCount() > 0"
        data-testid="notifications-mark-all-read"
      >
        {{{t("tooltips.markAllRead")}}}
      </button>
    </div>
  </header>

  <div class="app-layout" data-testid="notifications-page">
    <main class="main-content">
      <div class="chat-area" style="max-width: 760px; margin: 0 auto; width: 100%">
        <!-- List toggle: All / Unread -->
        <div class="list-toolbar">
          <div class="segmented" role="tablist" x-bind:aria-label="t('notifications.listToggle')">
            <button
              class="segmented-btn"
              :class="{ active: filter === 'all' }"
              x-on:click="filter = 'all'"
              data-testid="notifications-filter-all"
            >
              {{{t("notifications.all")}}}
            </button>
            <button
              class="segmented-btn"
              :class="{ active: filter === 'unread' }"
              x-on:click="filter = 'unread'"
              data-testid="notifications-filter-unread"
            >
              {{{t("notifications.unread")}}}
              <span x-text="unreadCount()" x-show="unreadCount() > 0"></span>
            </button>
          </div>
        </div>

        <!-- Noise filtering: per-type mute/suppress -->
        <div
          x-show="showFilters"
          class="settings-section"
          data-testid="notifications-filters"
        >
          <h3>{{{t("notifications.filters")}}}</h3>
          <p class="muted">{{{t("notifications.filtersDesc")}}}</p>
          <template x-for="tp in types" :key="tp.key">
            <label class="pref-row">
              <input type="checkbox" :checked="prefs[tp.key]" @change="toggleType(tp.key)" />
              <span x-text="tp.label"></span>
            </label>
          </template>
          <p class="muted" x-show="saving">{{{t("settings.saving")}}}</p>
        </div>

        <!-- Empty state -->
        <div class="empty-state" x-show="loaded && visible().length === 0" data-testid="notifications-empty">
          {{{t("tooltips.noNotifications")}}}
        </div>

        <!-- Notification list -->
        <template x-for="n in visible()" :key="n.id">
          <div
            class="notif-item"
            :class="{ unread: !n.read }"
            x-on:click="onOpen(n)"
            :data-testid="'notification-' + n.id"
          >
            <span class="notif-icon" x-text="iconFor(n.type)"></span>
            <div class="notif-body">
              <div class="notif-title" x-text="n.title"></div>
              <div class="notif-sub" x-text="n.body" x-show="n.body"></div>
              <div class="notif-time" x-text="timeAgo(n.createdAt)" x-show="n.createdAt"></div>
            </div>
            <span class="notif-dot" x-show="!n.read"></span>
          </div>
        </template>
      </div>
    </main>
  </div>
</div>
