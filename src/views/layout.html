<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loop-lore</title>

    <!-- Core resets - always loaded -->
    <link rel="stylesheet" href="/css/theme.css" media="all" />

    <!-- Theme CSS (dynamically loaded based on user preference) -->
    <link rel="stylesheet" href="/css/theme-default.css" media="all" id="theme-default" />
    <link rel="stylesheet" href="/css/theme-light.css" media="all" id="theme-light" disabled />
    <link rel="stylesheet" href="/css/theme-bright.css" media="all" id="theme-bright" disabled />
    <link rel="stylesheet" href="/css/theme-colorful.css" media="all" id="theme-colorful" disabled />
    <link rel="stylesheet" href="/css/theme-monochrome.css" media="all" id="theme-monochrome" disabled />
    <link rel="stylesheet" href="/css/theme-no-icons.css" media="all" id="theme-no-icons" disabled />
    <link rel="stylesheet" href="/css/theme-dracula.css" media="all" id="theme-dracula" disabled />
    <link rel="stylesheet" href="/css/theme-nord.css" media="all" id="theme-nord" disabled />
    <link rel="stylesheet" href="/css/theme-github-dark.css" media="all" id="theme-github-dark" disabled />
    <link rel="stylesheet" href="/css/theme-material.css" media="all" id="theme-material" disabled />

    <link rel="stylesheet" href="/css/app.css" media="all" />
    <link rel="stylesheet" href="/css/gallery.css" media="all" />

    <!-- htmx -->
    <script
      src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Alpine components (define app, chatState, etc. BEFORE Alpine loads) -->
    <script src="/alpine.js" defer></script>

    <!-- Alpine.js -->
    <script
      src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"
      integrity="sha384-9Ax3MmS9AClxJyd5/zafcXXjxmwFhZCdsT6HJoJjarvCaAkJlk5QDzjLJm+Wdx5F"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- htmx response-targets extension (for error handling) -->
    <script
      src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4"
      integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- htmx SSE extension (for streaming generation) -->
    <script
      src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"
      integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N"
      crossorigin="anonymous"
      defer
    ></script>

    <style>
      /* Inline critical: prevent FOUC - uses CSS vars from theme.css */
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
      }
      [x-cloak] {
        display: none !important;
      }

      /* Theme selector dropdown */
      .theme-selector {
        position: relative;
        display: inline-block;
      }

      .theme-options {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--bg-secondary);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        min-width: 180px;
        z-index: var(--z-dropdown);
        padding: var(--space-2) 0;
      }

      .theme-option {
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
        transition: background var(--transition-fast);
      }

      .theme-option:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .theme-option.active {
        background: var(--accent-primary);
        color: #000;
        font-weight: 600;
      }
    </style>
  </head>
  <body
    x-data="app()"
    x-init="init()"
    @keydown.escape.window="closeAllModals()"
    :class="{ 'sidebar-open': $store.sidebar.open }"
  >
    <!-- Toast container (fixed, outside layout) -->
    <div
      class="toast-container"
      id="toast-container"
      data-testid="toast-container"
      x-show="toasts.length > 0"
      x-transition
    >
      <template x-for="(toast, i) in toasts" :key="i">
        <div class="toast" :class="toast.type">
          <span class="icon" x-text="toast.icon"></span>
          <span class="message" x-text="toast.msg"></span>
          <button class="close" @click="toasts.splice(i, 1)">&times;</button>
        </div>
      </template>
    </div>

    <!-- Persistent sidebar (does not reload on htmx nav) -->
    <aside class="sidebar" id="layout-sidebar" data-testid="sidebar" :class="{ open: $store.sidebar.open }">
      <div class="sidebar-header">
        <span class="logo">loop-lore</span>
        <button
          class="btn-icon"
          @click="$store.sidebar.open = false"
          title="Close"
          x-bind:title="__('common.close')"
        >
          &times;
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Navigation</div>

        <a
          class="nav-item"
          href="/views/chat"
          hx-get="/views/chat"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          @click="$store.sidebar.open = false"
          data-testid="nav-chat"
        >
          <span>💬</span> <span x-text="__('nav.chat')">Chat</span>
        </a>

        <a
          class="nav-item"
          href="/views/characters"
          hx-get="/views/characters"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          @click="$store.sidebar.open = false"
          data-testid="nav-characters"
        >
          <span>👤</span> <span x-text="__('nav.characters')">Characters</span>
        </a>

        <a
          class="nav-item"
          href="/views/gallery"
          hx-get="/views/gallery"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          @click="$store.sidebar.open = false"
          data-testid="nav-gallery"
        >
          <span>🖼</span> <span x-text="__('nav.gallery')">Gallery</span>
        </a>

        <a
          class="nav-item"
          href="/views/worlds"
          hx-get="/views/worlds"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          @click="$store.sidebar.open = false"
          data-testid="nav-worlds"
        >
          <span>🌍</span> <span x-text="__('nav.worlds')">Worlds</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <img
            class="avatar"
            src="/img/default-avatar.png"
            alt="User avatar"
            style="background: var(--bg-tertiary)"
            x-on:error="$el.style.display='none'"
          />
          <div class="details">
            <div class="name" id="user-display-name">User</div>
            <div class="role" id="user-role">solo</div>
          </div>
          <button
            class="btn-icon"
            hx-get="/views/settings"
            hx-target="#app-root"
            hx-swap="innerHTML"
            hx-push-url="true"
            @click="$store.sidebar.open = false"
            title="Settings"
            x-bind:title="__('nav.settings')"
            data-testid="nav-settings"
          >
            ⚙
          </button>
        </div>
      </div>
    </aside>

    <!-- Backdrop for mobile sidebar -->
    <div
      x-show="$store.sidebar.open"
      class="backdrop"
      x-transition
      @click="$store.sidebar.open = false"
    ></div>

    <!-- Header slot placeholder — replaced via hx-swap-oob on page nav.
         CSS hides it when empty; after OOB swap the real header becomes visible. -->
    <header id="header-slot" class="main-header"></header>

    <!-- Main content rendered by htmx swaps -->
    <div id="app-root" data-testid="app-root" hx-ext="response-targets" hx-target-error="#toast-container">
      {{{content}}}
    </div>
  </body>
</html>
