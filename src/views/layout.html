<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loop-lore</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Core resets - always loaded -->
    <link rel="stylesheet" href="/css/theme.css" media="all" />

    <!-- Theme CSS (dynamically loaded based on user preference) -->
    <link rel="stylesheet" href="/css/theme-default.css" media="all" id="theme-default" />
    <link rel="stylesheet" href="/css/theme-light.css" media="all" id="theme-light" disabled />
    <link rel="stylesheet" href="/css/theme-bright.css" media="all" id="theme-bright" disabled />
    <link rel="stylesheet" href="/css/theme-colorful.css" media="all" id="theme-colorful" disabled />
    <link rel="stylesheet" href="/css/theme-monochrome.css" media="all" id="theme-monochrome" disabled />
    <link rel="stylesheet" href="/css/theme-no-icons.css" media="all" id="theme-no-icons" disabled />
    <link rel="stylesheet" href="/css/theme-dracula.css" media="all" id="theme-dracula" disabled />
    <link rel="stylesheet" href="/css/theme-nord.css" media="all" id="theme-nord" disabled />
    <link rel="stylesheet" href="/css/theme-github-dark.css" media="all" id="theme-github-dark" disabled />
    <link rel="stylesheet" href="/css/theme-material.css" media="all" id="theme-material" disabled />

    <link rel="stylesheet" href="/css/app.css" media="all" />
    <link rel="stylesheet" href="/css/gallery.css" media="all" />

    <!-- htmx -->
    <script src="/js/htmx.min.js" defer></script>

    <!-- Chat vendor libs (marked + dompurify) — must load before app.js -->
    <script src="/chat-vendor.js" defer></script>

    <!-- App bundle: core framework (sidebar, toast, theme, locale, htmx) -->
    <script src="/app.js" defer></script>

    <!-- Page-specific behaviors (characters, gallery, worlds, new-chat) -->
    <script src="/pages.js" defer></script>

    <!-- Alpine.js morph plugin — MUST load before Alpine core; enables htmx-ext-alpine-morph -->
    <script src="/js/alpine-morph.min.js" defer></script>

    <!-- Alpine.js (loaded for chat page reactivity) -->
    <script src="/js/alpine.min.js" defer></script>

    <!-- htmx alpine-morph extension — swaps via Alpine's morph, preserving component state -->
    <script src="/js/htmx-alpine-morph.min.js" defer></script>

    <!-- htmx response-targets extension (for error handling) -->
    <script src="/js/htmx-response-targets.min.js" defer></script>

    <!-- htmx SSE extension (for streaming generation) -->
    <script src="/js/htmx-sse.min.js" defer></script>

    <style>
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
      }

      /* Theme selector dropdown */
      .theme-selector {
        position: relative;
        display: inline-block;
      }
      .theme-options {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--bg-secondary);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        min-width: 180px;
        z-index: var(--z-dropdown);
        padding: var(--space-2) 0;
      }
      .theme-option {
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
        transition: background var(--transition-fast);
      }
      .theme-option:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      .theme-option.active {
        background: var(--accent-primary);
        color: #000;
        font-weight: 600;
      }
    </style>
  </head>
  <body x-data="app()" hx-ext="alpine-morph">
    <!-- Toast container (fixed, outside layout) -->
    <div class="toast-container" id="toast-container" data-testid="toast-container"></div>

    <!-- Skip to content (first focusable element for keyboard users) -->
    <a class="skip-to-content" href="#app-root" data-testid="skip-to-content">Skip to content</a>

    <!-- Persistent sidebar -->
    <aside class="sidebar" id="layout-sidebar" data-testid="sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <span class="logo">loop-lore</span>
        <button class="btn-icon" x-on:click="window.closeSidebar()" title="Close" aria-label="Close sidebar">
          &times;
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Primary">
        <div class="nav-section-title">Navigation</div>

        <a
          class="nav-item"
          href="/views/chat"
          hx-get="/views/chat"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-chat"
        >
          <span>💬</span> <span>Chat</span>
        </a>

        <a
          class="nav-item"
          href="/views/characters"
          hx-get="/views/characters"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-characters"
        >
          <span>👤</span> <span>Characters</span>
        </a>

        <a
          class="nav-item"
          href="/views/gallery"
          hx-get="/views/gallery"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-gallery"
        >
          <span>🖼</span> <span>Gallery</span>
        </a>

        <a
          class="nav-item"
          href="/views/worlds"
          hx-get="/views/worlds"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-worlds"
        >
          <span>🌍</span> <span>Worlds</span>
        </a>

        <a
          class="nav-item"
          href="/views/personas"
          hx-get="/views/personas"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-personas"
        >
          <span>🎭</span> <span>Personas</span>
        </a>

        <a
          class="nav-item"
          href="/views/admin"
          hx-get="/views/admin"
          hx-target="#app-root"
          hx-swap="innerHTML"
          hx-push-url="true"
          x-on:click="window.closeSidebar()"
          data-testid="nav-admin"
        >
          <span>🛡</span> <span>Admin</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <img
            class="avatar"
            src="/img/characters/default-avatar.svg"
            alt="User avatar"
            style="background: var(--bg-tertiary)"
            data-avatar="user"
          />
          <div class="details">
            <div class="name" id="user-display-name">User</div>
            <div class="role" id="user-role">solo</div>
          </div>
          <button
            class="btn-icon"
            hx-get="/views/settings"
            hx-target="#app-root"
            hx-swap="innerHTML"
            hx-push-url="true"
            x-on:click="window.closeSidebar()"
            title="Settings"
            data-testid="nav-settings"
          >
            ⚙
          </button>
        </div>
      </div>
    </aside>

    <!-- Backdrop for mobile sidebar -->
    <div
      class="backdrop"
      id="sidebar-backdrop"
      x-on:click="window.closeSidebar()"
      style="display: none"
    ></div>

    <!-- Header slot placeholder — replaced via hx-swap-oob on page nav -->
    <header id="header-slot" class="main-header"></header>

    <!-- Main content rendered by htmx swaps -->
    <div
      id="app-root"
      data-testid="app-root"
      hx-ext="response-targets"
      hx-target-error="#toast-container"
      role="main"
      tabindex="-1"
    >
      {{{content}}}
    </div>
  </body>
</html>
