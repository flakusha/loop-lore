<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loop-lore</title>

    <!-- Core resets - always loaded -->
    <link rel="stylesheet" href="/css/theme.css" media="all" />

    <!-- Theme CSS (dynamically loaded based on user preference) -->
    <link rel="stylesheet" href="/css/theme-default.css" media="all" id="theme-default" />
    <link rel="stylesheet" href="/css/theme-light.css" media="all" id="theme-light" disabled />
    <link rel="stylesheet" href="/css/theme-bright.css" media="all" id="theme-bright" disabled />
    <link rel="stylesheet" href="/css/theme-colorful.css" media="all" id="theme-colorful" disabled />
    <link rel="stylesheet" href="/css/theme-monochrome.css" media="all" id="theme-monochrome" disabled />
    <link rel="stylesheet" href="/css/theme-no-icons.css" media="all" id="theme-no-icons" disabled />
    <link rel="stylesheet" href="/css/theme-dracula.css" media="all" id="theme-dracula" disabled />
    <link rel="stylesheet" href="/css/theme-nord.css" media="all" id="theme-nord" disabled />
    <link rel="stylesheet" href="/css/theme-github-dark.css" media="all" id="theme-github-dark" disabled />
    <link rel="stylesheet" href="/css/theme-material.css" media="all" id="theme-material" disabled />

    <link rel="stylesheet" href="/css/app.css" media="all" />
    <link rel="stylesheet" href="/css/gallery.css" media="all" />

    <!-- htmx -->
    <script
      src="https://unpkg.com/htmx.org@2.0.4"
      integrity="sha384-ieQNIn/OMdC0jtCkCj3zXG1LZyNE1iIhJ6WNF66GSHU7hSHuk7qAApN21JxPBf3b"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Alpine.js -->
    <script
      src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"
      integrity="sha384-2GXm0oAzhNWQ6S+3JmC6m+OQfH8AnLyR5t0CVC8cvj2CJmN11OU3o%2BpE%2B%2B1lCg6QaTsgbfN"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- htmx response-targets extension (for error handling) -->
    <script
      src="https://unpkg.com/htmx.org@2.0.4/dist/ext/response-targets.js"
      crossorigin="anonymous"
      defer
    ></script>

    <style>
      /* Inline critical: prevent FOUC - uses CSS vars from theme.css */
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
      }
      [x-cloak] {
        display: none !important;
      }

      /* Theme selector dropdown */
      .theme-selector {
        position: relative;
        display: inline-block;
      }

      .theme-options {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--bg-secondary);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        min-width: 180px;
        z-index: var(--z-dropdown);
        padding: var(--space-2) 0;
      }

      .theme-option {
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
        transition: background var(--transition-fast);
      }

      .theme-option:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .theme-option.active {
        background: var(--accent-primary);
        color: #000;
        font-weight: 600;
      }
    </style>
  </head>
  <body x-data="app()" x-init="init()" @keydown.escape.window="closeAllModals()">
    <!-- Toast container (fixed, outside layout) -->
    <div class="toast-container" id="toast-container" x-show="toasts.length > 0" x-transition>
      <template x-for="(toast, i) in toasts" :key="i">
        <div class="toast" :class="toast.type">
          <span class="icon" x-text="toast.icon"></span>
          <span class="message" x-text="toast.msg"></span>
          <button class="close" @click="toasts.splice(i, 1)">&times;</button>
        </div>
      </template>
    </div>

    <!-- Main content rendered by htmx swaps -->
    <div id="app-root" hx-ext="response-targets" hx-target-error="#toast-container">{{{content}}}</div>

    <script>
      const THEMES = [
        { id: "default", name: "Default (Dark)", file: "theme-default.css" },
        { id: "light", name: "Light", file: "theme-light.css" },
        { id: "bright", name: "Bright", file: "theme-bright.css" },
        { id: "colorful", name: "Colorful", file: "theme-colorful.css" },
        { id: "monochrome", name: "Monochrome", file: "theme-monochrome.css" },
        { id: "no-icons", name: "No Icons", file: "theme-no-icons.css" },
        { id: "dracula", name: "Dracula", file: "theme-dracula.css" },
        { id: "nord", name: "Nord", file: "theme-nord.css" },
        { id: "github-dark", name: "GitHub Dark", file: "theme-github-dark.css" },
        { id: "material", name: "Material", file: "theme-material.css" },
      ];

      function app() {
        return {
          toasts: [],
          currentTheme: "default",

          init() {
            // Load saved theme preference
            const savedTheme = localStorage.getItem("theme-preference");
            if (savedTheme && THEMES.find((t) => t.id === savedTheme)) {
              this.currentTheme = savedTheme;
            }
            this.applyTheme(this.currentTheme);

            // Listen for htmx toast events
            document.addEventListener("show-toast", (e) => {
              this.toasts.push({
                type: e.detail.type || "info",
                msg: e.detail.message,
                icon: e.detail.icon || this.iconFor(e.detail.type || "info"),
              });
              setTimeout(() => this.toasts.shift(), 5000);
            });
          },

          applyTheme(themeId) {
            const theme = THEMES.find((t) => t.id === themeId);
            if (!theme) return;

            // Disable all theme stylesheets
            THEMES.forEach((t) => {
              const link = document.getElementById(`theme-${t.id}`);
              if (link) {
                link.disabled = true;
              }
            });

            // Enable selected theme
            const selectedLink = document.getElementById(`theme-${themeId}`);
            if (selectedLink) {
              selectedLink.disabled = false;
            }

            // Update body class for no-icons theme
            document.body.classList.toggle("theme-no-icons", themeId === "no-icons");

            // Save preference
            localStorage.setItem("theme-preference", themeId);
          },

          iconFor(type) {
            const icons = { success: "✓", error: "✗", info: "ℹ", warning: "⚠" };
            return icons[type] || "ℹ";
          },

          closeAllModals() {
            document.querySelectorAll("[x-data]").forEach((el) => {
              if (el.__x) {
                const data = el.__x.getUnobservedData();
                if (data && typeof data.showModal !== "undefined") {
                  data.showModal = false;
                }
              }
            });
          },

          toast(type, message) {
            this.toasts.push({ type, msg: message, icon: this.iconFor(type) });
            setTimeout(() => this.toasts.shift(), 5000);
          },

          setTheme(themeId) {
            this.currentTheme = themeId;
            this.applyTheme(themeId);
          },

          getThemeName() {
            const theme = THEMES.find((t) => t.id === this.currentTheme);
            return theme ? theme.name : "Default";
          },
        };
      }

      // --- htmx config ---
      document.addEventListener("htmx:configRequest", (e) => {
        const token = localStorage.getItem("session_token");
        if (token) {
          e.detail.headers["Authorization"] = "Bearer " + token;
        }
      });

      document.addEventListener("htmx:afterSwap", (e) => {
        if (e.detail.target && e.detail.target.__x) {
          e.detail.target.__x.$nextTick(() => Alpine.initTree(e.detail.target));
        }
      });

      document.addEventListener("htmx:responseError", (e) => {
        const detail = e.detail;
        if (detail.xhr) {
          try {
            const body = JSON.parse(detail.xhr.responseText);
            document.dispatchEvent(
              new CustomEvent("show-toast", {
                detail: { type: "error", message: body.error || "Request failed" },
              }),
            );
          } catch {
            document.dispatchEvent(
              new CustomEvent("show-toast", {
                detail: { type: "error", message: `Error ${detail.xhr.status}` },
              }),
            );
          }
        }
      });

      // --- Theme switcher for settings page ---
      document.addEventListener("htmx:loadTheme", (e) => {
        if (e.detail && e.detail.theme) {
          const app = Alpine?.closest(document.body)?.__x;
          if (app) {
            app.setTheme(e.detail.theme);
          }
        }
      });
    </script>
  </body>
</html>
