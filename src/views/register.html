<div class="login-page">
  <div class="login-card">
    <div class="login-logo">loop-lore</div>

    <div id="register-error" class="login-error" data-testid="register-error"></div>

    <form
      method="post"
      action="/api/auth/register"
      hx-post="/api/auth/register"
      hx-target="#register-error"
      hx-swap="innerHTML"
      hx-indicator="#register-submit"
    >
      <div class="form-field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          autocomplete="username"
          class="form-input"
          data-testid="register-username"
        />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          class="form-input"
          data-testid="register-password"
        />
      </div>

      <button
        id="register-submit"
        type="submit"
        class="btn btn-primary login-btn"
        data-testid="register-submit"
      >
        Sign Up
      </button>
    </form>

    <div class="login-divider"></div>

    <a href="/views/login" class="login-signup-link" data-testid="login-link">
      Already have an account? Log in
    </a>
  </div>
</div>
