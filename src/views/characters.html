<!-- Characters View (skeleton — grid + modals lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="characters" data-testid="characters-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("characters.title")}}}</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      hx-get="/partials/characters/import-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('import-modal')"
      data-testid="import-character"
    >
      Import Card
    </button>
    <button
      class="btn btn-secondary"
      hx-get="/partials/characters/export-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('export-modal')"
      data-testid="export-character"
    >
      Export All
    </button>
    <button
      class="btn btn-primary"
      hx-get="/partials/characters/create-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('create-modal')"
      data-testid="create-character"
    >
      + New
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area" style="overflow-y: auto">
      <div class="list-toolbar" x-data="{ view: localStorage.getItem('character-view') || 'grid' }">
        <div
          data-search-url="/dynamic/characters/search"
          data-target-id="character-grid"
          data-search-placeholder="{{{t("characters.searchCharacters")}}}"
          data-search-label="{{{t("characters.searchCharacters")}}}"
          style="display: contents"
        >
          {{> filter-bar.html}}
        </div>
        <button
          class="btn btn-secondary btn-sm"
          x-on:click="view = view === 'grid' ? 'list' : 'grid'; localStorage.setItem('character-view', view); document.getElementById('character-grid').className = view === 'grid' ? 'character-grid' : 'character-grid list-view'"
          :title="view === 'grid' ? t('characters.switchToList') : t('characters.switchToGrid')"
          data-testid="view-toggle"
        >
          <span x-show="view === 'grid'">☰</span>
          <span x-show="view === 'list'">⊞</span>
        </button>
      </div>
      <div
        id="character-grid"
        class="character-grid"
        data-testid="character-grid"
        hx-get="/dynamic/characters/grid"
        hx-trigger="load"
        hx-swap="innerHTML"
        hx-indicator="#characters-indicator"
      >
        <div class="empty-state" style="padding: var(--space-12)" data-testid="characters-loading">
          <div class="icon">⏳</div>
          <div class="title">{{{t("common.loading")}}}</div>
        </div>
      </div>
      <div
        id="characters-indicator"
        class="htmx-indicator"
        style="text-align: center; padding: var(--space-4)"
      >
        <span class="spinner"></span>
      </div>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
