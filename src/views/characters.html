<!-- Characters View -->
<header id="header-slot" class="main-header" data-page="characters" data-testid="characters-header">
  <button class="hamburger" onclick="toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Characters</span>
  <div class="actions">
    <button
      class="btn btn-secondary"
      onclick="document.getElementById('import-modal').classList.add('open')"
      data-testid="import-character"
    >
      Import Card
    </button>
    <button
      class="btn btn-primary"
      onclick="document.getElementById('create-modal').classList.add('open')"
      data-testid="create-character"
    >
      + New
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area" style="overflow-y: auto">
      <div class="character-grid" id="character-grid" data-testid="character-grid">
        <div class="empty-state" style="padding: var(--space-12)" data-testid="characters-loading">
          <div class="icon">⏳</div>
          <div class="title">Loading characters...</div>
        </div>
      </div>
    </div>

    <!-- Create modal -->
    <div
      id="create-modal"
      class="modal-overlay"
      onclick="if (event.target === this) this.classList.remove('open');"
      data-testid="create-character-modal"
    >
      <div class="modal">
        <div class="modal-header">
          <span class="title">Create Character</span>
          <button class="btn-icon" onclick="this.closest('.modal-overlay').classList.remove('open')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form
            hx-post="/api/actors"
            hx-target="#app-root"
            hx-swap="innerHTML"
            hx-target-error="#toast-container"
            hx-on::after-request="if(event.detail.successful){ showToast('success','Character created'); loadCharactersPage(); }"
            data-testid="create-character-form"
          >
            <div class="form-group">
              <label class="form-label" for="char-name">Character Name</label>
              <input
                class="form-input"
                type="text"
                name="displayName"
                id="char-name"
                required
                placeholder="e.g., Alice"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="char-type">Type</label>
              <select class="form-select" name="actorType" id="char-type">
                <option value="character">Character</option>
                <option value="persona">Persona</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="char-desc">Description</label>
              <textarea
                class="form-input form-textarea"
                name="description"
                id="char-desc"
                rows="3"
                placeholder="Brief description..."
              ></textarea>
            </div>
            <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
              <button
                type="button"
                class="btn btn-secondary"
                onclick="this.closest('.modal-overlay').classList.remove('open')"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Create</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Import modal -->
    <div
      id="import-modal"
      class="modal-overlay"
      onclick="if (event.target === this) this.classList.remove('open');"
      data-testid="import-character-modal"
    >
      <div class="modal">
        <div class="modal-header">
          <span class="title">Import Character Card</span>
          <button class="btn-icon" onclick="this.closest('.modal-overlay').classList.remove('open')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form
            hx-post="/api/actors/import"
            hx-encoding="multipart/form-data"
            hx-target="#app-root"
            hx-swap="innerHTML"
            hx-target-error="#toast-container"
            hx-on::after-request="if(event.detail.successful){ document.getElementById('import-modal').classList.remove('open'); showToast('success','Character imported'); loadCharactersPage(); }"
            data-testid="import-character-form"
          >
            <div
              class="drop-zone"
              style="margin-bottom: var(--space-4)"
              onclick="document.getElementById('import-file-input').click()"
            >
              <div class="icon">📄</div>
              <div class="text">Upload a character card JSON or PNG</div>
              <div class="hint">Supports V2 character cards</div>
              <input
                type="file"
                name="file"
                accept=".json,.png"
                style="display: none"
                id="import-file-input"
              />
            </div>
            <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
              <button
                type="button"
                class="btn btn-secondary"
                onclick="document.getElementById('import-modal').classList.remove('open')"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Import</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Character detail modal -->
    <div
      id="character-detail-modal"
      class="modal-overlay"
      onclick="if (event.target === this) this.classList.remove('open');"
      data-testid="character-detail-modal"
    >
      <div class="modal">
        <div class="modal-header">
          <span class="title" data-field="name"></span>
          <button class="btn-icon" onclick="this.closest('.modal-overlay').classList.remove('open')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <div style="display: flex; gap: var(--space-4); margin-bottom: var(--space-4)">
            <div
              style="
                width: 80px;
                height: 80px;
                border-radius: var(--radius-md);
                background: var(--bg-tertiary);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 36px;
                flex-shrink: 0;
                overflow: hidden;
              "
              data-field="avatar"
            >
              <span>👤</span>
            </div>
            <div style="flex: 1">
              <div style="font-size: 18px; font-weight: 600" data-field="name"></div>
              <div
                style="font-size: 13px; color: var(--text-secondary); margin-top: var(--space-2)"
                data-field="description"
              ></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">System Prompt</label>
            <div
              style="
                font-size: 13px;
                color: var(--text-secondary);
                white-space: pre-wrap;
                background: var(--bg-tertiary);
                padding: var(--space-3);
                border-radius: var(--radius-sm);
                max-height: 200px;
                overflow-y: auto;
              "
              data-field="system-prompt"
            ></div>
          </div>
          <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
            <button
              class="btn btn-secondary"
              data-action="start-chat"
              onclick="startChatFromChar(this)"
              data-testid="start-chat-btn"
            >
              💬 Start Chat
            </button>
            <button
              class="btn btn-secondary"
              data-action="edit-char"
              onclick="editCharacter(this)"
              data-testid="edit-character-btn"
            >
              ✏️ Edit
            </button>
            <button
              class="btn btn-danger"
              data-action="delete-char"
              onclick="deleteCharacter(this)"
              data-testid="delete-character-btn"
            >
              🗑 Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
