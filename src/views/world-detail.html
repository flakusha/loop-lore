<!-- World Detail Page (skeleton — detail + modal lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="world-detail" data-testid="world-detail-header">
  <button
    class="hamburger"
    x-on:click="window.toggleSidebar()"
    data-testid="hamburger"
    aria-label="{{{t('accessibility.toggleSidebar')}}}"
  >
    ☰
  </button>
  <h1 class="title" id="page-title">{{{t("worlds.worldDetails")}}}</h1>
  <div class="actions">
    <button
      class="btn btn-secondary"
      hx-get="/dynamic/worlds/{{worldId}}/detail"
      hx-target="#world-detail"
      hx-swap="innerHTML"
      data-testid="refresh-world"
    >
      Refresh
    </button>
    <button
      class="btn btn-secondary"
      x-on:click="window.exportWorld('{{worldId}}')"
      data-testid="export-world"
    >
      Export
    </button>
    <button
      class="btn btn-primary"
      hx-get="/partials/worlds/edit-modal?worldId={{worldId}}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after:swap="window.openModal('edit-world-modal')"
      data-testid="edit-world"
    >
      Edit
    </button>
  </div>
</header>

<div
  class="timeline-bar"
  x-data="worldTimelineBar('{{worldId}}')"
  x-init="init()"
>
  <label class="timeline-label">{{t("worlds.timeline")}}</label>
  <div class="timeline-list" data-testid="timeline-list" role="listbox" :aria-label="t('worlds.timeline')">
    <template x-for="tl in timelines" :key="tl.id">
      <button
        type="button"
        class="timeline-item"
        :class="{ 'timeline-item-active': tl.id === selectedTimeline }"
        role="option"
        :aria-selected="tl.id === selectedTimeline ? 'true' : 'false'"
        @click="selectTimeline(tl.id)"
        data-testid="timeline-item"
      >
        <span class="timeline-item-name" x-text="tl.name"></span>
        <span class="timeline-item-meta">
          <span class="timeline-item-count" x-text="tl.eventCount + ' ' + t('worlds.timelineEvents')"></span>
          <span class="timeline-item-date" x-text="new Date(tl.created_at).toLocaleDateString()"></span>
        </span>
      </button>
    </template>
  </div>
  <button
    class="btn btn-secondary btn-sm"
    @click="showCreate = true"
    data-testid="create-timeline"
    :title="t('worlds.createTimeline')"
  >
    +
  </button>

  <!-- Create timeline modal -->
  <div
    class="modal-backdrop"
    x-show="showCreate"
    x-cloak
    @click.self="showCreate = false"
    @keydown.escape.window="showCreate = false"
  >
    <div class="modal" @click.stop>
      <h3 x-text="t('worlds.createTimeline')"></h3>
      <form @submit.prevent="createTimeline()">
        <div class="form-group">
          <label for="tl-name" x-text="t('worlds.timelineName')"></label>
          <input
            id="tl-name"
            type="text"
            x-model="newName"
            :placeholder="t('worlds.timelineNamePlaceholder')"
            maxlength="200"
            required
          />
        </div>
        <div class="form-group">
          <label for="tl-desc" x-text="t('worlds.timelineDesc')"></label>
          <div style="display: flex; gap: var(--space-1); align-items: flex-start">
            <textarea
              id="tl-desc"
              style="flex: 1"
              x-model="newDesc"
              :placeholder="t('worlds.timelineDescPlaceholder')"
              maxlength="1000"
              rows="3"
              x-init="autoResize($el)"
              @input="autoResize($el)"
            ></textarea>
            <div x-data="textToolbar({ target: '#tl-desc' })">
              {{> text-toolbar.html }}
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" @click="showCreate = false" x-text="t('common.cancel')">
          </button>
          <button type="submit" class="btn btn-primary" x-text="t('common.create')"></button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area">
      <div
        id="world-detail"
        data-world-id="{{worldId}}"
        hx-get="/dynamic/worlds/{{worldId}}/detail"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        {{> loading-state.html}}
      </div>

      <!-- World management panels (world-management UI epic) -->
      <div class="world-page" x-data="worldState('{{worldId}}')" x-init="init()" data-testid="world-page">
        <!--
          World management panels (world-management UI epic). Each panel
          lives in src/components/ so this view stays a thin composition.
        -->
        {{> world-conditions-panel.html}}

        <div class="world-page-columns">
          {{> world-location-panel.html}} {{> world-travel-panel.html}}
        </div>

        {{> trade-window-panel.html}} {{> inventory-panels.html}} {{> world-lore-panel.html}}
      </div>

      <!-- Map zones (READ-ONLY, 063): list maps, click a tile to resolve its zone -->
      <div class="world-page" x-data="worldMapZones('{{worldId}}')" x-init="init()" data-testid="world-map-zones">
        <div class="panel">
          <h3 x-text="t('worlds.mapZonesTitle')"></h3>
          <p x-show="loading" x-text="t('worlds.loading')"></p>
          <p x-show="loadError" x-cloak x-text="t('worlds.mapZonesLoadFailed')" data-testid="map-zones-error"></p>
          <p
            x-show="!loading && !loadError && groups.length === 0"
            x-cloak
            x-text="t('worlds.mapZonesEmpty')"
            data-testid="map-zones-empty"
          >
          </p>
          <template x-for="group in groups" :key="group.map.id">
            <div class="map-zone-block">
              <h4 x-text="group.map.name"></h4>
              <svg
                class="map-zone-svg"
                :viewBox="`0 0 ${group.map.width} ${group.map.height}`"
                @click="pick($event, group)"
                x-html="svgInner(group)"
                role="img"
                :aria-label="group.map.name"
                data-testid="map-zone-svg"
              >
              </svg>
            </div>
          </template>
          <p x-show="resolvedMap" x-cloak data-testid="map-zone-resolved">
            <span x-text="resolvedMap"></span>:
            <span
              x-text="resolveError ? t('worlds.mapZonesResolveFailed') : (resolvedZone ?? t('worlds.mapZonesOffMap'))"
            ></span>
          </p>
          <p
            class="muted"
            x-show="!resolvedMap && !loading && !loadError && groups.length > 0"
            x-cloak
            x-text="t('worlds.mapZonesHint')"
          >
          </p>
        </div>
      </div>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
