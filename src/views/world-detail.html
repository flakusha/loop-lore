<!-- World Detail Page -->
<header id="header-slot" class="main-header" data-page="world-detail" data-testid="world-detail-header">
  <button class="hamburger" onclick="toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">World Details</span>
  <div class="actions">
    <button class="btn btn-secondary" onclick="loadWorldDetail()" data-testid="refresh-world">Refresh</button>
    <button
      class="btn btn-primary"
      onclick="document.getElementById('edit-world-modal').classList.add('open')"
      data-testid="edit-world"
    >
      Edit
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <div id="world-detail" data-world-id="{{worldId}}">
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading world...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div
    id="edit-world-modal"
    class="modal-overlay"
    onclick="if (event.target === this) this.classList.remove('open');"
    data-testid="edit-world-modal"
  >
    <div class="modal">
      <div class="modal-header">
        <span class="title">Edit World</span>
        <button class="btn-icon" onclick="this.closest('.modal-overlay').classList.remove('open')">
          &times;
        </button>
      </div>
      <div class="modal-body">
        <form
          hx-patch="/api/worlds/{{worldId}}"
          hx-target="#world-detail"
          hx-swap="innerHTML"
          hx-target-error="#toast-container"
          hx-on::after-request="if(event.detail.successful){ document.getElementById('edit-world-modal').classList.remove('open'); showToast('success','World saved'); loadWorldDetail(); }"
          data-testid="edit-world-form"
        >
          <div class="form-group">
            <label class="form-label" for="edit-name">Name</label>
            <input class="form-input" type="text" name="name" id="edit-name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-description">Description</label>
            <textarea class="form-input" name="description" id="edit-description" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-lore">Lore</label>
            <textarea class="form-input" name="lore" id="edit-lore" rows="4"></textarea>
          </div>
          <div style="display: flex; gap: var(--space-3); justify-content: flex-end">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="document.getElementById('edit-world-modal').classList.remove('open')"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
