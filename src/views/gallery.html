<!-- Gallery View (skeleton — grid + modals lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="gallery" data-testid="gallery-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">Asset Gallery</span>
  <div class="actions">
    <button
      class="btn btn-primary"
      hx-get="/partials/gallery/upload-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('upload-modal')"
      data-testid="upload-button"
    >
      + Upload
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="list-toolbar" x-data="{ view: localStorage.getItem('gallery-view') || 'grid' }">
      <input
        id="asset-search"
        class="form-input list-search"
        type="search"
        placeholder="Search assets…"
        aria-label="Search assets"
        oninput="filterAssets()"
        data-testid="asset-search"
      />
      <select
        id="asset-type-filter"
        class="form-select list-sort"
        aria-label="Filter asset type"
        onchange="filterAssets()"
      >
        <option value="all">All types</option>
        <option value="image">Images</option>
        <option value="audio">Audio</option>
        <option value="video">Video</option>
      </select>
      <select
        id="asset-sort"
        class="form-select list-sort"
        aria-label="Sort assets"
        onchange="filterAssets()"
      >
        <option value="name">Sort: Name</option>
      </select>
      <button
        class="btn btn-secondary btn-sm"
        x-on:click="view = view === 'grid' ? 'list' : 'grid'; localStorage.setItem('gallery-view', view); document.getElementById('asset-grid').className = view === 'grid' ? 'asset-grid' : 'asset-grid list-view'"
        :title="view === 'grid' ? 'Switch to list view' : 'Switch to grid view'"
        data-testid="view-toggle"
      >
        <span x-show="view === 'grid'">☰</span>
        <span x-show="view === 'list'">⊞</span>
      </button>
    </div>
    <div
      id="asset-grid"
      data-testid="asset-grid"
      hx-get="/dynamic/gallery/grid"
      hx-trigger="load"
      hx-swap="innerHTML"
    >
      <div class="empty-state" style="grid-column: 1 / -1" data-testid="gallery-loading">
        <div class="icon">⏳</div>
        <div class="title">Loading assets...</div>
      </div>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
