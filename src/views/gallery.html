<!-- Gallery View (skeleton — grid + modals lazy-loaded) -->
<header id="header-slot" class="main-header" data-page="gallery" data-testid="gallery-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title">{{{t("gallery.assetGallery")}}}</span>
  <div class="actions">
    <button
      class="btn btn-primary"
      hx-get="/partials/gallery/upload-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="window.openModal('upload-modal')"
      data-testid="upload-button"
    >
      + Upload
    </button>
  </div>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="list-toolbar" x-data="{ view: localStorage.getItem('gallery-view') || 'grid' }">
      <div
        data-search-url="/dynamic/gallery/search"
        data-target-id="asset-grid"
        data-show-type-filter="true"
        data-search-placeholder="{{{t("gallery.searchAssets")}}}"
        data-search-label="{{{t("gallery.searchAssets")}}}"
        style="display: contents"
      >
        {{> filter-bar.html}}
      </div>
      <button
        class="btn btn-secondary btn-sm"
        x-on:click="view = view === 'grid' ? 'list' : 'grid'; localStorage.setItem('gallery-view', view); document.getElementById('asset-grid').className = view === 'grid' ? 'asset-grid' : 'asset-grid list-view'"
        :title="view === 'grid' ? 'Switch to list view' : 'Switch to grid view'"
        data-testid="view-toggle"
      >
        <span x-show="view === 'grid'">☰</span>
        <span x-show="view === 'list'">⊞</span>
      </button>
    </div>
<div
      id="asset-grid"
      data-testid="asset-grid"
      data-loading-testid="gallery-loading"
      data-loading-style="grid-column: 1 / -1"
      hx-get="/dynamic/gallery/grid"
      hx-trigger="load"
      hx-swap="innerHTML"
      hx-indicator="#gallery-indicator"
    >
      {{> loading-state.html}}
    </div>
    <div id="gallery-indicator" class="htmx-indicator" style="text-align: center; padding: var(--space-4)">
      <span class="spinner"></span>
    </div>
    <div id="modal-container"></div>
  </main>
</div>
