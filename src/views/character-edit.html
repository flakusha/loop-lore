<!-- Character Edit Page -->
<header id="header-slot" class="main-header" data-page="character-edit" data-testid="character-edit-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">Edit Character</span>
</header>

<div class="app-layout">
  <main class="main-content" style="padding-top: 0">
    <div class="chat-area">
      <div id="character-edit-form" data-character-id="{{characterId}}">
        <div class="empty-state" style="padding: var(--space-12)">
          <div class="icon">⏳</div>
          <div class="title">Loading character...</div>
        </div>
      </div>
    </div>
  </main>
</div>
