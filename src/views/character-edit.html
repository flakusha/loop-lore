<!-- Character Edit Page (skeleton — form loaded via htmx) -->
<header id="header-slot" class="main-header" data-page="character-edit" data-testid="character-edit-header">
  <button class="hamburger" x-on:click="window.toggleSidebar()" data-testid="hamburger">☰</button>
  <span class="title" id="page-title">{{{t("characters.editCharacter")}}}</span>
</header>

<div class="app-layout">
  <main class="main-content">
    <div class="chat-area">
      <div
        id="character-edit-form"
        data-character-id="{{characterId}}"
        hx-get="/dynamic/characters/{{characterId}}/edit-form"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        {{> loading-state.html}}
      </div>
    </div>
  </main>
</div>
