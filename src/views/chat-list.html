<header id="header-slot" class="main-header" data-page="chat-list">
  <button class="hamburger" x-on:click="window.toggleSidebar()">☰</button>
  <span class="title" id="page-title">{{{t("chats.title")}}}</span>
  <div class="actions">
    <a
      class="btn btn-primary"
      href="/views/new-chat"
      hx-get="/views/new-chat"
      hx-target="#app-root"
      hx-swap="innerHTML"
      hx-push-url="true"
    >
      {{{t("chats.newChat")}}}
    </a>
  </div>
</header>

<div class="app-layout">
  <main class="main-content" style="padding: var(--space-6); max-width: 900px; margin: 0 auto; width: 100%">
    <!-- Search / Filter bar -->
    <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-6); flex-wrap: wrap; align-items: center">
      <input
        id="chat-search"
        class="form-input"
        type="search"
        x-bind:placeholder="t('chats.searchPlaceholder')"
        x-bind:aria-label="t('chats.searchPlaceholder')"
        hx-get="/dynamic/chats/search"
        hx-trigger="input changed delay:300ms, load"
        hx-target="#chat-list-grid"
        hx-swap="innerHTML"
        hx-include="#chat-search"
        name="q"
        style="flex: 1; min-width: 200px"
      />
      <select
        id="chat-world-filter"
        class="form-input"
        hx-get="/dynamic/chats/search"
        hx-trigger="change"
        hx-target="#chat-list-grid"
        hx-swap="innerHTML"
        hx-include="#chat-search, #chat-world-filter, #chat-type-filter, #chat-sort"
        name="world"
        style="width: 160px"
      >
        <option value="">{{{t("chats.allWorlds")}}}</option>
      </select>
      <select
        id="chat-type-filter"
        class="form-input"
        hx-get="/dynamic/chats/search"
        hx-trigger="change"
        hx-target="#chat-list-grid"
        hx-swap="innerHTML"
        hx-include="#chat-search, #chat-world-filter, #chat-type-filter, #chat-sort"
        name="type"
        style="width: 140px"
      >
        <option value="">{{{t("chats.allTypes")}}}</option>
        <option value="direct">{{{t("chats.direct")}}}</option>
        <option value="group">{{{t("chats.group")}}}</option>
      </select>
      <select
        id="chat-sort"
        class="form-input"
        hx-get="/dynamic/chats/search"
        hx-trigger="change"
        hx-target="#chat-list-grid"
        hx-swap="innerHTML"
        hx-include="#chat-search, #chat-world-filter, #chat-type-filter, #chat-sort"
        name="sort"
        style="width: 140px"
      >
        <option value="recent">{{{t("chats.recentlyUpdated")}}}</option>
        <option value="name">{{{t("chats.nameAZ")}}}</option>
        <option value="oldest">{{{t("chats.oldestFirst")}}}</option>
      </select>
    </div>

    <!-- Chat list grid (loaded via HTMX) -->
    <div
      id="chat-list-grid"
      data-loading-title="chats.loading"
      hx-get="/dynamic/chats/list?pageSize=50"
      hx-trigger="load"
      hx-swap="innerHTML"
    >
      {{> loading-state.html}}
    </div>
  </main>
</div>

<!-- Load world names for the filter dropdown -->
<script src="/chat-list.js" defer></script>
