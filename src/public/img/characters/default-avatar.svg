<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Default character avatar placeholder -->
  <rect width="128" height="128" rx="64" fill="#21242c"/>
  <rect width="128" height="128" rx="64" fill="url(#avatarFade)"/>
  <defs>
    <radialGradient id="avatarFade" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#30333b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#151820" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <!-- Head silhouette -->
  <ellipse cx="64" cy="52" rx="22" ry="24" fill="#3f424a"/>
  <!-- Body silhouette -->
  <ellipse cx="64" cy="94" rx="36" ry="30" fill="#3f424a"/>
  <!-- Accent eye glow -->
  <circle cx="56" cy="48" r="3" fill="#f597e8" opacity="0.4"/>
  <circle cx="72" cy="48" r="3" fill="#f597e8" opacity="0.4"/>
  <!-- Accent ring -->
  <circle cx="64" cy="64" r="60" stroke="#3c3f41" stroke-width="2" fill="none"/>
  <circle cx="64" cy="64" r="60" stroke="url(#avatarRing)" stroke-width="2" fill="none" opacity="0.3"/>
  <defs>
    <linearGradient id="avatarRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f597e8"/>
      <stop offset="100%" stop-color="#c469f0"/>
    </linearGradient>
  </defs>
</svg>